<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- latar -->
  <rect width="1400" height="640" fill="#ffffff"/>
  <text x="700" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">Arsitektur Fullstack IoT yang Akan Kita Bangun (Proyek "Rumah Pintar Mini")</text>
  <text x="700" y="72" text-anchor="middle" font-size="15" fill="#475569">Alur data: dari sensor fisik → mikrokontroler → gateway → server → layar pengguna. Warna menunjukkan fase kurikulum tempat lapisan itu dipelajari.</text>

  <!-- ===== KOLOM 1: PERANGKAT (EDGE) ===== -->
  <rect x="40" y="110" width="300" height="400" rx="16" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <rect x="40" y="110" width="300" height="46" rx="16" fill="#fb923c"/>
  <rect x="40" y="140" width="300" height="16" fill="#fb923c"/>
  <text x="190" y="140" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">1. PERANGKAT (Edge Node)</text>
  <text x="190" y="180" text-anchor="middle" font-size="13" fill="#9a3412" font-weight="600">Dipelajari di Fase 0 – 1 (Modul 1–8)</text>

  <!-- sensor -->
  <rect x="64" y="200" width="252" height="96" rx="10" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
  <text x="190" y="224" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Sensor &amp; Aktuator</text>
  <text x="190" y="246" text-anchor="middle" font-size="12.5" fill="#334155">Suhu/kelembapan (DHT22), cahaya (LDR),</text>
  <text x="190" y="264" text-anchor="middle" font-size="12.5" fill="#334155">kelembapan tanah, jarak (ultrasonik),</text>
  <text x="190" y="282" text-anchor="middle" font-size="12.5" fill="#334155">relay lampu/kipas, servo, OLED, buzzer</text>

  <!-- panah sensor -> esp32 -->
  <line x1="190" y1="296" x2="190" y2="334" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="204" y="320" font-size="11.5" fill="#475569">GPIO · ADC · PWM · I2C · 1-Wire</text>

  <!-- esp32 -->
  <rect x="64" y="338" width="252" height="150" rx="10" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
  <text x="190" y="364" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Mikrokontroler ESP32</text>
  <text x="190" y="386" text-anchor="middle" font-size="12.5" fill="#334155">Firmware C++ (Arduino)</text>
  <text x="190" y="406" text-anchor="middle" font-size="12.5" fill="#334155">Membaca sensor, menyalakan aktuator,</text>
  <text x="190" y="424" text-anchor="middle" font-size="12.5" fill="#334155">mengirim data lewat WiFi</text>
  <rect x="96" y="440" width="188" height="30" rx="15" fill="#ffedd5"/>
  <text x="190" y="460" text-anchor="middle" font-size="12" font-weight="600" fill="#9a3412">Bisa banyak node (ESP-NOW / BLE)</text>

  <!-- ===== PANAH 1 -> 2 ===== -->
  <line x1="340" y1="300" x2="398" y2="300" stroke="#475569" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

  <!-- ===== KOLOM 2: GATEWAY ===== -->
  <rect x="400" y="110" width="300" height="400" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <rect x="400" y="110" width="300" height="46" rx="16" fill="#3b82f6"/>
  <rect x="400" y="140" width="300" height="16" fill="#3b82f6"/>
  <text x="550" y="140" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">2. GATEWAY &amp; PROTOKOL</text>
  <text x="550" y="180" text-anchor="middle" font-size="13" fill="#1e3a8a" font-weight="600">Fase 2 (Modul 9–12) · penyangga di Modul 21</text>

  <rect x="424" y="200" width="252" height="288" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="550" y="226" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Raspberry Pi (Linux)</text>
  <text x="550" y="246" text-anchor="middle" font-size="12.5" fill="#334155">"Kantor pos" lokal di rumah/kebun</text>

  <rect x="444" y="262" width="212" height="56" rx="8" fill="#dbeafe"/>
  <text x="550" y="284" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e3a8a">Broker MQTT (Mosquitto)</text>
  <text x="550" y="304" text-anchor="middle" font-size="12" fill="#1e3a8a">Menerima &amp; meneruskan pesan sensor</text>

  <rect x="444" y="330" width="212" height="56" rx="8" fill="#dbeafe"/>
  <text x="550" y="352" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e3a8a">Node-RED (opsional)</text>
  <text x="550" y="372" text-anchor="middle" font-size="12" fill="#1e3a8a">Dashboard &amp; otomasi lokal tanpa koding</text>

  <rect x="444" y="398" width="212" height="56" rx="8" fill="#dbeafe"/>
  <text x="550" y="420" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e3a8a">Penyangga internet putus (M21)</text>
  <text x="550" y="440" text-anchor="middle" font-size="12" fill="#1e3a8a">Data disimpan dulu, dikirim saat online</text>

  <text x="550" y="478" text-anchor="middle" font-size="11.5" fill="#64748b" font-style="italic">(Di awal belajar, laptop Anda bisa menggantikan peran Pi)</text>

  <!-- ===== PANAH 2 -> 3 ===== -->
  <line x1="700" y1="300" x2="758" y2="300" stroke="#475569" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

  <!-- ===== KOLOM 3: SERVER / CLOUD ===== -->
  <rect x="760" y="110" width="300" height="400" rx="16" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <rect x="760" y="110" width="300" height="46" rx="16" fill="#22c55e"/>
  <rect x="760" y="140" width="300" height="16" fill="#22c55e"/>
  <text x="910" y="140" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">3. BACKEND &amp; DATA</text>
  <text x="910" y="180" text-anchor="middle" font-size="13" fill="#14532d" font-weight="600">Fase 3 (Modul 13–16) · ke internet di Fase 5</text>

  <rect x="784" y="200" width="252" height="130" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="910" y="226" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Server Node.js</text>
  <text x="910" y="248" text-anchor="middle" font-size="12.5" fill="#334155">REST API + WebSocket (realtime)</text>
  <text x="910" y="266" text-anchor="middle" font-size="12.5" fill="#334155">Aturan otomatis: "jika suhu &gt; 30°C</text>
  <text x="910" y="284" text-anchor="middle" font-size="12.5" fill="#334155">→ nyalakan kipas + kirim Telegram"</text>
  <text x="910" y="310" text-anchor="middle" font-size="12.5" fill="#334155">Login, API key perangkat, keamanan</text>

  <line x1="910" y1="330" x2="910" y2="366" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="926" y="352" font-size="11.5" fill="#475569">SQL</text>

  <rect x="784" y="370" width="252" height="118" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="910" y="396" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Database PostgreSQL</text>
  <text x="910" y="418" text-anchor="middle" font-size="12.5" fill="#334155">+ TimescaleDB untuk data deret waktu</text>
  <text x="910" y="436" text-anchor="middle" font-size="12.5" fill="#334155">Menyimpan riwayat sensor bertahun-tahun,</text>
  <text x="910" y="454" text-anchor="middle" font-size="12.5" fill="#334155">rata-rata per jam, per hari, dst.</text>
  <text x="910" y="478" text-anchor="middle" font-size="11.5" fill="#64748b" font-style="italic">Dijalankan di Raspberry Pi ATAU VPS cloud</text>

  <!-- ===== PANAH 3 -> 4 ===== -->
  <line x1="1060" y1="300" x2="1118" y2="300" stroke="#475569" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

  <!-- ===== KOLOM 4: PENGGUNA ===== -->
  <rect x="1120" y="110" width="240" height="400" rx="16" fill="#faf5ff" stroke="#8b5cf6" stroke-width="2"/>
  <rect x="1120" y="110" width="240" height="46" rx="16" fill="#8b5cf6"/>
  <rect x="1120" y="140" width="240" height="16" fill="#8b5cf6"/>
  <text x="1240" y="140" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">4. DASHBOARD</text>
  <text x="1240" y="180" text-anchor="middle" font-size="13" fill="#4c1d95" font-weight="600">Dipelajari di Fase 4 (Modul 17–20)</text>

  <rect x="1144" y="200" width="192" height="288" rx="10" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="1240" y="226" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Aplikasi Web React</text>
  <text x="1240" y="246" text-anchor="middle" font-size="12.5" fill="#334155">Dibuka di laptop &amp; HP (PWA di M21)</text>

  <!-- ilustrasi layar HP sederhana -->
  <rect x="1190" y="262" width="100" height="170" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="1200" y="276" width="80" height="34" rx="4" fill="#ddd6fe"/>
  <text x="1240" y="298" text-anchor="middle" font-size="11" font-weight="700" fill="#4c1d95">28,5 °C</text>
  <polyline points="1200,360 1215,345 1228,352 1242,330 1256,338 1268,322 1280,328" fill="none" stroke="#8b5cf6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="1200" y1="366" x2="1280" y2="366" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="1200" y="380" width="36" height="20" rx="10" fill="#22c55e"/>
  <circle cx="1227" cy="390" r="7" fill="#ffffff"/>
  <text x="1262" y="394" text-anchor="middle" font-size="10" fill="#334155">Lampu</text>
  <rect x="1200" y="406" width="36" height="20" rx="10" fill="#cbd5e1"/>
  <circle cx="1209" cy="416" r="7" fill="#ffffff"/>
  <text x="1262" y="420" text-anchor="middle" font-size="10" fill="#334155">Kipas</text>

  <text x="1240" y="456" text-anchor="middle" font-size="12" fill="#334155">Grafik realtime, riwayat,</text>
  <text x="1240" y="474" text-anchor="middle" font-size="12" fill="#334155">tombol kendali, notifikasi</text>

  <!-- ===== BAR FASE 5 ===== -->
  <rect x="40" y="536" width="1320" height="70" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="700" y="564" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">5. OPERASI &amp; SKALA — melingkupi semua lapisan di atas (Fase 5, Modul 21–24)</text>
  <text x="700" y="590" text-anchor="middle" font-size="13" fill="#334155">Docker · deploy ke VPS/cloud · domain &amp; HTTPS · OTA update firmware · monitoring &amp; alarm · backup · CI/CD · proyek akhir (capstone)</text>

  <text x="1360" y="628" text-anchor="end" font-size="10.5" fill="#94a3b8">Diagram: dibuat untuk kurikulum Fullstack IoT Developer (Kodingindonesia), 2026 · lisensi CC BY 4.0</text>
  <!-- label protokol digambar terakhir agar di atas kolom -->
  <rect x="322" y="236" width="96" height="48" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="370" y="256" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">WiFi</text>
  <text x="370" y="274" text-anchor="middle" font-size="12" fill="#1e3a8a">MQTT</text>
  <rect x="682" y="236" width="96" height="48" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="730" y="256" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14532d">Internet</text>
  <text x="730" y="274" text-anchor="middle" font-size="12" fill="#14532d">MQTT+TLS</text>
  <rect x="1042" y="236" width="96" height="48" rx="8" fill="#faf5ff" stroke="#c4b5fd"/>
  <text x="1090" y="256" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4c1d95">HTTPS</text>
  <text x="1090" y="274" text-anchor="middle" font-size="12" fill="#4c1d95">WebSocket</text>
</svg>
