<text x="268.0" y="405.0" font-size="13.5" font-weight="800" fill="#1e2a4a" text-anchor="start" >jalan pulang: air kembali ke</text>
<text x="268.0" y="423.2" font-size="13.5" font-weight="400" fill="#1e2a4a" text-anchor="start" >tandon. Di listrik: arus kembali</text>
<text x="268.0" y="441.4" font-size="13.5" font-weight="400" fill="#1e2a4a" text-anchor="start" >ke GND, lalu USB "memompa"</text>
<text x="268.0" y="459.7" font-size="13.5" font-weight="400" fill="#1e2a4a" text-anchor="start" >lagi ke 3,3 V / 5 V.</text>
<rect x="800.0" y="104.0" width="360.0" height="96.0" rx="12" fill="#fff" stroke="#b45f17" stroke-width="3" />
<text x="820.0" y="134.0" font-size="17" font-weight="800" fill="#b45f17" text-anchor="start" >TEGANGAN (V)</text>
<text x="820.0" y="158.0" font-size="13.5" font-weight="600" fill="#4a5568" text-anchor="start" >satuan: volt</text>
<text x="820.0" y="181.0" font-size="14" font-weight="400" fill="#1e2a4a" text-anchor="start" >Tekanan air; ada walau keran tertutup.</text>
<rect x="800.0" y="212.0" width="360.0" height="96.0" rx="12" fill="#fff" stroke="#0f8b8d" stroke-width="3" />
<text x="820.0" y="242.0" font-size="17" font-weight="800" fill="#0f8b8d" text-anchor="start" >ARUS (I)</text>
<text x="820.0" y="266.0" font-size="13.5" font-weight="600" fill="#4a5568" text-anchor="start" >satuan: ampere (A), miliampere (mA)</text>
<text x="820.0" y="289.0" font-size="14" font-weight="400" fill="#1e2a4a" text-anchor="start" >Banyaknya air yang lewat per detik.</text>
<rect x="800.0" y="320.0" width="360.0" height="96.0" rx="12" fill="#fff" stroke="#e63946" stroke-width="3" />
<text x="820.0" y="350.0" font-size="17" font-weight="800" fill="#e63946" text-anchor="start" >HAMBATAN (R)</text>
<text x="820.0" y="374.0" font-size="13.5" font-weight="600" fill="#4a5568" text-anchor="start" >satuan: ohm (Ω)</text>
<text x="820.0" y="397.0" font-size="14" font-weight="400" fill="#1e2a4a" text-anchor="start" >Keran yang menyempitkan aliran.</text>
<rect x="800.0" y="428.0" width="360.0" height="96.0" rx="12" fill="#fff" stroke="#2a9d5c" stroke-width="3" />
<text x="820.0" y="458.0" font-size="17" font-weight="800" fill="#2a9d5c" text-anchor="start" >DAYA (P)</text>
<text x="820.0" y="482.0" font-size="13.5" font-weight="600" fill="#4a5568" text-anchor="start" >satuan: watt (W)</text>
<text x="820.0" y="505.0" font-size="14" font-weight="400" fill="#1e2a4a" text-anchor="start" >Kerja yang dihasilkan: P = V × I.</text>
<rect x="40.0" y="548.0" width="1120.0" height="50.0" rx="10" fill="#fde4c8" />
<text x="600.0" y="579.0" font-size="15" font-weight="700" fill="#1e2a4a" text-anchor="middle" >Tanpa jalan pulang, air berhenti mengalir. Listrik juga begitu: tanpa sambungan ke GND, tidak ada arus.</text>
