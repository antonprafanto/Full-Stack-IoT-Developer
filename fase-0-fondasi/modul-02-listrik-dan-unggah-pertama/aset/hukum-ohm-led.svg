<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<rect width="1200" height="700" fill="#fffdf7"/>
<text x="600.0" y="44.0" font-size="28" font-weight="800" fill="#1e2a4a" text-anchor="middle" >Menghitung resistor LED dalam tiga langkah</text>
<text x="600.0" y="76.0" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" >Pin ESP32 memberi 3,3 V · LED merah "memakai" ±2,0 V · sisanya harus ditahan oleh resistor</text>
<rect x="40.0" y="100.0" width="360.0" height="440.0" rx="12" fill="#ffffff" stroke="#e0dcd2" stroke-width="2" />
<text x="220.0" y="132.0" font-size="17" font-weight="800" fill="#1e2a4a" text-anchor="middle" >Rangkaian kita</text>
<rect x="98.0" y="152.0" width="104.0" height="34.0" rx="8" fill="#fde4c8" stroke="#1e2a4a" stroke-width="2" />
<text x="150.0" y="175.0" font-size="15" font-weight="700" fill="#1e2a4a" text-anchor="middle" >Pin 3,3 V</text>
<line x1="150.0" y1="186.0" x2="150.0" y2="222.0" stroke="#1e2a4a" stroke-width="2.5" stroke-linecap="round" />
<rect x="138.0" y="222.0" width="24.0" height="72.0" rx="4" fill="#fff" stroke="#1e2a4a" stroke-width="2.5" />
<text x="174.0" y="263.0" font-size="15" font-weight="700" fill="#1e2a4a" text-anchor="start" >220 Ω</text>
<line x1="150.0" y1="294.0" x2="150.0" y2="334.0" stroke="#1e2a4a" stroke-width="2.5" stroke-linecap="round" />
<path d="M136.0 338.0 L164.0 338.0 L150.0 366.0 Z" fill="#e63946" stroke="#1e2a4a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
<line x1="136.0" y1="366.0" x2="164.0" y2="366.0" stroke="#1e2a4a" stroke-width="3" stroke-linecap="round" />
<line x1="170.0" y1="346.0" x2="186.0" y2="337.0" stroke="#b45f17" stroke-width="2" stroke-linecap="round" />
<path d="M182.8 342.1 L186.0 337.0 L180.0 337.1" fill="none" stroke="#b45f17" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<line x1="170.0" y1="358.0" x2="186.0" y2="349.0" stroke="#b45f17" stroke-width="2" stroke-linecap="round" />
<path d="M182.8 354.1 L186.0 349.0 L180.0 349.1" fill="none" stroke="#b45f17" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<text x="176.0" y="400.0" font-size="15" font-weight="700" fill="#1e2a4a" text-anchor="start" >LED merah</text>
<line x1="150.0" y1="366.0" x2="150.0" y2="452.0" stroke="#1e2a4a" stroke-width="2.5" stroke-linecap="round" />
<line x1="150.0" y1="452.0" x2="150.0" y2="466.0" stroke="#1e2a4a" stroke-width="2.5" stroke-linecap="round" />
<line x1="137.0" y1="466.0" x2="163.0" y2="466.0" stroke="#1e2a4a" stroke-width="2.5" stroke-linecap="round" />
<line x1="141.5" y1="472.0" x2="158.5" y2="472.0" stroke="#1e2a4a" stroke-width="2.5" stroke-linecap="round" />
<line x1="146.0" y1="478.0" x2="154.0" y2="478.0" stroke="#1e2a4a" stroke-width="2.5" stroke-linecap="round" />
<text x="172.0" y="470.0" font-size="15" font-weight="700" fill="#1e2a4a" text-anchor="start" >GND (0 V)</text>
<path d="M300 222 L310 222 L310 294 L300 294" fill="none" stroke="#b45f17" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<text x="318.0" y="255.0" font-size="15" font-weight="800" fill="#b45f17" text-anchor="start" >1,3 V</text>
<text x="318.0" y="274.0" font-size="13" font-weight="400" fill="#b45f17" text-anchor="start" >ditahan</text>
<path d="M300 334 L310 334 L310 370 L300 370" fill="none" stroke="#e63946" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<text x="318.0" y="350.0" font-size="15" font-weight="800" fill="#e63946" text-anchor="start" >2,0 V</text>
<text x="318.0" y="368.0" font-size="13" font-weight="400" fill="#e63946" text-anchor="start" >dipakai LED</text>
<line x1="110.0" y1="200.0" x2="110.0" y2="250.0" stroke="#0f8b8d" stroke-width="2.5" stroke-linecap="round" />
<path d="M105.8 242.1 L110.0 250.0 L114.2 242.1" fill="none" stroke="#0f8b8d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
<text x="104.0" y="230.0" font-size="13" font-weight="700" fill="#0f8b8d" text-anchor="end" >arus</text>
<text x="220.0" y="515.0" font-size="14" font-weight="600" fill="#4a5568" text-anchor="middle" >Jumlahnya selalu: 1,3 V + 2,0 V = 3,3 V</text>
<rect x="430.0" y="100.0" width="730.0" height="132.0" rx="12" fill="#ffffff" stroke="#e0dcd2" stroke-width="2" />
<circle cx="468.0" cy="140.0" r="18" fill="#0f8b8d" stroke="#ffffff" stroke-width="2" />
<text x="468.0" y="146.5" font-size="18" font-weight="700" fill="#fff" text-anchor="middle" >1</text>
<text x="500.0" y="136.0" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start" >Tegangan sisa untuk resistor</text>
<text x="500.0" y="176.0" font-size="26" font-weight="800" fill="#1e2a4a" text-anchor="start" >3,3 V − 2,0 V = 1,3 V</text>
<text x="500.0" y="208.0" font-size="14" font-weight="400" fill="#4a5568" text-anchor="start" >2,0 V dipakai LED; sisanya (1,3 V) untuk resistor.</text>
<rect x="430.0" y="248.0" width="730.0" height="132.0" rx="12" fill="#ffffff" stroke="#e0dcd2" stroke-width="2" />
<circle cx="468.0" cy="288.0" r="18" fill="#0f8b8d" stroke="#ffffff" stroke-width="2" />
<text x="468.0" y="294.5" font-size="18" font-weight="700" fill="#fff" text-anchor="middle" >2</text>
<text x="500.0" y="284.0" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start" >Arus = tegangan ÷ hambatan  (I = V ÷ R)</text>
<text x="500.0" y="324.0" font-size="26" font-weight="800" fill="#1e2a4a" text-anchor="start" >1,3 V ÷ 220 Ω ≈ 0,0059 A = 5,9 mA</text>
<text x="500.0" y="356.0" font-size="14" font-weight="400" fill="#4a5568" text-anchor="start" >1 A = 1.000 mA, jadi 0,0059 A = 5,9 mA.</text>
<rect x="430.0" y="396.0" width="730.0" height="132.0" rx="12" fill="#ffffff" stroke="#e0dcd2" stroke-width="2" />
<circle cx="468.0" cy="436.0" r="18" fill="#0f8b8d" stroke="#ffffff" stroke-width="2" />
<text x="468.0" y="442.5" font-size="18" font-weight="700" fill="#fff" text-anchor="middle" >3</text>
<text x="500.0" y="432.0" font-size="16" font-weight="700" fill="#4a5568" text-anchor="start" >Cek: aman?</text>
<text x="500.0" y="472.0" font-size="26" font-weight="800" fill="#1e2a4a" text-anchor="start" >5,9 mA → aman ✓</text>
<text x="500.0" y="504.0" font-size="14" font-weight="400" fill="#4a5568" text-anchor="start" >LED nyaman di 5–15 mA; batas pin yang kita pakai ±12 mA.</text>
<text x="40.0" y="578.0" font-size="16" font-weight="800" fill="#1e2a4a" text-anchor="start" >Ganti resistornya, lihat arusnya:</text>
<rect x="40.0" y="592.0" width="271.0" height="66.0" rx="10" fill="#fff" stroke="#8a8f9c" stroke-width="2.5" />
<text x="56.0" y="618.0" font-size="16" font-weight="800" fill="#1e2a4a" text-anchor="start" >10 kΩ → 0,13 mA</text>
<text x="56.0" y="643.0" font-size="14.5" font-weight="600" fill="#8a8f9c" text-anchor="start" >sangat redup</text>
<rect x="323.0" y="592.0" width="271.0" height="66.0" rx="10" fill="#fff" stroke="#b45f17" stroke-width="2.5" />
<text x="339.0" y="618.0" font-size="16" font-weight="800" fill="#1e2a4a" text-anchor="start" >1 kΩ → 1,3 mA</text>
<text x="339.0" y="643.0" font-size="14.5" font-weight="600" fill="#b45f17" text-anchor="start" >redup</text>
<rect x="606.0" y="592.0" width="271.0" height="66.0" rx="10" fill="#fff" stroke="#2a9d5c" stroke-width="2.5" />
<text x="622.0" y="618.0" font-size="16" font-weight="800" fill="#1e2a4a" text-anchor="start" >220 Ω → 5,9 mA</text>
<text x="622.0" y="643.0" font-size="14.5" font-weight="600" fill="#2a9d5c" text-anchor="start" >terang &amp; aman ✓</text>
<rect x="889.0" y="592.0" width="271.0" height="66.0" rx="10" fill="#fff" stroke="#e63946" stroke-width="2.5" />
<text x="905.0" y="618.0" font-size="16" font-weight="800" fill="#1e2a4a" text-anchor="start" >tanpa resistor → tak terbatas</text>
<text x="905.0" y="643.0" font-size="14.5" font-weight="600" fill="#e63946" text-anchor="start" >LED/pin bisa rusak ✗</text>
<text x="1178.0" y="686.0" font-size="12" font-weight="400" fill="#8a8f9c" text-anchor="end" >Kurikulum Fullstack IoT Developer · CC BY 4.0</text>
</svg>
