<text x="600.0" y="76.0" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" >Badan krem biasanya punya 4 gelang. Baca dari kiri; gelang emas (toleransi) selalu di sebelah kanan.</text>
