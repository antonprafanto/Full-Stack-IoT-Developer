<rect x="770.0" y="120.0" width="390.0" height="350.0" rx="12" fill="#ffffff" stroke="#e0dcd2" stroke-width="2" />
<text x="790.0" y="150.0" font-size="16" font-weight="800" fill="#1e2a4a" text-anchor="start" >Arti warna (gelang angka &amp; pengali)</text>
<rect x="790.0" y="172.0" width="34.0" height="34.0" rx="6" fill="#1b1b1b" />
<text x="834.0" y="195.0" font-size="16" font-weight="700" fill="#1e2a4a" text-anchor="start" >0 = hitam</text>
<rect x="975.0" y="172.0" width="34.0" height="34.0" rx="6" fill="#8b4513" />
<text x="1019.0" y="195.0" font-size="16" font-weight="700" fill="#1e2a4a" text-anchor="start" >1 = cokelat</text>
<rect x="790.0" y="222.0" width="34.0" height="34.0" rx="6" fill="#e63946" />
<text x="834.0" y="245.0" font-size="16" font-weight="700" fill="#1e2a4a" text-anchor="start" >2 = merah</text>
<rect x="975.0" y="222.0" width="34.0" height="34.0" rx="6" fill="#f28c28" />
<text x="1019.0" y="245.0" font-size="16" font-weight="700" fill="#1e2a4a" text-anchor="start" >3 = oranye</text>
<rect x="790.0" y="272.0" width="34.0" height="34.0" rx="6" fill="#f2d024" stroke="#999" stroke-width="1.5" />
<text x="834.0" y="295.0" font-size="16" font-weight="700" fill="#1e2a4a" text-anchor="start" >4 = kuning</text>
<rect x="975.0" y="272.0" width="34.0" height="34.0" rx="6" fill="#2a9d5c" />
<text x="1019.0" y="295.0" font-size="16" font-weight="700" fill="#1e2a4a" text-anchor="start" >5 = hijau</text>
<rect x="790.0" y="322.0" width="34.0" height="34.0" rx="6" fill="#2b6cd6" />
<text x="834.0" y="345.0" font-size="16" font-weight="700" fill="#1e2a4a" text-anchor="start" >6 = biru</text>
<rect x="975.0" y="322.0" width="34.0" height="34.0" rx="6" fill="#8e44ad" />
<text x="1019.0" y="345.0" font-size="16" font-weight="700" fill="#1e2a4a" text-anchor="start" >7 = ungu</text>
<rect x="790.0" y="372.0" width="34.0" height="34.0" rx="6" fill="#9a9a9a" />
<text x="834.0" y="395.0" font-size="16" font-weight="700" fill="#1e2a4a" text-anchor="start" >8 = abu-abu</text>
<rect x="975.0" y="372.0" width="34.0" height="34.0" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.5" />
<text x="1019.0" y="395.0" font-size="16" font-weight="700" fill="#1e2a4a" text-anchor="start" >9 = putih</text>
<rect x="790.0" y="422.0" width="34.0" height="22.0" rx="5" fill="#d4a017" />
<text x="834.0" y="438.0" font-size="14" font-weight="700" fill="#1e2a4a" text-anchor="start" >emas = toleransi ±5% (gelang terakhir)</text>
<text x="790.0" y="458.0" font-size="12.5" font-weight="400" fill="#4a5568" text-anchor="start" >Gelang toleransi agak terpisah — dibaca paling akhir.</text>
<rect x="40.0" y="486.0" width="1120.0" height="150.0" rx="12" fill="#cfe9f3" />
<text x="64.0" y="516.0" font-size="16" font-weight="800" fill="#1e2a4a" text-anchor="start" >Resistormu berbadan biru dengan 5 gelang? (jenis ±1%, sering ada di paket resistor)</text>
<text x="64.0" y="542.0" font-size="15" font-weight="400" fill="#1e2a4a" text-anchor="start" >Tiga gelang pertama = angka, gelang ke-4 = jumlah nol, gelang ke-5 (cokelat, agak terpisah) = toleransi ±1%.</text>
