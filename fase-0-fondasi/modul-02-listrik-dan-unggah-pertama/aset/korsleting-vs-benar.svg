<text x="410.0" y="230.5" font-size="15" font-weight="400" fill="#1e2a4a" text-anchor="start" >• regulator rusak</text>
<text x="410.0" y="250.8" font-size="15" font-weight="400" fill="#1e2a4a" text-anchor="start" >• port USB laptop</text>
<text x="410.0" y="271.0" font-size="15" font-weight="400" fill="#1e2a4a" text-anchor="start" >  mati sementara</text>
