<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e63946"/>
    </marker>
  </defs>
  <rect width="1100" height="520" fill="#fffdf7"/>
  <text x="550" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#1e2a4a">Rangkaian Kemenangan Cepat: 3 komponen, 3 kabel</text>
  <text x="550" y="66" text-anchor="middle" font-size="15" fill="#555">Pin D4 → resistor 220 Ω → LED (kaki panjang) → LED (kaki pendek) → GND</text>

  <!-- ESP32 board (simplified) -->
  <g transform="translate(90,100)">
    <rect x="0" y="0" width="200" height="340" rx="10" fill="#1e2a4a"/>
    <rect x="45" y="20" width="110" height="90" rx="4" fill="#9aa5b1"/>
    <text x="100" y="72" text-anchor="middle" font-size="18" font-weight="700" fill="#1e2a4a">ESP32</text>
    <!-- antenna zigzag -->
    <path d="M60 10 L70 2 L80 10 L90 2 L100 10 L110 2 L120 10 L130 2 L140 10" fill="none" stroke="#f4a261" stroke-width="2"/>
    <!-- usb -->
    <rect x="75" y="310" width="50" height="30" rx="3" fill="#cfd8e3"/>
    <text x="100" y="330" text-anchor="middle" font-size="11" fill="#1e2a4a">USB</text>
    <!-- buttons -->
    <rect x="15" y="300" width="22" height="14" rx="2" fill="#e0e0e0"/><text x="26" y="326" text-anchor="middle" font-size="9" fill="#fff">EN</text>
    <rect x="163" y="300" width="22" height="14" rx="2" fill="#e0e0e0"/><text x="174" y="326" text-anchor="middle" font-size="9" fill="#fff">BOOT</text>
    <!-- right pins -->
    <g font-size="11" fill="#fff" font-weight="600">
      <g id="pins">
        <circle cx="190" cy="130" r="5" fill="#ffd166"/><text x="180" y="134" text-anchor="end">3V3</text>
        <circle cx="190" cy="150" r="5" fill="#ffd166"/><text x="180" y="154" text-anchor="end">GND</text>
        <circle cx="190" cy="170" r="5" fill="#ffd166"/><text x="180" y="174" text-anchor="end">D15</text>
        <circle cx="190" cy="190" r="5" fill="#ffd166"/><text x="180" y="194" text-anchor="end">D2</text>
        <circle cx="190" cy="210" r="7" fill="#e63946" stroke="#fff" stroke-width="2"/><text x="180" y="214" text-anchor="end" fill="#ffd166">D4</text>
        <circle cx="190" cy="230" r="5" fill="#ffd166"/><text x="180" y="234" text-anchor="end">RX2</text>
        <circle cx="190" cy="250" r="5" fill="#ffd166"/><text x="180" y="254" text-anchor="end">TX2</text>
        <circle cx="190" cy="270" r="5" fill="#ffd166"/><text x="180" y="274" text-anchor="end">D5</text>
      </g>
      <!-- left pins (few) -->
      <circle cx="10" cy="130" r="5" fill="#ffd166"/><text x="20" y="134">VIN</text>
      <circle cx="10" cy="150" r="7" fill="#1e2a4a" stroke="#fff" stroke-width="2"/><text x="20" y="154" fill="#ffd166">GND</text>
      <circle cx="10" cy="170" r="5" fill="#ffd166"/><text x="20" y="174">D13</text>
      <circle cx="10" cy="190" r="5" fill="#ffd166"/><text x="20" y="194">D12</text>
      <circle cx="10" cy="210" r="5" fill="#ffd166"/><text x="20" y="214">D14</text>
    </g>
  </g>

  <!-- wire from D4 (green) -->
  <path d="M280 310 L420 310" fill="none" stroke="#2a9d8f" stroke-width="5" stroke-linecap="round"/>
  <!-- resistor -->
  <g transform="translate(420,296)">
    <rect x="0" y="0" width="110" height="28" rx="12" fill="#e8d5b5" stroke="#8a6d3b" stroke-width="2"/>
    <rect x="22" y="0" width="8" height="28" fill="#e63946"/>
    <rect x="38" y="0" width="8" height="28" fill="#e63946"/>
    <rect x="54" y="0" width="8" height="28" fill="#8a4b1f"/>
    <rect x="80" y="0" width="8" height="28" fill="#d4af37"/>
  </g>
  <text x="475" y="352" text-anchor="middle" font-size="14" font-weight="700" fill="#1e2a4a">resistor 220 Ω</text>
  <text x="475" y="370" text-anchor="middle" font-size="12" fill="#555">merah-merah-cokelat-emas</text>
  <!-- wire resistor -> LED anode (green) -->
  <path d="M530 310 L640 310 L640 250" fill="none" stroke="#2a9d8f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- LED -->
  <g transform="translate(600,120)">
    <path d="M20 90 L20 40 A40 40 0 0 1 100 40 L100 90 Z" fill="#e63946" opacity="0.9"/>
    <rect x="12" y="90" width="96" height="14" rx="3" fill="#c1121f"/>
    <!-- legs -->
    <line x1="40" y1="104" x2="40" y2="130" stroke="#999" stroke-width="5"/>
    <line x1="80" y1="104" x2="80" y2="118" stroke="#999" stroke-width="5"/>
    <text x="28" y="118" text-anchor="end" font-size="13" font-weight="700" fill="#2a9d8f">A (+)</text>
    <text x="28" y="134" text-anchor="end" font-size="12" fill="#555">kaki panjang</text>
    <text x="92" y="118" text-anchor="start" font-size="13" font-weight="700" fill="#1e2a4a">C (−)</text>
    <text x="92" y="134" text-anchor="start" font-size="12" fill="#555">kaki pendek</text>
    <!-- glow -->
    <circle cx="60" cy="50" r="52" fill="#ffd166" opacity="0.25"/>
  </g>
  <text x="660" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#1e2a4a">LED merah</text>
  <!-- wire from LED cathode (black) to GND -->
  <path d="M680 238 L680 272 L330 272 L330 250 L287 250" fill="none" stroke="#1e2a4a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="340" y="263" text-anchor="start" font-size="12" fill="#1e2a4a" font-weight="600">kabel hitam → GND (titik nol)</text>

  <!-- current flow arrows -->
  <g stroke="#e63946" stroke-width="2" fill="none">
    <path d="M330 300 L380 300" marker-end="url(#arr)"/>
    <path d="M570 300 L610 300" marker-end="url(#arr)"/>
  </g>
  <text x="355" y="292" text-anchor="middle" font-size="11" fill="#e63946">arus</text>

  <!-- legend box -->
  <rect x="760" y="110" width="310" height="300" rx="12" fill="#fff" stroke="#e0dcd2" stroke-width="1.5"/>
  <text x="780" y="140" font-size="16" font-weight="700" fill="#1e2a4a">Kenapa begini?</text>
  <g font-size="13" fill="#333">
    <text x="780" y="168"><tspan font-weight="700" fill="#2a9d8f">D4</tspan> = "keran" yang dibuka-tutup oleh</text>
    <text x="780" y="186">kode: HIGH = listrik keluar, LOW = tidak.</text>
    <text x="780" y="214"><tspan font-weight="700" fill="#8a6d3b">Resistor</tspan> = "penyempit pipa" agar arus</text>
    <text x="780" y="232">tidak terlalu deras. Tanpa dia, LED bisa</text>
    <text x="780" y="250">putus dalam sepersekian detik (Modul 2).</text>
    <text x="780" y="278"><tspan font-weight="700" fill="#e63946">LED</tspan> hanya menyala satu arah: listrik</text>
    <text x="780" y="296">masuk dari kaki panjang (A), keluar dari</text>
    <text x="780" y="314">kaki pendek (C). Terbalik = tidak nyala,</text>
    <text x="780" y="332">tapi tidak rusak.</text>
    <text x="780" y="360"><tspan font-weight="700" fill="#1e2a4a">GND</tspan> = titik nol; setiap rangkaian</text>
    <text x="780" y="378">harus "pulang" ke sini agar arus mengalir.</text>
  </g>

  <rect x="90" y="430" width="980" height="56" rx="10" fill="#fde4c8"/>
  <text x="580" y="453" text-anchor="middle" font-size="14" fill="#1e2a4a">Di Wokwi, tiga kabel ini sudah ditulis untukmu di file <tspan font-family="'DejaVu Sans Mono', monospace" font-weight="700">diagram.json</tspan>:</text>
  <text x="580" y="474" text-anchor="middle" font-size="13" fill="#1e2a4a" font-family="'DejaVu Sans Mono', monospace">esp:D4 → r1:1 · r1:2 → led1:A · led1:C → esp:GND.1</text>
  <text x="1070" y="510" text-anchor="end" font-size="11" fill="#999">Kurikulum Fullstack IoT Developer · CC BY 4.0</text>
</svg>
