<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e63946"/>
    </marker>
  </defs>
  <rect width="1100" height="560" fill="#fffdf7"/>
  <text x="550" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#1e2a4a">Rangkaian Kemenangan Cepat: 3 komponen, 3 kabel</text>
  <text x="550" y="66" text-anchor="middle" font-size="15" fill="#555">Pin D4 → resistor 220 Ω → LED (kaki panjang, A) → LED (kaki pendek, C) → GND. Susunannya sama dengan yang tampil di Wokwi.</text>

  <!-- ESP32 board (simplified, only right header labelled) -->
  <g transform="translate(70,100)">
    <rect x="0" y="0" width="200" height="340" rx="10" fill="#1e2a4a"/>
    <rect x="45" y="20" width="110" height="90" rx="4" fill="#9aa5b1"/>
    <text x="100" y="72" text-anchor="middle" font-size="18" font-weight="700" fill="#1e2a4a">ESP32</text>
    <path d="M60 10 L70 2 L80 10 L90 2 L100 10 L110 2 L120 10 L130 2 L140 10" fill="none" stroke="#f4a261" stroke-width="2"/>
    <rect x="75" y="310" width="50" height="30" rx="3" fill="#cfd8e3"/>
    <text x="100" y="330" text-anchor="middle" font-size="11" fill="#1e2a4a">USB</text>
    <rect x="15" y="300" width="22" height="14" rx="2" fill="#e0e0e0"/><text x="26" y="326" text-anchor="middle" font-size="9" fill="#fff">EN</text>
    <rect x="163" y="300" width="22" height="14" rx="2" fill="#e0e0e0"/><text x="174" y="326" text-anchor="middle" font-size="9" fill="#fff">BOOT</text>
    <!-- right header: D5 .. 3V3 (bottom part) -->
    <g font-size="11" fill="#fff" font-weight="600">
      <circle cx="190" cy="130" r="5" fill="#ffd166"/><text x="180" y="134" text-anchor="end">D5</text>
      <circle cx="190" cy="150" r="5" fill="#ffd166"/><text x="180" y="154" text-anchor="end">TX2</text>
      <circle cx="190" cy="170" r="5" fill="#ffd166"/><text x="180" y="174" text-anchor="end">RX2</text>
      <circle cx="190" cy="190" r="7" fill="#e63946" stroke="#fff" stroke-width="2"/><text x="180" y="194" text-anchor="end" fill="#ffd166">D4</text>
      <circle cx="190" cy="210" r="5" fill="#ffd166"/><text x="180" y="214" text-anchor="end">D2</text>
      <circle cx="190" cy="230" r="5" fill="#ffd166"/><text x="180" y="234" text-anchor="end">D15</text>
      <circle cx="190" cy="250" r="7" fill="#1e2a4a" stroke="#fff" stroke-width="2"/><text x="180" y="254" text-anchor="end" fill="#ffd166">GND</text>
      <circle cx="190" cy="270" r="5" fill="#ffd166"/><text x="180" y="274" text-anchor="end">3V3</text>
      <!-- left header (unlabelled dots) -->
      <circle cx="10" cy="130" r="5" fill="#ffd166"/><circle cx="10" cy="150" r="5" fill="#ffd166"/><circle cx="10" cy="170" r="5" fill="#ffd166"/>
      <circle cx="10" cy="190" r="5" fill="#ffd166"/><circle cx="10" cy="210" r="5" fill="#ffd166"/><circle cx="10" cy="230" r="5" fill="#ffd166"/>
      <circle cx="10" cy="250" r="5" fill="#ffd166"/><circle cx="10" cy="270" r="5" fill="#ffd166"/>
    </g>
  </g>

  <!-- green wire: D4 (260,290) -> right -> up -> resistor pin 1 (340,200) -->
  <path d="M260 290 L300 290 L300 200 L342 200" fill="none" stroke="#2a9d8f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- resistor horizontal at y=200, leads 340..480 -->
  <g transform="translate(340,186)">
    <line x1="0" y1="14" x2="25" y2="14" stroke="#999" stroke-width="4"/>
    <rect x="25" y="0" width="90" height="28" rx="12" fill="#e8d5b5" stroke="#8a6d3b" stroke-width="2"/>
    <rect x="42" y="0" width="7" height="28" fill="#e63946"/>
    <rect x="56" y="0" width="7" height="28" fill="#e63946"/>
    <rect x="70" y="0" width="7" height="28" fill="#8a4b1f"/>
    <rect x="96" y="0" width="7" height="28" fill="#d4af37"/>
    <line x1="115" y1="14" x2="140" y2="14" stroke="#999" stroke-width="4"/>
  </g>
  <text x="430" y="158" text-anchor="middle" font-size="14" font-weight="700" fill="#1e2a4a">resistor 220 Ω</text>
  <text x="430" y="175" text-anchor="middle" font-size="12" fill="#555">gelang merah-merah-cokelat-emas</text>
  <!-- green wire: resistor pin 2 (480,200) -> right -> down -> LED A (500,350) from the right -->
  <path d="M478 200 L560 200 L560 350 L506 350" fill="none" stroke="#2a9d8f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- LED: dome 230-300, rim 300-314, legs to 350; C leg x=440, A leg x=500 -->
  <g transform="translate(420,230)">
    <circle cx="50" cy="40" r="56" fill="#ffd166" opacity="0.22"/>
    <path d="M10 70 L10 30 A40 40 0 0 1 90 30 L90 70 Z" fill="#e63946" opacity="0.92"/>
    <rect x="2" y="70" width="96" height="14" rx="3" fill="#c1121f"/>
    <rect x="2" y="70" width="7" height="14" fill="#8a0a14"/>
    <line x1="20" y1="84" x2="20" y2="106" stroke="#999" stroke-width="5"/>
    <line x1="80" y1="84" x2="80" y2="120" stroke="#999" stroke-width="5"/>
  </g>
  <text x="470" y="412" text-anchor="middle" font-size="14" font-weight="700" fill="#1e2a4a">LED merah</text>
  <text x="432" y="374" text-anchor="end" font-size="13" font-weight="700" fill="#1e2a4a">C (−)</text>
  <text x="432" y="390" text-anchor="end" font-size="12" fill="#555">kaki pendek</text>
  <text x="508" y="374" text-anchor="start" font-size="13" font-weight="700" fill="#2a9d8f">A (+)</text>
  <text x="508" y="390" text-anchor="start" font-size="12" fill="#555">kaki panjang</text>

  <!-- black wire: LED C (440,350) -> straight left -> GND (260,350) -->
  <path d="M440 336 L420 336 L420 350 L262 350" fill="none" stroke="#1e2a4a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="300" y="440" text-anchor="start" font-size="12" fill="#1e2a4a" font-weight="600">kabel hitam → GND (titik nol)</text>
  <line x1="340" y1="426" x2="340" y2="358" stroke="#1e2a4a" stroke-width="1.5"/>

  <!-- current flow arrows -->
  <g stroke="#e63946" stroke-width="2" fill="none">
    <path d="M276 282 L302 282" marker-end="url(#arr)"/>
    <path d="M492 188 L540 188" marker-end="url(#arr)"/>
    <path d="M400 338 L340 338" marker-end="url(#arr)"/>
  </g>
  <text x="300" y="272" text-anchor="middle" font-size="11" fill="#e63946">arus</text>

  <!-- legend box -->
  <rect x="600" y="100" width="460" height="320" rx="12" fill="#fff" stroke="#e0dcd2" stroke-width="1.5"/>
  <text x="620" y="130" font-size="16" font-weight="700" fill="#1e2a4a">Kenapa begini?</text>
  <g font-size="13" fill="#333">
    <text x="620" y="160"><tspan font-weight="700" fill="#2a9d8f">D4</tspan> = "keran" yang dibuka-tutup oleh kode:</text>
    <text x="620" y="178">HIGH = listrik keluar, LOW = tidak ada listrik.</text>
    <text x="620" y="208"><tspan font-weight="700" fill="#8a6d3b">Resistor</tspan> = "penyempit pipa" agar arus tidak terlalu</text>
    <text x="620" y="226">deras. Tanpa resistor, LED atau pin ESP32 bisa rusak.</text>
    <text x="620" y="244">Angka 220 akan kamu hitung sendiri di Modul 2.</text>
    <text x="620" y="274"><tspan font-weight="700" fill="#e63946">LED</tspan> hanya menyala satu arah: listrik masuk dari</text>
    <text x="620" y="292">kaki panjang (A), keluar dari kaki pendek (C).</text>
    <text x="620" y="310">Terbalik = tidak menyala, tapi tidak rusak.</text>
    <text x="620" y="340"><tspan font-weight="700" fill="#1e2a4a">GND</tspan> = titik nol. Setiap rangkaian harus "pulang"</text>
    <text x="620" y="358">ke GND supaya arus bisa mengalir memutar.</text>
    <text x="620" y="388" font-size="12" fill="#555">Papan punya dua pin GND (kiri dan kanan); keduanya sama.</text>
    <text x="620" y="406" font-size="12" fill="#555">Kita memakai GND di sisi kanan karena dekat dengan D4.</text>
  </g>

  <rect x="70" y="460" width="990" height="60" rx="10" fill="#fde4c8"/>
  <text x="565" y="484" text-anchor="middle" font-size="14" fill="#1e2a4a">Di Wokwi, tiga kabel ini sudah ditulis untukmu di file <tspan font-family="'DejaVu Sans Mono', monospace" font-weight="700">diagram.json</tspan>:</text>
  <text x="565" y="506" text-anchor="middle" font-size="13" fill="#1e2a4a" font-family="'DejaVu Sans Mono', monospace">esp:D4 → r1:1 · r1:2 → led1:A · led1:C → esp:GND.1</text>
  <text x="1060" y="550" text-anchor="end" font-size="11" fill="#999">Kurikulum Fullstack IoT Developer · CC BY 4.0</text>
</svg>
