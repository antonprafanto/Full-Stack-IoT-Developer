<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2a9d8f"/></marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1e2a4a"/></marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e63946"/></marker>
  </defs>
  <rect width="1100" height="520" fill="#fffdf7"/>
  <text x="550" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#1e2a4a">Cara membedakan dua kaki LED</text>
  <text x="550" y="66" text-anchor="middle" font-size="15" fill="#555">Tiga petunjuk yang selalu ada pada LED 5 mm baru: panjang kaki, sisi pipih pada bibir, dan bentuk di dalam kubah</text>

  <!-- side view LED -->
  <g transform="translate(430,100)">
    <circle cx="100" cy="90" r="110" fill="#ffd166" opacity="0.18"/>
    <!-- dome -->
    <path d="M40 160 L40 80 A60 60 0 0 1 160 80 L160 160 Z" fill="#e63946" opacity="0.9"/>
    <!-- internal: anvil (big, cathode) and post (small, anode) -->
    <path d="M118 150 L118 95 L142 95 L142 150 Z" fill="#8a0a14" opacity="0.7"/>
    <path d="M62 150 L62 110 L74 110 L74 150 Z" fill="#8a0a14" opacity="0.7"/>
    <line x1="74" y1="112" x2="118" y2="98" stroke="#ffd166" stroke-width="2"/>
    <!-- rim with flat side on the right (cathode side) -->
    <rect x="28" y="160" width="144" height="18" rx="4" fill="#c1121f"/>
    <rect x="158" y="160" width="14" height="18" fill="#8a0a14"/>
    <!-- legs -->
    <line x1="68" y1="178" x2="68" y2="272" stroke="#8d99ae" stroke-width="8" stroke-linecap="round"/>
    <line x1="132" y1="178" x2="132" y2="226" stroke="#8d99ae" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- labels left (anode) -->
  <text x="400" y="300" text-anchor="end" font-size="18" font-weight="700" fill="#2a9d8f">Kaki PANJANG = anoda (A, +)</text>
  <text x="400" y="322" text-anchor="end" font-size="13" fill="#555">listrik MASUK dari sini</text>
  <text x="400" y="340" text-anchor="end" font-size="13" fill="#555">disambung ke resistor → pin D4</text>
  <path d="M408 300 L488 340" fill="none" stroke="#2a9d8f" stroke-width="2.5" marker-end="url(#arrg)"/>

  <!-- labels right (cathode) -->
  <text x="660" y="300" text-anchor="start" font-size="18" font-weight="700" fill="#1e2a4a">Kaki PENDEK = katoda (C, −)</text>
  <text x="660" y="322" text-anchor="start" font-size="13" fill="#555">listrik KELUAR dari sini</text>
  <text x="660" y="340" text-anchor="start" font-size="13" fill="#555">disambung ke GND</text>
  <path d="M652 300 L572 300" fill="none" stroke="#1e2a4a" stroke-width="2.5" marker-end="url(#arrb)"/>

  <!-- flat side label -->
  <text x="660" y="230" text-anchor="start" font-size="16" font-weight="700" fill="#e63946">Sisi PIPIH pada bibir = sisi katoda</text>
  <text x="660" y="250" text-anchor="start" font-size="13" fill="#555">raba bibir plastiknya: ada bagian yang rata</text>
  <path d="M652 236 L604 266" fill="none" stroke="#e63946" stroke-width="2.5" marker-end="url(#arrr)"/>

  <!-- inside label -->
  <text x="400" y="200" text-anchor="end" font-size="16" font-weight="700" fill="#8a0a14">Di dalam kubah: bagian yang BESAR = katoda</text>
  <text x="400" y="220" text-anchor="end" font-size="13" fill="#555">(berguna kalau kaki sudah dipotong sama panjang)</text>
  <path d="M408 205 L552 218" fill="none" stroke="#8a0a14" stroke-width="2.5" marker-end="url(#arrb)"/>

  <!-- top view inset -->
  <g transform="translate(80,380)">
    <rect x="0" y="0" width="360" height="120" rx="10" fill="#fff" stroke="#e0dcd2" stroke-width="1.5"/>
    <text x="180" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#1e2a4a">Dilihat dari atas</text>
    <path d="M60 70 m-36 0 a36 36 0 1 1 72 0 a36 36 0 1 1 -72 0" fill="#e63946" opacity="0.85"/>
    <!-- flat cut on the right -->
    <rect x="88" y="34" width="10" height="72" fill="#fff"/>
    <line x1="88" y1="40" x2="88" y2="100" stroke="#8a0a14" stroke-width="3"/>
    <text x="120" y="60" font-size="12" fill="#333">sisi rata di sini</text>
    <text x="120" y="78" font-size="12" fill="#333">= kaki katoda (−)</text>
    <text x="120" y="96" font-size="12" fill="#333">ada di sisi itu</text>
  </g>

  <!-- wokwi mapping -->
  <g transform="translate(480,380)">
    <rect x="0" y="0" width="560" height="120" rx="10" fill="#fff" stroke="#e0dcd2" stroke-width="1.5"/>
    <text x="280" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#1e2a4a">Di Wokwi, kedua kaki diberi nama</text>
    <text x="20" y="54" font-size="13" fill="#333"><tspan font-family="'DejaVu Sans Mono', monospace" font-weight="700">led1:A</tspan> = anoda (kaki panjang) → dari resistor</text>
    <text x="20" y="78" font-size="13" fill="#333"><tspan font-family="'DejaVu Sans Mono', monospace" font-weight="700">led1:C</tspan> = katoda (kaki pendek) → ke GND</text>
    <text x="20" y="104" font-size="12" fill="#555">Tertukar? LED tidak menyala, tapi tidak rusak — tinggal tukar kabelnya.</text>
  </g>
  <text x="1060" y="514" text-anchor="end" font-size="11" fill="#999">Kurikulum Fullstack IoT Developer · CC BY 4.0</text>
</svg>
