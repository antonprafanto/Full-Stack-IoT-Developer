<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1200" height="430" fill="#fffdf7"/>
  <text x="600" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#1e2a4a">Peta jalan mini — kamu ada di sini</text>
  <text x="600" y="66" text-anchor="middle" font-size="15" fill="#555">32 modul = 32 minggu · satu proyek benang merah "Rumah Pintar Mini" yang tumbuh dari LED berkedip sampai sistem online</text>

  <!-- phase bar -->
  <g font-size="14" font-weight="600">
    <rect x="60" y="100" width="140" height="56" rx="8" fill="#f4a261"/>
    <text x="130" y="124" text-anchor="middle" fill="#1e2a4a">FASE 0</text>
    <text x="130" y="144" text-anchor="middle" fill="#1e2a4a" font-weight="400">Fondasi · M1–4</text>

    <rect x="206" y="100" width="170" height="56" rx="8" fill="#fde4c8"/>
    <text x="291" y="124" text-anchor="middle" fill="#1e2a4a">FASE 1</text>
    <text x="291" y="144" text-anchor="middle" fill="#1e2a4a" font-weight="400">ESP32 · M5–9</text>

    <rect x="382" y="100" width="200" height="56" rx="8" fill="#cfe9f3"/>
    <text x="482" y="124" text-anchor="middle" fill="#1e2a4a">FASE 2</text>
    <text x="482" y="144" text-anchor="middle" fill="#1e2a4a" font-weight="400">Konektivitas · M10–15</text>

    <rect x="588" y="100" width="200" height="56" rx="8" fill="#d6f0e3"/>
    <text x="688" y="124" text-anchor="middle" fill="#1e2a4a">FASE 3</text>
    <text x="688" y="144" text-anchor="middle" fill="#1e2a4a" font-weight="400">Backend &amp; data · M16–21</text>

    <rect x="794" y="100" width="140" height="56" rx="8" fill="#e6dcf5"/>
    <text x="864" y="124" text-anchor="middle" fill="#1e2a4a">FASE 4</text>
    <text x="864" y="144" text-anchor="middle" fill="#1e2a4a" font-weight="400">Dashboard · M22–25</text>

    <rect x="940" y="100" width="200" height="56" rx="8" fill="#e0e0e0"/>
    <text x="1040" y="124" text-anchor="middle" fill="#1e2a4a">FASE 5</text>
    <text x="1040" y="144" text-anchor="middle" fill="#1e2a4a" font-weight="400">Operasi &amp; skala · M26–32</text>
  </g>

  <!-- module boxes inside Fase 0 -->
  <g font-size="13" font-weight="600" text-anchor="middle">
    <rect x="60" y="170" width="30" height="26" rx="5" fill="#e63946"/>
    <text x="75" y="188" fill="#fff">M1</text>
    <rect x="96" y="170" width="30" height="26" rx="5" fill="#fff" stroke="#f4a261" stroke-width="2"/>
    <text x="111" y="188" fill="#1e2a4a">M2</text>
    <rect x="132" y="170" width="30" height="26" rx="5" fill="#fff" stroke="#f4a261" stroke-width="2"/>
    <text x="147" y="188" fill="#1e2a4a">M3</text>
    <rect x="168" y="170" width="30" height="26" rx="5" fill="#fff" stroke="#f4a261" stroke-width="2"/>
    <text x="183" y="188" fill="#1e2a4a">M4</text>
  </g>
  <!-- pointer -->
  <path d="M75 215 L75 236" stroke="#e63946" stroke-width="3"/>
  <path d="M66 228 L75 238 L84 228" fill="none" stroke="#e63946" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="75" y="210" text-anchor="middle" font-size="13" fill="#e63946" font-weight="700">KAMU DI SINI</text>

  <!-- what M1 contributes -->
  <rect x="60" y="250" width="1080" height="150" rx="12" fill="#fff" stroke="#e0dcd2" stroke-width="1.5"/>
  <text x="80" y="280" font-size="17" font-weight="700" fill="#1e2a4a">Modul 1 minggu ini (±6–8 jam, santai):</text>

  <g font-size="14" fill="#333">
    <g transform="translate(80,300)">
      <circle cx="10" cy="10" r="10" fill="#0f8b8d"/><text x="10" y="15" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text>
      <text x="28" y="15">Kemenangan 10 menit: LED berkedip di simulator Wokwi</text>
    </g>
    <g transform="translate(80,330)">
      <circle cx="10" cy="10" r="10" fill="#0f8b8d"/><text x="10" y="15" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text>
      <text x="28" y="15">Konsep: apa itu IoT, "fullstack", mikrokontroler vs laptop, kode → chip</text>
    </g>
    <g transform="translate(80,360)">
      <circle cx="10" cy="10" r="10" fill="#0f8b8d"/><text x="10" y="15" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text>
      <text x="28" y="15">Praktik: ubah kecepatan kedip → LED kedua → pola kedip namamu</text>
    </g>
    <g transform="translate(620,300)">
      <circle cx="10" cy="10" r="10" fill="#f4a261"/><text x="10" y="15" text-anchor="middle" font-size="12" font-weight="700" fill="#1e2a4a">4</text>
      <text x="28" y="15">Simpan hasil ke GitHub lewat browser (tanpa instal apa pun)</text>
    </g>
    <g transform="translate(620,330)">
      <circle cx="10" cy="10" r="10" fill="#f4a261"/><text x="10" y="15" text-anchor="middle" font-size="12" font-weight="700" fill="#1e2a4a">5</text>
      <text x="28" y="15">Cara bertanya yang baik &amp; kenapa "versi" itu penting</text>
    </g>
    <g transform="translate(620,360)">
      <circle cx="10" cy="10" r="10" fill="#f4a261"/><text x="10" y="15" text-anchor="middle" font-size="12" font-weight="700" fill="#1e2a4a">6</text>
      <text x="28" y="15">Pesan Kit A Tahap 1 (foto "benar vs salah") + tulis visi proyekmu</text>
    </g>
  </g>
  <text x="1140" y="420" text-anchor="end" font-size="11" fill="#999">Kurikulum Fullstack IoT Developer · CC BY 4.0</text>
</svg>
