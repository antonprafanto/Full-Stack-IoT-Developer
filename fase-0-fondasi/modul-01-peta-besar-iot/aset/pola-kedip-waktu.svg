<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1100" height="520" fill="#fffdf7"/>
  <text x="550" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#1e2a4a">delay() = "tunggu sebentar": begini bentuk kedipnya di garis waktu</text>
  <text x="550" y="66" text-anchor="middle" font-size="15" fill="#555">Sumbu mendatar = waktu (milidetik). Garis di posisi ATAS = LED menyala (HIGH), di posisi BAWAH = padam (LOW).</text>

  <!-- Pattern 1: 500/500 -->
  <g transform="translate(60,100)">
    <text x="0" y="0" font-size="16" font-weight="700" fill="#1e2a4a">Pola 1 — Blink dasar: delay(500) nyala, delay(500) padam</text>
    <!-- axis -->
    <line x1="0" y1="90" x2="980" y2="90" stroke="#bbb" stroke-width="1"/>
    <g font-size="11" fill="#777" text-anchor="middle">
      <text x="0" y="108">0</text><text x="160" y="108">500</text><text x="320" y="108">1000</text><text x="480" y="108">1500</text><text x="640" y="108">2000</text><text x="800" y="108">2500</text><text x="960" y="108">3000 ms</text>
    </g>
    <path d="M0 90 L0 30 L160 30 L160 90 L320 90 L320 30 L480 30 L480 90 L640 90 L640 30 L800 30 L800 90 L960 90" fill="none" stroke="#e63946" stroke-width="4" stroke-linejoin="round"/>
    <g font-size="12" fill="#e63946" font-weight="600" text-anchor="middle">
      <text x="80" y="22">NYALA</text><text x="400" y="22">NYALA</text><text x="720" y="22">NYALA</text>
    </g>
    <g font-size="12" fill="#555" text-anchor="middle">
      <text x="240" y="80">padam</text><text x="560" y="80">padam</text><text x="880" y="80">padam</text>
    </g>
  </g>

  <!-- Pattern 2: 100/100 fast -->
  <g transform="translate(60,240)">
    <text x="0" y="0" font-size="16" font-weight="700" fill="#1e2a4a">Pola 2 — Ganti angka jadi delay(100): kedip 5× lebih cepat (bisa dipakai jadi "alarm")</text>
    <line x1="0" y1="90" x2="980" y2="90" stroke="#bbb" stroke-width="1"/>
    <g font-size="11" fill="#777" text-anchor="middle">
      <text x="0" y="108">0</text><text x="160" y="108">500</text><text x="320" y="108">1000</text><text x="480" y="108">1500</text><text x="640" y="108">2000</text><text x="800" y="108">2500</text><text x="960" y="108">3000 ms</text>
    </g>
    <path d="M0 90 L0 30 L32 30 L32 90 L64 90 L64 30 L96 30 L96 90 L128 90 L128 30 L160 30 L160 90 L192 90 L192 30 L224 30 L224 90 L256 90 L256 30 L288 30 L288 90 L320 90 L320 30 L352 30 L352 90 L384 90 L384 30 L416 30 L416 90 L448 90 L448 30 L480 30 L480 90 L512 90 L512 30 L544 30 L544 90 L576 90 L576 30 L608 30 L608 90 L640 90 L640 30 L672 30 L672 90 L704 90 L704 30 L736 30 L736 90 L768 90 L768 30 L800 30 L800 90 L832 90 L832 30 L864 30 L864 90 L896 90 L896 30 L928 30 L928 90 L960 90" fill="none" stroke="#f4a261" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- Pattern 3: ANI -->
  <g transform="translate(60,380)">
    <text x="0" y="0" font-size="16" font-weight="700" fill="#1e2a4a">Pola 3 — "Pola namamu" (Praktik 3): contoh nama ANI dalam kode Morse — pendek 200 ms, panjang 600 ms, jeda akhir 1000 ms</text>
    <line x1="0" y1="90" x2="980" y2="90" stroke="#bbb" stroke-width="1"/>
    <g font-size="11" fill="#777" text-anchor="middle">
      <text x="0" y="108">0</text><text x="196" y="108">1000</text><text x="392" y="108">2000</text><text x="588" y="108">3000</text><text x="784" y="108">4000</text><text x="980" y="108">5000 ms</text>
    </g>
    <path d="M0 90 L0 30 L39.2 30 L39.2 90 L78.4 90 L78.4 30 L196 30 L196 90 L313.6 90 L313.6 30 L431.2 30 L431.2 90 L470.4 90 L470.4 30 L509.6 30 L509.6 90 L627.2 90 L627.2 30 L666.4 30 L666.4 90 L705.6 90 L705.6 30 L744.8 30 L744.8 90 L980 90" fill="none" stroke="#0f8b8d" stroke-width="4" stroke-linejoin="round"/>
    <g font-size="14" fill="#0f8b8d" font-weight="700" text-anchor="middle">
      <text x="98" y="22">A  (· —)</text><text x="411" y="22">N  (— ·)</text><text x="686" y="22">I  (· ·)</text>
    </g>
    <text x="862" y="78" text-anchor="middle" font-size="12" fill="#555">jeda ±1,2 detik (200 + JEDA 1000 ms), lalu ulang</text>
  </g>
  <text x="1040" y="510" text-anchor="end" font-size="11" fill="#999">Kurikulum Fullstack IoT Developer · CC BY 4.0</text>
</svg>
