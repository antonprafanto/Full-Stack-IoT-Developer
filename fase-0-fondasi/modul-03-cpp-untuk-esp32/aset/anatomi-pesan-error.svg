<text x="84.0" y="618.0" font-size="14.5" font-weight="400" fill="#1e2a4a" text-anchor="start" >1. Lihat nomor barisnya dulu (angka di tepi kiri editor), lalu periksa baris itu dan satu baris di atasnya.</text>
<text x="84.0" y="639.0" font-size="14.5" font-weight="400" fill="#1e2a4a" text-anchor="start" >2. Betulkan error PERTAMA saja, lalu jalankan ulang — pesan-pesan sesudahnya sering ikut hilang.</text>
<text x="84.0" y="660.0" font-size="14.5" font-weight="400" fill="#1e2a4a" text-anchor="start" >3. Di Arduino IDE pesannya sama, diawali alamat file lengkap dan diakhiri "Compilation error: …".</text>
