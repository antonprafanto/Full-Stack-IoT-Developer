<text x="760.0" y="283.0" font-size="13.5" font-weight="400" fill="#1e2a4a" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">Content-Type: application/json</text>
<text x="760.0" y="308.0" font-size="13.5" font-weight="400" fill="#1e2a4a" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">Connection: keep-alive</text>
<text x="760.0" y="333.0" font-size="13.5" font-weight="400" fill="#1e2a4a" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">…</text>
<text x="760.0" y="383.0" font-size="13.5" font-weight="800" fill="#1e2a4a" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">{"ok":true}</text>
<text x="760.0" y="410.0" font-size="14" font-weight="800" fill="#2a9d5c" text-anchor="start" >200 = kode status: berhasil</text>
<text x="760.0" y="434.0" font-size="13.5" font-weight="600" fill="#4a5568" text-anchor="start" >4xx = salah di pengirim (404: jalur tidak ada)</text>
<text x="760.0" y="456.0" font-size="13.5" font-weight="600" fill="#4a5568" text-anchor="start" >5xx = salah di server (500)</text>
<text x="760.0" y="478.0" font-size="13.5" font-weight="700" fill="#e63946" text-anchor="start" >angka negatif = tidak ada balasan (HTTPClient)</text>
<rect x="50.0" y="545.0" width="1100.0" height="76.0" rx="12" fill="#eef1f5" />
<text x="74.0" y="577.0" font-size="15" font-weight="800" fill="#1e2a4a" text-anchor="start" >GET = "tolong berikan…" (tanpa body) · POST = "terimalah kiriman ini" (dengan body)</text>
<text x="74.0" y="603.0" font-size="14" font-weight="600" fill="#4a5568" text-anchor="start" >Header Content-Type memberi tahu jenis isinya; HTTPClient menghitung Content-Length sendiri.</text>
