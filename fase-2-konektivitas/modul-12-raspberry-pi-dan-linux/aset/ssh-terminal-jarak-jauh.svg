<text x="886.0" y="206.0" font-size="12.5" font-weight="600" fill="#4a5568" text-anchor="start" >tanpa monitor dan papan ketik</text>
<text x="824.0" y="252.0" font-size="13.5" font-weight="600" fill="#1e2a4a" text-anchor="start" >• layanan SSH menunggu di pintu 22</text>
