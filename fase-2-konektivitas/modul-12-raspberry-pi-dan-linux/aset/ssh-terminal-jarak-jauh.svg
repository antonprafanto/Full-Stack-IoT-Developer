<text x="62.0" y="500.0" font-size="14" font-weight="800" fill="#1e2a4a" text-anchor="start" >Sapaan pertama:</text>
<text x="196.0" y="500.0" font-size="13.5" font-weight="600" fill="#4a5568" text-anchor="start" >SSH menunjukkan sidik jari kunci Pi (SHA256:…). Jawab yes, dan laptop mencatatnya di known_hosts.</text>
<text x="62.0" y="528.0" font-size="14" font-weight="800" fill="#1e2a4a" text-anchor="start" >Berikutnya:</text>
<text x="196.0" y="528.0" font-size="13.5" font-weight="600" fill="#4a5568" text-anchor="start" >sidik jari dicocokkan setiap kali. Berbeda (misalnya kartu baru ditulis ulang)? SSH menolak dan memperingatkanmu.</text>
