<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<rect width="1200" height="640" fill="#fffdf7"/>
<text x="600.0" y="44.0" font-size="28" font-weight="800" fill="#1e2a4a" text-anchor="middle" >Peta rumah Linux: satu pohon dari /</text>
<text x="600.0" y="76.0" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" >Folder yang dipakai minggu ini · Windows punya C:\, Linux hanya punya satu akar: /</text>
<rect x="70.0" y="120.0" width="70.0" height="44.0" rx="10" fill="#1e2a4a" />
<text x="105.0" y="149.0" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">/</text>
<path d="M105 164 L105 218 L154 218" fill="none" stroke="#9aa3b0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<rect x="160.0" y="196.0" width="1010.0" height="46.0" rx="10" fill="#e6eefb" stroke="#2f6fd1" stroke-width="1.6" />
<text x="180.0" y="225.0" font-size="16" font-weight="800" fill="#1e2a4a" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">/home/budi</text>
<text x="470.0" y="225.0" font-size="14.5" font-weight="800" fill="#2f6fd1" text-anchor="start" >~  · meja kerjamu</text>
<text x="640.0" y="225.0" font-size="13" font-weight="600" fill="#4a5568" text-anchor="start" >berkas milikmu sendiri; tempat SSH membawamu masuk</text>
<path d="M105 164 L105 284 L154 284" fill="none" stroke="#9aa3b0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<rect x="160.0" y="262.0" width="1010.0" height="46.0" rx="10" fill="#fdeedd" stroke="#b45f17" stroke-width="1.6" />
<text x="180.0" y="291.0" font-size="16" font-weight="800" fill="#1e2a4a" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">/etc/mosquitto/conf.d</text>
<text x="470.0" y="291.0" font-size="14.5" font-weight="800" fill="#b45f17" text-anchor="start" >lemari pengaturan</text>
<text x="640.0" y="291.0" font-size="13" font-weight="600" fill="#4a5568" text-anchor="start" >pengaturan Mosquitto (berkas .conf); mengubahnya butuh sudo</text>
<path d="M105 164 L105 350 L154 350" fill="none" stroke="#9aa3b0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<rect x="160.0" y="328.0" width="1010.0" height="46.0" rx="10" fill="#e2f3f1" stroke="#0f8b8d" stroke-width="1.6" />
<text x="180.0" y="357.0" font-size="16" font-weight="800" fill="#1e2a4a" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">/var/log/mosquitto</text>
<text x="470.0" y="357.0" font-size="14.5" font-weight="800" fill="#0f8b8d" text-anchor="start" >buku catatan</text>
<text x="640.0" y="357.0" font-size="13" font-weight="600" fill="#4a5568" text-anchor="start" >mosquitto.log: setiap klien yang masuk dan keluar</text>
<path d="M105 164 L105 416 L154 416" fill="none" stroke="#9aa3b0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<rect x="160.0" y="394.0" width="1010.0" height="46.0" rx="10" fill="#eef1f5" />
<text x="180.0" y="423.0" font-size="16" font-weight="800" fill="#1e2a4a" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">/var/lib/mosquitto</text>
<text x="470.0" y="423.0" font-size="14.5" font-weight="800" fill="#4a5568" text-anchor="start" >simpanan pesan</text>
<text x="640.0" y="423.0" font-size="13" font-weight="600" fill="#4a5568" text-anchor="start" >mosquitto.db: pesan retained (papan pengumuman) yang disimpan ke kartu</text>
<path d="M105 164 L105 482 L154 482" fill="none" stroke="#9aa3b0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<rect x="160.0" y="460.0" width="1010.0" height="46.0" rx="10" fill="#eef1f5" />
<text x="180.0" y="489.0" font-size="16" font-weight="800" fill="#1e2a4a" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">/boot/firmware</text>
<text x="470.0" y="489.0" font-size="14.5" font-weight="800" fill="#4a5568" text-anchor="start" >kunci pintu depan</text>
<text x="640.0" y="489.0" font-size="13" font-weight="600" fill="#4a5568" text-anchor="start" >berkas penyala Pi; satu-satunya bagian yang terbaca Windows (bootfs)</text>
<path d="M105 164 L105 548 L154 548" fill="none" stroke="#9aa3b0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<rect x="160.0" y="526.0" width="1010.0" height="46.0" rx="10" fill="#eef1f5" />
<text x="180.0" y="555.0" font-size="16" font-weight="800" fill="#1e2a4a" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">/usr/bin  ·  /usr/sbin</text>
<text x="470.0" y="555.0" font-size="14.5" font-weight="800" fill="#4a5568" text-anchor="start" >ruang peralatan</text>
<text x="640.0" y="555.0" font-size="13" font-weight="600" fill="#4a5568" text-anchor="start" >program: mosquitto_sub, nano, … dan mosquitto sendiri (/usr/sbin)</text>
<text x="70.0" y="600.0" font-size="13.5" font-weight="700" fill="#1e2a4a" text-anchor="start" >Garis miring Linux "/" berlawanan dengan Windows "\" · huruf besar-kecil dibedakan: Mosquitto.conf ≠ mosquitto.conf</text>
<text x="1178.0" y="626.0" font-size="12" font-weight="400" fill="#8a8f9c" text-anchor="end" >Kurikulum Fullstack IoT Developer · CC BY 4.0</text>
</svg>
