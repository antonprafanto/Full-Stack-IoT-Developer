<rect x="30.0" y="586.0" width="1140.0" height="76.0" rx="10" fill="#eef1f5" />
<text x="52.0" y="616.0" font-size="13.5" font-weight="700" fill="#1e2a4a" text-anchor="start" >QoS berlaku per ruas: penerbit → broker memakai QoS penerbit; broker → pelanggan memakai yang lebih kecil antara QoS terbitan dan QoS langganan.</text>
<text x="52.0" y="642.0" font-size="13.5" font-weight="600" fill="#4a5568" text-anchor="start" >PubSubClient3 di ESP32: berlangganan QoS 0 atau 1; menerbitkan QoS 1 tanpa pernah mengirim ulang (setara QoS 0 saat sambungan putus).</text>
