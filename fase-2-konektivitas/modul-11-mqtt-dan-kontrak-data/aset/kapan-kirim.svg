<text x="52.0" y="518.0" font-size="13.5" font-weight="700" fill="#1e2a4a" text-anchor="start" >Kiriman segera hanya saat keadaan BERGANTI, ke dua arah: gerakan ada/hilang, terang/gelap, tanah kering/basah, air tandon rendah/cukup.</text>
<text x="52.0" y="544.0" font-size="13.5" font-weight="600" fill="#4a5568" text-anchor="start" >Bukan di setiap bacaan. Isi pesannya sama dengan kiriman terjadwal: delapan kolom telemetry dengan bacaan terbaru.</text>
<text x="52.0" y="568.0" font-size="12.5" font-weight="600" fill="#4a5568" text-anchor="start" >Node 1 v1.2 memeriksa keadaan setiap kali sensor dibaca (2 detik sekali), jadi kiriman segeranya jatuh pada bacaan berikutnya.</text>
