<circle cx="490.0" cy="150.0" r="6" fill="#2f6fd1" />
<circle cx="650.0" cy="150.0" r="6" fill="#2f6fd1" />
<text x="490.0" y="128.0" font-size="12" font-weight="700" fill="#2f6fd1" text-anchor="middle" >telemetry setiap 10 s</text>
<circle cx="179.6" cy="150.0" r="6" fill="#1e2a4a" />
<text x="174.0" y="186.0" font-size="12" font-weight="800" fill="#1e2a4a" text-anchor="start" >CONNECT + titip wasiat:</text>
<text x="174.0" y="204.0" font-size="11.5" font-weight="600" fill="#1e2a4a" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">status = "offline", QoS 1, retained</text>
<text x="174.0" y="222.0" font-size="12" font-weight="700" fill="#2a9d5c" text-anchor="start" >lalu terbit online (retained)</text>
<circle cx="698.0" cy="150.0" r="11" fill="#e63946" />
<path d="M693.5 145.5 L702.5 154.5 M702.5 145.5 L693.5 154.5" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
<text x="698.0" y="128.0" font-size="12" font-weight="800" fill="#e63946" text-anchor="middle" >USB dicabut</text>
<text x="40.0" y="285.0" font-size="15" font-weight="800" fill="#1e2a4a" text-anchor="start" >Broker</text>
<rect x="186.0" y="266.0" width="824.0" height="28.0" rx="6" fill="#e3f4ea" stroke="#2a9d5c" stroke-width="1.5" />
<text x="418.0" y="285.0" font-size="12.5" font-weight="800" fill="#2a9d5c" text-anchor="middle" >papan pengumuman: online</text>
<rect x="1010.0" y="266.0" width="120.0" height="28.0" rx="6" fill="#fde6e8" stroke="#e63946" stroke-width="1.5" />
<text x="1070.0" y="285.0" font-size="12.5" font-weight="800" fill="#e63946" text-anchor="middle" >offline</text>
<path d="M650.0 304 L650.0 314 L1010.0 314 L1010.0 304" fill="none" stroke="#b45f17" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<text x="830.0" y="334.0" font-size="12.5" font-weight="800" fill="#b45f17" text-anchor="middle" >22,5 s tanpa kabar = 1,5 × keep-alive 15 s</text>
<text x="1004.0" y="256.0" font-size="12.5" font-weight="800" fill="#e63946" text-anchor="end" >wasiat diterbitkan →</text>
<text x="40.0" y="415.0" font-size="15" font-weight="800" fill="#1e2a4a" text-anchor="start" >MQTTX</text>
<rect x="410.0" y="396.0" width="720.0" height="28.0" rx="6" fill="#ffffff" stroke="#e0dcd2" stroke-width="1.5" />
<circle cx="410.0" cy="410.0" r="7" fill="#2a9d5c" />
<text x="422.0" y="415.0" font-size="12.5" font-weight="700" fill="#2a9d5c" text-anchor="start" >baru berlangganan: langsung menerima online [Retained]</text>
<circle cx="1010.0" cy="410.0" r="7" fill="#e63946" />
<text x="998.0" y="388.0" font-size="12.5" font-weight="800" fill="#e63946" text-anchor="end" >menerima offline</text>
<line x1="1010.0" y1="294.0" x2="1010.0" y2="403.0" stroke="#e63946" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 4" />
<line x1="410.0" y1="294.0" x2="410.0" y2="403.0" stroke="#2a9d5c" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="5 4" />
<rect x="30.0" y="520.0" width="370.0" height="140.0" rx="12" fill="#ffffff" stroke="#2a9d5c" stroke-width="2" />
<text x="50.0" y="552.0" font-size="15.5" font-weight="800" fill="#2a9d5c" text-anchor="start" >Retained = papan pengumuman</text>
<text x="50.0" y="588.0" font-size="13" font-weight="600" fill="#1e2a4a" text-anchor="start" >• pesan terakhir di sebuah topik disimpan broker</text>
<text x="50.0" y="618.0" font-size="13" font-weight="600" fill="#1e2a4a" text-anchor="start" >• pelanggan baru langsung menerimanya</text>
<text x="50.0" y="648.0" font-size="13" font-weight="600" fill="#1e2a4a" text-anchor="start" >• hapus: pesan kosong + tanda retained</text>
<rect x="415.0" y="520.0" width="370.0" height="140.0" rx="12" fill="#ffffff" stroke="#e63946" stroke-width="2" />
<text x="435.0" y="552.0" font-size="15.5" font-weight="800" fill="#e63946" text-anchor="start" >Last Will = surat wasiat</text>
<text x="435.0" y="588.0" font-size="13" font-weight="600" fill="#1e2a4a" text-anchor="start" >• dititipkan klien saat menyambung</text>
<text x="435.0" y="618.0" font-size="13" font-weight="600" fill="#1e2a4a" text-anchor="start" >• diterbitkan broker kalau klien hilang tanpa pamit</text>
<text x="435.0" y="648.0" font-size="13" font-weight="600" fill="#1e2a4a" text-anchor="start" >• dibuang kalau klien pamit (DISCONNECT)</text>
<rect x="800.0" y="520.0" width="370.0" height="140.0" rx="12" fill="#ffffff" stroke="#b45f17" stroke-width="2" />
<text x="820.0" y="552.0" font-size="15.5" font-weight="800" fill="#b45f17" text-anchor="start" >Keep-alive = detak jantung</text>
<text x="820.0" y="588.0" font-size="13" font-weight="600" fill="#1e2a4a" text-anchor="start" >• klien kirim sesuatu paling lambat setiap 15 s</text>
<text x="820.0" y="618.0" font-size="13" font-weight="600" fill="#1e2a4a" text-anchor="start" >• 15 s tanpa paket broker: PINGREQ → PINGRESP</text>
<text x="820.0" y="648.0" font-size="13" font-weight="600" fill="#1e2a4a" text-anchor="start" >• broker menyerah setelah 22,5 s</text>
<text x="1178.0" y="686.0" font-size="12" font-weight="400" fill="#8a8f9c" text-anchor="end" >Kurikulum Fullstack IoT Developer · CC BY 4.0</text>
