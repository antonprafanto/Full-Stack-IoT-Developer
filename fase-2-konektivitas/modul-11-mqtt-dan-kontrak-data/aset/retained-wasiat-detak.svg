<rect x="698.0" y="136.0" width="432.0" height="28.0" rx="6" fill="#eef1f5" stroke="#9aa3b0" stroke-width="1.5" />
<text x="914.0" y="155.0" font-size="12.5" font-weight="700" fill="#4a5568" text-anchor="middle" >mati: tidak bisa mengirim apa pun</text>
