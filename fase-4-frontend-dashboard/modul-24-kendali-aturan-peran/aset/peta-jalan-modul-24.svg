<text x="80.0" y="778.0" font-size="14" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-weight="800" fill="#6f42c1">Syarat lulus dari Silabus: </tspan><tspan font-weight="800" font-size="11.5" fill="#6f42c1">L1 </tspan>orang lain (bukan Anda) bisa login dari HP-nya lewat WiFi rumah, <tspan font-weight="800" font-size="11.5" fill="#6f42c1">L2 </tspan>menyalakan lampu, </text>
<text x="80.0" y="798.0" font-size="14" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-weight="800" font-size="11.5" fill="#6f42c1">L3 </tspan>dan membuat aturan "siram jika tanah &lt; 30 %" tanpa bantuan — <tspan font-weight="800" font-size="11.5" fill="#6f42c1">L4 </tspan>dan akun viewer tidak melihat tombol kendali.</text>
<text x="80.0" y="824.0" font-size="14" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve"><tspan font-weight="800" fill="#1e2a4a">Dibuktikan di:</tspan> L1 Praktik 9–10 · L2 Praktik 5 · L3 Praktik 6 dan 8 · L4 Praktik 5 (dasarnya di Praktik 3);</text>
<text x="80.0" y="844.0" font-size="14" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">keempatnya diulang bersama penguji di Praktik 10.</text>
<text x="80.0" y="870.0" font-size="14" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve"><tspan font-weight="800" fill="#1e2a4a">Dua jalur data:</tspan> perangkat (Kit A + B lewat gateway Pi, tandon terisi) atau laptop (simulator <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13" fill="#4a5568" font-weight="700">f00d00000001</tspan> + <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13" fill="#4a5568" font-weight="700">tanah</tspan> <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13" fill="#4a5568" font-weight="700">25</tspan>, Bruno).</text>
<text x="80.0" y="894.0" font-size="14" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve"><tspan font-weight="800" fill="#1e2a4a">Berubah:</tspan> frontend 1.0.0, backend 1.1.0, simulator <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13" fill="#4a5568" font-weight="700">alat/</tspan> (<tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13" fill="#4a5568" font-weight="700">tanah</tspan>, <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13" fill="#4a5568" font-weight="700">tandon</tspan>). <tspan font-weight="800" fill="#1e2a4a">Tetap:</tspan> kontrak data 1.4 dan firmware.</text>
