<text x="832.0" y="325.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >4</text>
<text x="852.0" y="326.0" font-size="14.5" font-weight="800" fill="#1e2a4a" text-anchor="start" xml:space="preserve">Catat setiap tugas</text>
<text x="830.0" y="358.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">berhasil / dibantu / gagal, lama (mm:ss),</text>
<text x="830.0" y="376.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">kutipan penguji tanpa nama</text>
<text x="830.0" y="394.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">bukti dari log backend:</text>
<text x="830.0" y="428.0" font-size="11" font-weight="800" fill="#1a7f37" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">login: akun N (admin), sesi N, IP 192.168.…</text>
<text x="830.0" y="447.0" font-size="11" font-weight="800" fill="#1a7f37" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">… lampu = true, ack ok=true dalam N ms</text>
