<circle cx="52.0" cy="609.0" r="12" fill="#b45f17" stroke="#ffffff" stroke-width="2" />
<text x="52.0" y="613.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >6</text>
<text x="72.0" y="614.0" font-size="14.5" font-weight="800" fill="#1e2a4a" text-anchor="start" xml:space="preserve">Ulangi tugas yang dibantu</text>
<text x="50.0" y="646.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">penguji yang sama sesudah jeda, atau</text>
<text x="50.0" y="665.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">penguji lain; tugas lulus hanya bila</text>
<text x="50.0" y="684.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">berhasil tanpa bantuan</text>
<text x="50.0" y="722.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">putaran ini boleh diulang beberapa kali</text>
