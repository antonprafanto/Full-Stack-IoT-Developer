<text x="832.0" y="613.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >7</text>
<text x="852.0" y="614.0" font-size="14.5" font-weight="800" fill="#1e2a4a" text-anchor="start" xml:space="preserve">L4, lalu bereskan</text>
<text x="830.0" y="646.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">L4 (pelajar): masuk sebagai <tspan font-weight="800">viewer</tspan> di HP</text>
<text x="830.0" y="664.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">yang sama: tanpa tombol kendali, tanpa</text>
<text x="830.0" y="682.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-weight="800">+ Aturan baru</tspan>, tanpa <tspan font-weight="800">Ubah</tspan></text>
<text x="830.0" y="712.0" font-size="11" font-weight="800" fill="#6f42c1" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">npm run pengguna -- hapus penguji@rumah.test</text>
<text x="830.0" y="736.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">sobek atau simpan kartu sandi; kembali ke</text>
<text x="830.0" y="754.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">mode laptop; HP penguji tidak bisa membuka lagi</text>
<rect x="30.0" y="790.0" width="1140.0" height="66.0" rx="12" fill="#eef1f5" />
<text x="50.0" y="815.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">Lembar terisi disimpan di <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#1e2a4a" font-weight="800">belajar-iot/modul-24/</tspan>: tanpa sandi, tanpa nama lengkap, tanpa foto wajah. Izin rekam layar atau suara boleh ditolak.</text>
<text x="50.0" y="837.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">Uji ini hanya bisa dikerjakan manusia: bila belum sempat ada penguji, tulis jujur di catatan; <tspan font-weight="800" fill="#1e2a4a">jangan mengarang hasil</tspan>.</text>
<text x="1178.0" y="872.0" font-size="11" font-weight="400" fill="#8a8f9c" text-anchor="end" >Kurikulum Fullstack IoT Developer · CC BY 4.0</text>
