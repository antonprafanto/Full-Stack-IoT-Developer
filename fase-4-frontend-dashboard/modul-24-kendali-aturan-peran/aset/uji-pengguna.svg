<text x="62.0" y="206.4" font-size="11" font-weight="700" fill="#6f42c1" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">  penguji@rumah.test "Penguji" admin</text>
<text x="50.0" y="236.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">PowerShell atau Terminal macOS, bukan Git Bash;</text>
<text x="50.0" y="253.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">sandi ≥ 15 karakter, hanya di kartu kertas</text>
<text x="430.0" y="160.0" font-size="13" font-weight="800" fill="#1e2a4a" text-anchor="start" >Kondisi awal</text>
<text x="430.0" y="184.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">• lampu padam</text>
<text x="430.0" y="204.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">• belum ada aturan siram (hapus sisa latihan)</text>
<text x="430.0" y="224.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">• simulator: <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#1e2a4a" font-weight="800">tandon</tspan> <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#1e2a4a" font-weight="800">acak</tspan> dan <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#1e2a4a" font-weight="800">tanah</tspan> <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#1e2a4a" font-weight="800">acak</tspan></text>
<text x="430.0" y="244.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">• akun viewer Modul 20 siap untuk L4</text>
<text x="810.0" y="160.0" font-size="13" font-weight="800" fill="#1e2a4a" text-anchor="start" >Mode HP (Modul 23)</text>
<text x="810.0" y="184.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#6f42c1" font-weight="800">HOST=0.0.0.0</tspan>, IP laptop di <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#6f42c1" font-weight="800">CORS_ORIGIN</tspan></text>
<text x="810.0" y="204.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#6f42c1" font-weight="800">npm</tspan> <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#6f42c1" font-weight="800">run</tspan> <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#6f42c1" font-weight="800">dev:hp</tspan> di folder <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#6f42c1" font-weight="800">frontend</tspan></text>
<text x="810.0" y="224.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">HP penguji membuka dulu:</text>
<text x="810.0" y="244.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#6f42c1" font-weight="800">http://&lt;IP-laptop&gt;:8080/health</tspan> harus menjawab</text>
