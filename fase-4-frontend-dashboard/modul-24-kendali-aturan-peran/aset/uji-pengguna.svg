<text x="462.0" y="326.0" font-size="14.5" font-weight="800" fill="#1e2a4a" text-anchor="start" xml:space="preserve">Aturan "tanpa bantuan"</text>
<text x="440.0" y="358.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">pelajar hanya boleh membacakan ulang kalimat</text>
<text x="440.0" y="376.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">tugasnya: tidak menunjuk layar, tidak</text>
<text x="440.0" y="394.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">memberi petunjuk</text>
