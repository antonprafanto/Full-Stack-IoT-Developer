<text x="462.0" y="614.0" font-size="14.5" font-weight="800" fill="#1e2a4a" text-anchor="start" xml:space="preserve">Perbaiki yang membingungkan</text>
<text x="440.0" y="646.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">label, letak, atau pesan yang membuat</text>
<text x="440.0" y="665.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">penguji ragu → ubah kodenya, lalu catat</text>
