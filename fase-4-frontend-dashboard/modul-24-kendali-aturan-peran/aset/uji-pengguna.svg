<text x="580.0" y="472.0" font-size="11.5" font-weight="700" fill="#4a5568" text-anchor="middle" >2 menit</text>
<text x="440.0" y="496.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">hanya <tspan font-weight="800" fill="#1e2a4a">berhasil</tspan> yang dihitung lulus; penguji</text>
<text x="440.0" y="514.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">menyerah atau bertanya = <tspan font-weight="800" fill="#1e2a4a">dibantu</tspan></text>
