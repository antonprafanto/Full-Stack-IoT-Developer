<text x="72.0" y="326.0" font-size="14.5" font-weight="800" fill="#1e2a4a" text-anchor="start" xml:space="preserve">Empat tugas di HP penguji</text>
<text x="50.0" y="358.0" font-size="12.5" font-weight="800" fill="#6f42c1" text-anchor="start" >1</text>
<text x="66.0" y="358.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">buka <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11" fill="#6f42c1" font-weight="800">http://&lt;IP-laptop&gt;:5173</tspan>, masuk dengan</text>
<text x="66.0" y="376.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">email dan sandi di kartu</text>
<text x="372.0" y="358.0" font-size="12" font-weight="800" fill="#6f42c1" text-anchor="end" >L1</text>
<text x="50.0" y="404.0" font-size="12.5" font-weight="800" fill="#6f42c1" text-anchor="start" >2</text>
<text x="66.0" y="404.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">nyalakan lampu di rumah ini</text>
<text x="372.0" y="404.0" font-size="12" font-weight="800" fill="#6f42c1" text-anchor="end" >L2</text>
<text x="50.0" y="432.0" font-size="12.5" font-weight="800" fill="#6f42c1" text-anchor="start" >3</text>
<text x="66.0" y="432.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">atur supaya tanaman disiram otomatis</text>
<text x="66.0" y="450.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">kalau tanahnya lebih kering dari 30 %</text>
<text x="372.0" y="432.0" font-size="12" font-weight="800" fill="#6f42c1" text-anchor="end" >L3</text>
<text x="50.0" y="478.0" font-size="12.5" font-weight="800" fill="#6f42c1" text-anchor="start" >4</text>
<text x="66.0" y="478.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">keluar dari dashboard</text>
<text x="50.0" y="512.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">penguji bercerita sambil mengerjakan (<tspan font-style="italic">think-aloud</tspan>)</text>
