<path d="M235.0 278 C242.0 278 232.0 258 238.0 258" fill="none" stroke="#4a5568" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
</g>
<text x="256.0" y="263.0" font-size="14" font-weight="800" fill="#1e2a4a" text-anchor="start" >Node-RED Dashboard 2</text>
<text x="256.0" y="282.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="start" >di Pi · Modul 13</text>
<g transform="translate(552.0 267) scale(0.62) translate(-552.0 -267)">
<rect x="533.0" y="253.0" width="38.0" height="28.0" rx="4" fill="none" stroke="#1e2a4a" stroke-width="2" />
<line x1="533.0" y1="261.0" x2="571.0" y2="261.0" stroke="#1e2a4a" stroke-width="1.6" stroke-linecap="round" />
<circle cx="538.0" cy="257.0" r="1.1" fill="#1e2a4a" />
<circle cx="542.5" cy="257.0" r="1.1" fill="#1e2a4a" />
<circle cx="547.0" cy="257.0" r="1.1" fill="#1e2a4a" />
</g>
<text x="580.0" y="263.0" font-size="14" font-weight="800" fill="#1e2a4a" text-anchor="start" >dashboard buatanmu (React)</text>
<text x="580.0" y="282.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="start" >di laptop · Modul 22–24</text>
<g transform="translate(876.0 267) scale(0.62) translate(-876.0 -267)">
<rect x="857.0" y="253.0" width="38.0" height="28.0" rx="4" fill="none" stroke="#6f42c1" stroke-width="2" />
<path d="M863.0 274 L871.0 266 L878.0 271 L889.0 259" fill="none" stroke="#6f42c1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
</g>
<text x="904.0" y="263.0" font-size="14" font-weight="800" fill="#6f42c1" text-anchor="start" >Grafana</text>
<text x="904.0" y="282.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="start" >di laptop · Modul 25</text>
<line x1="30.0" y1="296.0" x2="1170.0" y2="296.0" stroke="#e0dcd2" stroke-width="1.2" stroke-linecap="round" />
<text x="48.0" y="322.0" font-size="12.5" font-weight="800" fill="#1e2a4a" text-anchor="start" >Untuk siapa</text>
<text x="216.0" y="322.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">kamu sendiri saat merakit dan</text>
<text x="216.0" y="341.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">mencoba ide</text>
<text x="540.0" y="322.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-weight="800" fill="#1e2a4a">penghuni rumah</tspan>: admin dan</text>
<text x="540.0" y="341.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">viewer, di laptop atau HP</text>
<text x="864.0" y="322.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-weight="800" fill="#6f42c1">tim teknis</tspan>: kamu, saat merawat</text>
<text x="864.0" y="341.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">sistem</text>
<line x1="30.0" y1="358.0" x2="1170.0" y2="358.0" stroke="#e0dcd2" stroke-width="1.2" stroke-linecap="round" />
<text x="48.0" y="384.0" font-size="12.5" font-weight="800" fill="#1e2a4a" text-anchor="start" >Dibuat dengan</text>
<text x="216.0" y="384.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">seret-sambung <tspan font-style="italic">node</tspan>, tanpa</text>
<text x="216.0" y="403.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">menulis kode</text>
<text x="540.0" y="384.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">kode React + TypeScript, berversi</text>
<text x="540.0" y="403.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">dan diuji (lint, build) di Git</text>
<text x="864.0" y="384.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">klik di layar + kueri SQL; disimpan</text>
<text x="864.0" y="403.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">sebagai JSON di folder <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#6f42c1" font-weight="800">grafana/</tspan></text>
<line x1="30.0" y1="420.0" x2="1170.0" y2="420.0" stroke="#e0dcd2" stroke-width="1.2" stroke-linecap="round" />
<text x="48.0" y="446.0" font-size="12.5" font-weight="800" fill="#1e2a4a" text-anchor="start" >Datanya dari</text>
<text x="216.0" y="446.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">pesan MQTT langsung; grafik 1 jam</text>
<text x="216.0" y="465.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">di memori Node-RED</text>
<text x="540.0" y="446.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">API backend + Socket.IO (<tspan font-style="italic">live</tspan>);</text>
<text x="540.0" y="465.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">riwayat 1 jam, 24 jam, 7 hari</text>
<text x="864.0" y="446.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">TimescaleDB langsung, akun</text>
<text x="864.0" y="465.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#6f42c1" font-weight="800">grafana_baca</tspan>; riwayat sepanjang data</text>
<line x1="30.0" y1="482.0" x2="1170.0" y2="482.0" stroke="#e0dcd2" stroke-width="1.2" stroke-linecap="round" />
<text x="48.0" y="508.0" font-size="12.5" font-weight="800" fill="#1e2a4a" text-anchor="start" >Kuat untuk</text>
<text x="216.0" y="508.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">mengintip lalu lintas MQTT,</text>
<text x="216.0" y="527.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">mencoba ide dengan cepat</text>
<text x="540.0" y="508.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">kendali lampu dan pompa, aturan,</text>
<text x="540.0" y="527.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">peran, peta, dari HP</text>
<text x="864.0" y="508.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">tren panjang, sinyal dan memori</text>
<text x="864.0" y="527.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">perangkat, <tspan font-style="italic">alert</tspan> ke Telegram</text>
<line x1="30.0" y1="544.0" x2="1170.0" y2="544.0" stroke="#e0dcd2" stroke-width="1.2" stroke-linecap="round" />
<text x="48.0" y="570.0" font-size="12.5" font-weight="800" fill="#1e2a4a" text-anchor="start" >Kelemahan jujur</text>
<text x="216.0" y="570.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">grafik hilang saat Node-RED menyala</text>
<text x="216.0" y="589.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">ulang; otomasi pensiun sejak M16</text>
<text x="540.0" y="570.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">setiap grafik baru = kode baru;</text>
<text x="540.0" y="589.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">tekanan, baterai, tandon tanpa riwayat</text>
<text x="864.0" y="570.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">akun sendiri (bukan akun Modul 20),</text>
<text x="864.0" y="589.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">perlu SQL, RAM ±200–470 MiB</text>
<line x1="30.0" y1="606.0" x2="1170.0" y2="606.0" stroke="#e0dcd2" stroke-width="1.2" stroke-linecap="round" />
<text x="48.0" y="632.0" font-size="12.5" font-weight="800" fill="#e63946" text-anchor="start" >Kapan TIDAK dipakai</text>
<text x="216.0" y="632.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">untuk penghuni, atau data</text>
<text x="216.0" y="651.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">bertahun-tahun</text>
<text x="540.0" y="632.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">menyelidiki RSSI 30 hari atau</text>
<text x="540.0" y="651.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">panel sekali pakai</text>
<text x="864.0" y="632.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">menyalakan lampu: Grafana hanya</text>
<text x="864.0" y="651.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">membaca; layar keluarga di HP</text>
<line x1="522.0" y1="246.0" x2="522.0" y2="660.0" stroke="#e0dcd2" stroke-width="1.2" stroke-linecap="round" />
<line x1="846.0" y1="246.0" x2="846.0" y2="660.0" stroke="#e0dcd2" stroke-width="1.2" stroke-linecap="round" />
<line x1="198.0" y1="246.0" x2="198.0" y2="660.0" stroke="#e0dcd2" stroke-width="1.2" stroke-linecap="round" />
<rect x="30.0" y="690.0" width="1140.0" height="100.0" rx="12" fill="#eef1f5" />
<text x="50.0" y="718.0" font-size="14" font-weight="800" fill="#1e2a4a" text-anchor="start" >Contoh dari proyekmu sendiri</text>
<text x="50.0" y="744.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-weight="800" fill="#1e2a4a">Tekanan udara, baterai, dan air tandon</tspan> hanya tampil di kartu <tspan font-style="italic">live</tspan> dashboard buatanmu (Batasan frontend): di Grafana, satu panel SQL sudah cukup.</text>
<text x="50.0" y="765.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-weight="800" fill="#1e2a4a">Tombol lampu</tspan> tidak cocok di Grafana: ia membaca database dengan akun hanya-baca. Node-RED tetap boleh hidup sebagai tampilan cadangan.</text>
<text x="1178.0" y="816.0" font-size="11" font-weight="400" fill="#8a8f9c" text-anchor="end" >Kurikulum Fullstack IoT Developer · CC BY 4.0</text>
</svg>
