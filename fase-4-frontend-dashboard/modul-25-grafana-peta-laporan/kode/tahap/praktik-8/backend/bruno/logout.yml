info:
  name: logout
  type: http
  seq: 18

http:
  method: POST
  url: "{{baseUrl}}/auth/logout"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.pesan
      operator: eq
      value: sudah logout

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
