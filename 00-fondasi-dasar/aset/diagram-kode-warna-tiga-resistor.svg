<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>Kode Warna Resistor 4 Pita — Tiga Nilai Standar</title>
  <desc>Chart flat 2D: resistor 220 Ω (Merah-Merah-Cokelat-Emas), 1 kΩ (Cokelat-Hitam-Merah-Emas), 10 kΩ (Cokelat-Hitam-Oranye-Emas)</desc>
  <defs>
    <style>
      text {
        font-family: Inter, "Helvetica Neue", Helvetica, Arial, sans-serif;
        fill: #0F172A;
      }
      .title       { font-size: 54px; font-weight: 800; letter-spacing: 1.5px; }
      .subtitle    { font-size: 27px; fill: #475569; }
      .value       { font-size: 46px; font-weight: 800; letter-spacing: 0.5px; }
      .purpose     { font-size: 28px; fill: #475569; }
      .formula     { font-size: 27px; font-weight: 600; letter-spacing: 0.5px; }
      .badge-name  { font-size: 17px; font-weight: 700; }
      .badge-val   { font-size: 16px; fill: #64748B; font-weight: 600; }
      .role        { font-size: 16px; fill: #94A3B8; letter-spacing: 0.5px; }
      .legend-kick { font-size: 26px; font-weight: 800; letter-spacing: 2px; }
      .legend      { font-size: 24px; fill: #475569; }
      .footer      { font-size: 18px; fill: #94A3B8; }
      .rule        { stroke: #0F172A; stroke-width: 3; }
      .sep         { stroke: #E2E8F0; stroke-width: 2; }
      .lead        { stroke: #64748B; stroke-width: 7; stroke-linecap: round; }
      .body        { fill: #E8D5B0; stroke: #0F172A; stroke-width: 3; }
      .band        { stroke: #0F172A; stroke-width: 2; }
      .chip        { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 2; }
      .swatch      { stroke: #0F172A; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF"/>

  <!-- header -->
  <text class="title" x="960" y="104" text-anchor="middle">KODE WARNA RESISTOR — TIGA NILAI STANDAR</text>
  <line class="rule" x1="560" y1="138" x2="1360" y2="138"/>
  <text class="subtitle" x="960" y="190" text-anchor="middle">Empat pita dibaca dari kiri ke kanan: Digit 1 • Digit 2 • Pengali • Toleransi</text>

  <!-- column separators -->
  <line class="sep" x1="670" y1="300" x2="670" y2="822"/>
  <line class="sep" x1="1250" y1="300" x2="1250" y2="822"/>

  <!-- ============ KOLOM 1 : 220 Ω ============ -->
  <g>
    <line class="lead" x1="130" y1="390" x2="225" y2="390"/>
    <line class="lead" x1="535" y1="390" x2="630" y2="390"/>
    <rect class="body" x="225" y="330" width="310" height="120" rx="26"/>
    <rect class="band" x="283" y="330" width="24" height="120" fill="#DC2626"/>
    <rect class="band" x="323" y="330" width="24" height="120" fill="#DC2626"/>
    <rect class="band" x="363" y="330" width="24" height="120" fill="#92400E"/>
    <rect class="band" x="468" y="330" width="24" height="120" fill="#D9A01C"/>

    <text class="value" x="380" y="548" text-anchor="middle">220 Ω</text>
    <text class="purpose" x="380" y="592" text-anchor="middle">(Pengaman LED)</text>
    <text class="formula" x="380" y="642" text-anchor="middle">22 × 10 = 220 Ω</text>

    <!-- badges: urutan warna -->
    <rect class="chip" x="120" y="690" width="124" height="86" rx="14"/>
    <rect class="swatch" x="132" y="708" width="26" height="26" rx="6" fill="#DC2626"/>
    <text class="badge-name" x="168" y="728">Merah</text>
    <text class="badge-val" x="168" y="754">2</text>

    <rect class="chip" x="252" y="690" width="124" height="86" rx="14"/>
    <rect class="swatch" x="264" y="708" width="26" height="26" rx="6" fill="#DC2626"/>
    <text class="badge-name" x="300" y="728">Merah</text>
    <text class="badge-val" x="300" y="754">2</text>

    <rect class="chip" x="384" y="690" width="124" height="86" rx="14"/>
    <rect class="swatch" x="396" y="708" width="26" height="26" rx="6" fill="#92400E"/>
    <text class="badge-name" x="432" y="728">Cokelat</text>
    <text class="badge-val" x="432" y="754">×10</text>

    <rect class="chip" x="516" y="690" width="124" height="86" rx="14"/>
    <rect class="swatch" x="528" y="708" width="26" height="26" rx="6" fill="#D9A01C"/>
    <text class="badge-name" x="564" y="728">Emas</text>
    <text class="badge-val" x="564" y="754">±5%</text>

    <text class="role" x="182" y="806" text-anchor="middle">Digit 1</text>
    <text class="role" x="314" y="806" text-anchor="middle">Digit 2</text>
    <text class="role" x="446" y="806" text-anchor="middle">Pengali</text>
    <text class="role" x="578" y="806" text-anchor="middle">Toleransi</text>
  </g>

  <!-- ============ KOLOM 2 : 1 kΩ ============ -->
  <g>
    <line class="lead" x1="710" y1="390" x2="805" y2="390"/>
    <line class="lead" x1="1115" y1="390" x2="1210" y2="390"/>
    <rect class="body" x="805" y="330" width="310" height="120" rx="26"/>
    <rect class="band" x="863" y="330" width="24" height="120" fill="#92400E"/>
    <rect class="band" x="903" y="330" width="24" height="120" fill="#111827"/>
    <rect class="band" x="943" y="330" width="24" height="120" fill="#DC2626"/>
    <rect class="band" x="1048" y="330" width="24" height="120" fill="#D9A01C"/>

    <text class="value" x="960" y="548" text-anchor="middle">1 kΩ</text>
    <text class="purpose" x="960" y="592" text-anchor="middle">(Pembagi Tegangan)</text>
    <text class="formula" x="960" y="642" text-anchor="middle">10 × 100 = 1 kΩ</text>

    <!-- badges: urutan warna -->
    <rect class="chip" x="700" y="690" width="124" height="86" rx="14"/>
    <rect class="swatch" x="712" y="708" width="26" height="26" rx="6" fill="#92400E"/>
    <text class="badge-name" x="748" y="728">Cokelat</text>
    <text class="badge-val" x="748" y="754">1</text>

    <rect class="chip" x="832" y="690" width="124" height="86" rx="14"/>
    <rect class="swatch" x="844" y="708" width="26" height="26" rx="6" fill="#111827"/>
    <text class="badge-name" x="880" y="728">Hitam</text>
    <text class="badge-val" x="880" y="754">0</text>

    <rect class="chip" x="964" y="690" width="124" height="86" rx="14"/>
    <rect class="swatch" x="976" y="708" width="26" height="26" rx="6" fill="#DC2626"/>
    <text class="badge-name" x="1012" y="728">Merah</text>
    <text class="badge-val" x="1012" y="754">×100</text>

    <rect class="chip" x="1096" y="690" width="124" height="86" rx="14"/>
    <rect class="swatch" x="1108" y="708" width="26" height="26" rx="6" fill="#D9A01C"/>
    <text class="badge-name" x="1144" y="728">Emas</text>
    <text class="badge-val" x="1144" y="754">±5%</text>

    <text class="role" x="762" y="806" text-anchor="middle">Digit 1</text>
    <text class="role" x="894" y="806" text-anchor="middle">Digit 2</text>
    <text class="role" x="1026" y="806" text-anchor="middle">Pengali</text>
    <text class="role" x="1158" y="806" text-anchor="middle">Toleransi</text>
  </g>

  <!-- ============ KOLOM 3 : 10 kΩ ============ -->
  <g>
    <line class="lead" x1="1290" y1="390" x2="1385" y2="390"/>
    <line class="lead" x1="1695" y1="390" x2="1790" y2="390"/>
    <rect class="body" x="1385" y="330" width="310" height="120" rx="26"/>
    <rect class="band" x="1443" y="330" width="24" height="120" fill="#92400E"/>
    <rect class="band" x="1483" y="330" width="24" height="120" fill="#111827"/>
    <rect class="band" x="1523" y="330" width="24" height="120" fill="#EA580C"/>
    <rect class="band" x="1628" y="330" width="24" height="120" fill="#D9A01C"/>

    <text class="value" x="1540" y="548" text-anchor="middle">10 kΩ</text>
    <text class="purpose" x="1540" y="592" text-anchor="middle">(Pull-up &amp; Sensor LDR)</text>
    <text class="formula" x="1540" y="642" text-anchor="middle">10 × 1.000 = 10 kΩ</text>

    <!-- badges: urutan warna -->
    <rect class="chip" x="1280" y="690" width="124" height="86" rx="14"/>
    <rect class="swatch" x="1292" y="708" width="26" height="26" rx="6" fill="#92400E"/>
    <text class="badge-name" x="1328" y="728">Cokelat</text>
    <text class="badge-val" x="1328" y="754">1</text>

    <rect class="chip" x="1412" y="690" width="124" height="86" rx="14"/>
    <rect class="swatch" x="1424" y="708" width="26" height="26" rx="6" fill="#111827"/>
    <text class="badge-name" x="1460" y="728">Hitam</text>
    <text class="badge-val" x="1460" y="754">0</text>

    <rect class="chip" x="1544" y="690" width="124" height="86" rx="14"/>
    <rect class="swatch" x="1556" y="708" width="26" height="26" rx="6" fill="#EA580C"/>
    <text class="badge-name" x="1592" y="728">Oranye</text>
    <text class="badge-val" x="1592" y="754">×1.000</text>

    <rect class="chip" x="1676" y="690" width="124" height="86" rx="14"/>
    <rect class="swatch" x="1688" y="708" width="26" height="26" rx="6" fill="#D9A01C"/>
    <text class="badge-name" x="1724" y="728">Emas</text>
    <text class="badge-val" x="1724" y="754">±5%</text>

    <text class="role" x="1342" y="806" text-anchor="middle">Digit 1</text>
    <text class="role" x="1474" y="806" text-anchor="middle">Digit 2</text>
    <text class="role" x="1606" y="806" text-anchor="middle">Pengali</text>
    <text class="role" x="1738" y="806" text-anchor="middle">Toleransi</text>
  </g>

  <!-- legend -->
  <line class="sep" x1="120" y1="856" x2="1800" y2="856"/>
  <text class="legend-kick" x="960" y="908" text-anchor="middle">CARA MEMBACA</text>
  <text class="legend" x="960" y="950" text-anchor="middle">Pita 1 &amp; 2 = digit nilai resistansi • Pita 3 = pengali (jumlah nol) • Pita 4 = toleransi</text>
  <text class="footer" x="960" y="1006" text-anchor="middle">Toleransi Emas (±5%) cukup untuk hampir semua proyek elektronika dasar.</text>
</svg>
