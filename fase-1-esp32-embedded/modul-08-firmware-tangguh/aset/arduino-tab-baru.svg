<text x="154.0" y="240.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13.5" xml:space="preserve"><tspan fill="#95a5a6">// Modul 8 - Praktik 3: state machine penyiraman</tspan></text>
