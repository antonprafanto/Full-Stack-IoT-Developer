<text x="134.0" y="284.0" font-size="13" font-weight="400" fill="#30858d" text-anchor="end" font-family="'DejaVu Sans Mono', Consolas, monospace" >3</text>
<text x="154.0" y="284.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13.5" xml:space="preserve"><tspan fill="#95a5a6">// pompa D25 (lewat MOSFET), sensor tanah di VN (GPIO 39), dan HC-SR04 (TRIG D15, ECHO D35).</tspan></text>
<text x="134.0" y="306.0" font-size="13" font-weight="400" fill="#30858d" text-anchor="end" font-family="'DejaVu Sans Mono', Consolas, monospace" >4</text>
<text x="154.0" y="306.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13.5" xml:space="preserve"><tspan fill="#95a5a6">//</tspan></text>
<text x="134.0" y="328.0" font-size="13" font-weight="400" fill="#30858d" text-anchor="end" font-family="'DejaVu Sans Mono', Consolas, monospace" >5</text>
<text x="154.0" y="328.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13.5" xml:space="preserve"><tspan fill="#95a5a6">// Penyiraman punya tiga keadaan: SIAGA -&gt; MENYIRAM -&gt; JEDA -&gt; SIAGA.</tspan></text>
<text x="134.0" y="350.0" font-size="13" font-weight="400" fill="#30858d" text-anchor="end" font-family="'DejaVu Sans Mono', Consolas, monospace" >6</text>
<text x="154.0" y="350.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13.5" xml:space="preserve"><tspan fill="#95a5a6">// Selama pompa menyala, LED status tetap berdetak dan tombol tetap bekerja:</tspan></text>
<text x="134.0" y="372.0" font-size="13" font-weight="400" fill="#30858d" text-anchor="end" font-family="'DejaVu Sans Mono', Consolas, monospace" >7</text>
<text x="154.0" y="372.0" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13.5" xml:space="preserve"><tspan fill="#95a5a6">// tekan pendek = lampu, tekan lama (1 detik) = siram sekarang.</tspan></text>
