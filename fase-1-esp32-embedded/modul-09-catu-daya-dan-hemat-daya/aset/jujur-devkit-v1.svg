<text x="600.0" y="44.0" font-size="28" font-weight="800" fill="#1e2a4a" text-anchor="middle" >Jujur soal DevKit V1: chip-nya tidur, papannya tidak</text>
<text x="600.0" y="76.0" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" >Chip ESP32 tidur dalam sekitar 0,01 mA · papan pengembang sejenis terukur sekitar 4–5 mA · papan tiruan bisa lebih boros</text>
