<text x="640.0" y="312.0" font-size="13" font-weight="700" fill="#1e2a4a" text-anchor="start" >DevKit V1, tidak pernah bangun</text>
<rect x="640.0" y="320.0" width="79.7" height="20.0" rx="4" fill="#b45f17" />
<text x="727.7" y="335.0" font-size="12.5" font-weight="800" fill="#b45f17" text-anchor="start" >paling lama sekitar 10 hari</text>
<text x="640.0" y="368.0" font-size="13" font-weight="700" fill="#1e2a4a" text-anchor="start" >papan hemat daya, tidur 30 detik</text>
<rect x="640.0" y="376.0" width="358.0" height="20.0" rx="4" fill="#0f8b8d" />
<text x="990.0" y="391.0" font-size="12.5" font-weight="800" fill="#ffffff" text-anchor="end" >≈ 47 hari</text>
<text x="640.0" y="424.0" font-size="13" font-weight="700" fill="#1e2a4a" text-anchor="start" >papan hemat daya, tidur 5 menit</text>
<rect x="640.0" y="432.0" width="460.0" height="20.0" rx="4" fill="#0f8b8d" />
