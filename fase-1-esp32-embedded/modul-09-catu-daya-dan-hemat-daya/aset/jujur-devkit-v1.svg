<text x="276.0" y="474.0" font-size="12.5" font-weight="500" fill="#4a5568" text-anchor="start" >sekitar 0,01 mA: satu-satunya yang tidur</text>
<rect x="576.0" y="100.0" width="588.0" height="400.0" rx="12" fill="#ffffff" stroke="#e0dcd2" stroke-width="1.5" />
<text x="870.0" y="130.0" font-size="15" font-weight="800" fill="#1e2a4a" text-anchor="middle" >Umur baterai 2.500 mAh (2.000 mAh terpakai)</text>
<text x="870.0" y="150.0" font-size="12.5" font-weight="600" fill="#4a5568" text-anchor="middle" >bangun 1 detik (55 mA), lalu tidur dengan arus tidur papannya</text>
<text x="870.0" y="168.0" font-size="12.5" font-weight="600" fill="#4a5568" text-anchor="middle" >DevKit V1: 5 mA, lewat MT3608 · papan hemat daya: 0,01 mA, regulator irit</text>
<text x="640.0" y="200.0" font-size="13" font-weight="700" fill="#1e2a4a" text-anchor="start" >DevKit V1, tidur 30 detik</text>
<rect x="640.0" y="208.0" width="60.6" height="20.0" rx="4" fill="#b45f17" />
<text x="708.6" y="223.0" font-size="12.5" font-weight="800" fill="#b45f17" text-anchor="start" >≈ 8 hari</text>
<text x="640.0" y="256.0" font-size="13" font-weight="700" fill="#1e2a4a" text-anchor="start" >DevKit V1, tidur 5 menit</text>
