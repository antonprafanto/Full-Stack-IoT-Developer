<text x="870.0" y="488.0" font-size="11" font-weight="600" fill="#4a5568" text-anchor="middle" >30 hari</text>
<text x="1100.0" y="488.0" font-size="11" font-weight="600" fill="#4a5568" text-anchor="middle" >60 hari</text>
<rect x="36.0" y="520.0" width="1128.0" height="128.0" rx="12" fill="#f4f6f9" stroke="#e0dcd2" stroke-width="1.2" />
<text x="60.0" y="552.0" font-size="15" font-weight="800" fill="#1e2a4a" text-anchor="start" >Artinya</text>
<text x="60.0" y="580.0" font-size="13.5" font-weight="600" fill="#4a5568" text-anchor="start" >• Untuk papan DevKit V1, memperpanjang tidur hanya sedikit menolong: arus tidur papannya yang menentukan batas umur baterai.</text>
<text x="60.0" y="602.0" font-size="13.5" font-weight="600" fill="#4a5568" text-anchor="start" >• Untuk kurikulum ini, beberapa hari sudah cukup: Node 2 diisi ulang lewat colokan TP4056.</text>
<text x="60.0" y="624.0" font-size="13.5" font-weight="600" fill="#4a5568" text-anchor="start" >• Papan hemat daya: regulator irit langsung dari baterai, tidak ada LED yang menyala terus, dan chip USB-nya ikut padam (🔬).</text>
