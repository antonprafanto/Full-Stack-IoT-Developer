<text x="64.0" y="754.0" font-size="14" font-weight="400" fill="#4a5568" text-anchor="start" >Urutan nyala-mati: colokkan USB dulu, baru nyalakan MB102; matikan MB102 dulu, baru cabut USB. Daya ESP32 dari adaptor tanpa laptop: Modul 9.</text>
