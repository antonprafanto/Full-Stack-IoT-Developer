<text x="80.0" y="616.0" font-size="14" font-weight="600" fill="#1e2a4a" text-anchor="start" >• Kalau ada beberapa perangkat SPI: SCK, MOSI, MISO dipakai bersama; setiap perangkat punya CS sendiri.</text>
