<text x="380.0" y="412.0" font-size="16" font-weight="800" fill="#2f6fd1" text-anchor="middle" >ESP32: "0x3C, ada?"</text>
<rect x="60.0" y="600.0" width="1080.0" height="70.0" rx="12" fill="#fff" stroke="#e0dcd2" stroke-width="1.5" />
<text x="80.0" y="630.0" font-size="15" font-weight="800" fill="#1e2a4a" text-anchor="start" >Membaca heksadesimal:</text>
<text x="280.0" y="630.0" font-size="15" font-weight="700" fill="#1e2a4a" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">0x3C = 3 × 16 + 12 (C) = 60</text>
<text x="640.0" y="630.0" font-size="15" font-weight="700" fill="#1e2a4a" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">0x76 = 118</text>
<text x="820.0" y="630.0" font-size="15" font-weight="700" fill="#1e2a4a" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">0x77 = 119</text>
<text x="80.0" y="656.0" font-size="13.5" font-weight="600" fill="#4a5568" text-anchor="start" >A = 10, B = 11, C = 12, D = 13, E = 14, F = 15 · awalan 0x menandai angka heksadesimal</text>
<text x="1178.0" y="686.0" font-size="12" font-weight="400" fill="#8a8f9c" text-anchor="end" >Kurikulum Fullstack IoT Developer · CC BY 4.0</text>
