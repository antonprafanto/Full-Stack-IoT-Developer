<text x="642.0" y="584.0" font-size="15" font-weight="400" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-style="italic">pull request</tspan> "keamanan perangkat" ⭐</text>
<text x="80.0" y="678.0" font-size="14" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve"><tspan font-weight="800" fill="#1e2a4a">Urutannya penting:</tspan> pasang kunci dulu (Praktik 1–3), baru ganti gembok: broker dikunci di Praktik 4.</text>
<text x="80.0" y="706.0" font-size="14" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve"><tspan font-weight="800" fill="#1e2a4a">Tiga jalur:</tspan> perangkat (gateway Pi, Node 1, dan papan Node 2 yang dipinjam sebagai penyusup),</text>
<text x="80.0" y="728.0" font-size="14" font-weight="600" fill="#4a5568" text-anchor="start" >laptop (Mosquitto di laptop, simulator, dan MQTTX sebagai penyusup), atau Wokwi (hanya firmware v1.6.0).</text>
