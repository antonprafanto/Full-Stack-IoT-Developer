<text x="62.0" y="197.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" >1</text>
<rect x="92.0" y="172.0" width="690.0" height="226.0" rx="12" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6" />
<path d="M92.8 212.8 L92.8 184.3 Q92.8 172.8 104.3 172.8 L769.6999999999999 172.8 Q781.1999999999999 172.8 781.1999999999999 184.3 L781.1999999999999 212.8 Z" fill="#dafbe1" stroke-linecap="round" stroke-linejoin="round" />
<line x1="92.8" y1="213.0" x2="781.2" y2="213.0" stroke="#1a7f37" stroke-width="1" stroke-linecap="round" />
<text x="108.0" y="198.0" font-size="14" font-weight="800" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-weight="800" fill="#1a7f37">Lapis 1</tspan> · backend</text>
<text x="766.0" y="198.0" font-size="12.5" font-weight="800" fill="#1a7f37" text-anchor="end" >berlaku seketika</text>
<text x="108.0" y="238.0" font-size="12" font-weight="700" fill="#4a5568" text-anchor="start" >admin mengirim:</text>
<rect x="108.0" y="248.0" width="300.0" height="34.4" rx="8" fill="#eef1f5" />
<text x="120.0" y="269.8" font-size="11.5" font-weight="800" fill="#1e2a4a" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">POST /devices/a4cf12e5b7c0/cabut</text>
<text x="430.0" y="266.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" >backend menghapus sidik jari kuncinya</text>
<text x="430.0" y="284.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" >dan mencatat waktu pencabutannya</text>
<line x1="108.0" y1="312.0" x2="766.0" y2="312.0" stroke="#e0dcd2" stroke-width="1" stroke-linecap="round" />
<text x="108.0" y="336.0" font-size="12.5" font-weight="700" fill="#1e2a4a" text-anchor="start" >pesan dari perangkat itu</text>
<text x="108.0" y="354.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="start" >mulai detik itu:</text>
<rect x="300.0" y="322.0" width="466.0" height="30.0" rx="8" fill="#fde6e8" />
<text x="314.0" y="342.0" font-size="12" font-weight="800" fill="#e63946" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">DIABAIKAN … kuncinya sudah dicabut</text>
<text x="108.0" y="384.0" font-size="12.5" font-weight="700" fill="#1e2a4a" text-anchor="start" >perintah ke perangkat itu:</text>
<rect x="300.0" y="366.0" width="64.0" height="26.0" rx="13.0" fill="#fde6e8" stroke="#e63946" stroke-width="1.4" />
<text x="332.0" y="383.7" font-size="13" font-weight="800" fill="#e63946" text-anchor="middle" xml:space="preserve">409</text>
<text x="376.0" y="384.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">jawaban <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#1e2a4a" font-weight="700">POST</tspan> <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#1e2a4a" font-weight="700">/devices/:id/command</tspan> untuk perangkat itu</text>
<circle cx="62.0" cy="438.0" r="13" fill="#0f8b8d" stroke="#ffffff" stroke-width="2" />
<text x="62.0" y="443.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" >2</text>
<rect x="92.0" y="418.0" width="690.0" height="238.0" rx="12" fill="#ffffff" stroke="#0f8b8d" stroke-width="1.6" />
<path d="M92.8 458.8 L92.8 430.3 Q92.8 418.8 104.3 418.8 L769.6999999999999 418.8 Q781.1999999999999 418.8 781.1999999999999 430.3 L781.1999999999999 458.8 Z" fill="#e2f3f1" stroke-linecap="round" stroke-linejoin="round" />
<line x1="92.8" y1="459.0" x2="781.2" y2="459.0" stroke="#0f8b8d" stroke-width="1" stroke-linecap="round" />
<text x="108.0" y="444.0" font-size="14" font-weight="800" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-weight="800" fill="#0f8b8d">Lapis 2</tspan> · broker</text>
<text x="766.0" y="444.0" font-size="12.5" font-weight="800" fill="#0f8b8d" text-anchor="end" >menutup pintunya</text>
<text x="108.0" y="484.0" font-size="12" font-weight="700" fill="#4a5568" text-anchor="start" >di mesin broker (Pi): hapus akunnya, lalu muat ulang</text>
<rect x="108.0" y="494.0" width="658.0" height="52.2" rx="8" fill="#eef1f5" />
<text x="120.0" y="515.8" font-size="11.5" font-weight="800" fill="#1e2a4a" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">sudo mosquitto_passwd -D /etc/mosquitto/sandi-broker a4cf12e5b7c0</text>
<text x="120.0" y="533.6" font-size="11.5" font-weight="800" fill="#1e2a4a" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">sudo systemctl reload mosquitto</text>
<line x1="108.0" y1="568.0" x2="766.0" y2="568.0" stroke="#e0dcd2" stroke-width="1" stroke-linecap="round" />
<text x="108.0" y="592.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" >menurut kode sumber Mosquitto: semua klien yang tersambung diperiksa lagi,</text>
<text x="108.0" y="612.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">dan Node 1 <tspan font-weight="800" fill="#e63946">diputus</tspan>. Percobaan berikutnya dijawab</text>
<rect x="432.0" y="596.0" width="74.0" height="24.0" rx="12.0" fill="#fde6e8" stroke="#e63946" stroke-width="1.4" />
<text x="469.0" y="612.5" font-size="12.5" font-weight="800" fill="#e63946" text-anchor="middle" xml:space="preserve">kode 5</text>
<text x="516.0" y="613.0" font-size="12" font-weight="800" fill="#e63946" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">Not authorized</text>
<text x="108.0" y="640.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">Node 1 menulis <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#1e2a4a" font-weight="800">MQTT</tspan> <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#1e2a4a" font-weight="800">DITOLAK</tspan> <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#1e2a4a" font-weight="800">broker</tspan> <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#1e2a4a" font-weight="800">(kode</tspan> <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#1e2a4a" font-weight="800">5)</tspan> dan mencoba lagi setiap 60 detik</text>
<rect x="92.0" y="672.0" width="690.0" height="62.0" rx="10" fill="#fdeedd" />
<text x="108.0" y="696.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-weight="800" fill="#b45f17">Wasiat</tspan> <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12" fill="#1e2a4a" font-weight="800">offline</tspan> <tspan font-weight="800" fill="#b45f17">tidak terkirim</tspan> saat akunnya dicabut: <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12" fill="#1e2a4a" font-weight="800">status</tspan> <tspan font-style="italic">retained</tspan> bisa tetap <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12" fill="#1e2a4a" font-weight="800">online</tspan>.</text>
<text x="108.0" y="718.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">Keadaan resmi perangkat dilihat di <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12" font-weight="800">GET</tspan> <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12" font-weight="800">/devices</tspan> (kolom <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12" font-weight="800">kunci</tspan>: <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12" font-weight="800">dicabut</tspan>), bukan di <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12" font-weight="800">status</tspan>.</text>
<circle cx="62.0" cy="772.0" r="13" fill="#ffffff" stroke="#2a9d5c" stroke-width="2.4" />
<path d="M55 772 L60 778 L70 766" fill="none" stroke="#2a9d5c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
<rect x="92.0" y="752.0" width="690.0" height="160.0" rx="12" fill="#ffffff" stroke="#e0dcd2" stroke-width="1.6" />
<text x="108.0" y="778.0" font-size="14" font-weight="800" fill="#1e2a4a" text-anchor="start" >Pemulihan: papan sudah ditemukan</text>
<text x="766.0" y="778.0" font-size="12.5" font-weight="800" fill="#2a9d5c" text-anchor="end" >jangan memakai kunci lamanya lagi</text>
<circle cx="118.0" cy="808.0" r="10" fill="#2a9d5c" stroke="#ffffff" stroke-width="2" />
<text x="118.0" y="812.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >1</text>
<text x="138.0" y="812.0" font-size="12.5" font-weight="800" fill="#1e2a4a" text-anchor="start" >backend</text>
<text x="226.0" y="812.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12" font-weight="800">POST /devices/a4cf12e5b7c0/kunci</tspan></text>
<text x="766.0" y="812.0" font-size="12.5" font-weight="600" fill="#4a5568" text-anchor="end" xml:space="preserve">membuat kunci <tspan font-weight="800" fill="#2a9d5c">baru</tspan></text>
<circle cx="118.0" cy="838.0" r="10" fill="#2a9d5c" stroke="#ffffff" stroke-width="2" />
<text x="118.0" y="842.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >2</text>
<text x="138.0" y="842.0" font-size="12.5" font-weight="800" fill="#1e2a4a" text-anchor="start" >broker</text>
<text x="226.0" y="842.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12" font-weight="800">mosquitto_passwd</tspan> dengan kunci baru</text>
<text x="766.0" y="842.0" font-size="12.5" font-weight="600" fill="#4a5568" text-anchor="end" xml:space="preserve">lalu muat ulang broker</text>
<circle cx="118.0" cy="868.0" r="10" fill="#2a9d5c" stroke="#ffffff" stroke-width="2" />
<text x="118.0" y="872.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >3</text>
<text x="138.0" y="872.0" font-size="12.5" font-weight="800" fill="#1e2a4a" text-anchor="start" >perangkat</text>
<text x="226.0" y="872.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12" font-weight="800">kunci &lt;isi baru&gt;</tspan></text>
<text x="766.0" y="872.0" font-size="12.5" font-weight="600" fill="#4a5568" text-anchor="end" xml:space="preserve">di Serial Monitor Node 1</text>
<text x="108.0" y="900.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="start" >siapa tahu kunci lama itu sudah disalin</text>
<rect x="802.0" y="104.0" width="368.0" height="808.0" rx="14" fill="#ffffff" stroke="#e0dcd2" stroke-width="1.6" />
<text x="822.0" y="136.0" font-size="15" font-weight="800" fill="#1e2a4a" text-anchor="start" >Muat ulang atau mulai ulang?</text>
<text x="822.0" y="156.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="start" >dua cara yang berbeda</text>
<rect x="818.0" y="176.0" width="336.0" height="152.0" rx="10" fill="#ffffff" stroke="#0f8b8d" stroke-width="1.4" />
<text x="834.0" y="202.0" font-size="14" font-weight="800" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-weight="800">Muat ulang</tspan> (<tspan font-style="italic">reload</tspan>)</text>
<text x="834.0" y="226.0" font-size="11.5" font-weight="700" fill="#4a5568" text-anchor="start" >kalau yang diubah:</text>
<text x="834.0" y="244.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">berkas sandi: menambah, mengganti, atau</text>
<text x="834.0" y="262.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">menghapus akun dengan <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" font-weight="800">mosquitto_passwd</tspan></text>
<text x="834.0" y="288.0" font-size="11.5" font-weight="700" fill="#4a5568" text-anchor="start" >di Pi:</text>
<text x="878.0" y="288.0" font-size="11.5" font-weight="800" fill="#0f8b8d" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">sudo systemctl reload mosquitto</text>
<text x="834.0" y="310.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="start" >sambungan yang sah tidak terputus</text>
<rect x="818.0" y="344.0" width="336.0" height="172.0" rx="10" fill="#ffffff" stroke="#0f8b8d" stroke-width="1.4" />
<text x="834.0" y="370.0" font-size="14" font-weight="800" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-weight="800">Mulai ulang</tspan> (<tspan font-style="italic">restart</tspan>)</text>
<text x="834.0" y="394.0" font-size="11.5" font-weight="700" fill="#4a5568" text-anchor="start" >kalau yang diubah:</text>
<text x="834.0" y="412.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">daftar izin, atau pengaturan seperti</text>
<text x="834.0" y="430.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" font-weight="800">use_username_as_clientid</tspan></text>
<text x="834.0" y="456.0" font-size="11.5" font-weight="700" fill="#4a5568" text-anchor="start" >di Pi:</text>
<text x="878.0" y="456.0" font-size="11.5" font-weight="800" fill="#0f8b8d" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">sudo systemctl restart mosquitto</text>
<text x="834.0" y="478.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="start" >semua klien tersambung lagi</text>
<text x="834.0" y="496.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="start" >dalam beberapa detik</text>
<rect x="818.0" y="532.0" width="336.0" height="224.0" rx="10" fill="#fde6e8" />
<text x="834.0" y="558.0" font-size="13" font-weight="800" fill="#e63946" text-anchor="start" xml:space="preserve">Mengapa daftar izin butuh <tspan font-style="italic">restart</tspan>?</text>
<text x="834.0" y="582.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">Menurut kode sumbernya, Mosquitto 2.0.21</text>
<text x="834.0" y="600.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">(Pi) yang memuat ulang daftar izin yang</text>
<text x="834.0" y="618.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">salah ketik tetap berjalan <tspan font-weight="800" fill="#e63946">tanpa daftar</tspan></text>
<text x="834.0" y="636.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-weight="800" fill="#e63946">izin sama sekali</tspan>: semua akun boleh</text>
<text x="834.0" y="654.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">menulis ke mana saja. Tandanya hanya</text>
<text x="834.0" y="672.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">dua baris <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" font-weight="800">Error</tspan> di log.</text>
<text x="834.0" y="700.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">Dengan <tspan font-style="italic">restart</tspan>, berkas yang salah membuat</text>
<text x="834.0" y="718.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">broker gagal menyala: kesalahannya</text>
<text x="834.0" y="736.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">langsung terlihat.</text>
<rect x="818.0" y="772.0" width="336.0" height="84.0" rx="10" fill="#eef1f5" />
<text x="834.0" y="796.0" font-size="12.5" font-weight="800" fill="#1e2a4a" text-anchor="start" >Di laptop</text>
<text x="834.0" y="816.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" >keduanya cukup dengan menghentikan</text>
<text x="834.0" y="834.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" >brokernya, lalu menyalakannya lagi</text>
<text x="1178.0" y="954.0" font-size="11" font-weight="400" fill="#8a8f9c" text-anchor="end" >Kurikulum Fullstack IoT Developer · CC BY 4.0</text>
