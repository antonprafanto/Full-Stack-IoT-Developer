<text x="48.0" y="700.0" font-size="13" font-weight="700" fill="#1e2a4a" text-anchor="start" xml:space="preserve">Satu fungsi di migrasi <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12.0" font-weight="800">002_hypertable.sql</tspan> (Praktik 2) menjilid <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12.0" font-weight="800">readings</tspan> per hari dan memindahkan baris yang sudah ada:</text>
