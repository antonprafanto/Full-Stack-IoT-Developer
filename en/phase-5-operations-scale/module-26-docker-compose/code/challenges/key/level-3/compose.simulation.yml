# compose.simulation.yml - the Module 26 Level 3 answer key: the simulator service (profile "simulation") as an EXTRA Compose file.
# The main file compose.cloud.yml isn't changed. Put this file at the project root (next to compose.cloud.yml), then write
# both file names on the COMPOSE_FILE line of the root .env, separated by ":" (Linux, macOS, Pi) or ";" (Windows):
#   COMPOSE_FILE=compose.cloud.yml:compose.simulation.yml
# Compose merges both into one home: the simulator joins the same hallway, so it can call "mosquitto".
# The simulator does NOT start with a plain "docker compose up -d". Start it with: docker compose --profile simulation up -d
services:
  simulator:
    profiles: ["simulation"]
    # A local mold (not sent to the image shop): a name + an exact tag (= version in tools/package.json), built from
    # tools/Dockerfile. The path ./tools is counted from the folder of compose.cloud.yml (the first file in COMPOSE_FILE).
    image: mini-smart-home-tools:1.0.0
    build: ./tools
    # one fake device (f00d00000001) to the CENTRAL broker through the service name "mosquitto", not 127.0.0.1:
    # inside the container, 127.0.0.1 is the simulator container itself
    command: ["node", "device-simulator.js", "mqtt://mosquitto:1883", "1"]
    # Node as the first process (PID 1) in a container ignores the SIGTERM stop signal, because the simulator has no
    # handler for it: "docker compose stop" then waits 10 seconds before killing it by force. init: true installs a small
    # "init" as PID 1 that passes that signal on to Node, so the simulator stops in an instant (lab: 11.5 s -> 1.3 s).
    init: true
    environment:
      # the practice device key (the POST /devices answer) = the password of the broker account f00d00000001. Filled in in the root .env.
      KEY_F00D00000001: ${KEY_F00D00000001:-}
    depends_on:
      mosquitto:
        condition: service_started
    restart: unless-stopped
    # the same log limit as the other services (the x-log anchor of compose.cloud.yml can't be referred to from another file)
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
