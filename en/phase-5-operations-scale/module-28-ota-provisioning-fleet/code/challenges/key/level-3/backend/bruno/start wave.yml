info:
  name: start wave
  type: http
  seq: 40

http:
  method: POST
  url: "{{baseUrl}}/fleet/wave"
  body:
    type: json
    data: |-
      {
        "version": "1.7.1"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "202"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
