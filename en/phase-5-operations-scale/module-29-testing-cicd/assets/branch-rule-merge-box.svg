<text x="92.0" y="632.0" font-size="12.5" font-weight="800" fill="#1e2a4a" text-anchor="start" >Require a pull request before merging</text>
<text x="92.0" y="654.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">required approvals <tspan font-weight="800" fill="#1e2a4a">0</tspan>: the author of a PR can't</text>
<text x="92.0" y="673.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">approve their own PR; a direct push to</text>
<text x="92.0" y="692.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11" fill="#1e2a4a" font-weight="800">main</tspan> is refused</text>
<rect x="612.0" y="604.0" width="536.0" height="151.0" rx="10" fill="#ffffff" />
<rect x="628.0" y="620.0" width="13.0" height="13.0" rx="3" fill="#a13a6b" stroke="#a13a6b" stroke-width="1.4" />
<path d="M631.0 626.8 L633.6 629.4 L638.2 623.8" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
<text x="652.0" y="632.0" font-size="12.5" font-weight="800" fill="#1e2a4a" text-anchor="start" >Require status checks to pass before merging</text>
<text x="652.0" y="654.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">require <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11" fill="#1e2a4a" font-weight="800">verify</tspan>, <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11" fill="#1e2a4a" font-weight="800">test</tspan> (Practice 5) and <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11" fill="#1e2a4a" font-weight="800">build</tspan> (Practice 7);</text>
<text x="652.0" y="673.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">the exact job names, a job without a <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11" fill="#1e2a4a" font-weight="800">paths</tspan> filter, a check</text>
<text x="652.0" y="692.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">that passed in the last 7 days. <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11" fill="#1e2a4a" font-weight="800">staging</tspan> is not</text>
<text x="652.0" y="711.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">required: in a PR it is skipped (<tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11" fill="#1e2a4a" font-weight="800">if:</tspan>), and a skipped</text>
<text x="652.0" y="730.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">job counts as passed</text>
<rect x="52.0" y="769.0" width="536.0" height="94.0" rx="10" fill="#ffffff" />
<rect x="68.0" y="785.0" width="13.0" height="13.0" rx="3" fill="#a13a6b" stroke="#a13a6b" stroke-width="1.4" />
<path d="M71.0 791.8 L73.6 794.4 L78.2 788.8" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
<text x="92.0" y="797.0" font-size="12.5" font-weight="800" fill="#1e2a4a" text-anchor="start" >Require branches to be up to date before merging</text>
<text x="92.0" y="819.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">the PR branch must hold the latest <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11" fill="#1e2a4a" font-weight="800">main</tspan>: the button</text>
<text x="92.0" y="838.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-weight="800" fill="#1e2a4a">Update branch</tspan> when <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11" fill="#1e2a4a" font-weight="800">main</tspan> has moved on</text>
<rect x="612.0" y="769.0" width="536.0" height="94.0" rx="10" fill="#ffffff" />
<rect x="628.0" y="785.0" width="13.0" height="13.0" rx="3" fill="#a13a6b" stroke="#a13a6b" stroke-width="1.4" />
<path d="M631.0 791.8 L633.6 794.4 L638.2 788.8" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
<text x="652.0" y="797.0" font-size="12.5" font-weight="800" fill="#1e2a4a" text-anchor="start" >Do not allow bypassing the above settings</text>
<text x="652.0" y="819.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">without this box, you as the repo owner (admin)</text>
<text x="652.0" y="838.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">can still merge a red PR</text>
<rect x="30.0" y="897.0" width="1140.0" height="70.0" rx="12" fill="#eef1f5" />
<text x="52.0" y="925.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-weight="800" fill="#1e2a4a">Conditions:</tspan> a <tspan font-weight="800" fill="#1e2a4a">public</tspan> repo (a free account: branch protection only for public repos) · the first pull request that brings <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11" fill="#1e2a4a" font-weight="800">ci.yml</tspan> is merged first</text>
<text x="52.0" y="947.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">(a check can only be chosen after it has run once) · this rule doesn't replace the Module 16 review checklist</text>
