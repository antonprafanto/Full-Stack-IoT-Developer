<text x="651.0" y="438.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">→ <tspan font-weight="800" fill="#1e2a4a">Delete branch</tspan> (the same as Module 16);</text>
<text x="651.0" y="456.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">the robot continues on <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11" fill="#1e2a4a" font-weight="800">main</tspan> (Concept 3)</text>
<rect x="30.0" y="496.0" width="1140.0" height="30.0" rx="8" fill="#fdeedd" />
<text x="600.0" y="516.0" font-size="12" font-weight="800" fill="#b45f17" text-anchor="middle" >RECONSTRUCTION: not a GitHub screenshot · the layout and the texts on your screen may differ a little</text>
<rect x="30.0" y="546.0" width="1140.0" height="335.0" rx="14" fill="#fcf2f6" stroke="#a13a6b" stroke-width="2" />
<text x="52.0" y="576.0" font-size="14" font-weight="700" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-weight="800" fill="#a13a6b">Settings</tspan> → <tspan font-weight="800" fill="#a13a6b">Branches</tspan> → a classic rule for <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13" fill="#a13a6b" font-weight="800">main</tspan>: four checkboxes</text>
<rect x="52.0" y="604.0" width="536.0" height="151.0" rx="10" fill="#ffffff" />
<rect x="68.0" y="620.0" width="13.0" height="13.0" rx="3" fill="#a13a6b" stroke="#a13a6b" stroke-width="1.4" />
