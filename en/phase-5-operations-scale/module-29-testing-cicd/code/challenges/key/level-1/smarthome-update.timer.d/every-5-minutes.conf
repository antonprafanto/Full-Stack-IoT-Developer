# every-5-minutes.conf - Module 29 Challenge 1 key: the Pi asks "a new release?" every 5 minutes, not every 15.
# A systemd "drop-in" file: it overrides part of smarthome-update.timer WITHOUT changing the original file (the file in the repo
# stays at 15 minutes). Its place on the Pi: /etc/systemd/system/smarthome-update.timer.d/every-5-minutes.conf
[Timer]
# A schedule (OnBootSec=, OnUnitActiveSec=, ...) may be written several times, and ALL its values apply together. The empty
# value below first empties ALL the schedules of this timer, OnBootSec=5min of the original file included: without the empty
# value, the old 15-minute schedule stays next to the new 5-minute one.
OnUnitActiveSec=
# ...so the schedule "5 minutes after the Pi starts" is written again. Without this line, after the Pi restarts nothing wakes
# the timer: OnUnitActiveSec= counts from the previous round, and right after starting there hasn't been any round yet.
OnBootSec=5min
OnUnitActiveSec=5min
