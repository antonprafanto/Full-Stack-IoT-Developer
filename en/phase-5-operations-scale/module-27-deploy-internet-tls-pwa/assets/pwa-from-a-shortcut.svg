<path d="M349.0 761.5 L356.0 761.0 L351.7 755.5" fill="none" stroke="#1a7f37" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
<line x1="762.0" y1="669.0" x2="786.0" y2="669.0" stroke="#a13a6b" stroke-width="2" stroke-linecap="round" />
<path d="M780.7 671.8 L786.0 669.0 L780.7 666.2" fill="none" stroke="#a13a6b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<line x1="762.0" y1="761.0" x2="786.0" y2="761.0" stroke="#1a7f37" stroke-width="2" stroke-linecap="round" />
<path d="M780.7 763.8 L786.0 761.0 L780.7 758.2" fill="none" stroke="#1a7f37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<text x="790.0" y="654.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">the screen opens fast, offline too;</text>
<text x="790.0" y="673.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">offline, the dashboard writes:</text>
<rect x="786.0" y="680.0" width="364.0" height="46.0" rx="6" fill="#eef1f5" />
<text x="798.0" y="698.0" font-size="11.5" font-weight="700" fill="#1e2a4a" text-anchor="start" >Can't reach the server.</text>
<text x="798.0" y="716.0" font-size="11.5" font-weight="700" fill="#1e2a4a" text-anchor="start" >Check your internet connection, then try again.</text>
<text x="790.0" y="758.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">numbers never come from the phone's store:</text>
<text x="790.0" y="777.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">always from the server (the last reading</text>
<text x="790.0" y="796.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">the server got), or an error if unreachable</text>
<rect x="30.0" y="830.0" width="562.0" height="196.0" rx="12" fill="#ffffff" stroke="#e0dcd2" stroke-width="1.6" />
<text x="50.0" y="858.0" font-size="14" font-weight="800" fill="#1e2a4a" text-anchor="start" >A new version (autoUpdate)</text>
<text x="50.0" y="886.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" >the web image is rebuilt on the server</text>
<text x="50.0" y="908.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" >the first opening: still the OLD version (from</text>
<text x="50.0" y="930.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" >the store) while the new one is fetched quietly</text>
<text x="50.0" y="952.0" font-size="12" font-weight="700" fill="#a13a6b" text-anchor="start" >the next opening: the NEW version</text>
<text x="50.0" y="974.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="start" >(lab: shown on the 2nd reload; the tab isn't</text>
<text x="50.0" y="996.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="start" >reloaded by itself, form fields are safe)</text>
<rect x="608.0" y="830.0" width="562.0" height="196.0" rx="12" fill="#ffffff" stroke="#e0dcd2" stroke-width="1.6" />
<text x="628.0" y="858.0" font-size="14" font-weight="800" fill="#1e2a4a" text-anchor="start" >Installing</text>
<text x="628.0" y="886.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-weight="800" fill="#1e2a4a">Android (Chrome):</tspan> menu ⋮ → the app install option</text>
<text x="628.0" y="908.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-weight="800" fill="#1e2a4a">iPhone (Safari):</tspan> Share → Add to Home Screen →</text>
<text x="628.0" y="930.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">turn on Open as Web App → Add</text>
<text x="628.0" y="952.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-weight="800" fill="#1e2a4a">Laptop (Chrome, Edge):</tspan> the install button in the address bar</text>
<text x="628.0" y="974.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-weight="800" fill="#1e2a4a">Honestly:</tspan> a real phone wasn't tested by the author (headless</text>
<text x="628.0" y="996.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">Chrome, 412 px); no push notifications, no offline data</text>
<text x="1178.0" y="1054.0" font-size="11" font-weight="400" fill="#8a8f9c" text-anchor="end" >Fullstack IoT Developer Curriculum · CC BY 4.0</text>
