<rect width="1200" height="1068" fill="#fffdf7"/>
<text x="600.0" y="44.0" font-size="28" font-weight="800" fill="#1e2a4a" text-anchor="middle" xml:space="preserve">From a shortcut to an app (PWA)</text>
<text x="600.0" y="76.0" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">Concept 11 · dashboard 1.3.0 · <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="14.5">vite-plugin-pwa</tspan> 2.0.0 writes the manifest and the service worker at <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="14.5">npm</tspan> <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="14.5">run</tspan> <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="14.5">build</tspan></text>
<rect x="30.0" y="98.0" width="520.0" height="268.0" rx="14" fill="#ffffff" stroke="#9aa3b0" stroke-width="1.6" stroke-dasharray="7 5"/>
<rect x="51.0" y="115.0" width="22.0" height="38.0" rx="5" fill="none" stroke="#4a5568" stroke-width="2" />
<circle cx="62.0" cy="147.0" r="1.8" fill="#4a5568" />
<text x="88.0" y="130.0" font-size="15" font-weight="800" fill="#1e2a4a" text-anchor="start" >A shortcut on the home screen</text>
<text x="88.0" y="149.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="start" >Modules 24–26, phone mode on the home Wi-Fi</text>
<text x="50.0" y="182.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">address <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#1e2a4a" font-weight="800">http://192.168.1.10</tspan> (the laptop's IP)</text>
<text x="50.0" y="207.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">not a secure context: <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#1e2a4a" font-weight="800">isSecureContext</tspan> = <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#1e2a4a" font-weight="800">false</tspan></text>
<text x="50.0" y="232.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">only the <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#1e2a4a" font-weight="800">apple-touch-icon.png</tspan> 180 px icon + a name</text>
<text x="50.0" y="257.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">no service worker: offline = the browser's error page</text>
<text x="50.0" y="282.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">Android: opens in Chrome, with the Chrome logo</text>
<text x="50.0" y="307.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">the laptop's IP changes or it sleeps = a dead shortcut</text>
<text x="50.0" y="332.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">outside the home Wi-Fi: it can't work at all</text>
<line x1="558.0" y1="232.0" x2="624.0" y2="232.0" stroke="#a13a6b" stroke-width="2.8" stroke-linecap="round" />
<path d="M616.1 236.2 L624.0 232.0 L616.1 227.8" fill="none" stroke="#a13a6b" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
<text x="590.0" y="220.0" font-size="12" font-weight="800" fill="#a13a6b" text-anchor="middle" >Module 27</text>
<rect x="630.0" y="98.0" width="540.0" height="268.0" rx="14" fill="#fcf2f6" stroke="#a13a6b" stroke-width="2" />
<g transform="translate(662 134) scale(1.0) translate(-662 -134)">
<rect x="651.0" y="115.0" width="22.0" height="38.0" rx="5" fill="none" stroke="#a13a6b" stroke-width="2" />
