</g>
<text x="688.0" y="130.0" font-size="15" font-weight="800" fill="#a13a6b" text-anchor="start" >The installed app (PWA)</text>
<text x="688.0" y="149.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="start" >opened through the VPS or the Cloudflare tunnel, 24 hours</text>
<text x="650.0" y="182.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">address <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#1e2a4a" font-weight="800">https://iot.yourname.my.id</tspan> (or <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#1e2a4a" font-weight="800">http://localhost</tspan>)</text>
<text x="650.0" y="207.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">a secure context: the browser will install the app</text>
<text x="650.0" y="232.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">the manifest + icons 192/512 + a maskable icon</text>
<text x="650.0" y="257.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">the service worker keeps the dashboard's shell</text>
<text x="650.0" y="282.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">its own window without an address bar (<tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#1e2a4a" font-weight="800">standalone</tspan>)</text>
<text x="650.0" y="307.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">offline: the shell stays open + a clear message</text>
<text x="650.0" y="332.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">from anywhere: another Wi-Fi, mobile data</text>
<text x="30.0" y="392.0" font-size="15" font-weight="800" fill="#1e2a4a" text-anchor="start" >The dashboard app's four parts</text>
<text x="1170.0" y="392.0" font-size="11.5" font-weight="600" fill="#4a5568" text-anchor="end" >lab: headless Chrome 156, the install-error list empty at localhost and at the simulated HTTPS</text>
<rect x="30.0" y="406.0" width="270.0" height="150.0" rx="12" fill="#ffffff" stroke="#e0dcd2" stroke-width="1.6" />
<circle cx="54.0" cy="430.0" r="11" fill="#a13a6b" stroke="#ffffff" stroke-width="2" />
<text x="54.0" y="434.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >1</text>
<text x="74.0" y="435.0" font-size="13.5" font-weight="800" fill="#1e2a4a" text-anchor="start" >A secure address</text>
<text x="46.0" y="462.0" font-size="11.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="10.5" fill="#1e2a4a" font-weight="800">https://…</tspan> or <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="10.5" fill="#1e2a4a" font-weight="800">localhost</tspan></text>
<text x="46.0" y="480.0" font-size="11.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">Wi-Fi IP <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="10.5" fill="#1e2a4a" font-weight="800">http://192.168…</tspan></text>
<text x="46.0" y="498.0" font-size="11.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">does NOT count as secure</text>
<rect x="320.0" y="406.0" width="270.0" height="150.0" rx="12" fill="#ffffff" stroke="#e0dcd2" stroke-width="1.6" />
<circle cx="344.0" cy="430.0" r="11" fill="#a13a6b" stroke="#ffffff" stroke-width="2" />
<text x="344.0" y="434.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >2</text>
<text x="364.0" y="435.0" font-size="13.5" font-weight="800" fill="#1e2a4a" text-anchor="start" >Manifest</text>
<text x="336.0" y="462.0" font-size="11.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="10.5" fill="#1e2a4a" font-weight="800">manifest.webmanifest</tspan>:</text>
<text x="336.0" y="480.0" font-size="11.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">"Mini Smart Home",</text>
<text x="336.0" y="498.0" font-size="11.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="10.5" fill="#1e2a4a" font-weight="800">start_url</tspan> <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="10.5" fill="#1e2a4a" font-weight="800">/</tspan>, <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="10.5" fill="#1e2a4a" font-weight="800">standalone</tspan>,</text>
<text x="336.0" y="516.0" font-size="11.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="10.5" fill="#1e2a4a" font-weight="800">theme_color #1d293d</tspan></text>
<rect x="610.0" y="406.0" width="270.0" height="150.0" rx="12" fill="#ffffff" stroke="#e0dcd2" stroke-width="1.6" />
<circle cx="634.0" cy="430.0" r="11" fill="#a13a6b" stroke="#ffffff" stroke-width="2" />
<text x="634.0" y="434.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >3</text>
<text x="654.0" y="435.0" font-size="13.5" font-weight="800" fill="#1e2a4a" text-anchor="start" >Icons</text>
<text x="626.0" y="462.0" font-size="11.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="10.5" fill="#1e2a4a" font-weight="800">pwa-192x192.png</tspan>, <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="10.5" fill="#1e2a4a" font-weight="800">pwa-512x512.png</tspan></text>
<text x="626.0" y="480.0" font-size="11.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="10.5" fill="#1e2a4a" font-weight="800">maskable-icon-512x512.png</tspan></text>
<text x="626.0" y="498.0" font-size="11.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">(+ 64 px), from <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="10.5" fill="#1e2a4a" font-weight="800">favicon.svg</tspan></text>
<text x="626.0" y="516.0" font-size="11.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">the Module 24 line house</text>
<rect x="900.0" y="406.0" width="270.0" height="150.0" rx="12" fill="#ffffff" stroke="#e0dcd2" stroke-width="1.6" />
<circle cx="924.0" cy="430.0" r="11" fill="#a13a6b" stroke="#ffffff" stroke-width="2" />
<text x="924.0" y="434.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >4</text>
<text x="944.0" y="435.0" font-size="13.5" font-weight="800" fill="#1e2a4a" text-anchor="start" >Service worker</text>
<text x="916.0" y="462.0" font-size="11.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="10.5" fill="#1e2a4a" font-weight="800">sw.js</tspan>: <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="10.5" fill="#1e2a4a" font-weight="800">generateSW</tspan>,</text>
<text x="916.0" y="480.0" font-size="11.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="10.5" fill="#1e2a4a" font-weight="800">registerType: 'autoUpdate'</tspan></text>
<text x="916.0" y="498.0" font-size="11.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">the shell = 10 files (±1,054 KiB);</text>
<text x="916.0" y="516.0" font-size="11.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">not required to install in current</text>
<text x="916.0" y="534.0" font-size="11.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">Chrome, but it makes offline work</text>
<rect x="30.0" y="576.0" width="1140.0" height="236.0" rx="14" fill="#ffffff" stroke="#e0dcd2" stroke-width="1.6" />
<text x="54.0" y="606.0" font-size="15" font-weight="800" fill="#1e2a4a" text-anchor="start" >The service worker: what is kept and what ALWAYS goes to the server</text>
<rect x="54.0" y="650.0" width="230.0" height="118.0" rx="12" fill="#fcf2f6" stroke="#a13a6b" stroke-width="2" />
<text x="70.0" y="683.0" font-size="14" font-weight="800" fill="#a13a6b" text-anchor="start" xml:space="preserve">service worker <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13.5" fill="#a13a6b" font-weight="800">sw.js</tspan></text>
<text x="70.0" y="712.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">a helper in the browser</text>
<text x="70.0" y="730.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">that checks every</text>
<text x="70.0" y="748.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">page request</text>
<rect x="360.0" y="628.0" width="400.0" height="82.0" rx="10" fill="#ffffff" stroke="#a13a6b" stroke-width="1.6" />
<text x="376.0" y="652.0" font-size="13" font-weight="800" fill="#a13a6b" text-anchor="start" >from its store (the shell)</text>
<text x="376.0" y="674.0" font-size="11.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11" fill="#1e2a4a" font-weight="800">index.html</tspan>, JavaScript, CSS, <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11" fill="#1e2a4a" font-weight="800">favicon.svg</tspan>,</text>
<text x="376.0" y="692.0" font-size="11.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">icons, the manifest, <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11" fill="#1e2a4a" font-weight="800">registerSW.js</tspan></text>
<rect x="360.0" y="720.0" width="400.0" height="82.0" rx="10" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6" />
<text x="376.0" y="744.0" font-size="13" font-weight="800" fill="#1a7f37" text-anchor="start" >always to the server (never kept)</text>
<text x="376.0" y="766.0" font-size="11.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11" fill="#1e2a4a" font-weight="800">/api/…</tspan> (data, login, commands), <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11" fill="#1e2a4a" font-weight="800">/grafana/…</tspan>,</text>
<text x="376.0" y="784.0" font-size="11.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">Socket.IO <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11" fill="#1e2a4a" font-weight="800">wss://…/api/socket.io/</tspan> (WebSocket)</text>
<line x1="286.0" y1="690.0" x2="356.0" y2="669.0" stroke="#a13a6b" stroke-width="2.2" stroke-linecap="round" />
<path d="M351.0 673.9 L356.0 669.0 L349.1 667.6" fill="none" stroke="#a13a6b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
