# compose.cloud.yml - every CENTRAL service of Mini Smart Home in one file (Modules 26-27).
# ONE file for three places; only the contents of .env differ (the "values per place" table in .env.example):
#   laptop (Module 26)            : WEB_DOMAIN and MQTT_DOMAIN empty = the dashboard over HTTP at http://localhost, a plain broker 1883
#   VPS (Module 27, main path)    : WEB_DOMAIN and MQTT_DOMAIN filled in = Caddy sets up HTTPS by itself, the broker also TLS on 8883
#   Pi (Module 27, free path)     : the domains empty (HTTPS is set up by Cloudflare), profile "tunnel" (cloudflared) switched on
# Run it from this folder (the project root):  docker compose up -d
#   No .env yet? Copy .env.example to .env and fill in its secrets first. Without .env, Compose doesn't find this file
#   (no configuration file provided); a secret that is still empty makes it stop (required variable).
#   The line COMPOSE_FILE=compose.cloud.yml in .env makes -f unnecessary (without that line: docker compose -f compose.cloud.yml ...).
# Secrets and settings are read from .env in this folder (its example is .env.example). .env NEVER goes into Git, and the output
# of "docker compose config" prints every secret: don't paste it into a forum, an issue, or an AI.
# NEVER "docker compose down -v": -v deletes the cupboards (volumes) that belong to Compose. The history cupboards (db, grafana) are
# "external" on purpose so they aren't deleted, but the broker passwords, the Uptime Kuma data, and (Module 27) Caddy's certificates are.
name: smarthome

# The backend settings are used by two services (backend and migrate): written once here, then referred to with *backend-settings.
# Compose ignores an "x-..." name as a service; its content is only material to refer to.
x-backend-settings: &backend-settings
  # inside the Compose hallway, other services are called by their SERVICE NAME: mosquitto, db (not 127.0.0.1). The broker here
  # stays plain (mqtt://, 1883): this connection never leaves this machine, on the VPS too.
  MQTT_URL: mqtt://mosquitto:1883
  MQTT_USERNAME: backend
  MQTT_PASSWORD: ${MQTT_PASSWORD:?fill in MQTT_PASSWORD in .env}
  DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?fill in POSTGRES_PASSWORD in .env}@db:5432/smarthome
  # 0.0.0.0 = listen on every interface INSIDE the container, so that Caddy and the healthcheck can get in. What decides
  # who outside this machine can knock is still the counter (ports) of the backend service below: 127.0.0.1 only.
  HOST: 0.0.0.0
  PORT: "8080"
  JWT_SECRET: ${JWT_SECRET:?fill in JWT_SECRET in .env}
  # pages (origins) that may log in from a browser: the dashboard through Caddy at http://localhost (web counter 80).
  # The VPS and the free-path Pi: the dashboard's address on the internet, for example https://iot.yourname.my.id (Module 27)
  CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost,http://127.0.0.1}
  # Module 27 (backend 1.4.0): the backend is always behind Caddy. uniquelocal = what Caddy says about the visitor (the IP address
  # and https, the X-Forwarded-* headers) is trusted when it comes from a private address in the Docker hallway: Secure login
  # cookies over HTTPS and the limit of 10 login attempts per visitor, not shared by every visitor. Not a number (refused by the backend).
  TRUST_PROXY: ${TRUST_PROXY:-uniquelocal}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
  # only for a mock Bot API server in the lab; empty = the real Telegram server
  TELEGRAM_API_ROOT: ${TELEGRAM_API_ROOT:-}
  REPORT_SCHEDULE: "${REPORT_SCHEDULE:-0 7 * * *}"
  # the times in the backend log use WIB (without this, the container's clock = UTC; a VPS is usually UTC too)
  TZ: Asia/Jakarta

# Each container's log is limited to 3 files x 10 MB. Docker's default has NO limit: in the long run the disk fills up.
x-log: &log
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  # The TimescaleDB database (Modules 17-18). Its cupboard = the same smarthome-data cupboard since Module 17 (see volumes below).
  db:
    image: timescale/timescaledb:2.30.2-pg17
    environment:
      # This form is only read while the cupboard is still EMPTY. An old cupboard already holds the password: write the OLD one in .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?fill in POSTGRES_PASSWORD in .env}
      POSTGRES_DB: smarthome
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # 127.0.0.1 = this machine only (DBeaver, psql, dev mode npm run dev). Without 127.0.0.1, Docker opens the counter to
      # the whole Wi-Fi (on a VPS: to the whole internet) and goes around the firewall (ufw too).
      - "127.0.0.1:${PORT_DB:-5432}:5432"
    networks:
      default:
        # the old container name of Modules 17-25: the screen-made Grafana data source (host smarthome-db:5432) stays connected
        aliases:
          - smarthome-db
    healthcheck:
      # "running" doesn't mean "ready for visitors". -h 127.0.0.1: while a new cupboard is filled for the first time, a temporary
      # server only listens on the local socket, so without -h the check can pass too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d smarthome"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s
    restart: unless-stopped
    logging: *log

  # One-off: makes the broker account "backend" in the broker cupboard, ONLY when there's no password file yet (a new machine, an
  # empty cupboard). Other accounts (simulator devices, pi-bridge, checker, monitor) are added with (-u mosquitto = the password
  # file's owner):
  #   docker compose exec -u mosquitto mosquitto mosquitto_passwd /mosquitto/data/broker-passwd <name>
  # then: docker compose restart mosquitto
  broker-account:
    image: eclipse-mosquitto:2.1.2-alpine
    environment:
      MQTT_PASSWORD: ${MQTT_PASSWORD:?fill in MQTT_PASSWORD in .env}
    # $$ = a $ sign passed on to sh, not filled in by Compose from .env. -b = the password is written in the command: it doesn't
    # go into your terminal history, but it's briefly visible in the machine's process list (on Linux, the Pi, and the VPS, ps also
    # shows container processes). The risk is small: only once, when the password file is made.
    command:
      - sh
      - -c
      - |
        set -e
        if [ -f /mosquitto/data/broker-passwd ]; then
          echo "broker password file already exists: skipped"
        else
          mosquitto_passwd -b -c /mosquitto/data/broker-passwd backend "$$MQTT_PASSWORD"
          chmod 600 /mosquitto/data/broker-passwd
          echo "broker account backend created"
        fi
    volumes:
      - broker-data:/mosquitto/data
    # The Mosquitto image declares its log folder as a cupboard, while our log shows on the screen (docker compose logs).
    # tmpfs = a temporary folder in RAM: without it Docker makes a nameless cupboard every time this container is recreated.
    tmpfs:
      - /mosquitto/log
    restart: "no"
    logging: *log

  # Module 27, one-off: copies the broker name's certificate (MQTT_DOMAIN, asked from Let's Encrypt by Caddy) from Caddy's
  # cupboard to the certificate-data cupboard, owned by the user mosquitto (uid 1883). Mosquitto 2.x reads its certificate AFTER
  # dropping from root to the user mosquitto, while Caddy's files may only be read by root: read directly = "Permission
  # denied" and the broker stops. The steps are in scripts/copy-certificate.sh. It waits for Caddy for 5 minutes at most.
  # MQTT_DOMAIN empty (laptop, free-path Pi) = done at once: "skipped", the broker stays plain as in Module 26.
  # Caddy renews its certificate by itself, Mosquitto does NOT read it again by itself. On the VPS, a weekly cron runs
  # scripts/renew-mqtt-certificate.sh: this service again (docker compose run --rm mqtt-certificate), then a broker reload
  # (docker compose exec mosquitto kill -HUP 1: the same PID, the bridge doesn't break). Not "docker compose restart mosquitto"
  # with a key that has the wrong owner (it crash-loops), and not "docker compose kill -s SIGHUP" (Docker takes it as stopped).
  mqtt-certificate:
    image: eclipse-mosquitto:2.1.2-alpine
    environment:
      MQTT_DOMAIN: ${MQTT_DOMAIN:-}
    # this script is run by sh inside the container (as root), not by the mosquitto program
    entrypoint: ["sh", "/scripts/copy-certificate.sh"]
    volumes:
      # Caddy's cupboard read-only: the copier can't change the certificates or the Let's Encrypt account key
      - caddy-data:/caddy:ro
      - certificate-data:/out
      # the scripts/ folder from the repo, mounted as a FOLDER (like the Caddyfile), read-only
      - ./scripts:/scripts:ro
    # two folders of the Mosquitto image that aren't used here: tmpfs, so that there's no nameless cupboard
    tmpfs:
      - /mosquitto/data
      - /mosquitto/log
    restart: "no"
    logging: *log

  # The CENTRAL MQTT broker (Mosquitto 2.1.2). The backend calls it mosquitto:1883 inside the hallway; the Pi gateway (bridge) and
  # the simulator come in through counter 1883 from the home network, or (Module 27, VPS) through the TLS door 8883 from the internet.
  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    volumes:
      # The configuration and the access list from the repo (read-only). After changing either: docker compose restart mosquitto
      # Module 27: CENTER_CONF in .env chooses the file: center.conf (the default: the laptop and the free-path Pi, only 1883) or
      # center-internet.conf (VPS: + the TLS door 8883 with the copied certificate). The long form + create_host_path false:
      # a file name with a typo is refused by Compose at once, not quietly turned into an empty folder.
      - type: bind
        source: ./edge/${CENTER_CONF:-center.conf}
        target: /mosquitto/config/mosquitto.conf
        read_only: true
        bind:
          create_host_path: false
      - ./edge/acl-broker:/mosquitto/config/acl-broker:ro
      # the password file, retained messages, and sessions are kept in this cupboard (it belongs to Compose)
      - broker-data:/mosquitto/data
      # Module 27: the copy of the broker name's certificate from the mqtt-certificate service (empty on the laptop and the free-path Pi)
      - certificate-data:/mosquitto/certs:ro
    # the image's own log folder isn't used (log to the screen): tmpfs, so that there's no nameless cupboard
    tmpfs:
      - /mosquitto/log
    ports:
      # 1883 = PLAIN MQTT: the username and the device key can be read by anyone on the way it travels (Module 21).
      # The default 127.0.0.1 = this machine only (the backend still comes in through the hallway). MQTT_ADDRESS=0.0.0.0 in .env if
      # a Pi gateway or an ESP32 comes in from the home Wi-Fi (the Kit B laptop of Module 26); the free-path Pi: 172.17.0.1, only for
      # the gateway bridge on the same Pi (host-gateway). On a VPS NEVER 0.0.0.0: Docker opens the counter past ufw, so plain 1883 is
      # open to the whole internet. A laptop on a public Wi-Fi (a cafe, a campus) with 0.0.0.0: docker compose stop mosquitto, then
      # back home: docker compose start mosquitto
      - "${MQTT_ADDRESS:-127.0.0.1}:${PORT_MQTT:-1883}:1883"
      # Module 27: 8883 = ENCRYPTED MQTT (TLS) for the Pi bridge and devices from the internet; only alive with
      # center-internet.conf. It follows WEB_ADDRESS (the visitor doors from outside): VPS 0.0.0.0, the laptop and the Pi 127.0.0.1.
      - "${WEB_ADDRESS:-127.0.0.1}:${PORT_MQTTS:-8883}:8883"
    depends_on:
      broker-account:
        condition: service_completed_successfully
      # Module 27: door 8883 needs the certificate copy BEFORE the broker starts (without its files, the broker stops)
      mqtt-certificate:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *log

  # One-off: applies the new migrations/*.sql files (safe to repeat: "0 new migration(s) applied").
  migrate:
    # the same mold as the backend service (image + build written exactly the same in both services)
    image: ${IMAGE_REGISTRY:?fill in IMAGE_REGISTRY in .env}/mini-smart-home-backend:1.4.0
    build: ./backend
    command: ["node", "src/db/migrate.ts"]
    environment: *backend-settings
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    logging: *log

  # Backend 1.4.0 (Modules 16-27). The image tag = version in backend/package.json.
  backend:
    # image: the name in the image shop (GHCR, Module 26 Practice 10). build: if that image isn't on this machine yet and can't be
    # pulled from the shop, Compose builds it itself from backend/Dockerfile (on a VPS: docker compose build, Module 27).
    image: ${IMAGE_REGISTRY:?fill in IMAGE_REGISTRY in .env}/mini-smart-home-backend:1.4.0
    build: ./backend
    environment: *backend-settings
    ports:
      # Bruno, Swagger (http://localhost:8080/docs), and tools/live-terminal.js keep using the old counter. On a VPS also
      # 127.0.0.1: from the laptop through an SSH tunnel (ssh -L 8080:127.0.0.1:8080), internet visitors through Caddy /api.
      - "127.0.0.1:${PORT_BACKEND:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # HEAD /health from inside the container (the node image has no curl). Healthy = the process is alive and answers; /health
      # stays 200 even when the broker or the database is down (a real monitor = Module 30). "unhealthy" does NOT restart the container.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health',{method:'HEAD'}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 2s
    restart: unless-stopped
    logging: *log

  # The dashboard (Modules 22-27) served by Caddy: the page at /, the backend API at /api (one address, no cross-port CORS).
  # Module 27: Caddy also sets up HTTPS by itself when WEB_DOMAIN is filled in (frontend/caddy/Caddyfile).
  web:
    image: ${IMAGE_REGISTRY:?fill in IMAGE_REGISTRY in .env}/mini-smart-home-web:1.3.0
    build:
      context: ./frontend
      args:
        # the API address is built into the JavaScript at build time; it must equal the handle_path prefix in frontend/caddy/Caddyfile
        VITE_API_BASE: /api
    environment:
      # Module 27: read by the Caddyfile. Empty in .env = ":80": HTTP only on port 80 for any address (Module 26, and the free-path
      # Pi behind Cloudflare Tunnel). Filled in = Caddy asks Let's Encrypt for a certificate for that name, opens HTTPS 443,
      # redirects http:// to https://, and renews it by itself. MQTT_DOMAIN: the certificate for the broker (8883).
      # (":80" is written here, not in the Caddyfile: Caddy only uses its fallback when the variable DOESN'T EXIST, while an
      # empty "WEB_DOMAIN=" line in .env still reaches Caddy as empty text.)
      WEB_DOMAIN: ${WEB_DOMAIN:-:80}
      MQTT_DOMAIN: ${MQTT_DOMAIN:-}
      # Module 27, the free path only: the proxy Caddy trusts (cloudflared in this hallway), see .env.example
      CADDY_TRUSTED_PROXIES: ${CADDY_TRUSTED_PROXIES:-}
    volumes:
      # The Caddyfile is mounted as a FOLDER (not a single file), so that new content is read after the editor saves the file.
      - ./frontend/caddy:/etc/caddy:ro
      # Module 27: Caddy's cupboard (belongs to Compose) = the Let's Encrypt account key + the certificates + their keys. It MUST
      # last: lost = asking Let's Encrypt again (a limit of 5 identical certificates per week). Don't "down -v".
      - caddy-data:/data
      - caddy-config:/config
    ports:
      # the default 127.0.0.1 = this machine only. Phone mode (laptop): WEB_ADDRESS=0.0.0.0 and the laptop's IP in CORS_ORIGIN.
      # VPS: WEB_ADDRESS=0.0.0.0, because Let's Encrypt and visitors must be able to knock on 80 and 443 from the internet. 0.0.0.0 =
      # IPv4 only: make a DNS A record, not AAAA (IPv6).
      - "${WEB_ADDRESS:-127.0.0.1}:${PORT_WEB:-80}:80"
      # Module 27: HTTPS (TCP) and HTTP/3 (UDP, advertised by Caddy itself). Not used on a laptop without a domain.
      - "${WEB_ADDRESS:-127.0.0.1}:${PORT_HTTPS:-443}:443"
      - "${WEB_ADDRESS:-127.0.0.1}:${PORT_HTTPS:-443}:443/udp"
    # Module 27: web does NOT wait for the backend anymore. Mosquitto waits for the certificate copy (mqtt-certificate), the copy waits
    # for the certificate from Caddy; if Caddy waited for the backend (which waits for Mosquitto), they'd all wait for each other forever.
    # The effect is small: for the first few seconds after "up", /api is answered with 502 until the backend is ready.
    restart: unless-stopped
    logging: *log

  # One-off: the read-only database account grafana_reader (grafana/grafana-user.sql) if it doesn't exist yet, then its password
  # is synced with GRAFANA_READER_PASSWORD in .env. This container only uses psql from the database image, not its database.
  grafana-account:
    image: timescale/timescaledb:2.30.2-pg17
    environment:
      PGHOST: db
      PGUSER: postgres
      PGDATABASE: smarthome
      PGPASSWORD: ${POSTGRES_PASSWORD:?fill in POSTGRES_PASSWORD in .env}
      GRAFANA_READER_PASSWORD: ${GRAFANA_READER_PASSWORD:?fill in GRAFANA_READER_PASSWORD in .env}
    # $$ = a $ sign for sh; the password is sent through a psql variable (:'password'), never written in a file or on the screen
    command:
      - sh
      - -c
      - |
        set -e
        if [ "$$(psql -tAc "SELECT 1 FROM pg_roles WHERE rolname = 'grafana_reader'")" = "1" ]; then
          echo "account grafana_reader already exists: skipped"
        else
          psql -v ON_ERROR_STOP=1 -f /grafana/grafana-user.sql
        fi
        echo "ALTER ROLE grafana_reader PASSWORD :'password';" | psql -v ON_ERROR_STOP=1 -v password="$$GRAFANA_READER_PASSWORD"
        echo "grafana_reader password synced with GRAFANA_READER_PASSWORD in .env"
    volumes:
      - ./grafana:/grafana:ro
    # The database image declares its data folder as a cupboard, while this container only uses psql: tmpfs, so that
    # there's no nameless cupboard every time this container is recreated (the history stays in the db service's cupboard).
    tmpfs:
      - /var/lib/postgresql/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    logging: *log

  # Grafana 13.2.4 (Module 25), the same smarthome-grafana-data cupboard. The data source, the dashboard, the "Silent node" rule, and
  # the Telegram contact point are installed from the grafana/provisioning files (Module 26): shown "Provisioned", changed through files.
  grafana:
    image: grafana/grafana:13.2.4
    environment:
      # exactly the Module 25 settings: no plugin download at the first start, no statistics/snapshots/public dashboards sent out
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_PUBLIC_DASHBOARDS_ENABLED: "false"
      # only used while the Grafana cupboard is still empty; the Module 25 cupboard keeps your old admin password
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?fill in GRAFANA_ADMIN_PASSWORD in .env}
      # Module 27: the Grafana address visitors see, used for links (for example in the Telegram alert messages). Empty =
      # Grafana's default (http://localhost:3000/, as in Modules 25-26). VPS: https://iot.yourname.my.id/grafana/ = Grafana
      # opened through Caddy HTTPS under /grafana/ (frontend/caddy/Caddyfile). SERVE_FROM_SUB_PATH = Grafana itself
      # serves that /grafana/ path; without a path in its address (laptop), Grafana stays at / as usual.
      GF_SERVER_ROOT_URL: ${GRAFANA_URL:-%(protocol)s://%(domain)s:%(http_port)s/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # read by the provisioning files ($GRAFANA_READER_PASSWORD, $TELEGRAM_BOT_TOKEN, $TELEGRAM_CHAT_ID)
      GRAFANA_READER_PASSWORD: ${GRAFANA_READER_PASSWORD:?fill in GRAFANA_READER_PASSWORD in .env}
      # Telegram is optional, but a contact point without a token makes Grafana fail to start (over and over). "not-set-yet"
      # and 0 = Grafana still starts; alerts are still recorded, only sending them to Telegram fails.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-not-set-yet}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-0}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      # 127.0.0.1 on a VPS too: from the laptop through an SSH tunnel (ssh -L 3000:127.0.0.1:3000), visitors through Caddy /grafana/
      - "127.0.0.1:${PORT_GRAFANA:-3000}:3000"
    depends_on:
      grafana-account:
        condition: service_completed_successfully
    healthcheck:
      # the Grafana image has curl; /api/health answers "database": "ok" when Grafana is ready. -L: with an address ending in /grafana/,
      # Grafana redirects /api/health to /grafana/api/health
      test: ["CMD", "curl", "-fsSL", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    restart: unless-stopped
    logging: *log

  # Module 27, the free path (everything on the Pi): the Cloudflare tunnel brings visitors from https://iot.yourname.my.id to Caddy
  # (http://web:80 in this hallway) through an OUTGOING connection from the Pi, with no open counter on the router. Needs TUNNEL_TOKEN
  # (from the Cloudflare dashboard, secret) in .env. The profile "tunnel" = doesn't start until it's named:
  #   COMPOSE_PROFILES=tunnel in .env, or: docker compose --profile tunnel up -d
  # In Module 26 this service was written in edge/compose.edge.yml; moved here because it must share a hallway with web.
  # The main path (VPS) doesn't use it. The MQTT broker does NOT go through this tunnel (HTTP and WebSocket only).
  cloudflared:
    image: cloudflare/cloudflared:2026.10.5
    profiles: ["tunnel"]
    # the image's starting program is already "cloudflared --no-autoupdate"; this is what follows it
    command: ["tunnel", "run"]
    environment:
      # Without a token, cloudflared stops and is started again over and over (Restarting). "not-set-yet" makes its message clear:
      # docker compose logs cloudflared -> "Provided Tunnel token is not valid." (fill in TUNNEL_TOKEN in .env). The ":?" sign
      # (must be filled in) can't be used here: Compose checks it even when the tunnel profile isn't switched on.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-not-set-yet}
    restart: unless-stopped
    logging: *log

  # Uptime Kuma (set up in Module 30). The "monitoring" profile: it does NOT start with a plain "docker compose up -d";
  # start it with: docker compose --profile monitoring up -d
  # stop it with:  docker compose --profile monitoring down   (without --profile, Uptime Kuma keeps running)
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.8-slim
    profiles: ["monitoring"]
    volumes:
      - kuma-data:/app/data
    ports:
      - "127.0.0.1:${PORT_KUMA:-3001}:3001"
    restart: unless-stopped
    logging: *log

volumes:
  # The history cupboards belong to YOU, not to Compose ("external"): Compose never creates or deletes them, not even
  # with "down -v". A new machine (a new laptop, a VPS, a Pi) creates them once: docker volume create smarthome-data (and
  # smarthome-grafana-data).
  db-data:
    external: true
    name: ${DB_VOLUME:-smarthome-data}
  grafana-data:
    external: true
    name: ${GRAFANA_VOLUME:-smarthome-grafana-data}
  # Compose's cupboards (made by itself, deleted by "down -v"): the broker password file + retained messages, the Uptime Kuma data,
  # and (Module 27) Caddy's cupboard (the Let's Encrypt account + certificates) and the copy of the broker certificate.
  broker-data:
  kuma-data:
  caddy-data:
  caddy-config:
  certificate-data:
