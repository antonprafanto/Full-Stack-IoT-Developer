<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<rect width="1200" height="640" fill="#fffdf7"/>
<text x="600.0" y="44.0" font-size="28" font-weight="800" fill="#1e2a4a" text-anchor="middle" >Node 1 becomes the second board's current meter</text>
<text x="600.0" y="76.0" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" >The INA219 sits in the second board's 5 V wire and is read by the Node 1 board over I2C</text>
<rect x="36.0" y="110.0" width="300.0" height="300.0" rx="12" fill="#eef1f5" stroke="#e0dcd2" stroke-width="1.4" />
<text x="186.0" y="140.0" font-size="17" font-weight="800" fill="#1e2a4a" text-anchor="middle" >Node 1 board</text>
<text x="186.0" y="162.0" font-size="13" font-weight="600" fill="#4a5568" text-anchor="middle" >on the laptop's USB, MB102 off</text>
<rect x="86.0" y="184.0" width="200.0" height="92.0" rx="6" fill="#1f3b57" stroke="#0f2236" stroke-width="1.6" />
<text x="186.0" y="222.0" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle" >ESP32</text>
<text x="186.0" y="246.0" font-size="12.5" font-weight="700" fill="#cfe8ff" text-anchor="middle" font-family="'DejaVu Sans Mono', Consolas, monospace" >module09_current_meter</text>
<text x="186.0" y="304.0" font-size="13" font-weight="700" fill="#4a5568" text-anchor="middle" >Serial Monitor:</text>
<text x="186.0" y="324.0" font-size="13" font-weight="600" fill="#1e2a4a" text-anchor="middle" >the current every second +</text>
<text x="186.0" y="344.0" font-size="13" font-weight="600" fill="#1e2a4a" text-anchor="middle" >a summary every cycle</text>
<line x1="286.0" y1="200.0" x2="470.0" y2="200.0" stroke="#2f6fd1" stroke-width="3" stroke-linecap="round" />
<text x="300.0" y="195.0" font-size="11.5" font-weight="700" fill="#2f6fd1" text-anchor="start" >SDA (D21)</text>
<line x1="286.0" y1="222.0" x2="470.0" y2="222.0" stroke="#c9a400" stroke-width="3" stroke-linecap="round" />
<text x="300.0" y="217.0" font-size="11.5" font-weight="700" fill="#c9a400" text-anchor="start" >SCL (D22)</text>
