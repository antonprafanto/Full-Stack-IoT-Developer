<text x="646.0" y="320.0" font-size="14" font-weight="800" fill="#1e2a4a" text-anchor="middle" >0.1 Ω</text>
<text x="646.0" y="350.0" font-size="11.5" font-weight="700" fill="#e6dcf5" text-anchor="middle" >shunt resistor</text>
<line x1="540.0" y1="272.0" x2="540.0" y2="316.0" stroke="#e6dcf5" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="4 3" />
