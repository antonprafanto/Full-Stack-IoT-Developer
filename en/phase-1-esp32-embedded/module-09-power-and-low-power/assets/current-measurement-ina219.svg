<text x="1010.0" y="360.0" font-size="13" font-weight="600" fill="#1e2a4a" text-anchor="middle" >awake 1 second, asleep 30 seconds</text>
<text x="1010.0" y="384.0" font-size="13" font-weight="600" fill="#4a5568" text-anchor="middle" >its USB unplugged</text>
<line x1="820.0" y1="315.0" x2="856.0" y2="315.0" stroke="#b45f17" stroke-width="3" stroke-linecap="round" />
<path d="M848.1 319.2 L856.0 315.0 L848.1 310.8" fill="none" stroke="#b45f17" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
<line x1="345.0" y1="490.0" x2="345.0" y2="520.0" stroke="#262626" stroke-width="3" stroke-linecap="round" />
<line x1="1010.0" y1="410.0" x2="1010.0" y2="520.0" stroke="#262626" stroke-width="3" stroke-linecap="round" />
<line x1="160.0" y1="520.0" x2="1010.0" y2="520.0" stroke="#262626" stroke-width="3" stroke-linecap="round" />
<line x1="160.0" y1="410.0" x2="160.0" y2="520.0" stroke="#262626" stroke-width="3" stroke-linecap="round" />
<text x="585.0" y="542.0" font-size="13.5" font-weight="800" fill="#262626" text-anchor="middle" >Shared GND: the GNDs of Node 1, the INA219, the battery circuit, and the second board are joined</text>
<rect x="36.0" y="560.0" width="1128.0" height="52.0" rx="12" fill="#ffffff" stroke="#e0dcd2" stroke-width="1.2" />
<text x="600.0" y="592.0" font-size="14" font-weight="700" fill="#1e2a4a" text-anchor="middle" >Ohm's law: current = voltage across the resistor ÷ 0.1 Ω  ·  example: 10 mA gives only 1 mV, enough for the INA219 to read</text>
