<text x="418.0" y="305.0" font-size="13" font-weight="800" fill="#b45f17" text-anchor="start" >VIN+</text>
<rect x="240.0" y="420.0" width="210.0" height="70.0" rx="8" fill="#fdeedd" stroke="#b45f17" stroke-width="1.8" />
<text x="345.0" y="448.0" font-size="15" font-weight="800" fill="#1e2a4a" text-anchor="middle" >MT3608: 5.0 V</text>
<text x="345.0" y="470.0" font-size="12.5" font-weight="600" fill="#4a5568" text-anchor="middle" >from the 18650 battery</text>
<path d="M345 420 L345 315 L410 315" fill="none" stroke="#b45f17" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
<line x1="372.0" y1="315.0" x2="400.0" y2="315.0" stroke="#b45f17" stroke-width="3" stroke-linecap="round" />
<path d="M392.1 319.2 L400.0 315.0 L392.1 310.8" fill="none" stroke="#b45f17" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
<rect x="860.0" y="250.0" width="300.0" height="160.0" rx="12" fill="#e2f3f1" stroke="#0f8b8d" stroke-width="2" />
<text x="1010.0" y="282.0" font-size="17" font-weight="800" fill="#1e2a4a" text-anchor="middle" >Second board</text>
