<text x="300.0" y="261.0" font-size="11.5" font-weight="700" fill="#262626" text-anchor="start" >GND</text>
<rect x="470.0" y="170.0" width="260.0" height="210.0" rx="8" fill="#5b3a9a" stroke="#3d2570" stroke-width="1.8" />
<text x="600.0" y="198.0" font-size="17" font-weight="800" fill="#ffffff" text-anchor="middle" >INA219</text>
<text x="600.0" y="218.0" font-size="12.5" font-weight="700" fill="#e6dcf5" text-anchor="middle" font-family="'DejaVu Sans Mono', Consolas, monospace" >address 0x40</text>
<rect x="512.0" y="238.0" width="52.0" height="34.0" rx="3" fill="#222" stroke="#000" stroke-width="1" />
<text x="538.0" y="259.0" font-size="11.5" font-weight="700" fill="#dddddd" text-anchor="middle" >chip</text>
