<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<rect width="1200" height="680" fill="#fffdf7"/>
<text x="600.0" y="44.0" font-size="28" font-weight="800" fill="#1e2a4a" text-anchor="middle" >Honest about the DevKit V1: the chip sleeps, the board doesn't</text>
<text x="600.0" y="76.0" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" >ESP32 chip in deep sleep: about 0.01 mA · similar development boards measured about 4–5 mA · clone boards can draw more</text>
<rect x="36.0" y="100.0" width="520.0" height="400.0" rx="12" fill="#ffffff" stroke="#e0dcd2" stroke-width="1.5" />
<text x="296.0" y="130.0" font-size="15" font-weight="800" fill="#1e2a4a" text-anchor="middle" >What keeps drawing current while the chip sleeps</text>
<rect x="96.0" y="160.0" width="400.0" height="200.0" rx="10" fill="#1f3b57" stroke="#0f2236" stroke-width="2" />
<rect x="76.0" y="238.0" width="34.0" height="44.0" rx="3" fill="#b8c0cc" stroke="#6b7585" stroke-width="1.4" />
<rect x="326.0" y="190.0" width="150.0" height="140.0" rx="4" fill="#c9ced6" stroke="#8a93a1" stroke-width="1.4" />
<text x="401.0" y="256.0" font-size="15" font-weight="800" fill="#3b4656" text-anchor="middle" >ESP32</text>
<text x="401.0" y="276.0" font-size="13" font-weight="800" fill="#0f8b8d" text-anchor="middle" >asleep</text>
<rect x="136.0" y="186.0" width="54.0" height="34.0" rx="3" fill="#2b2b2b" />
<text x="163.0" y="207.0" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle" >AMS1117</text>
<rect x="136.0" y="292.0" width="54.0" height="40.0" rx="3" fill="#2b2b2b" />
<text x="163.0" y="316.0" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle" >CP2102</text>
<circle cx="246.0" cy="200.0" r="9" fill="#ff5a5a" stroke="#a32020" stroke-width="1.4" />
<circle cx="163.0" cy="186.0" r="12" fill="#b45f17" stroke="#ffffff" stroke-width="2" />
<text x="163.0" y="190.7" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >1</text>
<circle cx="274.0" cy="200.0" r="12" fill="#b45f17" stroke="#ffffff" stroke-width="2" />
<text x="274.0" y="204.7" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >2</text>
<circle cx="163.0" cy="332.0" r="12" fill="#b45f17" stroke="#ffffff" stroke-width="2" />
<text x="163.0" y="336.7" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >3</text>
<circle cx="401.0" cy="190.0" r="12" fill="#0f8b8d" stroke="#ffffff" stroke-width="2" />
<text x="401.0" y="194.7" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >4</text>
<circle cx="70.0" cy="391.0" r="11" fill="#b45f17" stroke="#ffffff" stroke-width="2" />
<text x="70.0" y="395.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >1</text>
<text x="88.0" y="396.0" font-size="12.5" font-weight="800" fill="#1e2a4a" text-anchor="start" >AMS1117 regulator</text>
<text x="276.0" y="396.0" font-size="12.5" font-weight="500" fill="#4a5568" text-anchor="start" >a few mA (its "running money")</text>
<circle cx="70.0" cy="417.0" r="11" fill="#b45f17" stroke="#ffffff" stroke-width="2" />
<text x="70.0" y="421.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >2</text>
<text x="88.0" y="422.0" font-size="12.5" font-weight="800" fill="#1e2a4a" text-anchor="start" >red power LED</text>
<text x="276.0" y="422.0" font-size="12.5" font-weight="500" fill="#4a5568" text-anchor="start" >1.3–1.5 mA, always on</text>
<circle cx="70.0" cy="443.0" r="11" fill="#b45f17" stroke="#ffffff" stroke-width="2" />
<text x="70.0" y="447.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >3</text>
<text x="88.0" y="448.0" font-size="12.5" font-weight="800" fill="#1e2a4a" text-anchor="start" >CP2102 USB-serial chip</text>
<text x="276.0" y="448.0" font-size="12.5" font-weight="500" fill="#4a5568" text-anchor="start" >stays on, fed by the 3.3 V line</text>
<circle cx="70.0" cy="469.0" r="11" fill="#0f8b8d" stroke="#ffffff" stroke-width="2" />
<text x="70.0" y="473.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >4</text>
<text x="88.0" y="474.0" font-size="12.5" font-weight="800" fill="#1e2a4a" text-anchor="start" >ESP32 chip</text>
<text x="276.0" y="474.0" font-size="12.5" font-weight="500" fill="#4a5568" text-anchor="start" >about 0.01 mA: the only part that sleeps</text>
<rect x="576.0" y="100.0" width="588.0" height="400.0" rx="12" fill="#ffffff" stroke="#e0dcd2" stroke-width="1.5" />
<text x="870.0" y="130.0" font-size="15" font-weight="800" fill="#1e2a4a" text-anchor="middle" >Life of a 2,500 mAh battery (2,000 mAh usable)</text>
<text x="870.0" y="150.0" font-size="12.5" font-weight="600" fill="#4a5568" text-anchor="middle" >awake 1 second (55 mA), then asleep at the board's sleep current</text>
<text x="870.0" y="168.0" font-size="12.5" font-weight="600" fill="#4a5568" text-anchor="middle" >DevKit V1: 5 mA, through the MT3608 · low-power board: 0.01 mA, efficient regulator</text>
<text x="640.0" y="200.0" font-size="13" font-weight="700" fill="#1e2a4a" text-anchor="start" >DevKit V1, sleeping 30 seconds</text>
<rect x="640.0" y="208.0" width="60.6" height="20.0" rx="4" fill="#b45f17" />
<text x="708.6" y="223.0" font-size="12.5" font-weight="800" fill="#b45f17" text-anchor="start" >≈ 8 days</text>
<text x="640.0" y="256.0" font-size="13" font-weight="700" fill="#1e2a4a" text-anchor="start" >DevKit V1, sleeping 5 minutes</text>
<rect x="640.0" y="264.0" width="77.4" height="20.0" rx="4" fill="#b45f17" />
<text x="725.4" y="279.0" font-size="12.5" font-weight="800" fill="#b45f17" text-anchor="start" >≈ 10 days</text>
<text x="640.0" y="312.0" font-size="13" font-weight="700" fill="#1e2a4a" text-anchor="start" >DevKit V1, never waking up</text>
<rect x="640.0" y="320.0" width="79.7" height="20.0" rx="4" fill="#b45f17" />
<text x="727.7" y="335.0" font-size="12.5" font-weight="800" fill="#b45f17" text-anchor="start" >about 10 days at most</text>
<text x="640.0" y="368.0" font-size="13" font-weight="700" fill="#1e2a4a" text-anchor="start" >low-power board, sleeping 30 seconds</text>
<rect x="640.0" y="376.0" width="358.0" height="20.0" rx="4" fill="#0f8b8d" />
<text x="990.0" y="391.0" font-size="12.5" font-weight="800" fill="#ffffff" text-anchor="end" >≈ 47 days</text>
<text x="640.0" y="424.0" font-size="13" font-weight="700" fill="#1e2a4a" text-anchor="start" >low-power board, sleeping 5 minutes</text>
<rect x="640.0" y="432.0" width="460.0" height="20.0" rx="4" fill="#0f8b8d" />
<text x="1092.0" y="447.0" font-size="12.5" font-weight="800" fill="#ffffff" text-anchor="end" >months →</text>
<text x="640.0" y="488.0" font-size="11" font-weight="600" fill="#4a5568" text-anchor="middle" >0 days</text>
<text x="870.0" y="488.0" font-size="11" font-weight="600" fill="#4a5568" text-anchor="middle" >30 days</text>
<text x="1100.0" y="488.0" font-size="11" font-weight="600" fill="#4a5568" text-anchor="middle" >60 days</text>
<rect x="36.0" y="520.0" width="1128.0" height="128.0" rx="12" fill="#f4f6f9" stroke="#e0dcd2" stroke-width="1.2" />
<text x="60.0" y="552.0" font-size="15" font-weight="800" fill="#1e2a4a" text-anchor="start" >What it means</text>
<text x="60.0" y="580.0" font-size="13.5" font-weight="600" fill="#4a5568" text-anchor="start" >• For a DevKit V1 board, sleeping longer helps only a little: the board's sleep current sets the limit on battery life.</text>
<text x="60.0" y="602.0" font-size="13.5" font-weight="600" fill="#4a5568" text-anchor="start" >• For this curriculum, a few days is enough: Node 2 is recharged through the TP4056's USB port.</text>
<text x="60.0" y="624.0" font-size="13.5" font-weight="600" fill="#4a5568" text-anchor="start" >• Low-power board: an efficient regulator straight from the battery, no always-on LED, and its USB chip switches off too (🔬).</text>
<text x="1178.0" y="666.0" font-size="12" font-weight="400" fill="#8a8f9c" text-anchor="end" >Fullstack IoT Developer curriculum · CC BY 4.0</text>
</svg>
