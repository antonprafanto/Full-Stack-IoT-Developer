<text x="56.0" y="126.0" font-size="15" font-weight="800" fill="#1e2a4a" text-anchor="start" >The second board's current on the 5 V side, two wake–sleep cycles (widths not to scale)</text>
<line x1="110.0" y1="352.0" x2="770.0" y2="352.0" stroke="#4a5568" stroke-width="1.5" stroke-linecap="round" />
