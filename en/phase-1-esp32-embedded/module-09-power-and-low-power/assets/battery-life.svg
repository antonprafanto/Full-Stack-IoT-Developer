<text x="101.0" y="326.0" font-size="11.5" font-weight="600" fill="#4a5568" text-anchor="end" >10</text>
<line x1="105.0" y1="292.0" x2="110.0" y2="292.0" stroke="#4a5568" stroke-width="1.2" stroke-linecap="round" />
<text x="101.0" y="296.0" font-size="11.5" font-weight="600" fill="#4a5568" text-anchor="end" >20</text>
<line x1="105.0" y1="262.0" x2="110.0" y2="262.0" stroke="#4a5568" stroke-width="1.2" stroke-linecap="round" />
