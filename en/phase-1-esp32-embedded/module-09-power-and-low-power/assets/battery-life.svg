<text x="800.0" y="168.0" font-size="15" font-weight="800" fill="#1e2a4a" text-anchor="start" >One cycle = 31 seconds</text>
<rect x="800.0" y="184.0" width="22.0" height="16.0" rx="3" fill="#b45f17" />
<text x="832.0" y="197.0" font-size="14" font-weight="700" fill="#1e2a4a" text-anchor="start" >awake: 55 mA × 1.0 seconds = 55</text>
<rect x="800.0" y="214.0" width="22.0" height="16.0" rx="3" fill="#cfe9f3" stroke="#0f8b8d" stroke-width="1" />
<text x="832.0" y="227.0" font-size="14" font-weight="700" fill="#1e2a4a" text-anchor="start" >asleep: 5 mA × 30 seconds = 150</text>
<text x="800.0" y="254.0" font-size="13.5" font-weight="600" fill="#4a5568" text-anchor="start" >total: 205 (the unit is mA·s)</text>
<rect x="800.0" y="272.0" width="340.0" height="30.0" rx="6" fill="#cfe9f3" stroke="#0f8b8d" stroke-width="1.2" />
<rect x="800.0" y="272.0" width="91.2" height="30.0" rx="6" fill="#b45f17" />
<text x="901.2" y="292.0" font-size="14" font-weight="800" fill="#0f8b8d" text-anchor="start" >sleep accounts for 73%</text>
<text x="800.0" y="330.0" font-size="14" font-weight="700" fill="#b45f17" text-anchor="start" >The "small" sleep current actually</text>
<text x="800.0" y="350.0" font-size="14" font-weight="700" fill="#b45f17" text-anchor="start" >uses up most of the battery.</text>
<rect x="36.0" y="424.0" width="258.0" height="150.0" rx="12" fill="#ffffff" stroke="#e0dcd2" stroke-width="1.4" />
<circle cx="62.0" cy="452.0" r="13" fill="#0f8b8d" stroke="#ffffff" stroke-width="2" />
<text x="62.0" y="457.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" >1</text>
<text x="84.0" y="458.0" font-size="15" font-weight="800" fill="#1e2a4a" text-anchor="start" >Average on the 5 V side</text>
<text x="58.0" y="506.0" font-size="15" font-weight="700" fill="#1e2a4a" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">(55 + 150) ÷ 31</text>
<text x="58.0" y="536.0" font-size="15" font-weight="800" fill="#0f8b8d" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">≈ 6.6 mA</text>
<line x1="299.0" y1="499.0" x2="321.0" y2="499.0" stroke="#4a5568" stroke-width="2.2" stroke-linecap="round" />
<path d="M313.9 502.8 L321.0 499.0 L313.9 495.2" fill="none" stroke="#4a5568" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
<rect x="326.0" y="424.0" width="258.0" height="150.0" rx="12" fill="#ffffff" stroke="#e0dcd2" stroke-width="1.4" />
<circle cx="352.0" cy="452.0" r="13" fill="#0f8b8d" stroke="#ffffff" stroke-width="2" />
<text x="352.0" y="457.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" >2</text>
<text x="374.0" y="458.0" font-size="15" font-weight="800" fill="#1e2a4a" text-anchor="start" >Move to the battery side</text>
<text x="348.0" y="506.0" font-size="15" font-weight="700" fill="#1e2a4a" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">6.6 × 1.6</text>
<text x="348.0" y="536.0" font-size="15" font-weight="800" fill="#0f8b8d" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">≈ 10.6 mA</text>
<line x1="589.0" y1="499.0" x2="611.0" y2="499.0" stroke="#4a5568" stroke-width="2.2" stroke-linecap="round" />
<path d="M603.9 502.8 L611.0 499.0 L603.9 495.2" fill="none" stroke="#4a5568" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
<rect x="616.0" y="424.0" width="258.0" height="150.0" rx="12" fill="#ffffff" stroke="#e0dcd2" stroke-width="1.4" />
<circle cx="642.0" cy="452.0" r="13" fill="#0f8b8d" stroke="#ffffff" stroke-width="2" />
<text x="642.0" y="457.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" >3</text>
<text x="664.0" y="458.0" font-size="15" font-weight="800" fill="#1e2a4a" text-anchor="start" >Usable capacity</text>
<text x="638.0" y="506.0" font-size="15" font-weight="700" fill="#1e2a4a" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">2,500 mAh × 0.8</text>
<text x="638.0" y="536.0" font-size="15" font-weight="800" fill="#0f8b8d" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">= 2,000 mAh</text>
<line x1="879.0" y1="499.0" x2="901.0" y2="499.0" stroke="#4a5568" stroke-width="2.2" stroke-linecap="round" />
<path d="M893.9 502.8 L901.0 499.0 L893.9 495.2" fill="none" stroke="#4a5568" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
<rect x="906.0" y="424.0" width="258.0" height="150.0" rx="12" fill="#fdeedd" stroke="#b45f17" stroke-width="2" />
<circle cx="932.0" cy="452.0" r="13" fill="#b45f17" stroke="#ffffff" stroke-width="2" />
<text x="932.0" y="457.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" >4</text>
<text x="954.0" y="458.0" font-size="15" font-weight="800" fill="#1e2a4a" text-anchor="start" >Battery life</text>
<text x="928.0" y="506.0" font-size="15" font-weight="700" fill="#1e2a4a" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">2,000 ÷ 10.6 ≈ 189 hours</text>
<text x="928.0" y="536.0" font-size="17" font-weight="800" fill="#b45f17" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">≈ 7.9 days</text>
<text x="56.0" y="610.0" font-size="13.5" font-weight="600" fill="#4a5568" text-anchor="start" >• 1.6: the battery current is larger than the 5 V current (the MT3608 boosts the voltage, efficiency about 85%); the MT3608 itself draws about 1 mA more</text>
<text x="56.0" y="634.0" font-size="13.5" font-weight="600" fill="#4a5568" text-anchor="start" >• 0.8: the real capacity is smaller than the number printed on the battery</text>
