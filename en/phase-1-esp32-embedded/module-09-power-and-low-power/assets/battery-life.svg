<text x="282.0" y="325.0" font-size="12.5" font-weight="800" fill="#0f8b8d" text-anchor="middle" >asleep</text>
<line x1="110.0" y1="364.0" x2="150.0" y2="364.0" stroke="#b45f17" stroke-width="2" stroke-linecap="round" />
