<line x1="105.0" y1="202.0" x2="110.0" y2="202.0" stroke="#4a5568" stroke-width="1.2" stroke-linecap="round" />
<text x="101.0" y="206.0" font-size="11.5" font-weight="600" fill="#4a5568" text-anchor="end" >50</text>
<line x1="105.0" y1="172.0" x2="110.0" y2="172.0" stroke="#4a5568" stroke-width="1.2" stroke-linecap="round" />
<text x="101.0" y="176.0" font-size="11.5" font-weight="600" fill="#4a5568" text-anchor="end" >60</text>
<text x="118.0" y="168.0" font-size="12" font-weight="700" fill="#4a5568" text-anchor="start" >mA</text>
<text x="766.0" y="374.0" font-size="12" font-weight="700" fill="#4a5568" text-anchor="end" >time →</text>
<rect x="110.0" y="187.0" width="40.0" height="165.0" rx="0" fill="#b45f17" />
