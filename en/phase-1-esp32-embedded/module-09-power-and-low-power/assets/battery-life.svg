<text x="282.0" y="382.0" font-size="11.5" font-weight="700" fill="#0f8b8d" text-anchor="middle" >30 seconds</text>
<rect x="414.0" y="187.0" width="40.0" height="165.0" rx="0" fill="#b45f17" />
