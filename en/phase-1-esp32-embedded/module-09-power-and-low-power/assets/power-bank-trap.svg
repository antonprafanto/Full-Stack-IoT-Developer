<text x="600.0" y="44.0" font-size="28" font-weight="800" fill="#1e2a4a" text-anchor="middle" >The power bank trap: it switches itself off at low current</text>
<text x="600.0" y="76.0" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" >Example: an ESP32 board that wakes for 1 second, then sleeps for 30 seconds · the limit and timing vary between power banks</text>
