<text x="760.0" y="446.0" font-size="12" font-weight="700" fill="#0f8b8d" text-anchor="middle" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">28-AA-3C-91-0B-00-00-87</text>
<line x1="1000.0" y1="250.0" x2="1000.0" y2="330.0" stroke="#7b4fb0" stroke-width="3.5" stroke-linecap="round" />
