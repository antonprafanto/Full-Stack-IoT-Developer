<rect x="398.0" y="484.0" width="34.0" height="32.0" rx="6" fill="#7b4fb0" />
<text x="404.0" y="507.0" font-size="17" font-weight="800" fill="#ffffff" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">28</text>
<text x="446.0" y="507.0" font-size="17" font-weight="800" fill="#1e2a4a" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">-FF-64-1E-0F-6A-D3-</text>
<text x="680.0" y="507.0" font-size="17" font-weight="800" fill="#b45f17" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">3C</text>
<text x="760.0" y="496.0" font-size="13" font-weight="700" fill="#7b4fb0" text-anchor="start" >28 = DS18B20 family code</text>
<text x="760.0" y="516.0" font-size="13" font-weight="700" fill="#4a5568" text-anchor="start" >6 middle pairs = serial number · 3C = check (CRC)</text>
<rect x="60.0" y="400.0" width="290.0" height="130.0" rx="12" fill="#e3ecfa" />
<text x="76.0" y="428.0" font-size="15" font-weight="800" fill="#2f6fd1" text-anchor="start" >How to read:</text>
<text x="76.0" y="454.0" font-size="13.5" font-weight="800" fill="#1e2a4a" text-anchor="start" >1. requestTemperatures():</text>
<text x="92.0" y="474.0" font-size="13" font-weight="600" fill="#4a5568" text-anchor="start" >all measure at the same time (≤ 750 ms)</text>
<text x="76.0" y="498.0" font-size="13.5" font-weight="800" fill="#1e2a4a" text-anchor="start" >2. getTempC(serial number):</text>
<text x="92.0" y="518.0" font-size="13" font-weight="600" fill="#4a5568" text-anchor="start" >asked one by one</text>
<rect x="60.0" y="560.0" width="1100.0" height="70.0" rx="12" fill="#fde2e4" />
<text x="80.0" y="590.0" font-size="15" font-weight="800" fill="#e63946" text-anchor="start" >Two "lying" numbers:</text>
<text x="260.0" y="590.0" font-size="14" font-weight="700" fill="#1e2a4a" text-anchor="start" >85.00 °C = the built-in value of a sensor that has just powered up; library 4.0.6 usually reports it as −127</text>
<text x="260.0" y="614.0" font-size="14" font-weight="700" fill="#1e2a4a" text-anchor="start" >−127 °C = the reading can't be trusted: loose wire, no pull-up, broken, or the sensor just restarted</text>
<text x="1178.0" y="646.0" font-size="12" font-weight="400" fill="#8a8f9c" text-anchor="end" >Fullstack IoT Developer curriculum · CC BY 4.0</text>
</svg>
