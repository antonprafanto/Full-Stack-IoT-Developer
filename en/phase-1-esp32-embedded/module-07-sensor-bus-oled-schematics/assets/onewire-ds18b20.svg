<text x="600.0" y="76.0" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" >Every DS18B20 has a 64-bit factory serial number · a 4.7 kΩ pull-up resistor brings the wire back to 3.3 V</text>
