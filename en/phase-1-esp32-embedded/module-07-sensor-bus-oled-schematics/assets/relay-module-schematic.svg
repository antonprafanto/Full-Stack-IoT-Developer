<circle cx="54.0" cy="731.0" r="13" fill="#e63946" stroke="#ffffff" stroke-width="2" />
<text x="54.0" y="735.7" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >1</text>
<text x="76.0" y="736.0" font-size="13.5" font-weight="600" fill="#1e2a4a" text-anchor="start" >IN pulled down to 0 V (LOW) → current flows: VCC → R1 → LED1 → the LED in U1 → IN. That's why the module is active LOW.</text>
<circle cx="54.0" cy="753.0" r="13" fill="#e63946" stroke="#ffffff" stroke-width="2" />
<text x="54.0" y="757.7" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >2</text>
<text x="76.0" y="758.0" font-size="13.5" font-weight="600" fill="#1e2a4a" text-anchor="start" >U1 (optocoupler): the command crosses over by light; the IN pin isn't wired directly to the coil side.</text>
<circle cx="54.0" cy="775.0" r="13" fill="#e63946" stroke="#ffffff" stroke-width="2" />
<text x="54.0" y="779.7" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >3</text>
<text x="76.0" y="780.0" font-size="13.5" font-weight="600" fill="#1e2a4a" text-anchor="start" >D1 (flyback diode): absorbs the voltage kick when the coil is switched off, so Q1 isn't damaged.</text>
<circle cx="54.0" cy="797.0" r="13" fill="#e63946" stroke="#ffffff" stroke-width="2" />
<text x="54.0" y="801.7" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >4</text>
<text x="76.0" y="802.0" font-size="13.5" font-weight="600" fill="#1e2a4a" text-anchor="start" >Contacts: with no current in the coil, COM connects to NC (as drawn); when the coil is magnetized, COM moves to NO.</text>
<circle cx="54.0" cy="819.0" r="13" fill="#e63946" stroke="#ffffff" stroke-width="2" />
<text x="54.0" y="823.7" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >5</text>
<text x="76.0" y="824.0" font-size="13.5" font-weight="600" fill="#1e2a4a" text-anchor="start" >JD-VCC jumper: connects the coil power to VCC. If it's removed, LED1 still lights up when IN is LOW, but the relay doesn't click.</text>
<text x="1178.0" y="846.0" font-size="11.5" font-weight="400" fill="#8a8f9c" text-anchor="end" >Fullstack IoT Developer curriculum · CC BY 4.0 · simplified drawing</text>
