<text x="800.0" y="140.0" font-size="15" font-weight="800" fill="#1e2a4a" text-anchor="start" >Module 5–6 fixed pins (private roads)</text>
<text x="800.0" y="172.0" font-size="13.5" font-weight="600" fill="#1e2a4a" text-anchor="start" >sensors: D14 DHT22 · VP LDR · VN soil</text>
<text x="800.0" y="200.0" font-size="13.5" font-weight="600" fill="#1e2a4a" text-anchor="start" >D34 PIR · D15/D35 HC-SR04</text>
<text x="800.0" y="228.0" font-size="13.5" font-weight="600" fill="#1e2a4a" text-anchor="start" >actuators: D32/D33 relays · D25 pump</text>
<text x="800.0" y="256.0" font-size="13.5" font-weight="600" fill="#1e2a4a" text-anchor="start" >D26 servo · D27 buzzer · D4 LED · D13 button</text>
<line x1="780.0" y1="230.0" x2="730.0" y2="280.0" stroke="#1e2a4a" stroke-width="3" stroke-linecap="round" />
<rect x="60.0" y="550.0" width="1080.0" height="110.0" rx="12" fill="#ffffff" stroke="#e0dcd2" stroke-width="1.5" />
<text x="80.0" y="580.0" font-size="15" font-weight="800" fill="#1e2a4a" text-anchor="start" >To get along:</text>
<text x="80.0" y="610.0" font-size="14.5" font-weight="700" fill="#1e2a4a" text-anchor="start" >✓ unique I2C addresses on one bus</text>
<text x="600.0" y="610.0" font-size="14.5" font-weight="700" fill="#1e2a4a" text-anchor="start" >✓ every SPI device has its own CS</text>
<text x="80.0" y="638.0" font-size="14.5" font-weight="700" fill="#1e2a4a" text-anchor="start" >✓ all signals 3.3 V, all GNDs joined</text>
<text x="600.0" y="638.0" font-size="14.5" font-weight="700" fill="#1e2a4a" text-anchor="start" >✓ one pin, one job (PIN-MAP.md)</text>
<text x="1178.0" y="686.0" font-size="12" font-weight="400" fill="#8a8f9c" text-anchor="end" >Fullstack IoT Developer curriculum · CC BY 4.0</text>
