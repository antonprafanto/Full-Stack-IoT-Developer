<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<rect width="1200" height="470" fill="#fffdf7"/>
