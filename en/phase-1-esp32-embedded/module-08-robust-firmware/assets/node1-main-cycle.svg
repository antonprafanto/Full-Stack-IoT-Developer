<text x="352.0" y="392.0" font-size="12.5" font-weight="700" fill="#1e2a4a" text-anchor="middle" >analog sample every 2 ms</text>
<rect x="460.0" y="374.0" width="250.0" height="26.0" rx="13" fill="#ffffff" stroke="#e0dcd2" stroke-width="1.2" />
<text x="585.0" y="392.0" font-size="12.5" font-weight="700" fill="#1e2a4a" text-anchor="middle" >pump &amp; buzzer off right on time</text>
