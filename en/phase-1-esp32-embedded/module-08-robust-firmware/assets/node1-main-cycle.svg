<text x="600.0" y="76.0" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" >One step per pass of loop() · between the steps, the small tasks are still checked</text>
<rect x="60.0" y="110.0" width="240.0" height="120.0" rx="14" fill="#f5f7fa" stroke="#9aa3b0" stroke-width="1.8" />
<text x="180.0" y="148.0" font-size="18" font-weight="800" fill="#1e2a4a" text-anchor="middle" >IDLE</text>
<text x="180.0" y="176.0" font-size="13.5" font-weight="600" fill="#4a5568" text-anchor="middle" >2 seconds since</text>
<text x="180.0" y="196.0" font-size="13.5" font-weight="600" fill="#4a5568" text-anchor="middle" >the last reading?</text>
<rect x="340.0" y="110.0" width="240.0" height="120.0" rx="14" fill="#f5f7fa" stroke="#9aa3b0" stroke-width="1.8" />
<text x="460.0" y="148.0" font-size="18" font-weight="800" fill="#1e2a4a" text-anchor="middle" >READING</text>
<text x="460.0" y="176.0" font-size="13.5" font-weight="600" fill="#4a5568" text-anchor="middle" >readSensors()</text>
<text x="460.0" y="196.0" font-size="13.5" font-weight="600" fill="#4a5568" text-anchor="middle" >(about 70 ms at most)</text>
<rect x="620.0" y="110.0" width="240.0" height="120.0" rx="14" fill="#f5f7fa" stroke="#9aa3b0" stroke-width="1.8" />
<text x="740.0" y="148.0" font-size="18" font-weight="800" fill="#1e2a4a" text-anchor="middle" >DISPLAYING</text>
<text x="740.0" y="176.0" font-size="13.5" font-weight="600" fill="#4a5568" text-anchor="middle" >log, OLED display,</text>
<text x="740.0" y="196.0" font-size="13.5" font-weight="600" fill="#4a5568" text-anchor="middle" >CSV every 30 seconds</text>
<rect x="900.0" y="110.0" width="240.0" height="120.0" rx="14" fill="#f5f7fa" stroke="#9aa3b0" stroke-width="1.8" />
<text x="1020.0" y="148.0" font-size="18" font-weight="800" fill="#1e2a4a" text-anchor="middle" >ACTING</text>
<text x="1020.0" y="176.0" font-size="13.5" font-weight="600" fill="#4a5568" text-anchor="middle" >automatic rules,</text>
<text x="1020.0" y="196.0" font-size="13.5" font-weight="600" fill="#4a5568" text-anchor="middle" >sendData() (M10–11 shelf)</text>
