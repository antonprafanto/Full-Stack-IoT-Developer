<text x="640.0" y="130.0" font-size="18" font-weight="800" fill="#1e2a4a" text-anchor="start" >millis() in an unsigned long</text>
<text x="640.0" y="168.0" font-size="13.5" font-weight="700" fill="#4a5568" text-anchor="start" >lastTime (296 ms before the rollover)</text>
<text x="640.0" y="206.0" font-size="30" font-weight="700" fill="#1e2a4a" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">4294967000</text>
<text x="640.0" y="248.0" font-size="13.5" font-weight="700" fill="#4a5568" text-anchor="start" >now (704 ms after the rollover)</text>
<text x="640.0" y="286.0" font-size="30" font-weight="700" fill="#1e2a4a" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">704</text>
