<text x="108.0" y="534.0" font-size="16.5" font-weight="700" fill="#1e2a4a" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">if (millis() &gt;= lastTime + INTERVAL)</text>
<text x="1120.0" y="534.0" font-size="14" font-weight="700" fill="#e63946" text-anchor="end" >breaks once every 49.7 days: the addition overflows too</text>
