<path d="M79 466 L82.5 470 L89.5 461.5" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
<text x="108.0" y="472.0" font-size="16.5" font-weight="700" fill="#1e2a4a" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">if (now - lastTime &gt;= INTERVAL)</text>
<text x="1120.0" y="472.0" font-size="14" font-weight="700" fill="#2a9d5c" text-anchor="end" >safe forever, as long as INTERVAL &lt; 49.7 days</text>
<rect x="60.0" y="502.0" width="1080.0" height="52.0" rx="10" fill="#fde6e8" />
<circle cx="84.0" cy="528.0" r="11" fill="#e63946" />
