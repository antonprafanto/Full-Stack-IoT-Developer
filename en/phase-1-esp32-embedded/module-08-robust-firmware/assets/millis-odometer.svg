<text x="350.0" y="300.0" font-size="20" font-weight="800" fill="#2a9d5c" text-anchor="start" >= 500 km ✓</text>
<text x="60.0" y="372.0" font-size="14" font-weight="400" fill="#4a5568" text-anchor="start" >000300 − 999800, counted "across zero", is still 500.</text>
