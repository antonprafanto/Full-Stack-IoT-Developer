<text x="70.0" y="178.0" font-size="14" font-weight="400" fill="#1e2a4a" text-anchor="start" >frequency fixed at 5,000 Hz;</text>
<text x="70.0" y="198.0" font-size="14" font-weight="700" fill="#1e2a4a" text-anchor="start" >duty cycle changes</text>
