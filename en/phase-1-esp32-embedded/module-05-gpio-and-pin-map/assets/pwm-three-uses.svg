<text x="600.0" y="44.0" font-size="28" font-weight="800" fill="#1e2a4a" text-anchor="middle" >PWM: one technique, three uses</text>
<text x="600.0" y="76.0" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" >The pin blinks very fast between 3.3 V and 0 V. You set: how long it is on (duty cycle) and how fast it blinks (frequency).</text>
