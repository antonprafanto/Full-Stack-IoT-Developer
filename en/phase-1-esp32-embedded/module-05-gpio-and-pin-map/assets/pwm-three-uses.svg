<text x="70.0" y="438.0" font-size="14" font-weight="400" fill="#1e2a4a" text-anchor="start" >duty cycle fixed at 50%;</text>
<text x="70.0" y="458.0" font-size="14" font-weight="700" fill="#1e2a4a" text-anchor="start" >frequency = pitch</text>
