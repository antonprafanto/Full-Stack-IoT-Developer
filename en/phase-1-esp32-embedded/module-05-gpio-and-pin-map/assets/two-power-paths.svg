<text x="102.0" y="690.0" font-size="14" font-weight="400" fill="#1e2a4a" text-anchor="start" >from the ESP32 board's VIN or 3V3 pin</text>
<circle cx="446.0" cy="672.0" r="15" fill="#e63946" />
<path d="M441 667 L451 677 M451 667 L441 677" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
<text x="470.0" y="668.0" font-size="14.5" font-weight="700" fill="#1e2a4a" text-anchor="start" >A 5 V adapter in the MB102's barrel jack</text>
<text x="470.0" y="690.0" font-size="14" font-weight="400" fill="#1e2a4a" text-anchor="start" >(the barrel jack needs 6.5–12 V)</text>
<circle cx="814.0" cy="672.0" r="15" fill="#e63946" />
<path d="M809 667 L819 677 M819 667 L809 677" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
<text x="838.0" y="668.0" font-size="14.5" font-weight="700" fill="#1e2a4a" text-anchor="start" >The MB102's 5 V rail connected to the</text>
<text x="838.0" y="690.0" font-size="14" font-weight="400" fill="#1e2a4a" text-anchor="start" >ESP32's VIN or 3V3 pin</text>
<text x="64.0" y="730.0" font-size="14" font-weight="400" fill="#4a5568" text-anchor="start" >VIN and 3V3 are not for loads: 3V3 is only for the ESP32 and the small sensors on the bottom rail.</text>
<text x="64.0" y="754.0" font-size="14" font-weight="400" fill="#4a5568" text-anchor="start" >On/off order: plug in the USB first, then turn on the MB102; turn off the MB102 first, then unplug the USB. ESP32 power from an adapter, no laptop: Module 9.</text>
<text x="1178.0" y="786.0" font-size="12" font-weight="400" fill="#8a8f9c" text-anchor="end" >Fullstack IoT Developer curriculum · CC BY 4.0</text>
