<text x="150.0" y="334.0" font-size="14" font-weight="700" fill="#4a5568" text-anchor="middle" >laptop</text>
<text x="64.0" y="372.0" font-size="14.5" font-weight="400" fill="#1e2a4a" text-anchor="start" >The laptop USB cable carries data and</text>
<text x="64.0" y="391.6" font-size="14.5" font-weight="400" fill="#1e2a4a" text-anchor="start" >about 5 V of power — only about 500 mA.</text>
<text x="64.0" y="411.1" font-size="14.5" font-weight="400" fill="#1e2a4a" text-anchor="start" >GPIO pins only give commands</text>
<text x="64.0" y="430.7" font-size="14.5" font-weight="400" fill="#1e2a4a" text-anchor="start" >(a small current) to the relay, MOSFET, and servo.</text>
