<text x="300.0" y="182.0" font-size="14" font-weight="600" fill="#0f8b8d" text-anchor="start" >The ESP32 uses 3.3 V</text>
<text x="300.0" y="200.9" font-size="14" font-weight="600" fill="#0f8b8d" text-anchor="start" >for the chip and the signals.</text>
