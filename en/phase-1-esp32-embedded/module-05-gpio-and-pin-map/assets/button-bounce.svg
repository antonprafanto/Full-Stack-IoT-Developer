<text x="634.0" y="550.0" font-size="14.5" font-weight="500" fill="#1e2a4a" text-anchor="start" >wait 30 ms, check again: still LOW? a real press</text>
<circle cx="74.0" cy="579.0" r="11" fill="#0f8b8d" />
<text x="74.0" y="584.0" font-size="12" font-weight="800" fill="#fff" text-anchor="middle" >3</text>
