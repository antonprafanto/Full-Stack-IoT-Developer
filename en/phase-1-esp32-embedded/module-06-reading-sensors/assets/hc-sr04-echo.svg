<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<rect width="1200" height="600" fill="#fffdf7"/>
<text x="600.0" y="44.0" font-size="28" font-weight="800" fill="#1e2a4a" text-anchor="middle" >HC-SR04: measuring distance with an echo</text>
<text x="600.0" y="76.0" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" >ECHO pulse length = the time the sound takes to reach the water surface and come back</text>
<text x="70.0" y="155.0" font-size="15" font-weight="800" fill="#1e2a4a" text-anchor="end" >TRIG</text>
<text x="70.0" y="225.0" font-size="15" font-weight="800" fill="#1e2a4a" text-anchor="end" >sound</text>
<text x="70.0" y="295.0" font-size="15" font-weight="800" fill="#1e2a4a" text-anchor="end" >ECHO</text>
<path d="M90 165 L140 165 L140 135 L170 135 L170 165 L560 165" fill="none" stroke="#3a6fc4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
<text x="155.0" y="126.0" font-size="12.5" font-weight="800" fill="#3a6fc4" text-anchor="middle" >10 µs</text>
<path d="M180 230 L184.5 210 L189 230" fill="none" stroke="#b45f17" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<path d="M189 230 L193.5 210 L198 230" fill="none" stroke="#b45f17" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<path d="M198 230 L202.5 210 L207 230" fill="none" stroke="#b45f17" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<path d="M207 230 L211.5 210 L216 230" fill="none" stroke="#b45f17" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<path d="M216 230 L220.5 210 L225 230" fill="none" stroke="#b45f17" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<path d="M225 230 L229.5 210 L234 230" fill="none" stroke="#b45f17" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<path d="M234 230 L238.5 210 L243 230" fill="none" stroke="#b45f17" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<path d="M243 230 L247.5 210 L252 230" fill="none" stroke="#b45f17" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<text x="216.0" y="250.0" font-size="12.5" font-weight="700" fill="#b45f17" text-anchor="middle" >8 vibrations, 40 kHz</text>
<path d="M380 230 L388 210 L396 230" fill="none" stroke="#8a8f9c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
<text x="388.0" y="250.0" font-size="12" font-weight="700" fill="#8a8f9c" text-anchor="middle" >echo</text>
<path d="M90 305 L250 305 L250 275 L388 275 L388 305 L560 305" fill="none" stroke="#7b4fb0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
<line x1="250.0" y1="330.0" x2="388.0" y2="330.0" stroke="#7b4fb0" stroke-width="1.8" stroke-linecap="round" />
<path d="M256 325 L250 330 L256 335 M382 325 L388 330 L382 335" fill="none" stroke="#7b4fb0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
<text x="319.0" y="352.0" font-size="13" font-weight="800" fill="#7b4fb0" text-anchor="middle" >ECHO HIGH time, e.g. 580 µs</text>
<rect x="90.0" y="380.0" width="470.0" height="92.0" rx="10" fill="#fff4c2" stroke="#e9b10d" stroke-width="1.5" />
<text x="110.0" y="410.0" font-size="18" font-weight="800" fill="#1e2a4a" text-anchor="start" >distance (cm) = ECHO time (µs) ÷ 58</text>
<text x="110.0" y="436.0" font-size="13.5" font-weight="600" fill="#4a5568" text-anchor="start" >343 m/s = 0.0343 cm/µs, divided by 2 (there + back)</text>
<text x="110.0" y="458.0" font-size="13.5" font-weight="700" fill="#1e2a4a" text-anchor="start" >example: 580 µs ÷ 58 = 10 cm</text>
<rect x="90.0" y="490.0" width="470.0" height="60.0" rx="10" fill="#fde2e4" />
<text x="110.0" y="516.0" font-size="14" font-weight="800" fill="#e63946" text-anchor="start" >The HC-SR04's ECHO is 5 V → it must go through a</text>
<text x="110.0" y="538.0" font-size="14" font-weight="800" fill="#e63946" text-anchor="start" >4.7 kΩ + 10 kΩ voltage divider (about 3.4 V) to D35</text>
<rect x="660.0" y="150.0" width="380.0" height="12.0" rx="3" fill="#d9c7a1" stroke="#b59a6b" stroke-width="1.5" />
<text x="1050.0" y="146.0" font-size="12.5" font-weight="700" fill="#4a5568" text-anchor="end" >cardboard "bridge"</text>
<rect x="800.0" y="162.0" width="100.0" height="22.0" rx="4" fill="#2f6db3" />
<circle cx="825.0" cy="184.0" r="9" fill="#c0c6cf" stroke="#555" stroke-width="1.5" />
<circle cx="875.0" cy="184.0" r="9" fill="#c0c6cf" stroke="#555" stroke-width="1.5" />
<rect x="796.0" y="146.0" width="10.0" height="30.0" rx="2" fill="#f4f4f4" stroke="#bbb" stroke-width="1" opacity="0.9"/>
<rect x="894.0" y="146.0" width="10.0" height="30.0" rx="2" fill="#f4f4f4" stroke="#bbb" stroke-width="1" opacity="0.9"/>
<text x="850.0" y="122.0" font-size="13" font-weight="800" fill="#1e2a4a" text-anchor="middle" >HC-SR04 under the bridge, facing down</text>
<text x="660.0" y="137.0" font-size="12" font-weight="600" fill="#8a8f9c" text-anchor="start" >side view, not to scale</text>
<path d="M700 190 L700 490 L1000 490 L1000 190" fill="none" stroke="#7a8aa0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
<rect x="702.0" y="325.0" width="296.0" height="163.0" rx="0" fill="#a6d8f0" opacity="0.7"/>
<line x1="702.0" y1="236.0" x2="998.0" y2="236.0" stroke="#3a6fc4" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="6 5" />
<text x="708.0" y="230.0" font-size="12" font-weight="700" fill="#3a6fc4" text-anchor="start" >full level</text>
<rect x="730.0" y="450.0" width="40.0" height="36.0" rx="5" fill="#2b2b2b" />
<text x="750.0" y="442.0" font-size="12" font-weight="700" fill="#4a5568" text-anchor="middle" >pump</text>
<line x1="825.0" y1="196.0" x2="825.0" y2="488.0" stroke="#1e2a4a" stroke-width="2.5" stroke-linecap="round" />
<path d="M819 205 L825 196 L831 205 M819 479 L825 488 L831 479" fill="none" stroke="#1e2a4a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
<text x="835.0" y="347.0" font-size="13.5" font-weight="800" fill="#1e2a4a" text-anchor="start" ></text>
<text x="1011.0" y="460.0" font-size="13" font-weight="800" fill="#1e2a4a" text-anchor="start" >DISTANCE_EMPTY = 20 cm</text>
<text x="1011.0" y="478.0" font-size="12.5" font-weight="600" fill="#4a5568" text-anchor="start" >(sensor → tank bottom)</text>
<line x1="875.0" y1="196.0" x2="875.0" y2="236.0" stroke="#3a6fc4" stroke-width="2.5" stroke-linecap="round" />
<path d="M869 205 L875 196 L881 205 M869 227 L875 236 L881 227" fill="none" stroke="#3a6fc4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
<text x="885.0" y="221.0" font-size="13.5" font-weight="800" fill="#3a6fc4" text-anchor="start" ></text>
<text x="1011.0" y="242.0" font-size="13" font-weight="800" fill="#3a6fc4" text-anchor="start" >DISTANCE_FULL = 5 cm</text>
<text x="1011.0" y="260.0" font-size="12.5" font-weight="600" fill="#4a5568" text-anchor="start" >(sensor → water when full)</text>
<line x1="850.0" y1="196.0" x2="850.0" y2="325.0" stroke="#7b4fb0" stroke-width="2.5" stroke-linecap="round" />
<path d="M844 205 L850 196 L856 205 M844 316.0 L850 325.0 L856 316.0" fill="none" stroke="#7b4fb0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
<text x="860.0" y="265.5" font-size="13.5" font-weight="800" fill="#7b4fb0" text-anchor="start" ></text>
<text x="1011.0" y="329.0" font-size="13" font-weight="800" fill="#7b4fb0" text-anchor="start" >distance = 12.4 cm</text>
<line x1="855.0" y1="325.0" x2="1006.0" y2="325.0" stroke="#7b4fb0" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3" />
<rect x="660.0" y="512.0" width="480.0" height="60.0" rx="10" fill="#e1f3f3" />
<text x="680.0" y="538.0" font-size="15" font-weight="800" fill="#0f8b8d" text-anchor="start" >level = (20 − 12.4) ÷ (20 − 5) × 100 ≈ 50%</text>
<text x="680.0" y="560.0" font-size="13" font-weight="700" fill="#4a5568" text-anchor="start" >leave at least 3 cm between the sensor and the water</text>
<text x="1178.0" y="586.0" font-size="12" font-weight="400" fill="#8a8f9c" text-anchor="end" >Fullstack IoT Developer curriculum · CC BY 4.0</text>
</svg>
