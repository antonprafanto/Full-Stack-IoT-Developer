<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="886" viewBox="0 0 1200 886" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<rect width="1200" height="886" fill="#fffdf7"/>
<text x="600.0" y="44.0" font-size="28" font-weight="800" fill="#1e2a4a" text-anchor="middle" xml:space="preserve">User test: someone else, their own phone, without help</text>
<text x="600.0" y="76.0" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">Concept 11 · Practice 10 · task sheet and notes sheet in <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="14.5">code/user-test/</tspan> · pass requirement L1–L4</text>
<rect x="30.0" y="100.0" width="1140.0" height="172.0" rx="14" fill="#ffffff" stroke="#e0dcd2" stroke-width="1.6" />
<circle cx="52.0" cy="125.0" r="12" fill="#6f42c1" stroke="#ffffff" stroke-width="2" />
<text x="52.0" y="129.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >1</text>
<text x="72.0" y="130.0" font-size="14.5" font-weight="800" fill="#1e2a4a" text-anchor="start" xml:space="preserve">Preparation (the learner, before the tester arrives)</text>
<text x="50.0" y="160.0" font-size="13" font-weight="800" fill="#1e2a4a" text-anchor="start" >Temporary tester account (admin)</text>
<rect x="50.0" y="168.0" width="330.0" height="50.9" rx="8" fill="#eef1f5" />
<text x="62.0" y="189.3" font-size="11" font-weight="700" fill="#6f42c1" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">npm run users -- add</text>
<text x="62.0" y="206.4" font-size="11" font-weight="700" fill="#6f42c1" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">  tester@home.test "Tester" admin</text>
<text x="50.0" y="236.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">PowerShell or the macOS Terminal, not Git Bash;</text>
<text x="50.0" y="253.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">password ≥ 15 characters, only on a paper card</text>
<text x="430.0" y="160.0" font-size="13" font-weight="800" fill="#1e2a4a" text-anchor="start" >Starting state</text>
<text x="430.0" y="184.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">• the lamp is off</text>
<text x="430.0" y="204.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">• no watering rule yet (delete practice leftovers)</text>
<text x="430.0" y="224.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">• simulator: <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#1e2a4a" font-weight="800">tank</tspan> <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#1e2a4a" font-weight="800">random</tspan> and <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#1e2a4a" font-weight="800">soil</tspan> <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#1e2a4a" font-weight="800">random</tspan></text>
<text x="430.0" y="244.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">• the Module 20 viewer account ready for L4</text>
<text x="810.0" y="160.0" font-size="13" font-weight="800" fill="#1e2a4a" text-anchor="start" >Phone mode (Module 23)</text>
<text x="810.0" y="184.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#6f42c1" font-weight="800">HOST=0.0.0.0</tspan>, the laptop IP in <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#6f42c1" font-weight="800">CORS_ORIGIN</tspan></text>
<text x="810.0" y="204.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#6f42c1" font-weight="800">npm</tspan> <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#6f42c1" font-weight="800">run</tspan> <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#6f42c1" font-weight="800">dev:phone</tspan> in the <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#6f42c1" font-weight="800">frontend</tspan> folder</text>
<text x="810.0" y="224.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">the tester's phone opens first:</text>
<text x="810.0" y="244.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#6f42c1" font-weight="800">http://&lt;laptop-IP&gt;:8080/health</tspan> must answer</text>
<line x1="210.0" y1="274.0" x2="210.0" y2="292.0" stroke="#6f42c1" stroke-width="2.2" stroke-linecap="round" />
<path d="M206.7 285.8 L210.0 292.0 L213.3 285.8" fill="none" stroke="#6f42c1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
<rect x="30.0" y="296.0" width="360.0" height="230.0" rx="12" fill="#f5f0fc" stroke="#6f42c1" stroke-width="1.8" />
<circle cx="52.0" cy="321.0" r="12" fill="#6f42c1" stroke="#ffffff" stroke-width="2" />
<text x="52.0" y="325.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >2</text>
<text x="72.0" y="326.0" font-size="14.5" font-weight="800" fill="#1e2a4a" text-anchor="start" xml:space="preserve">Four tasks on the tester's phone</text>
<text x="50.0" y="358.0" font-size="12.5" font-weight="800" fill="#6f42c1" text-anchor="start" >1</text>
<text x="66.0" y="358.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">open <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11" fill="#6f42c1" font-weight="800">http://&lt;laptop-IP&gt;:5173</tspan>, log in with</text>
<text x="66.0" y="376.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">the email and password on the card</text>
<text x="372.0" y="358.0" font-size="12" font-weight="800" fill="#6f42c1" text-anchor="end" >L1</text>
<text x="50.0" y="404.0" font-size="12.5" font-weight="800" fill="#6f42c1" text-anchor="start" >2</text>
<text x="66.0" y="404.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">turn on the lamp in this house</text>
<text x="372.0" y="404.0" font-size="12" font-weight="800" fill="#6f42c1" text-anchor="end" >L2</text>
<text x="50.0" y="432.0" font-size="12.5" font-weight="800" fill="#6f42c1" text-anchor="start" >3</text>
<text x="66.0" y="432.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">get the plants watered automatically</text>
<text x="66.0" y="450.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">when the soil is drier than 30 %</text>
<text x="372.0" y="432.0" font-size="12" font-weight="800" fill="#6f42c1" text-anchor="end" >L3</text>
<text x="50.0" y="478.0" font-size="12.5" font-weight="800" fill="#6f42c1" text-anchor="start" >4</text>
<text x="66.0" y="478.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">log out of the dashboard</text>
<text x="50.0" y="512.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">the tester thinks aloud while working</text>
<line x1="392.0" y1="406.0" x2="418.0" y2="406.0" stroke="#6f42c1" stroke-width="2.2" stroke-linecap="round" />
<path d="M411.8 409.3 L418.0 406.0 L411.8 402.7" fill="none" stroke="#6f42c1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
<rect x="420.0" y="296.0" width="360.0" height="230.0" rx="12" fill="#ffffff" stroke="#e0dcd2" stroke-width="1.6" />
<circle cx="442.0" cy="321.0" r="12" fill="#6f42c1" stroke="#ffffff" stroke-width="2" />
<text x="442.0" y="325.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >3</text>
<text x="462.0" y="326.0" font-size="14.5" font-weight="800" fill="#1e2a4a" text-anchor="start" xml:space="preserve">The "no help" rule</text>
<text x="440.0" y="358.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">the learner may only read the task sentence</text>
<text x="440.0" y="376.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">out again: no pointing at the screen,</text>
<text x="440.0" y="394.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">no hints</text>
<rect x="440.0" y="438.0" width="140.0" height="18.0" rx="4" fill="#e3f4ea" stroke="#2a9d5c" stroke-width="1.2" />
<rect x="580.0" y="438.0" width="180.0" height="18.0" rx="4" fill="#fdeedd" stroke="#b45f17" stroke-width="1.2" />
<text x="510.0" y="430.0" font-size="12" font-weight="800" fill="#2a9d5c" text-anchor="middle" >success</text>
<text x="670.0" y="430.0" font-size="12" font-weight="800" fill="#b45f17" text-anchor="middle" >stuck = helped</text>
<text x="440.0" y="472.0" font-size="11.5" font-weight="700" fill="#4a5568" text-anchor="start" >0</text>
<text x="580.0" y="472.0" font-size="11.5" font-weight="700" fill="#4a5568" text-anchor="middle" >2 minutes</text>
<text x="440.0" y="496.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">only <tspan font-weight="800" fill="#1e2a4a">success</tspan> counts as a pass; a tester</text>
<text x="440.0" y="514.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">who gives up or asks = <tspan font-weight="800" fill="#1e2a4a">helped</tspan></text>
<line x1="782.0" y1="406.0" x2="808.0" y2="406.0" stroke="#9aa3b0" stroke-width="2.2" stroke-linecap="round" />
<path d="M801.8 409.3 L808.0 406.0 L801.8 402.7" fill="none" stroke="#9aa3b0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
<rect x="810.0" y="296.0" width="360.0" height="230.0" rx="12" fill="#ffffff" stroke="#e0dcd2" stroke-width="1.6" />
<circle cx="832.0" cy="321.0" r="12" fill="#6f42c1" stroke="#ffffff" stroke-width="2" />
<text x="832.0" y="325.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >4</text>
<text x="852.0" y="326.0" font-size="14.5" font-weight="800" fill="#1e2a4a" text-anchor="start" xml:space="preserve">Write down every task</text>
<text x="830.0" y="358.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">success / helped / failed, time (mm:ss),</text>
<text x="830.0" y="376.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">the tester's quotes without a name</text>
<text x="830.0" y="394.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">evidence from the backend log:</text>
<text x="830.0" y="428.0" font-size="10.5" font-weight="800" fill="#1a7f37" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">login: account N (admin), session N, IP 192.168.…</text>
<text x="830.0" y="447.0" font-size="10.5" font-weight="800" fill="#1a7f37" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">… lamp = true, ack ok=true in N ms</text>
<text x="830.0" y="466.0" font-size="10.5" font-weight="800" fill="#1a7f37" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">Rule N (…) created through the API: …</text>
<text x="830.0" y="485.0" font-size="10.5" font-weight="800" fill="#1a7f37" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">logout: session N</text>
<path d="M900 528 L900 554 L600 554 L600 580" fill="none" stroke="#b45f17" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
<path d="M596.7 575.8 L600.0 582.0 L603.3 575.8" fill="none" stroke="#b45f17" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
<text x="750.0" y="547.0" font-size="12" font-weight="800" fill="#b45f17" text-anchor="middle" >some tasks were helped</text>
<line x1="1080.0" y1="528.0" x2="1080.0" y2="582.0" stroke="#2a9d5c" stroke-width="2.2" stroke-linecap="round" />
<path d="M1076.7 575.8 L1080.0 582.0 L1083.3 575.8" fill="none" stroke="#2a9d5c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
<text x="1070.0" y="547.0" font-size="12" font-weight="800" fill="#2a9d5c" text-anchor="end" >all succeeded</text>
<rect x="420.0" y="584.0" width="360.0" height="188.0" rx="12" fill="#ffffff" stroke="#b45f17" stroke-width="1.6" />
<circle cx="442.0" cy="609.0" r="12" fill="#b45f17" stroke="#ffffff" stroke-width="2" />
<text x="442.0" y="613.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >5</text>
<text x="462.0" y="614.0" font-size="14.5" font-weight="800" fill="#1e2a4a" text-anchor="start" xml:space="preserve">Fix what was confusing</text>
<text x="440.0" y="646.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">a label, position, or message that made the</text>
<text x="440.0" y="665.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">tester hesitate → change the code, then</text>
<text x="440.0" y="684.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">note the file and the change on the notes sheet</text>
<line x1="418.0" y1="684.0" x2="392.0" y2="684.0" stroke="#b45f17" stroke-width="2.2" stroke-linecap="round" />
<path d="M398.2 680.7 L392.0 684.0 L398.2 687.3" fill="none" stroke="#b45f17" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
<rect x="30.0" y="584.0" width="360.0" height="188.0" rx="12" fill="#ffffff" stroke="#b45f17" stroke-width="1.6" />
<circle cx="52.0" cy="609.0" r="12" fill="#b45f17" stroke="#ffffff" stroke-width="2" />
<text x="52.0" y="613.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >6</text>
<text x="72.0" y="614.0" font-size="14.5" font-weight="800" fill="#1e2a4a" text-anchor="start" xml:space="preserve">Repeat the helped tasks</text>
<text x="50.0" y="646.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">the same tester after a break, or another</text>
<text x="50.0" y="665.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">tester; a task only passes when it</text>
<text x="50.0" y="684.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">succeeds without help</text>
<text x="50.0" y="722.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">this loop may be repeated several times</text>
<line x1="210.0" y1="582.0" x2="210.0" y2="530.0" stroke="#b45f17" stroke-width="2.2" stroke-linecap="round" />
<path d="M213.3 536.2 L210.0 530.0 L206.7 536.2" fill="none" stroke="#b45f17" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
<text x="222.0" y="560.0" font-size="12" font-weight="800" fill="#b45f17" text-anchor="start" >back to the tasks</text>
<rect x="810.0" y="584.0" width="360.0" height="188.0" rx="12" fill="#f5f0fc" stroke="#6f42c1" stroke-width="1.8" />
<circle cx="832.0" cy="609.0" r="12" fill="#6f42c1" stroke="#ffffff" stroke-width="2" />
<text x="832.0" y="613.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >7</text>
<text x="852.0" y="614.0" font-size="14.5" font-weight="800" fill="#1e2a4a" text-anchor="start" xml:space="preserve">L4, then tidy up</text>
<text x="830.0" y="646.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">L4 (learner): log in as <tspan font-weight="800">viewer</tspan> on the same</text>
<text x="830.0" y="664.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">phone: no control buttons, no</text>
<text x="830.0" y="682.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-weight="800">+ New rule</tspan>, no <tspan font-weight="800">Edit</tspan></text>
<text x="830.0" y="712.0" font-size="11" font-weight="800" fill="#6f42c1" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">npm run users -- delete tester@home.test</text>
<text x="830.0" y="736.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">tear up or keep the password card; back to</text>
<text x="830.0" y="754.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">laptop mode (the phone can't open it again)</text>
<rect x="30.0" y="790.0" width="1140.0" height="66.0" rx="12" fill="#eef1f5" />
<text x="50.0" y="815.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">Filled-in sheets are kept in <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#1e2a4a" font-weight="800">learn-iot/module-24/</tspan>: no password, no full name, no face photo. Permission to record the screen or voice may be refused.</text>
<text x="50.0" y="837.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">Only a human can do this test: if there was no tester yet, write that honestly in your notes; <tspan font-weight="800" fill="#1e2a4a">never make up results</tspan>.</text>
<text x="1178.0" y="872.0" font-size="11" font-weight="400" fill="#8a8f9c" text-anchor="end" >Fullstack IoT Developer Curriculum · CC BY 4.0</text>
</svg>
