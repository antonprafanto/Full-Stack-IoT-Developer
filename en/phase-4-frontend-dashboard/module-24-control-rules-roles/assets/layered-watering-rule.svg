<text x="116.0" y="643.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">✅ Soil up to 36 % — rule ready again</text>
<circle cx="621.0" cy="547.0" r="11" fill="#1e2a4a" stroke="#ffffff" stroke-width="2" />
<text x="621.0" y="551.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >3</text>
<text x="640.0" y="552.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">soil below 30 %, but the server is silent: nobody waters</text>
<text x="640.0" y="570.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">yet (no event, no toast)</text>
<circle cx="621.0" cy="609.0" r="11" fill="#1e2a4a" stroke="#ffffff" stroke-width="2" />
<text x="621.0" y="613.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >4</text>
<text x="640.0" y="614.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">below 20 % → Node 1 waters by itself for 3 seconds, rests</text>
<text x="640.0" y="632.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">30 seconds, repeats while still dry (logged on Serial)</text>
<rect x="30.0" y="698.0" width="366.0" height="196.0" rx="12" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6" />
<text x="48.0" y="726.0" font-size="14" font-weight="800" fill="#1a7f37" text-anchor="start" >Server · backend 1.1 (while online)</text>
<text x="48.0" y="752.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#1e2a4a" font-weight="800">below-threshold</tspan>: <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#1e2a4a" font-weight="800">on_below</tspan> 30,</text>
<text x="48.0" y="771.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#1e2a4a" font-weight="800">off_above</tspan> 35, <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#1e2a4a" font-weight="800">for_seconds</tspan> 10</text>
<text x="48.0" y="790.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">a <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#1e2a4a" font-weight="800">command</tspan> action: pump 5 seconds, sent</text>
<text x="48.0" y="809.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">ONCE when the rule turns on</text>
<text x="48.0" y="828.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">refused or unanswered: not tried again</text>
<text x="48.0" y="847.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">until the soil is above 35 % or the rule</text>
<text x="48.0" y="866.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">is saved again</text>
<rect x="417.0" y="698.0" width="366.0" height="196.0" rx="12" fill="#e2f3f1" stroke="#0f8b8d" stroke-width="1.6" />
<text x="435.0" y="726.0" font-size="14" font-weight="800" fill="#0f8b8d" text-anchor="start" >Node 1 · safety rule (server silent)</text>
<text x="435.0" y="752.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">firmware v1.6.0 unchanged: always waters</text>
<text x="435.0" y="771.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">by itself below its local threshold,</text>
<text x="435.0" y="790.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">3 seconds, then a 30-second rest</text>
<text x="435.0" y="809.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">default 30 % → type <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#1e2a4a" font-weight="800">threshold</tspan> <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#1e2a4a" font-weight="800">20</tspan> in the</text>
<text x="435.0" y="828.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">Serial Monitor (stored in NVS)</text>
<text x="435.0" y="847.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">forgot? double watering at 30 %: local</text>
<text x="435.0" y="866.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">3 seconds repeated + the server's 5 seconds</text>
<rect x="804.0" y="698.0" width="366.0" height="196.0" rx="12" fill="#eef1f5" stroke="#9aa3b0" stroke-width="1.6" />
<text x="822.0" y="726.0" font-size="14" font-weight="800" fill="#1e2a4a" text-anchor="start" >The tank protects both</text>
<text x="822.0" y="752.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">tank water below 20 % → Node 1 refuses the</text>
<text x="822.0" y="771.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">pump, from the server and locally:</text>
<text x="822.0" y="790.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#1e2a4a" font-weight="800">pump refused: tank water too low</tspan></text>
<text x="822.0" y="809.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">laptop path: simulator <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#1e2a4a" font-weight="800">tank</tspan> <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#1e2a4a" font-weight="800">15</tspan>;</text>
<text x="822.0" y="828.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">the simulator doesn't water locally and</text>
<text x="822.0" y="847.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">its soil doesn't get wet by itself: type</text>
<text x="822.0" y="866.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#1e2a4a" font-weight="800">soil</tspan> <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#1e2a4a" font-weight="800">25</tspan>, then <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#1e2a4a" font-weight="800">soil</tspan> <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#1e2a4a" font-weight="800">40</tspan></text>
<rect x="30.0" y="912.0" width="1140.0" height="64.0" rx="12" fill="#f5f0fc" />
<text x="50.0" y="937.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-weight="800" fill="#6f42c1">Module 19's decision, revised.</tspan> Back then the pump deliberately had no threshold rule on the server: "two brains for one pump could water twice".</text>
<text x="50.0" y="959.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">Module 24 layers it: <tspan font-weight="800" fill="#1e2a4a">one brain while online</tspan> (server, 30 %), <tspan font-weight="800" fill="#1e2a4a">a local safety rule while it is silent</tspan> (Node 1, 20 %), like Module 19's safety fan.</text>
