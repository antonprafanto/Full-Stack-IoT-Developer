<text x="605.0" y="636.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle" >P10</text>
<text x="642.0" y="637.0" font-size="15" font-weight="400" fill="#1e2a4a" text-anchor="start" xml:space="preserve">the pass test: used by someone else on a phone ⭐</text>
<text x="642.0" y="656.0" font-size="13" font-weight="700" fill="#4a5568" text-anchor="start" xml:space="preserve">pass requirement L1–L4: someone else (not you) can</text>
<text x="642.0" y="676.0" font-size="13" font-weight="700" fill="#4a5568" text-anchor="start" xml:space="preserve">log in from their phone over the home Wi-Fi, …</text>
