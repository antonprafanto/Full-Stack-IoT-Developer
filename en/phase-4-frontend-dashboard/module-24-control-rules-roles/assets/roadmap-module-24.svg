<text x="142.0" y="587.0" font-size="15" font-weight="400" fill="#1e2a4a" text-anchor="start" xml:space="preserve">roles on the screen and a complete logout ⭐</text>
<text x="142.0" y="606.0" font-size="13" font-weight="700" fill="#4a5568" text-anchor="start" xml:space="preserve">base of L4: the screen knows the role (<tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12" fill="#4a5568" font-weight="800">useAdmin</tspan>),</text>
<text x="142.0" y="626.0" font-size="13" font-weight="700" fill="#4a5568" text-anchor="start" xml:space="preserve">viewer refused with <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12" fill="#4a5568" font-weight="800">403</tspan> in Bruno</text>
