<text x="605.0" y="711.4" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" >+</text>
<text x="642.0" y="711.0" font-size="15" font-weight="400" fill="#1e2a4a" text-anchor="start" xml:space="preserve">Add-on: dashboard v1.0 and the pull request</text>
<text x="642.0" y="732.0" font-size="15" font-weight="400" fill="#1e2a4a" text-anchor="start" xml:space="preserve">"dashboard v1.0 (controls &amp; roles) + backend 1.1" ⭐</text>
<line x1="80.0" y1="754.0" x2="1120.0" y2="754.0" stroke="#e0dcd2" stroke-width="1" stroke-linecap="round" />
<text x="80.0" y="778.0" font-size="14" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-weight="800" fill="#6f42c1">Pass requirement from the Syllabus: </tspan><tspan font-weight="800" font-size="11.5" fill="#6f42c1">L1 </tspan>someone else (not you) can log in from their phone over the home Wi-Fi, <tspan font-weight="800" font-size="11.5" fill="#6f42c1">L2 </tspan>turn on the lamp, </text>
<text x="80.0" y="798.0" font-size="14" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-weight="800" font-size="11.5" fill="#6f42c1">L3 </tspan>and create the rule "water if soil &lt; 30%" without help — <tspan font-weight="800" font-size="11.5" fill="#6f42c1">L4 </tspan>and a viewer account doesn't see the control buttons.</text>
<text x="80.0" y="824.0" font-size="14" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve"><tspan font-weight="800" fill="#1e2a4a">Proven in:</tspan> L1 Practices 9–10 · L2 Practice 5 · L3 Practices 6 and 8 · L4 Practice 5 (its base in Practice 3);</text>
<text x="80.0" y="844.0" font-size="14" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">all four repeated with the tester in Practice 10.</text>
<text x="80.0" y="870.0" font-size="14" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve"><tspan font-weight="800" fill="#1e2a4a">Two data paths:</tspan> the devices (Kit A + B via the Pi gateway, the tank filled) or the laptop (simulator <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13" fill="#4a5568" font-weight="700">f00d00000001</tspan> + <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13" fill="#4a5568" font-weight="700">soil</tspan> <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13" fill="#4a5568" font-weight="700">25</tspan>, Bruno).</text>
<text x="80.0" y="894.0" font-size="14" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve"><tspan font-weight="800" fill="#1e2a4a">Changed:</tspan> frontend 1.0.0, backend 1.1.0, the simulator in <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13" fill="#4a5568" font-weight="700">tools/</tspan> (<tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13" fill="#4a5568" font-weight="700">soil</tspan>, <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13" fill="#4a5568" font-weight="700">tank</tspan>). <tspan font-weight="800" fill="#1e2a4a">Unchanged:</tspan> data contract 1.4 and the firmware.</text>
