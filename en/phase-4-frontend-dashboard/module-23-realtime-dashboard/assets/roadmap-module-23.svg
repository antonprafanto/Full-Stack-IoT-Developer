<text x="80.0" y="724.0" font-size="14" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-weight="800" fill="#6f42c1">Pass requirement from the Syllabus: </tspan>covering the LDR with your hand changes the chart on your phone in </text>
<text x="80.0" y="744.0" font-size="14" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-weight="800">&lt; 1 send interval + 1 second</tspan> (with Module 11's <tspan font-style="italic">report-by-exception</tspan>: about 1–2 seconds), and the 7-day history loads in &lt; 1 second.</text>
<text x="80.0" y="772.0" font-size="14" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve"><tspan font-weight="800" fill="#1e2a4a">Two data paths:</tspan> the devices (Kit A + B via the Pi gateway, a real LDR) or the laptop (simulator <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13" fill="#4a5568" font-weight="700">f00d00000001</tspan> + Bruno).</text>
<text x="80.0" y="794.0" font-size="14" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve"><tspan font-weight="800" fill="#1e2a4a">Unchanged:</tspan> backend v1.0, data contract 1.4, firmware, and <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13" fill="#4a5568" font-weight="700">tools/</tspan>; Wokwi not needed.</text>
<text x="80.0" y="816.0" font-size="14" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve"><tspan font-weight="800" fill="#1e2a4a">Always open</tspan> <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13" fill="#4a5568" font-weight="700">http://localhost:5173</tspan> on the laptop; the phone opens <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13" fill="#4a5568" font-weight="700">http://&lt;laptop-IP&gt;:5173</tspan> only in phone mode (Practice 9).</text>
