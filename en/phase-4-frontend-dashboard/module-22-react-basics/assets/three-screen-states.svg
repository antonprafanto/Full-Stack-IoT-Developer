<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="944" viewBox="0 0 1200 944" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<rect width="1200" height="944" fill="#fffdf7"/>
<text x="600.0" y="44.0" font-size="28" font-weight="800" fill="#1e2a4a" text-anchor="middle" xml:space="preserve">Loading, error, and empty: three states you always prepare for</text>
<text x="600.0" y="76.0" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">Concept 10 · like a station information board: there is always news on the screen · example: <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="14.5">DeviceList</tspan> and <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="14.5">GET</tspan> <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="14.5">/devices</tspan></text>
<rect x="30.0" y="100.0" width="1140.0" height="40.0" rx="8" fill="#eef1f5" />
<text x="600.0" y="125.0" font-size="13" font-weight="600" fill="#1e2a4a" text-anchor="middle" xml:space="preserve"><tspan font-weight="800" fill="#6f42c1">1</tspan> the screen shows first  →  <tspan font-weight="800" fill="#6f42c1">2</tspan> <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12" font-weight="800">useEffect</tspan> calls <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12" font-weight="800">GET</tspan> <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12" font-weight="800">/devices</tspan>  →  <tspan font-weight="800" fill="#6f42c1">3</tspan> the response arrives: <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12" font-weight="800">setDevices(…)</tspan> or <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12" font-weight="800">setError(…)</tspan>  →  <tspan font-weight="800" fill="#6f42c1">4</tspan> React re-renders</text>
<rect x="110.0" y="160.0" width="110.0" height="24.0" rx="12.0" fill="#eef1f5" stroke="#9aa3b0" stroke-width="1.4" />
<text x="165.0" y="176.5" font-size="12.5" font-weight="800" fill="#4a5568" text-anchor="middle" xml:space="preserve">loading</text>
<rect x="65.0" y="198.0" width="200.0" height="330.0" rx="22" fill="#ffffff" stroke="#1e2a4a" stroke-width="2" />
<line x1="147.0" y1="210.0" x2="183.0" y2="210.0" stroke="#d5dbe3" stroke-width="3" stroke-linecap="round" />
<rect x="75.0" y="222.0" width="180.0" height="30.0" rx="6" fill="#eef1f5" />
<text x="85.0" y="242.0" font-size="11.5" font-weight="800" fill="#1e2a4a" text-anchor="start" >Mini Smart Home</text>
<text x="79.0" y="278.0" font-size="13" font-weight="800" fill="#1e2a4a" text-anchor="start" >Device List</text>
<text x="79.0" y="302.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="start" >Loading devices…</text>
<text x="165.0" y="562.0" font-size="12" font-weight="800" fill="#6f42c1" text-anchor="middle" xml:space="preserve"><tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12" fill="#6f42c1" font-weight="800">devices === null</tspan></text>
<text x="165.0" y="586.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="middle" >the response hasn't arrived yet: say so,</text>
<text x="165.0" y="604.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="middle" >don't leave the screen blank</text>
