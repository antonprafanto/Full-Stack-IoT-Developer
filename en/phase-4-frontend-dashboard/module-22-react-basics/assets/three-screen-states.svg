<text x="375.0" y="242.0" font-size="11.5" font-weight="800" fill="#1e2a4a" text-anchor="start" >Mini Smart Home</text>
<text x="369.0" y="278.0" font-size="13" font-weight="800" fill="#1e2a4a" text-anchor="start" >Device List</text>
<rect x="365.0" y="286.0" width="180.0" height="178.0" rx="8" fill="#fde6e8" />
<text x="375.0" y="306.0" font-size="11.5" font-weight="600" fill="#e63946" text-anchor="start" >Can't reach the server at</text>
<text x="375.0" y="324.0" font-size="11.5" font-weight="600" fill="#e63946" text-anchor="start" >http://localhost:8080.</text>
<text x="375.0" y="342.0" font-size="11.5" font-weight="600" fill="#e63946" text-anchor="start" >Maybe the backend isn't</text>
<text x="375.0" y="360.0" font-size="11.5" font-weight="600" fill="#e63946" text-anchor="start" >running yet, or this page</text>
<text x="375.0" y="378.0" font-size="11.5" font-weight="600" fill="#e63946" text-anchor="start" >was opened from an</text>
<text x="375.0" y="396.0" font-size="11.5" font-weight="600" fill="#e63946" text-anchor="start" >address the backend</text>
<text x="375.0" y="414.0" font-size="11.5" font-weight="600" fill="#e63946" text-anchor="start" >doesn't allow (open</text>
<text x="375.0" y="432.0" font-size="11.5" font-weight="600" fill="#e63946" text-anchor="start" >http://localhost:5173,</text>
<text x="375.0" y="450.0" font-size="11.5" font-weight="600" fill="#e63946" text-anchor="start" >see CORS_ORIGIN).</text>
<text x="455.0" y="562.0" font-size="12" font-weight="800" fill="#6f42c1" text-anchor="middle" xml:space="preserve"><tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12" fill="#6f42c1" font-weight="800">error !== null</tspan></text>
<text x="455.0" y="586.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="middle" >backend down, wrong address, or</text>
<text x="455.0" y="604.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="middle" >refused: a message the user</text>
<text x="455.0" y="622.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="middle" >can act on</text>
<rect x="690.0" y="160.0" width="110.0" height="24.0" rx="12.0" fill="#eef1f5" stroke="#9aa3b0" stroke-width="1.4" />
<text x="745.0" y="176.5" font-size="12.5" font-weight="800" fill="#4a5568" text-anchor="middle" xml:space="preserve">empty</text>
<rect x="645.0" y="198.0" width="200.0" height="330.0" rx="22" fill="#ffffff" stroke="#1e2a4a" stroke-width="2" />
<line x1="727.0" y1="210.0" x2="763.0" y2="210.0" stroke="#d5dbe3" stroke-width="3" stroke-linecap="round" />
<rect x="655.0" y="222.0" width="180.0" height="30.0" rx="6" fill="#eef1f5" />
<text x="665.0" y="242.0" font-size="11.5" font-weight="800" fill="#1e2a4a" text-anchor="start" >Mini Smart Home</text>
<text x="659.0" y="278.0" font-size="13" font-weight="800" fill="#1e2a4a" text-anchor="start" >Device List</text>
<text x="659.0" y="302.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="start" >No registered devices</text>
<text x="659.0" y="320.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="start" >yet (registering devices:</text>
<text x="659.0" y="338.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="start" >Module 21).</text>
<text x="745.0" y="562.0" font-size="12" font-weight="800" fill="#6f42c1" text-anchor="middle" xml:space="preserve"><tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12" fill="#6f42c1" font-weight="800">devices.length === 0</tspan></text>
<text x="745.0" y="586.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="middle" >it worked, but the list is</text>
<text x="745.0" y="604.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="middle" >empty: no devices registered</text>
<text x="745.0" y="622.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="middle" >yet (Module 21)</text>
<rect x="980.0" y="160.0" width="110.0" height="24.0" rx="12.0" fill="#e3f4ea" stroke="#2a9d5c" stroke-width="1.4" />
<text x="1035.0" y="176.5" font-size="12.5" font-weight="800" fill="#2a9d5c" text-anchor="middle" xml:space="preserve">success</text>
<rect x="935.0" y="198.0" width="200.0" height="330.0" rx="22" fill="#ffffff" stroke="#1e2a4a" stroke-width="2" />
<line x1="1017.0" y1="210.0" x2="1053.0" y2="210.0" stroke="#d5dbe3" stroke-width="3" stroke-linecap="round" />
<rect x="945.0" y="222.0" width="180.0" height="30.0" rx="6" fill="#eef1f5" />
<text x="955.0" y="242.0" font-size="11.5" font-weight="800" fill="#1e2a4a" text-anchor="start" >Mini Smart Home</text>
<text x="949.0" y="278.0" font-size="13" font-weight="800" fill="#1e2a4a" text-anchor="start" >Device List</text>
<rect x="945.0" y="286.0" width="180.0" height="62.0" rx="8" fill="#ffffff" stroke="#d5dbe3" stroke-width="1.2" />
<text x="955.0" y="306.0" font-size="12" font-weight="800" fill="#1e2a4a" text-anchor="start" >Node 2 garden</text>
<text x="955.0" y="322.0" font-size="10.5" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">garden · <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="10.5" fill="#4a5568" font-weight="700">246f28b1c7d4</tspan></text>
<rect x="953.0" y="328.0" width="44.0" height="16.0" rx="8" fill="#e3f4ea" />
<text x="975.0" y="339.6" font-size="10.5" font-weight="700" fill="#2a9d5c" text-anchor="middle" >online</text>
