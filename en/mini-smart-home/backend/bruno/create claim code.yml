info:
  name: create claim code
  type: http
  seq: 37

http:
  method: POST
  url: "{{baseUrl}}/provision/code"
  body:
    type: json
    data: |-
      {
        "name": "Third board (borrowed)",
        "location": "garage",
        "minutes": 30
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
