<text x="580.0" y="470.0" font-size="12.5" font-weight="700" fill="#b45f17" text-anchor="middle" >a short branch to each device (Modbus specification: at most 20 m) · every device's GND to the third wire</text>
<text x="250.0" y="132.0" font-size="13.5" font-weight="700" fill="#1e2a4a" text-anchor="start" >A chain shape, not a star.</text>
<text x="250.0" y="151.0" font-size="13.5" font-weight="700" fill="#1e2a4a" text-anchor="start" >One client, up to 32 standard loads.</text>
<text x="690.0" y="132.0" font-size="13.5" font-weight="700" fill="#1e2a4a" text-anchor="start" >Main cable up to about 1,200 m at</text>
<text x="690.0" y="151.0" font-size="13.5" font-weight="700" fill="#1e2a4a" text-anchor="start" >low speeds; the faster, the shorter.</text>
<rect x="30.0" y="500.0" width="1140.0" height="66.0" rx="10" fill="#eef1f5" />
<text x="52.0" y="526.0" font-size="13.5" font-weight="800" fill="#1e2a4a" text-anchor="start" >120 Ω terminators only at the two ends of the main cable · a third wire joins the GND of all devices</text>
<text x="52.0" y="550.0" font-size="13" font-weight="600" fill="#4a5568" text-anchor="start" >The letters A and B aren't the same at every maker: with a device from another maker, if there's no answer at all, swap A and B.</text>
<text x="1178.0" y="586.0" font-size="11" font-weight="400" fill="#8a8f9c" text-anchor="end" >Fullstack IoT Developer curriculum · CC BY 4.0</text>
