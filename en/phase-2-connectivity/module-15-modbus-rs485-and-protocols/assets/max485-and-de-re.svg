<circle cx="986.0" cy="292.0" r="4" fill="#6d4aa8" />
<text x="1020.0" y="350.0" font-size="12.5" font-weight="700" fill="#0f8b8d" text-anchor="start" >letters from the cable</text>
<text x="1020.0" y="368.0" font-size="12.5" font-weight="700" fill="#0f8b8d" text-anchor="start" >(difference A − B)</text>
<text x="1020.0" y="386.0" font-size="12.5" font-weight="700" fill="#0f8b8d" text-anchor="start" >come into RX2;</text>
<text x="1020.0" y="404.0" font-size="12.5" font-weight="700" fill="#0f8b8d" text-anchor="start" >transmitter quiet</text>
<rect x="30.0" y="480.0" width="560.0" height="170.0" rx="12" fill="#ffffff" stroke="#e0dcd2" stroke-width="1.4" />
<text x="50.0" y="506.0" font-size="15" font-weight="800" fill="#1e2a4a" text-anchor="start" >The correct talking order</text>
<circle cx="64.0" cy="534.0" r="10" fill="#1e2a4a" stroke="#ffffff" stroke-width="2" />
<text x="64.0" y="538.0" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" >1</text>
<text x="84.0" y="538.0" font-size="12.5" font-weight="700" fill="#b45f17" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">D4 HIGH</text>
<text x="250.0" y="538.0" font-size="13" font-weight="600" fill="#4a5568" text-anchor="start" >press the talk button</text>
<circle cx="64.0" cy="562.0" r="10" fill="#1e2a4a" stroke="#ffffff" stroke-width="2" />
<text x="64.0" y="566.0" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" >2</text>
<text x="84.0" y="566.0" font-size="12.5" font-weight="700" fill="#1e2a4a" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">Serial2.print(…)</text>
<text x="250.0" y="566.0" font-size="13" font-weight="600" fill="#4a5568" text-anchor="start" >hand the letters to the UART queue</text>
<circle cx="64.0" cy="590.0" r="10" fill="#1e2a4a" stroke="#ffffff" stroke-width="2" />
<text x="64.0" y="594.0" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" >3</text>
<text x="84.0" y="594.0" font-size="12.5" font-weight="700" fill="#1e2a4a" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">Serial2.flush()</text>
<text x="250.0" y="594.0" font-size="13" font-weight="600" fill="#4a5568" text-anchor="start" >wait for the last letter to go out</text>
<circle cx="64.0" cy="618.0" r="10" fill="#1e2a4a" stroke="#ffffff" stroke-width="2" />
<text x="64.0" y="622.0" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" >4</text>
<text x="84.0" y="622.0" font-size="12.5" font-weight="700" fill="#b45f17" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">D4 LOW</text>
<text x="250.0" y="622.0" font-size="13" font-weight="600" fill="#4a5568" text-anchor="start" >release: back to listening</text>
<rect x="610.0" y="480.0" width="560.0" height="170.0" rx="12" fill="#ffffff" stroke="#e0dcd2" stroke-width="1.4" />
<text x="630.0" y="506.0" font-size="15" font-weight="800" fill="#1e2a4a" text-anchor="start" >Voltage</text>
<text x="630.0" y="532.0" font-size="13" font-weight="600" fill="#4a5568" text-anchor="start" >The MAX485 module gets 5 V. DI, DE, and RE already treat</text>
<text x="630.0" y="551.0" font-size="13" font-weight="600" fill="#4a5568" text-anchor="start" >2.0 V as HIGH, so 3.3 V from the ESP32 is enough.</text>
<text x="630.0" y="582.0" font-size="13" font-weight="700" fill="#6d4aa8" text-anchor="start" >RO puts out almost 5 V → through the 4.7 kΩ + 10 kΩ divider</text>
<text x="630.0" y="601.0" font-size="13" font-weight="700" fill="#6d4aa8" text-anchor="start" >→ about 3.4 V at RX2, safe for an ESP32 pin.</text>
<text x="630.0" y="632.0" font-size="12.5" font-weight="700" fill="#e63946" text-anchor="start" >Always write the Serial2 RX/TX pins: Serial2.begin(9600, SERIAL_8N1, 16, 17).</text>
<text x="1178.0" y="666.0" font-size="11" font-weight="400" fill="#8a8f9c" text-anchor="end" >Fullstack IoT Developer curriculum · CC BY 4.0</text>
