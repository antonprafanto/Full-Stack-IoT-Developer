<rect x="630.0" y="118.0" width="180.0" height="26.0" rx="13.0" fill="#0f8b8d" />
<text x="720.0" y="135.7" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" >D4 LOW = listen</text>
