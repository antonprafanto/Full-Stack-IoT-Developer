<text x="440.0" y="386.0" font-size="12.5" font-weight="700" fill="#6d4aa8" text-anchor="start" >always opposite;</text>
<text x="440.0" y="404.0" font-size="12.5" font-weight="700" fill="#6d4aa8" text-anchor="start" >receiver off</text>
