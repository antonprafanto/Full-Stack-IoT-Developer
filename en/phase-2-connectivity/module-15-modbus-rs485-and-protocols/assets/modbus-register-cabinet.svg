<text x="628.0" y="404.0" font-size="14" font-weight="800" fill="#1e2a4a" text-anchor="start" >Negative numbers: two's complement</text>
<text x="628.0" y="428.0" font-size="12.5" font-weight="600" fill="#4a5568" text-anchor="start" >−5.0 °C × 10 = −50 → stored as FF CE (65,486)</text>
<text x="628.0" y="446.0" font-size="12.5" font-weight="600" fill="#4a5568" text-anchor="start" >read with (int16_t) → −50 → −5.0 °C</text>
<text x="628.0" y="464.0" font-size="12.5" font-weight="600" fill="#4a5568" text-anchor="start" >forgot (int16_t)? it reads 6,548.6 °C</text>
<rect x="30.0" y="520.0" width="1140.0" height="74.0" rx="10" fill="#eef1f5" />
<text x="52.0" y="546.0" font-size="13.5" font-weight="800" fill="#1e2a4a" text-anchor="start" >Numbering shifted by one: old-style datasheets write "40001" for the first holding register = register 0 in the code.</text>
<text x="52.0" y="570.0" font-size="13" font-weight="600" fill="#4a5568" text-anchor="start" >Registers outside 0–3 (function 03) or 0–2 (function 04) get exception 02. Write commands to registers 0–2 are ignored.</text>
