<text x="52.0" y="440.0" font-size="14" font-weight="800" fill="#6d4aa8" text-anchor="start" >RS-485 = the phone line (electricity in the cable)  ·  Modbus RTU = the rules for talking on that line</text>
<text x="52.0" y="464.0" font-size="13.5" font-weight="600" fill="#4a5568" text-anchor="start" >The MAX485 modules at both ends turn the UART letters (TX/RX) into a differential signal on wires A and B.</text>
<rect x="30.0" y="496.0" width="1140.0" height="70.0" rx="10" fill="#eef1f5" />
<text x="52.0" y="524.0" font-size="14" font-weight="800" fill="#1e2a4a" text-anchor="start" >A real RS-485 soil sensor works exactly like the second board:</text>
<text x="52.0" y="548.0" font-size="13.5" font-weight="600" fill="#4a5568" text-anchor="start" >a small microcontroller inside reads the electrodes, stores the results in registers, then answers over RS-485.</text>
