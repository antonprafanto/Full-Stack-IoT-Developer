<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<rect width="1200" height="620" fill="#fffdf7"/>
<text x="600.0" y="44.0" font-size="28" font-weight="800" fill="#1e2a4a" text-anchor="middle" >When Node 1 sends: a 10-second schedule + immediate sends</text>
<text x="600.0" y="76.0" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" >A 40-second example · immediate sends at most every 2 seconds · the schedule restarts from the last send</text>
<text x="40.0" y="155.0" font-size="14.5" font-weight="800" fill="#1e2a4a" text-anchor="start" >Motion (PIR)</text>
<rect x="190.0" y="138.0" width="540.5" height="24.0" rx="5" fill="#eef1f5" stroke="#9aa3b0" stroke-width="1.2" />
<rect x="730.5" y="138.0" width="399.5" height="24.0" rx="5" fill="#fdeedd" stroke="#b45f17" stroke-width="1.2" />
<text x="460.2" y="155.0" font-size="12" font-weight="700" fill="#4a5568" text-anchor="middle" >no motion</text>
<text x="930.2" y="155.0" font-size="12" font-weight="800" fill="#b45f17" text-anchor="middle" >motion</text>
<text x="40.0" y="210.0" font-size="14.5" font-weight="800" fill="#1e2a4a" text-anchor="start" >Light (LDR)</text>
<rect x="190.0" y="193.0" width="564.0" height="24.0" rx="5" fill="#fff7d6" stroke="#d4a72c" stroke-width="1.2" />
<rect x="754.0" y="193.0" width="376.0" height="24.0" rx="5" fill="#3b4256" stroke="#1e2a4a" stroke-width="1.2" />
<text x="472.0" y="210.0" font-size="12" font-weight="700" fill="#8a6d0b" text-anchor="middle" >bright</text>
<text x="942.0" y="210.0" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle" >dark (light &lt; 1000)</text>
<text x="40.0" y="305.0" font-size="14.5" font-weight="800" fill="#1e2a4a" text-anchor="start" >Sends</text>
<line x1="190.0" y1="300.0" x2="1130.0" y2="300.0" stroke="#d5dbe3" stroke-width="2" stroke-linecap="round" />
<circle cx="190.0" cy="300.0" r="9" fill="#0f8b8d" />
<text x="190.0" y="332.0" font-size="12.5" font-weight="700" fill="#0f8b8d" text-anchor="middle" >0 s</text>
<text x="190.0" y="350.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="middle" >schedule</text>
<circle cx="425.0" cy="300.0" r="9" fill="#0f8b8d" />
<text x="425.0" y="332.0" font-size="12.5" font-weight="700" fill="#0f8b8d" text-anchor="middle" >10 s</text>
<text x="425.0" y="350.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="middle" >schedule</text>
<circle cx="660.0" cy="300.0" r="9" fill="#0f8b8d" />
<text x="660.0" y="332.0" font-size="12.5" font-weight="700" fill="#0f8b8d" text-anchor="middle" >20 s</text>
<text x="660.0" y="350.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="middle" >schedule</text>
<circle cx="730.5" cy="300.0" r="9" fill="#b45f17" />
<text x="730.5" y="278.0" font-size="12.5" font-weight="800" fill="#b45f17" text-anchor="end" >23 s: motion detected</text>
<text x="730.5" y="332.0" font-size="12" font-weight="800" fill="#b45f17" text-anchor="middle" >immediate</text>
<line x1="754.0" y1="286.0" x2="754.0" y2="314.0" stroke="#1e2a4a" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3" />
<text x="760.0" y="278.0" font-size="12.5" font-weight="800" fill="#1e2a4a" text-anchor="start" >24 s: getting dark</text>
<path d="M730.5 364 L730.5 372 L777.5 372 L777.5 364" fill="none" stroke="#4a5568" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
<text x="754.0" y="392.0" font-size="12" font-weight="700" fill="#4a5568" text-anchor="middle" >wait for 2 s gap</text>
<circle cx="777.5" cy="300.0" r="9" fill="#b45f17" />
<text x="779.5" y="332.0" font-size="12" font-weight="800" fill="#b45f17" text-anchor="start" >immediate</text>
<line x1="895.0" y1="290.0" x2="895.0" y2="310.0" stroke="#9aa3b0" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3" />
<text x="895.0" y="332.0" font-size="12" font-weight="700" fill="#9aa3b0" text-anchor="middle" >not 30 s</text>
<circle cx="1012.5" cy="300.0" r="9" fill="#0f8b8d" />
<text x="1012.5" y="332.0" font-size="12.5" font-weight="700" fill="#0f8b8d" text-anchor="middle" >35 s</text>
<text x="1012.5" y="350.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="middle" >10 s after the last send</text>
<line x1="190.0" y1="440.0" x2="1130.0" y2="440.0" stroke="#9aa3b0" stroke-width="1.5" stroke-linecap="round" />
<line x1="190.0" y1="436.0" x2="190.0" y2="444.0" stroke="#9aa3b0" stroke-width="1.5" stroke-linecap="round" />
<text x="190.0" y="462.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="middle" >0</text>
<line x1="307.5" y1="436.0" x2="307.5" y2="444.0" stroke="#9aa3b0" stroke-width="1.5" stroke-linecap="round" />
<text x="307.5" y="462.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="middle" >5</text>
<line x1="425.0" y1="436.0" x2="425.0" y2="444.0" stroke="#9aa3b0" stroke-width="1.5" stroke-linecap="round" />
<text x="425.0" y="462.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="middle" >10</text>
<line x1="542.5" y1="436.0" x2="542.5" y2="444.0" stroke="#9aa3b0" stroke-width="1.5" stroke-linecap="round" />
<text x="542.5" y="462.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="middle" >15</text>
<line x1="660.0" y1="436.0" x2="660.0" y2="444.0" stroke="#9aa3b0" stroke-width="1.5" stroke-linecap="round" />
<text x="660.0" y="462.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="middle" >20</text>
<line x1="777.5" y1="436.0" x2="777.5" y2="444.0" stroke="#9aa3b0" stroke-width="1.5" stroke-linecap="round" />
<text x="777.5" y="462.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="middle" >25</text>
<line x1="895.0" y1="436.0" x2="895.0" y2="444.0" stroke="#9aa3b0" stroke-width="1.5" stroke-linecap="round" />
<text x="895.0" y="462.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="middle" >30</text>
<line x1="1012.5" y1="436.0" x2="1012.5" y2="444.0" stroke="#9aa3b0" stroke-width="1.5" stroke-linecap="round" />
<text x="1012.5" y="462.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="middle" >35</text>
<line x1="1130.0" y1="436.0" x2="1130.0" y2="444.0" stroke="#9aa3b0" stroke-width="1.5" stroke-linecap="round" />
<text x="1130.0" y="462.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="middle" >40</text>
<text x="40.0" y="462.0" font-size="12.5" font-weight="700" fill="#4a5568" text-anchor="start" >time (seconds)</text>
<rect x="30.0" y="488.0" width="1140.0" height="96.0" rx="10" fill="#eef1f5" />
<text x="52.0" y="518.0" font-size="13.5" font-weight="700" fill="#1e2a4a" text-anchor="start" >Immediate sends only when a state CHANGES, in both directions: motion yes/no, bright/dark, soil dry/wet, tank water low/OK.</text>
<text x="52.0" y="544.0" font-size="13.5" font-weight="600" fill="#4a5568" text-anchor="start" >Not on every reading. The message is the same as a scheduled send: the eight telemetry fields with the latest readings.</text>
<text x="52.0" y="568.0" font-size="12.5" font-weight="600" fill="#4a5568" text-anchor="start" >Node 1 v1.2 checks the states every time the sensors are read (every 2 seconds), so its immediate send lands on the next reading.</text>
<text x="1178.0" y="606.0" font-size="12" font-weight="400" fill="#8a8f9c" text-anchor="end" >Fullstack IoT Developer curriculum · CC BY 4.0</text>
</svg>
