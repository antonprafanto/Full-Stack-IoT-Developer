<text x="851.3" y="175.0" font-size="11.5" font-weight="800" fill="#e63946" text-anchor="middle" >loop() held up</text>
<text x="924.7" y="146.0" font-size="11.5" font-weight="800" fill="#e63946" text-anchor="middle" >⟳ restart</text>
