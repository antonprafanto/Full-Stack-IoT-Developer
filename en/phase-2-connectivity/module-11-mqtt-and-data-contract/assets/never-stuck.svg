<text x="1027.3" y="175.0" font-size="11.5" font-weight="800" fill="#e63946" text-anchor="middle" >loop() held up</text>
<text x="1100.7" y="146.0" font-size="11.5" font-weight="800" fill="#e63946" text-anchor="middle" >⟳ restart</text>
<rect x="250.0" y="284.0" width="29.3" height="32.0" rx="5" fill="#e2f3f1" stroke="#0f8b8d" stroke-width="1.4" />
<rect x="279.3" y="284.0" width="146.7" height="32.0" rx="5" fill="#fde6e8" stroke="#e63946" stroke-width="1.4" />
<text x="352.7" y="305.0" font-size="11.5" font-weight="800" fill="#e63946" text-anchor="middle" >connect() waits…</text>
<rect x="426.0" y="284.0" width="293.3" height="32.0" rx="5" fill="none" stroke="#9aa3b0" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="572.7" y="305.0" font-size="11.5" font-weight="700" fill="#4a5568" text-anchor="middle" >the remaining 10 s never come</text>
<text x="426.0" y="276.0" font-size="11.5" font-weight="800" fill="#e63946" text-anchor="middle" >⟳ watchdog: restart</text>
<text x="729.3" y="305.0" font-size="12" font-weight="700" fill="#4a5568" text-anchor="start" >then it starts over</text>
<text x="729.3" y="324.0" font-size="11.5" font-weight="600" fill="#4a5568" text-anchor="start" >(a broker that is fully down: fails fast or after 3 s)</text>
