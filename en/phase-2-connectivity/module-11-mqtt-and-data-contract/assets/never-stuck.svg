<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<rect width="1200" height="640" fill="#fffdf7"/>
<text x="600.0" y="44.0" font-size="28" font-weight="800" fill="#1e2a4a" text-anchor="middle" >The broker is down or stuck, Node 1 keeps working</text>
<text x="600.0" y="76.0" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" >Three ways to wait 30 seconds for the broker · the Module 8 watchdog restarts the board if loop() hangs over 5 seconds</text>
<text x="40.0" y="168.0" font-size="15" font-weight="800" fill="#1e2a4a" text-anchor="start" >Tutorial pattern</text>
<text x="40.0" y="190.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">while (!mqtt.connected())</text>
<text x="40.0" y="298.0" font-size="15" font-weight="800" fill="#1e2a4a" text-anchor="start" >Library default limits</text>
<text x="40.0" y="320.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">broker stuck: CONNACK 15 s</text>
<text x="40.0" y="428.0" font-size="15" font-weight="800" fill="#1e2a4a" text-anchor="start" >Our recipe</text>
<text x="40.0" y="450.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">≤ 1 s, every 5 s</text>
