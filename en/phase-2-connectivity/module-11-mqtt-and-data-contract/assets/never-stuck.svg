<text x="52.0" y="572.0" font-size="13.5" font-weight="700" fill="#1e2a4a" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">setConnectionTimeout(1000) · setSocketTimeout(1) · an IP address, not a name</text>
<text x="52.0" y="594.0" font-size="13.5" font-weight="600" fill="#4a5568" text-anchor="start" >Try to connect at most every 5 seconds, only while the Wi-Fi is connected; mqtt.loop() on every pass.</text>
