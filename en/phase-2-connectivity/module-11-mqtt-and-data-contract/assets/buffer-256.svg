<rect width="1200" height="600" fill="#fffdf7"/>
<text x="600.0" y="44.0" font-size="28" font-weight="800" fill="#1e2a4a" text-anchor="middle" >The 256-byte container that silently throws things away</text>
<text x="600.0" y="76.0" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" >What has to fit is the whole incoming MQTT packet, not just its JSON content</text>
<text x="40.0" y="176.0" font-size="14.5" font-weight="800" fill="#1e2a4a" text-anchor="start" >A regular set command</text>
<text x="40.0" y="196.0" font-size="12.5" font-weight="600" fill="#4a5568" text-anchor="start" >121-byte packet</text>
