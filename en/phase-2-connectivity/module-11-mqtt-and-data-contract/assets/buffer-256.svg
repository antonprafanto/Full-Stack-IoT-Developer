<rect x="294.9" y="396.0" width="3.3" height="36.0" rx="0" fill="#b5c3d9" />
<rect x="298.2" y="396.0" width="33.0" height="36.0" rx="0" fill="#e6eefb" />
<text x="314.8" y="418.0" font-size="11.5" font-weight="700" fill="#1e2a4a" text-anchor="middle" >topic</text>
<rect x="331.2" y="396.0" width="3.3" height="36.0" rx="0" fill="#b5c3d9" />
<rect x="334.6" y="396.0" width="429.0" height="36.0" rx="0" fill="#fdeedd" />
<text x="549.0" y="418.0" font-size="11.5" font-weight="700" fill="#1e2a4a" text-anchor="middle" >260-byte JSON</text>
<circle cx="1160.8" cy="414.0" r="12" fill="#2a9d5c" />
<path d="M1155.8 414 L1159.3 418 L1166.3 409.5" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
<rect x="40.0" y="467.0" width="22.0" height="18.0" rx="3" fill="#c9d3e3" />
<text x="70.0" y="481.0" font-size="12.5" font-weight="700" fill="#4a5568" text-anchor="start" >header 2–3 bytes</text>
<rect x="325.0" y="467.0" width="22.0" height="18.0" rx="3" fill="#b5c3d9" />
<text x="355.0" y="481.0" font-size="12.5" font-weight="700" fill="#4a5568" text-anchor="start" >topic length 2 + packet number 2</text>
<rect x="610.0" y="467.0" width="22.0" height="18.0" rx="3" fill="#e6eefb" />
<text x="640.0" y="481.0" font-size="12.5" font-weight="700" fill="#4a5568" text-anchor="start" >topic msh/&lt;id&gt;/cmd (20 bytes)</text>
<rect x="895.0" y="467.0" width="22.0" height="18.0" rx="3" fill="#fdeedd" />
<text x="925.0" y="481.0" font-size="12.5" font-weight="700" fill="#4a5568" text-anchor="start" >JSON content</text>
<rect x="30.0" y="506.0" width="1140.0" height="64.0" rx="10" fill="#eef1f5" />
<text x="52.0" y="534.0" font-size="13.5" font-weight="800" fill="#1e2a4a" text-anchor="start" >A thrown-away packet: the receiving function isn't called, there's no error message, mqtt.loop() stays "just fine".</text>
<text x="52.0" y="556.0" font-size="13.5" font-weight="600" fill="#4a5568" text-anchor="start" >The only symptom: the ack never comes. The cure is one line in setup(): mqtt.setBufferSize(512).</text>
<text x="1178.0" y="586.0" font-size="12" font-weight="400" fill="#8a8f9c" text-anchor="end" >Fullstack IoT Developer curriculum · CC BY 4.0</text>
</svg>
