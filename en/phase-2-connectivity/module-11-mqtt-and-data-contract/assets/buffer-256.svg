<text x="40.0" y="296.0" font-size="14.5" font-weight="800" fill="#1e2a4a" text-anchor="start" >Command + a long note</text>
<text x="40.0" y="316.0" font-size="12.5" font-weight="600" fill="#4a5568" text-anchor="start" >287-byte packet</text>
