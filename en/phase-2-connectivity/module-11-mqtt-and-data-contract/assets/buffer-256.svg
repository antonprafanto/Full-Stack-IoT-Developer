<text x="706.4" y="258.0" font-size="12.5" font-weight="800" fill="#1e2a4a" text-anchor="end" >256-byte container</text>
<rect x="290.0" y="276.0" width="4.9" height="36.0" rx="0" fill="#c9d3e3" />
<rect x="294.9" y="276.0" width="3.3" height="36.0" rx="0" fill="#b5c3d9" />
<rect x="298.2" y="276.0" width="33.0" height="36.0" rx="0" fill="#e6eefb" />
<text x="314.8" y="298.0" font-size="11.5" font-weight="700" fill="#1e2a4a" text-anchor="middle" >topic</text>
<rect x="331.2" y="276.0" width="3.3" height="36.0" rx="0" fill="#b5c3d9" />
<rect x="334.6" y="276.0" width="429.0" height="36.0" rx="0" fill="#fdeedd" />
<rect x="712.4" y="276.0" width="51.1" height="36.0" rx="0" fill="#fde6e8" />
<text x="523.5" y="298.0" font-size="11.5" font-weight="700" fill="#1e2a4a" text-anchor="middle" >260-byte JSON</text>
<line x1="712.4" y1="260.0" x2="712.4" y2="328.0" stroke="#e63946" stroke-width="2.4" stroke-linecap="round" />
<circle cx="785.5" cy="294.0" r="12" fill="#e63946" />
<path d="M781.05 289.5 L790.05 298.5 M790.05 289.5 L781.05 298.5" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
<text x="720.4" y="344.0" font-size="13" font-weight="800" fill="#e63946" text-anchor="start" >too big: read to the end, then THROWN AWAY</text>
<text x="40.0" y="416.0" font-size="14.5" font-weight="800" fill="#1e2a4a" text-anchor="start" >After setBufferSize(512)</text>
<text x="40.0" y="436.0" font-size="12.5" font-weight="600" fill="#4a5568" text-anchor="start" >287-byte packet</text>
