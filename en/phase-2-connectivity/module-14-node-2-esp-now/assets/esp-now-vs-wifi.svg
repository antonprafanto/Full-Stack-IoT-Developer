<text x="168.0" y="520.0" font-size="13.5" font-weight="700" fill="#1e2a4a" text-anchor="start" >no router, no Wi-Fi password · send + ACK take only a few milliseconds</text>
<text x="168.0" y="540.0" font-size="13.5" font-weight="800" fill="#0f8b8d" text-anchor="start" >as long as both are on the same channel, ESP-NOW keeps working even when the router is off</text>
