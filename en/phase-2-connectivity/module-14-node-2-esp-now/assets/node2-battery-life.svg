<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<rect width="1200" height="680" fill="#fffdf7"/>
<text x="600.0" y="44.0" font-size="28" font-weight="800" fill="#1e2a4a" text-anchor="middle" >Node 2's battery life: sleep is what decides it</text>
<text x="600.0" y="76.0" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" >Estimates for a genuine 2,500 mAh 18650 battery (2,000 mAh usable), 5-minute schedule except the last row</text>
<text x="40.0" y="122.0" font-size="15" font-weight="800" fill="#1e2a4a" text-anchor="start" >Charge in one 300-second cycle (5 V side)</text>
<rect x="40.0" y="136.0" width="50.9" height="46.0" rx="4" fill="#b45f17" />
<rect x="90.9" y="136.0" width="1069.1" height="46.0" rx="4" fill="#e2f3f1" stroke="#0f8b8d" stroke-width="1.4" />
<text x="44.0" y="206.0" font-size="12.5" font-weight="800" fill="#b45f17" text-anchor="start" >awake: about 50–90 mA·s</text>
<text x="625.5" y="165.0" font-size="14" font-weight="800" fill="#0f8b8d" text-anchor="middle" >asleep: about 1,470 mA·s (4.9 mA × 299.5 s)</text>
<text x="1160.0" y="206.0" font-size="14" font-weight="800" fill="#1e2a4a" text-anchor="end" >about 95% of the charge is used while ASLEEP</text>
<text x="40.0" y="252.0" font-size="15" font-weight="800" fill="#1e2a4a" text-anchor="start" >Estimated battery life</text>
<text x="40.0" y="296.0" font-size="13.5" font-weight="700" fill="#1e2a4a" text-anchor="start" >This design (soil from D32, BME280 forced, DS18B20 10 bits)</text>
<rect x="500.0" y="278.0" width="483.3" height="28.0" rx="4" fill="#0f8b8d" />
<text x="991.3" y="297.0" font-size="12.5" font-weight="800" fill="#0f8b8d" text-anchor="start" >about 10 days</text>
<text x="40.0" y="350.0" font-size="13.5" font-weight="700" fill="#1e2a4a" text-anchor="start" >Soil sensor connected to 3V3</text>
<rect x="500.0" y="332.0" width="241.7" height="28.0" rx="4" fill="#e63946" />
<text x="749.7" y="351.0" font-size="12.5" font-weight="800" fill="#e63946" text-anchor="start" >about 5 days</text>
<text x="40.0" y="404.0" font-size="13.5" font-weight="700" fill="#1e2a4a" text-anchor="start" >BME280 left in normal mode</text>
<rect x="500.0" y="386.0" width="454.3" height="28.0" rx="4" fill="#b45f17" />
<text x="962.3" y="405.0" font-size="12.5" font-weight="800" fill="#b45f17" text-anchor="start" >about 9.4 days</text>
<text x="40.0" y="458.0" font-size="13.5" font-weight="700" fill="#1e2a4a" text-anchor="start" >Scanning for the channel on every wake</text>
<rect x="500.0" y="440.0" width="430.2" height="28.0" rx="4" fill="#b45f17" />
<text x="938.2" y="459.0" font-size="12.5" font-weight="800" fill="#b45f17" text-anchor="start" >about 8.9 days</text>
<text x="40.0" y="512.0" font-size="13.5" font-weight="700" fill="#1e2a4a" text-anchor="start" >All three of those mistakes at once</text>
<rect x="500.0" y="494.0" width="222.3" height="28.0" rx="4" fill="#e63946" />
<text x="730.3" y="513.0" font-size="12.5" font-weight="800" fill="#e63946" text-anchor="start" >about 4.6 days</text>
<text x="40.0" y="566.0" font-size="13.5" font-weight="700" fill="#1e2a4a" text-anchor="start" >This design, waking every 30 minutes</text>
<rect x="500.0" y="548.0" width="512.3" height="28.0" rx="4" fill="#0f8b8d" />
<text x="1020.3" y="567.0" font-size="12.5" font-weight="800" fill="#0f8b8d" text-anchor="start" >only about 10.6 days</text>
<text x="500.0" y="616.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="middle" >0 days</text>
<line x1="500.0" y1="596.0" x2="500.0" y2="600.0" stroke="#1e2a4a" stroke-width="1.4" stroke-linecap="round" />
<text x="645.0" y="616.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="middle" >3 days</text>
<line x1="645.0" y1="596.0" x2="645.0" y2="600.0" stroke="#1e2a4a" stroke-width="1.4" stroke-linecap="round" />
<text x="790.0" y="616.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="middle" >6 days</text>
<line x1="790.0" y1="596.0" x2="790.0" y2="600.0" stroke="#1e2a4a" stroke-width="1.4" stroke-linecap="round" />
<text x="935.0" y="616.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="middle" >9 days</text>
<line x1="935.0" y1="596.0" x2="935.0" y2="600.0" stroke="#1e2a4a" stroke-width="1.4" stroke-linecap="round" />
<text x="1080.0" y="616.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="middle" >12 days</text>
<line x1="1080.0" y1="596.0" x2="1080.0" y2="600.0" stroke="#1e2a4a" stroke-width="1.4" stroke-linecap="round" />
<line x1="500.0" y1="596.0" x2="1080.0" y2="596.0" stroke="#1e2a4a" stroke-width="1.6" stroke-linecap="round" />
<line x1="645.0" y1="262.0" x2="645.0" y2="596.0" stroke="#e63946" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5" />
<text x="651.0" y="262.0" font-size="12.5" font-weight="800" fill="#e63946" text-anchor="start" >pass requirement: ≥ 3 days</text>
<text x="40.0" y="644.0" font-size="13" font-weight="600" fill="#4a5568" text-anchor="start" >Estimates with a board sleep current of 4.9 mA and the factor 1.6 from Module 9 (MT3608). Measure your own in Practice 7.</text>
<text x="1178.0" y="666.0" font-size="11" font-weight="400" fill="#8a8f9c" text-anchor="end" >Fullstack IoT Developer curriculum · CC BY 4.0</text>
</svg>
