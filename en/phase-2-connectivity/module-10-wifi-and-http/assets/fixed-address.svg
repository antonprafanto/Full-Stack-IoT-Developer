<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<rect width="1200" height="590" fill="#fffdf7"/>
<text x="600.0" y="44.0" font-size="28" font-weight="800" fill="#1e2a4a" text-anchor="middle" >Finding Node 1: a fixed address or a .local name</text>
<text x="600.0" y="76.0" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" >Main path: the router reserves the address · bonus: the ESP32 announces its own name</text>
<rect x="50.0" y="110.0" width="540.0" height="390.0" rx="16" fill="#ffffff" stroke="#0f8b8d" stroke-width="2" />
<text x="74.0" y="144.0" font-size="17" font-weight="800" fill="#0f8b8d" text-anchor="start" >Fixed address through the router (main path)</text>
<text x="74.0" y="170.0" font-size="14" font-weight="600" fill="#4a5568" text-anchor="start" >DHCP reservation: "a reserved house number"</text>
<rect x="74.0" y="192.0" width="492.0" height="110.0" rx="10" fill="#eef1f5" />
<text x="94.0" y="220.0" font-size="13.5" font-weight="800" fill="#1e2a4a" text-anchor="start" >Router admin page · Address Reservation</text>
<text x="94.0" y="252.0" font-size="15" font-weight="700" fill="#1e2a4a" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">MAC A4-CF-12-E5-B7-C0</text>
<line x1="320.0" y1="247.0" x2="380.0" y2="247.0" stroke="#0f8b8d" stroke-width="2.5" stroke-linecap="round" />
<path d="M371.2 251.7 L380.0 247.0 L371.2 242.3" fill="none" stroke="#0f8b8d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
<text x="390.0" y="252.0" font-size="15" font-weight="800" fill="#0f8b8d" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">192.168.1.23</text>
<text x="94.0" y="284.0" font-size="13" font-weight="600" fill="#4a5568" text-anchor="start" >the router knows the ESP32 by its ID card number (MAC address)</text>
<circle cx="92.0" cy="329.0" r="9" fill="#2a9d5c" />
<path d="M87 329 L90.5 333 L97.5 324.5" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
<text x="112.0" y="334.0" font-size="14.5" font-weight="600" fill="#1e2a4a" text-anchor="start" >the ESP32 still asks for an address the usual way</text>
<circle cx="92.0" cy="363.0" r="9" fill="#2a9d5c" />
<path d="M87 363 L90.5 367 L97.5 358.5" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
<text x="112.0" y="368.0" font-size="14.5" font-weight="600" fill="#1e2a4a" text-anchor="start" >the address doesn't change even when the router restarts</text>
<circle cx="92.0" cy="397.0" r="9" fill="#2a9d5c" />
<path d="M87 397 L90.5 401 L97.5 392.5" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
<text x="112.0" y="402.0" font-size="14.5" font-weight="600" fill="#1e2a4a" text-anchor="start" >the /off link on the phone always works</text>
<text x="92.0" y="436.0" font-size="18" font-weight="800" fill="#b45f17" text-anchor="middle" >!</text>
<text x="112.0" y="436.0" font-size="14.5" font-weight="600" fill="#1e2a4a" text-anchor="start" >needs access to the router's admin page (just once)</text>
<rect x="620.0" y="110.0" width="530.0" height="390.0" rx="16" fill="#ffffff" stroke="#e0dcd2" stroke-width="1.5" />
<text x="644.0" y="144.0" font-size="17" font-weight="800" fill="#1e2a4a" text-anchor="start" >The name node1.local (bonus)</text>
<text x="644.0" y="170.0" font-size="14" font-weight="600" fill="#4a5568" text-anchor="start" >mDNS: the ESP32 "shouts" on the home network</text>
<rect x="675.0" y="220.0" width="30.0" height="40.0" rx="3" fill="none" stroke="#1e2a4a" stroke-width="2" />
<rect x="681.0" y="226.0" width="18.0" height="14.0" rx="2" fill="none" stroke="#1e2a4a" stroke-width="1.6" />
