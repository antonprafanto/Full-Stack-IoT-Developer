<line x1="675.0" y1="238.0" x2="670.0" y2="238.0" stroke="#1e2a4a" stroke-width="1.6" stroke-linecap="round" />
<line x1="705.0" y1="238.0" x2="710.0" y2="238.0" stroke="#1e2a4a" stroke-width="1.6" stroke-linecap="round" />
<line x1="675.0" y1="246.0" x2="670.0" y2="246.0" stroke="#1e2a4a" stroke-width="1.6" stroke-linecap="round" />
<line x1="705.0" y1="246.0" x2="710.0" y2="246.0" stroke="#1e2a4a" stroke-width="1.6" stroke-linecap="round" />
<line x1="675.0" y1="254.0" x2="670.0" y2="254.0" stroke="#1e2a4a" stroke-width="1.6" stroke-linecap="round" />
<line x1="705.0" y1="254.0" x2="710.0" y2="254.0" stroke="#1e2a4a" stroke-width="1.6" stroke-linecap="round" />
<rect x="730.0" y="214.0" width="200.0" height="46.0" rx="12" fill="#fdeedd" stroke="#f4a261" stroke-width="1.5" />
<text x="830.0" y="243.0" font-size="16" font-weight="800" fill="#b45f17" text-anchor="middle" >"I'm node1!"</text>
<circle cx="662.0" cy="307.0" r="10" fill="#2a9d5c" />
<path d="M657 307 L660.5 311 L667.5 302.5" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
<text x="684.0" y="312.0" font-size="14.5" font-weight="600" fill="#1e2a4a" text-anchor="start" >Windows 10/11, macOS, Linux laptops</text>
<circle cx="662.0" cy="347.0" r="10" fill="#2a9d5c" />
<path d="M657 347 L660.5 351 L667.5 342.5" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
<text x="684.0" y="352.0" font-size="14.5" font-weight="600" fill="#1e2a4a" text-anchor="start" >iPhone</text>
<text x="662.0" y="394.0" font-size="20" font-weight="800" fill="#b45f17" text-anchor="middle" >!</text>
<text x="684.0" y="392.0" font-size="14.5" font-weight="600" fill="#1e2a4a" text-anchor="start" >Android phones: often fail, especially older ones</text>
<circle cx="662.0" cy="427.0" r="10" fill="#e63946" />
<path d="M657.5 422.5 L666.5 431.5 M666.5 422.5 L657.5 431.5" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
<text x="684.0" y="432.0" font-size="14.5" font-weight="600" fill="#1e2a4a" text-anchor="start" >over mobile data or a VPN</text>
<text x="644.0" y="484.0" font-size="14" font-weight="700" fill="#4a5568" text-anchor="start" >If it fails, use its IP address.</text>
<text x="600.0" y="540.0" font-size="14" font-weight="700" fill="#4a5568" text-anchor="middle" >Other ways to see the address: the Serial Monitor, the Node 1 v1.1 OLED status page, or the router's device list.</text>
<text x="1178.0" y="576.0" font-size="12" font-weight="400" fill="#8a8f9c" text-anchor="end" >Fullstack IoT Developer curriculum · CC BY 4.0</text>
