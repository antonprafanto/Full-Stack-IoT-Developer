<text x="105.0" y="442.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle" >P3</text>
<text x="142.0" y="443.0" font-size="15" font-weight="400" fill="#1e2a4a" text-anchor="start" >the router unplug test: it reconnects by itself</text>
