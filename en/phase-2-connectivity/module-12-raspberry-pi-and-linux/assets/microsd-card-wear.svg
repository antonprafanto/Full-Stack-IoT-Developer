<text x="320.0" y="412.0" font-size="13" font-weight="700" fill="#e63946" text-anchor="middle" >the blocks erased and rewritten most often wear out first</text>
<rect x="70.0" y="432.0" width="500.0" height="70.0" rx="10" fill="#fdeedd" />
<text x="90.0" y="458.0" font-size="13.5" font-weight="800" fill="#b45f17" text-anchor="start" >One log line, a few dozen bytes, every few seconds</text>
<text x="90.0" y="482.0" font-size="13" font-weight="600" fill="#4a5568" text-anchor="start" >→ the card copies and erases big blocks again and again</text>
<text x="640.0" y="132.0" font-size="15.5" font-weight="800" fill="#1e2a4a" text-anchor="start" >Three things that protect the gateway</text>
<rect x="640.0" y="158.0" width="520.0" height="100.0" rx="12" fill="#ffffff" stroke="#0f8b8d" stroke-width="2" />
<circle cx="682.0" cy="208.0" r="20" fill="#0f8b8d" />
<text x="682.0" y="215.0" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle" >1</text>
<text x="718.0" y="202.0" font-size="15.5" font-weight="800" fill="#1e2a4a" text-anchor="start" >A high-endurance card</text>
<text x="718.0" y="226.0" font-size="13" font-weight="600" fill="#4a5568" text-anchor="start" >designed for CCTV that records 24/7</text>
<rect x="640.0" y="276.0" width="520.0" height="100.0" rx="12" fill="#ffffff" stroke="#0f8b8d" stroke-width="2" />
<circle cx="682.0" cy="326.0" r="20" fill="#0f8b8d" />
<text x="682.0" y="333.0" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle" >2</text>
<text x="718.0" y="320.0" font-size="15.5" font-weight="800" fill="#1e2a4a" text-anchor="start" >sudo poweroff, then unplug</text>
<text x="718.0" y="344.0" font-size="13" font-weight="600" fill="#4a5568" text-anchor="start" >a power cut while writing can damage files</text>
<rect x="640.0" y="394.0" width="520.0" height="100.0" rx="12" fill="#ffffff" stroke="#0f8b8d" stroke-width="2" />
<circle cx="682.0" cy="444.0" r="20" fill="#0f8b8d" />
<text x="682.0" y="451.0" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle" >3</text>
<text x="718.0" y="438.0" font-size="15.5" font-weight="800" fill="#1e2a4a" text-anchor="start" >Official adapter + backups</text>
<text x="718.0" y="462.0" font-size="13" font-weight="600" fill="#4a5568" text-anchor="start" >steady voltage; recipe &amp; settings on GitHub</text>
<rect x="40.0" y="540.0" width="1120.0" height="56.0" rx="10" fill="#eef1f5" />
<text x="62.0" y="574.0" font-size="13.5" font-weight="700" fill="#1e2a4a" text-anchor="start" >The A1/A2 code on a card = speed at opening and writing many small files, not endurance. For a gateway, put high-endurance first.</text>
<text x="1178.0" y="626.0" font-size="12" font-weight="400" fill="#8a8f9c" text-anchor="end" >Fullstack IoT Developer curriculum · CC BY 4.0</text>
