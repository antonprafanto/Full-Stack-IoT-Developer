<text x="355.0" y="592.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >1</text>
<text x="374.0" y="593.0" font-size="13.5" font-weight="800" fill="#1e2a4a" text-anchor="start" >Only needed binders get opened</text>
<text x="374.0" y="614.0" font-size="12.5" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">the last-7-days query touches the 8</text>
<text x="374.0" y="632.0" font-size="12.5" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">newest; the others (faded) are pruned</text>
<circle cx="631.0" cy="588.0" r="11" fill="#336791" stroke="#ffffff" stroke-width="2" />
<text x="631.0" y="592.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >2</text>
<text x="650.0" y="593.0" font-size="13.5" font-weight="800" fill="#1e2a4a" text-anchor="start" >Drop old data = drop whole binders</text>
<text x="650.0" y="614.0" font-size="12.5" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">like deleting one file, without a</text>
<text x="650.0" y="632.0" font-size="12.5" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve"><tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#4a5568" font-weight="700">DELETE</tspan> of millions of rows (Concept 7)</text>
<circle cx="907.0" cy="588.0" r="11" fill="#336791" stroke="#ffffff" stroke-width="2" />
<text x="907.0" y="592.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >3</text>
<text x="926.0" y="593.0" font-size="13.5" font-weight="800" fill="#1e2a4a" text-anchor="start" >Old binders can be compressed</text>
<text x="926.0" y="614.0" font-size="12.5" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">without disturbing today's binder,</text>
<text x="926.0" y="632.0" font-size="12.5" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">still being written to (Concept 8)</text>
