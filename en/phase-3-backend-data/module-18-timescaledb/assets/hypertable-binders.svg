<text x="48.0" y="700.0" font-size="13" font-weight="700" fill="#1e2a4a" text-anchor="start" xml:space="preserve">One function in the migration <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12.0" font-weight="800">002_hypertable.sql</tspan> (Practice 2) files <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12.0" font-weight="800">readings</tspan> into daily binders and moves the rows that already exist:</text>
<text x="48.0" y="724.0" font-size="12.5" font-weight="700" fill="#1e2a4a" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">SELECT create_hypertable('readings', by_range('ts', INTERVAL '1 day'), migrate_data =&gt; true);</text>
