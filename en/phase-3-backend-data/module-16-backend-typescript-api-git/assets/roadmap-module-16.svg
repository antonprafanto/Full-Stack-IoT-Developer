<text x="80.0" y="590.0" font-size="14" font-weight="600" fill="#4a5568" text-anchor="start" >Almost all of this week's work is on the laptop, in VS Code. No Node 1 and Node 2 yet? The Practice 7 simulator stands in for both.</text>
