<text x="880.0" y="330.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="middle" >telemetry, status,</text>
<text x="880.0" y="346.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="middle" >vitals, ack</text>
<text x="30.0" y="446.0" font-size="15.5" font-weight="800" fill="#1e2a4a" text-anchor="start" >The waiter adds three things the kitchen doesn't have:</text>
<rect x="30.0" y="464.0" width="360.0" height="122.0" rx="12" fill="#ffffff" stroke="#1a7f37" stroke-width="1.8" />
<circle cx="62.0" cy="496.0" r="13" fill="#1a7f37" stroke="#ffffff" stroke-width="2" />
<text x="62.0" y="501.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" >1</text>
<text x="86.0" y="502.0" font-size="16" font-weight="800" fill="#1a7f37" text-anchor="start" >checks</text>
<text x="86.0" y="528.0" font-size="13" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">every message and request is checked</text>
<text x="86.0" y="548.0" font-size="13" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">with Zod before it's trusted</text>
<text x="86.0" y="568.0" font-size="13" font-weight="700" fill="#1e2a4a" text-anchor="start" xml:space="preserve">(Concept 7)</text>
<rect x="420.0" y="464.0" width="360.0" height="122.0" rx="12" fill="#ffffff" stroke="#1a7f37" stroke-width="1.8" />
<circle cx="452.0" cy="496.0" r="13" fill="#1a7f37" stroke="#ffffff" stroke-width="2" />
<text x="452.0" y="501.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" >2</text>
<text x="476.0" y="502.0" font-size="16" font-weight="800" fill="#1a7f37" text-anchor="start" >remembers</text>
<text x="476.0" y="528.0" font-size="13" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">the last state of every device and</text>
<text x="476.0" y="548.0" font-size="13" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">commands waiting for an ack, in memory</text>
<text x="476.0" y="568.0" font-size="13" font-weight="700" fill="#1e2a4a" text-anchor="start" xml:space="preserve">(later in a database, Module 17)</text>
<rect x="810.0" y="464.0" width="360.0" height="122.0" rx="12" fill="#ffffff" stroke="#9aa3b0" stroke-width="1.5" stroke-dasharray="7 5"/>
<circle cx="842.0" cy="496.0" r="13" fill="#9aa3b0" stroke="#ffffff" stroke-width="2" />
<text x="842.0" y="501.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" >3</text>
<text x="866.0" y="502.0" font-size="16" font-weight="800" fill="#4a5568" text-anchor="start" >guards the door</text>
<rect x="1090.0" y="488.0" width="60.0" height="20.0" rx="10.0" fill="#9aa3b0" />
<text x="1120.0" y="502.1" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" >later</text>
<text x="866.0" y="528.0" font-size="13" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">who may order what:</text>
<text x="866.0" y="548.0" font-size="13" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">the <tspan>login</tspan> and user roles</text>
