<text x="82.0" y="378.0" font-size="13.5" font-weight="800" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12.4" font-weight="700">git switch -c feature/vitals</tspan></text>
<text x="82.0" y="398.0" font-size="12.5" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">a new branch from <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#1e2a4a" font-weight="700">main</tspan>; <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#1e2a4a" font-weight="700">main</tspan> stays untouched</text>
<circle cx="60.0" cy="428.0" r="12" fill="#1e2a4a" stroke="#ffffff" stroke-width="2" />
<text x="60.0" y="432.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >2</text>
<text x="82.0" y="433.0" font-size="13.5" font-weight="800" fill="#1e2a4a" text-anchor="start" xml:space="preserve">write the feature, then test it yourself</text>
<text x="82.0" y="453.0" font-size="12.5" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve"><tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#1e2a4a" font-weight="700">npm run check</tspan>, send from Bruno, look at <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#1e2a4a" font-weight="700">/docs</tspan></text>
<text x="82.0" y="472.0" font-size="12.5" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">then <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#1e2a4a" font-weight="700">git add .</tspan> and <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#1e2a4a" font-weight="700">git commit</tspan></text>
<circle cx="60.0" cy="502.0" r="12" fill="#1e2a4a" stroke="#ffffff" stroke-width="2" />
<text x="60.0" y="506.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >3</text>
