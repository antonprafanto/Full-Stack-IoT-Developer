<rect x="482.0" y="435.0" width="13.0" height="13.0" rx="3" fill="#ffffff" stroke="#1a7f37" stroke-width="1.4" />
<text x="504.0" y="446.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">tried in Bruno, the tests pass</text>
<rect x="482.0" y="457.0" width="13.0" height="13.0" rx="3" fill="#ffffff" stroke="#1a7f37" stroke-width="1.4" />
<text x="504.0" y="468.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">shown in <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" font-weight="700">/docs</tspan></text>
<rect x="482.0" y="479.0" width="13.0" height="13.0" rx="3" fill="#ffffff" stroke="#1a7f37" stroke-width="1.4" />
<text x="504.0" y="490.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">no <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" font-weight="700">.env</tspan> or passwords</text>
<circle cx="460.0" cy="518.0" r="12" fill="#1e2a4a" stroke="#ffffff" stroke-width="2" />
<text x="460.0" y="522.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >5</text>
<text x="482.0" y="523.0" font-size="13.5" font-weight="800" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan>Review</tspan>: check, then tick the checklist</text>
<text x="482.0" y="543.0" font-size="12.5" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">Files changed tab, a comment on one line,</text>
<text x="482.0" y="562.0" font-size="12.5" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">Review changes → Comment → Submit review</text>
<circle cx="460.0" cy="592.0" r="12" fill="#1e2a4a" stroke="#ffffff" stroke-width="2" />
<text x="460.0" y="596.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >6</text>
<text x="482.0" y="597.0" font-size="13.5" font-weight="800" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan>Merge</tspan>: Create a merge commit</text>
<text x="482.0" y="617.0" font-size="12.5" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">Merge pull request → Confirm merge,</text>
<text x="482.0" y="636.0" font-size="12.5" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">then Delete branch</text>
<circle cx="900.0" cy="373.0" r="12" fill="#1e2a4a" stroke="#ffffff" stroke-width="2" />
<text x="900.0" y="377.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >7</text>
<text x="922.0" y="378.0" font-size="13.5" font-weight="800" fill="#1e2a4a" text-anchor="start" xml:space="preserve">back to <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12.4" font-weight="700">main</tspan></text>
<text x="922.0" y="406.0" font-size="12.5" font-weight="700" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" font-weight="700">git switch main</tspan></text>
<text x="922.0" y="432.0" font-size="12.5" font-weight="700" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" font-weight="700">git pull --prune</tspan></text>
<text x="922.0" y="458.0" font-size="12.5" font-weight="700" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" font-weight="700">git branch -d feature/vitals</tspan></text>
<text x="922.0" y="498.0" font-size="12.5" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">main on the laptop gets the</text>
<text x="922.0" y="517.0" font-size="12.5" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve"><tspan>merge commit</tspan> from GitHub;</text>
<text x="922.0" y="536.0" font-size="12.5" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">the feature branch is deleted</text>
<text x="922.0" y="578.0" font-size="12.5" font-weight="700" fill="#1e2a4a" text-anchor="start" >proof in the history:</text>
