<text x="82.0" y="527.0" font-size="12.5" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">the branch goes to GitHub; <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#1e2a4a" font-weight="700">-u</tspan> remembers</text>
<text x="82.0" y="546.0" font-size="12.5" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">the laptop and GitHub branch pair</text>
<circle cx="460.0" cy="373.0" r="12" fill="#1e2a4a" stroke="#ffffff" stroke-width="2" />
<text x="460.0" y="377.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >4</text>
<text x="482.0" y="378.0" font-size="13.5" font-weight="800" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan>Pull request</tspan> #1</text>
<text x="482.0" y="398.0" font-size="12.5" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">base: <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#1e2a4a" font-weight="700">main</tspan> ← compare: <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#1e2a4a" font-weight="700">feature/vitals</tspan></text>
