<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<rect width="1200" height="860" fill="#fffdf7"/>
<text x="600.0" y="44.0" font-size="28" font-weight="800" fill="#1e2a4a" text-anchor="middle" xml:space="preserve">Password fingerprints: store the fingerprint, not the face</text>
<text x="600.0" y="76.0" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">Concept 3 · bcrypt is slow on purpose (cost factor 12) and adds a salt · the database only stores the fingerprint</text>
<rect x="30.0" y="100.0" width="640.0" height="476.0" rx="14" fill="#ffffff" stroke="#e0dcd2" stroke-width="1.6" />
<text x="50.0" y="130.0" font-size="15" font-weight="800" fill="#1e2a4a" text-anchor="start" xml:space="preserve">When an account is created (<tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="14" font-weight="800">npm</tspan> <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="14" font-weight="800">run</tspan> <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="14" font-weight="800">users</tspan>, Practice 1)</text>
<rect x="50.0" y="148.0" width="270.0" height="74.0" rx="10" fill="#ffffff" stroke="#1e2a4a" stroke-width="1.5" />
<text x="66.0" y="172.0" font-size="13" font-weight="800" fill="#1e2a4a" text-anchor="start" >passphrase</text>
<text x="66.0" y="196.0" font-size="14" font-weight="700" fill="#1e2a4a" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">••••••••••••••••</text>
<text x="66.0" y="213.0" font-size="11.5" font-weight="600" fill="#4a5568" text-anchor="start" >at least 15 characters</text>
<rect x="380.0" y="148.0" width="270.0" height="74.0" rx="10" fill="#ffffff" stroke="#1e2a4a" stroke-width="1.5" />
<text x="396.0" y="172.0" font-size="13" font-weight="800" fill="#1e2a4a" text-anchor="start" xml:space="preserve">random salt, 16 <tspan>bytes</tspan></text>
<text x="396.0" y="192.0" font-size="11.5" font-weight="600" fill="#4a5568" text-anchor="start" >made automatically, different every time</text>
<text x="396.0" y="209.0" font-size="11.5" font-weight="600" fill="#4a5568" text-anchor="start" >not secret: it's stored with it</text>
<line x1="185.0" y1="224.0" x2="300.0" y2="262.0" stroke="#1a7f37" stroke-width="2.2" stroke-linecap="round" />
<path d="M292.1 263.3 L300.0 262.0 L294.5 256.2" fill="none" stroke="#1a7f37" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
<line x1="515.0" y1="224.0" x2="400.0" y2="262.0" stroke="#1a7f37" stroke-width="2.2" stroke-linecap="round" />
<path d="M405.5 256.2 L400.0 262.0 L407.9 263.3" fill="none" stroke="#1a7f37" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
<rect x="200.0" y="266.0" width="300.0" height="86.0" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="2" />
<text x="350.0" y="292.0" font-size="16" font-weight="800" fill="#1a7f37" text-anchor="middle" >bcrypt</text>
<text x="350.0" y="314.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="middle" xml:space="preserve"><tspan>cost</tspan> factor <tspan font-weight="800">12</tspan>: 2¹² = 4,096 rounds</text>
<text x="350.0" y="338.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="middle" >about 0.3 seconds on the author's laptop</text>
<line x1="350.0" y1="354.0" x2="350.0" y2="388.0" stroke="#1a7f37" stroke-width="2.2" stroke-linecap="round" />
<path d="M346.2 380.9 L350.0 388.0 L353.8 380.9" fill="none" stroke="#1a7f37" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
<text x="364.0" y="378.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="start" >the result: one 60-character text, split up below</text>
<rect x="58.2" y="394.0" width="45.7" height="30.0" rx="6" fill="#ffffff" stroke="#9aa3b0" stroke-width="1.2" />
<text x="64.2" y="414.0" font-size="14" font-weight="700" fill="#1e2a4a" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">$2b$</text>
<text x="81.0" y="444.0" font-size="12.5" font-weight="800" fill="#1e2a4a" text-anchor="middle" >recipe</text>
<text x="81.0" y="461.0" font-size="11.5" font-weight="600" fill="#4a5568" text-anchor="middle" xml:space="preserve">version</text>
<rect x="113.9" y="394.0" width="37.3" height="30.0" rx="6" fill="#ffffff" stroke="#9aa3b0" stroke-width="1.2" />
<text x="119.9" y="414.0" font-size="14" font-weight="800" fill="#1a7f37" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">12$</text>
<text x="132.5" y="444.0" font-size="12.5" font-weight="800" fill="#1a7f37" text-anchor="middle" >cost</text>
<text x="132.5" y="461.0" font-size="11.5" font-weight="600" fill="#4a5568" text-anchor="middle" xml:space="preserve">factor</text>
<rect x="161.2" y="394.0" width="197.4" height="30.0" rx="6" fill="#eef1f5" />
<text x="167.2" y="414.0" font-size="14" font-weight="700" fill="#1e2a4a" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">mCgEV8BHKGueg1vUTZtbW.</text>
<text x="266.9" y="444.0" font-size="12.5" font-weight="800" fill="#1e2a4a" text-anchor="middle" >salt</text>
<text x="266.9" y="461.0" font-size="11.5" font-weight="600" fill="#4a5568" text-anchor="middle" xml:space="preserve">22 characters from 16 random <tspan>bytes</tspan></text>
<rect x="368.6" y="394.0" width="273.3" height="30.0" rx="6" fill="#dafbe1" />
<text x="374.6" y="414.0" font-size="14" font-weight="700" fill="#1e2a4a" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">hWprLVUZn6hfQskfy8p9rD0ZJ.8Ayie</text>
<text x="505.2" y="444.0" font-size="12.5" font-weight="800" fill="#1e2a4a" text-anchor="middle" >password fingerprint</text>
<text x="505.2" y="461.0" font-size="11.5" font-weight="600" fill="#4a5568" text-anchor="middle" xml:space="preserve">31 characters, mixed with the salt</text>
<text x="50.0" y="490.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="start" >The same password made twice → different fingerprints, because the salt is different.</text>
<rect x="50.0" y="506.0" width="600.0" height="54.0" rx="8" fill="#e6edf5" stroke="#336791" stroke-width="1.4" />
<g transform="translate(74 533) scale(0.66) translate(-74 -533)">
<path d="M59 522 L59 544 A15 5 0 0 0 89 544 L89 522" fill="none" stroke="#336791" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<ellipse cx="74" cy="522" rx="15" ry="5" fill="none" stroke="#336791" stroke-width="2"/>
<path d="M59 533 A15 5 0 0 0 89 533" fill="none" stroke="#336791" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
</g>
<text x="98.0" y="528.0" font-size="12.5" font-weight="700" fill="#1e2a4a" text-anchor="start" xml:space="preserve">stored in the <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12" fill="#336791" font-weight="800">password_hash</tspan> column of the <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12" fill="#336791" font-weight="800">users</tspan> table:</text>
<text x="98.0" y="548.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" >only this fingerprint; the password itself is never stored</text>
<rect x="690.0" y="100.0" width="480.0" height="476.0" rx="14" fill="#ffffff" stroke="#e0dcd2" stroke-width="1.6" />
<text x="710.0" y="130.0" font-size="15" font-weight="800" fill="#1e2a4a" text-anchor="start" xml:space="preserve">At <tspan>login</tspan> (<tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="14" font-weight="800">POST</tspan> <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="14" font-weight="800">/auth/login</tspan>)</text>
<rect x="710.0" y="148.0" width="210.0" height="74.0" rx="10" fill="#ffffff" stroke="#1e2a4a" stroke-width="1.5" />
<text x="726.0" y="172.0" font-size="13" font-weight="800" fill="#1e2a4a" text-anchor="start" >the typed password</text>
<text x="726.0" y="196.0" font-size="12.5" font-weight="700" fill="#1e2a4a" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">••••••••••••••••</text>
<rect x="940.0" y="148.0" width="210.0" height="74.0" rx="10" fill="#e6edf5" stroke="#336791" stroke-width="1.5" />
<text x="956.0" y="172.0" font-size="13" font-weight="800" fill="#1e2a4a" text-anchor="start" >the stored fingerprint</text>
<text x="956.0" y="196.0" font-size="12.5" font-weight="800" fill="#336791" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">$2b$12$mCgEV8BH…</text>
<text x="956.0" y="213.0" font-size="11.5" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">from <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11" fill="#1e2a4a" font-weight="700">users.password_hash</tspan></text>
<line x1="815.0" y1="224.0" x2="900.0" y2="262.0" stroke="#1a7f37" stroke-width="2.2" stroke-linecap="round" />
<path d="M892.0 262.5 L900.0 262.0 L895.1 255.7" fill="none" stroke="#1a7f37" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
<line x1="1045.0" y1="224.0" x2="960.0" y2="262.0" stroke="#1a7f37" stroke-width="2.2" stroke-linecap="round" />
<path d="M964.9 255.7 L960.0 262.0 L968.0 262.5" fill="none" stroke="#1a7f37" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
<rect x="780.0" y="266.0" width="300.0" height="104.0" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="2" />
<text x="930.0" y="292.0" font-size="15" font-weight="800" fill="#1e2a4a" text-anchor="middle" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">bcrypt.compare()</text>
<text x="930.0" y="316.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="middle" >reads the version, cost, and salt</text>
<text x="930.0" y="334.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="middle" >from that fingerprint text, then</text>
<text x="930.0" y="352.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="middle" >computes again</text>
<line x1="860.0" y1="372.0" x2="800.0" y2="412.0" stroke="#2a9d5c" stroke-width="2.2" stroke-linecap="round" />
<path d="M803.8 405.0 L800.0 412.0 L808.0 411.2" fill="none" stroke="#2a9d5c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
<line x1="1000.0" y1="372.0" x2="1060.0" y2="412.0" stroke="#e63946" stroke-width="2.2" stroke-linecap="round" />
<path d="M1052.0 411.2 L1060.0 412.0 L1056.2 405.0" fill="none" stroke="#e63946" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
<rect x="755.0" y="416.0" width="70.0" height="26.0" rx="13.0" fill="#e3f4ea" stroke="#2a9d5c" stroke-width="1.4" />
<text x="790.0" y="433.9" font-size="13.5" font-weight="800" fill="#2a9d5c" text-anchor="middle" xml:space="preserve"><tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12.4" font-weight="800">true</tspan></text>
<rect x="1032.0" y="416.0" width="76.0" height="26.0" rx="13.0" fill="#fde6e8" stroke="#e63946" stroke-width="1.4" />
<text x="1070.0" y="433.9" font-size="13.5" font-weight="800" fill="#e63946" text-anchor="middle" xml:space="preserve"><tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12.4" font-weight="800">false</tspan></text>
<text x="790.0" y="464.0" font-size="12" font-weight="700" fill="#1e2a4a" text-anchor="middle" >a match: session and wristband</text>
<text x="790.0" y="481.0" font-size="12" font-weight="700" fill="#1e2a4a" text-anchor="middle" >created (Concept 4)</text>
<text x="1070.0" y="464.0" font-size="12" font-weight="700" fill="#e63946" text-anchor="middle" >no match: 401</text>
<text x="1070.0" y="481.0" font-size="11.5" font-weight="800" fill="#e63946" text-anchor="middle" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">wrong email or password</text>
<rect x="710.0" y="504.0" width="440.0" height="60.0" rx="8" fill="#eef1f5" />
<text x="726.0" y="528.0" font-size="12.5" font-weight="700" fill="#1e2a4a" text-anchor="start" >The password is never reversed from the fingerprint:</text>
<text x="726.0" y="547.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" >what gets compared is two fingerprints.</text>
<rect x="30.0" y="594.0" width="640.0" height="226.0" rx="12" fill="#ffffff" stroke="#e0dcd2" stroke-width="1.6" />
<text x="50.0" y="622.0" font-size="14.5" font-weight="800" fill="#1e2a4a" text-anchor="start" >Why bcrypt, not SHA-256?</text>
<line x1="56.0" y1="646.0" x2="68.0" y2="658.0" stroke="#e63946" stroke-width="2.4" stroke-linecap="round" />
<line x1="56.0" y1="658.0" x2="68.0" y2="646.0" stroke="#e63946" stroke-width="2.4" stroke-linecap="round" />
<text x="84.0" y="657.0" font-size="13" font-weight="800" fill="#1e2a4a" text-anchor="start" >SHA-256 (warm-up step 1): too fast for passwords</text>
<text x="84.0" y="678.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" >100,000 guesses in less than half a second (the author's laptop);</text>
<text x="84.0" y="696.0" font-size="12.5" font-weight="600" fill="#4a5568" text-anchor="start" >an attacker's graphics card: billions of times per second</text>
<path d="M55 728 L60 734 L70 722" fill="none" stroke="#2a9d5c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
<text x="84.0" y="733.0" font-size="13" font-weight="800" fill="#1a7f37" text-anchor="start" >bcrypt, cost factor 12: slow on purpose</text>
<text x="84.0" y="754.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" >about 0.3 seconds for one guess (up to about 1 second</text>
<text x="84.0" y="772.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" >when the laptop is busy); a million guesses on one core:</text>
<text x="84.0" y="790.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" >about 3.5 days; the fastest graphics card: thousands per second</text>
<text x="84.0" y="810.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="start" >Cost factor up by one = twice as long.</text>
<rect x="690.0" y="594.0" width="480.0" height="226.0" rx="12" fill="#ffffff" stroke="#e0dcd2" stroke-width="1.6" />
<text x="710.0" y="622.0" font-size="14.5" font-weight="800" fill="#1e2a4a" text-anchor="start" >Password rules of backend v0.5</text>
<rect x="712.0" y="643.0" width="13.0" height="13.0" rx="3" fill="#1a7f37" stroke="#1a7f37" stroke-width="1.4" />
<path d="M715 649.8 L717.6 652.4 L722.2 646.8" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
<text x="736.0" y="654.0" font-size="12.5" font-weight="700" fill="#1e2a4a" text-anchor="start" xml:space="preserve">at least 15 characters, no mixing rules:</text>
<text x="736.0" y="673.0" font-size="12.5" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">use a passphrase (NIST SP 800-63B-4)</text>
<rect x="712.0" y="699.0" width="13.0" height="13.0" rx="3" fill="#1a7f37" stroke="#1a7f37" stroke-width="1.4" />
<path d="M715 705.8 L717.6 708.4 L722.2 702.8" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
<text x="736.0" y="710.0" font-size="12.5" font-weight="700" fill="#1e2a4a" text-anchor="start" xml:space="preserve">at most 72 <tspan>bytes</tspan>: anything longer is refused,</text>
<text x="736.0" y="729.0" font-size="12.5" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">not silently cut</text>
<rect x="712.0" y="755.0" width="13.0" height="13.0" rx="3" fill="#1a7f37" stroke="#1a7f37" stroke-width="1.4" />
<path d="M715 761.8 L717.6 764.4 L722.2 758.8" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
<text x="736.0" y="766.0" font-size="12.5" font-weight="700" fill="#1e2a4a" text-anchor="start" xml:space="preserve">wrong email = wrong password: the same message</text>
<text x="736.0" y="785.0" font-size="12.5" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">and time (bcrypt on a dummy fingerprint)</text>
<text x="1178.0" y="846.0" font-size="11" font-weight="400" fill="#8a8f9c" text-anchor="end" >Fullstack IoT Developer curriculum · CC BY 4.0</text>
</svg>
