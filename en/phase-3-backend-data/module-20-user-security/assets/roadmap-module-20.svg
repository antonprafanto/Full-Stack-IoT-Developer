<text x="80.0" y="632.0" font-size="14" font-weight="600" fill="#4a5568" text-anchor="start" >Two paths: the device (Node 1 and the Pi gateway) or the laptop (a laptop broker and the Module 19 simulator). No firmware changes this week.</text>
<text x="80.0" y="654.0" font-size="14" font-weight="600" fill="#4a5568" text-anchor="start" >Almost everything happens on the laptop: the backend, the database, Bruno, the terminal, and the browser (Chrome or Edge).</text>
