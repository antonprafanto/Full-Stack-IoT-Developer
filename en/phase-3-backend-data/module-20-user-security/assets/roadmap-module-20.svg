<text x="142.0" y="562.0" font-size="13" font-weight="700" fill="#4a5568" text-anchor="start" xml:space="preserve">to pass: no <tspan>login</tspan> → 401, a <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12" fill="#4a5568" font-weight="800">viewer</tspan> turning the relay on → 403</text>
