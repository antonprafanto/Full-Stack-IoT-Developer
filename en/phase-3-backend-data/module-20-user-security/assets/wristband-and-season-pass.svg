<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<rect width="1200" height="1080" fill="#fffdf7"/>
<text x="600.0" y="44.0" font-size="28" font-weight="800" fill="#1e2a4a" text-anchor="middle" xml:space="preserve"><tspan>Refresh tokens</tspan> and <tspan>logout</tspan>: a season pass at the ticket booth</text>
<text x="600.0" y="76.0" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">Concept 7 · wristband = <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="14.5">access</tspan> cookie (15 minutes) · season pass = <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="14.5">session</tspan> cookie (only to <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="14.5">/auth/…</tspan>, at most 7 days)</text>
<rect x="265.0" y="100.0" width="150.0" height="34.0" rx="8" fill="#ffffff" stroke="#1e2a4a" stroke-width="1.5" />
<text x="340.0" y="122.0" font-size="13.5" font-weight="800" fill="#1e2a4a" text-anchor="middle" >client</text>
<rect x="655.0" y="100.0" width="150.0" height="34.0" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.8" />
<text x="730.0" y="122.0" font-size="13.5" font-weight="800" fill="#1e2a4a" text-anchor="middle" >backend</text>
<rect x="975.0" y="100.0" width="150.0" height="34.0" rx="8" fill="#e6edf5" stroke="#336791" stroke-width="1.8" />
<text x="1050.0" y="122.0" font-size="13.5" font-weight="800" fill="#1e2a4a" text-anchor="middle" xml:space="preserve">the <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13" fill="#336791" font-weight="800">sessions</tspan> table</text>
<text x="340.0" y="154.0" font-size="11.5" font-weight="600" fill="#4a5568" text-anchor="middle" >browser, Bruno, small terminal</text>
<text x="1050.0" y="154.0" font-size="11.5" font-weight="600" fill="#4a5568" text-anchor="middle" xml:space="preserve">one row per <tspan>login</tspan></text>
<rect x="30.0" y="164.0" width="1140.0" height="122.0" rx="0" fill="#eef1f5" />
<rect x="30.0" y="286.0" width="1140.0" height="90.0" rx="0" fill="#ffffff" />
<rect x="30.0" y="376.0" width="1140.0" height="82.0" rx="0" fill="#eef1f5" />
<rect x="30.0" y="458.0" width="1140.0" height="148.0" rx="0" fill="#ffffff" />
<rect x="30.0" y="606.0" width="1140.0" height="172.0" rx="0" fill="#eef1f5" />
<rect x="30.0" y="778.0" width="1140.0" height="118.0" rx="0" fill="#ffffff" />
<rect x="30.0" y="896.0" width="1140.0" height="90.0" rx="0" fill="#eef1f5" />
