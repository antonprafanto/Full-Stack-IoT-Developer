<line x1="1050.0" y1="164.0" x2="1050.0" y2="986.0" stroke="#d5dbe3" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5" />
<line x1="30.0" y1="164.0" x2="1170.0" y2="164.0" stroke="#e0dcd2" stroke-width="1" stroke-linecap="round" />
<circle cx="50.0" cy="192.0" r="12" fill="#1a7f37" stroke="#ffffff" stroke-width="2" />
<text x="50.0" y="196.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >1</text>
<text x="70.0" y="196.0" font-size="13.5" font-weight="800" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan>Login</tspan></text>
<text x="70.0" y="215.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">email + password</text>
<text x="70.0" y="233.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">checked by bcrypt (Concept 3)</text>
<line x1="344.0" y1="198.0" x2="724.0" y2="198.0" stroke="#1e2a4a" stroke-width="2.2" stroke-linecap="round" />
<path d="M716.9 201.8 L724.0 198.0 L716.9 194.2" fill="none" stroke="#1e2a4a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
<text x="535.0" y="191.0" font-size="12" font-weight="700" fill="#1e2a4a" text-anchor="middle" xml:space="preserve"><tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" font-weight="800">POST /auth/login</tspan></text>
<line x1="734.0" y1="222.0" x2="1044.0" y2="222.0" stroke="#336791" stroke-width="2.2" stroke-linecap="round" />
<path d="M1036.9 225.8 L1044.0 222.0 L1036.9 218.2" fill="none" stroke="#336791" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
<text x="890.0" y="215.0" font-size="12" font-weight="700" fill="#336791" text-anchor="middle" xml:space="preserve">new row</text>
<text x="890.0" y="240.0" font-size="11.5" font-weight="600" fill="#4a5568" text-anchor="middle" xml:space="preserve"><tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11" fill="#1e2a4a" font-weight="700">token_hash</tspan> = SHA-256 fingerprint of the pass</text>
<line x1="726.0" y1="270.0" x2="346.0" y2="270.0" stroke="#1a7f37" stroke-width="2.2" stroke-linecap="round" />
<path d="M353.1 266.2 L346.0 270.0 L353.1 273.8" fill="none" stroke="#1a7f37" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
<text x="535.0" y="263.0" font-size="12" font-weight="700" fill="#1a7f37" text-anchor="middle" xml:space="preserve">two <tspan>cookie</tspan>s: wristband (15 minutes) + season pass</text>
<circle cx="50.0" cy="312.0" r="12" fill="#1a7f37" stroke="#ffffff" stroke-width="2" />
<text x="50.0" y="316.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >2</text>
<text x="70.0" y="316.0" font-size="13.5" font-weight="800" fill="#1e2a4a" text-anchor="start" xml:space="preserve">For 15 minutes</text>
<text x="70.0" y="335.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">every request</text>
<text x="70.0" y="353.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">brings the wristband</text>
<line x1="344.0" y1="316.0" x2="724.0" y2="316.0" stroke="#1e2a4a" stroke-width="2.2" stroke-linecap="round" />
<path d="M716.9 319.8 L724.0 316.0 L716.9 312.2" fill="none" stroke="#1e2a4a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
<text x="535.0" y="309.0" font-size="12" font-weight="700" fill="#1e2a4a" text-anchor="middle" xml:space="preserve"><tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" font-weight="800">GET</tspan> <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" font-weight="800">/devices</tspan> + wristband</text>
<line x1="726.0" y1="352.0" x2="346.0" y2="352.0" stroke="#2a9d5c" stroke-width="2.2" stroke-linecap="round" />
<path d="M353.1 348.2 L346.0 352.0 L353.1 355.8" fill="none" stroke="#2a9d5c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
<text x="535.0" y="345.0" font-size="12" font-weight="700" fill="#2a9d5c" text-anchor="middle" xml:space="preserve">200</text>
<text x="890.0" y="330.0" font-size="12" font-weight="700" fill="#1e2a4a" text-anchor="middle" xml:space="preserve">only the signature and <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" font-weight="800">exp</tspan> are checked:</text>
<text x="890.0" y="348.0" font-size="12" font-weight="700" fill="#1e2a4a" text-anchor="middle" >the database isn't opened</text>
<circle cx="50.0" cy="404.0" r="12" fill="#1a7f37" stroke="#ffffff" stroke-width="2" />
<text x="50.0" y="408.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >3</text>
<text x="70.0" y="408.0" font-size="13.5" font-weight="800" fill="#1e2a4a" text-anchor="start" xml:space="preserve">Stale wristband</text>
<text x="70.0" y="427.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">15 minutes later</text>
<line x1="344.0" y1="408.0" x2="724.0" y2="408.0" stroke="#1e2a4a" stroke-width="2.2" stroke-linecap="round" />
<path d="M716.9 411.8 L724.0 408.0 L716.9 404.2" fill="none" stroke="#1e2a4a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
<text x="535.0" y="401.0" font-size="12" font-weight="700" fill="#1e2a4a" text-anchor="middle" xml:space="preserve"><tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" font-weight="800">GET</tspan> <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" font-weight="800">/devices</tspan> + stale wristband</text>
<line x1="726.0" y1="442.0" x2="346.0" y2="442.0" stroke="#e63946" stroke-width="2.2" stroke-linecap="round" />
<path d="M353.1 438.2 L346.0 442.0 L353.1 445.8" fill="none" stroke="#e63946" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
<text x="535.0" y="435.0" font-size="12" font-weight="700" fill="#e63946" text-anchor="middle" xml:space="preserve">401</text>
<circle cx="50.0" cy="486.0" r="12" fill="#1a7f37" stroke="#ffffff" stroke-width="2" />
<text x="50.0" y="490.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >4</text>
<text x="70.0" y="490.0" font-size="13.5" font-weight="800" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan>Refresh</tspan>: rotation</text>
<text x="70.0" y="509.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">the role is read again</text>
<text x="70.0" y="527.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">from table <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#1e2a4a" font-weight="700">users</tspan></text>
<line x1="344.0" y1="490.0" x2="724.0" y2="490.0" stroke="#1e2a4a" stroke-width="2.2" stroke-linecap="round" />
<path d="M716.9 493.8 L724.0 490.0 L716.9 486.2" fill="none" stroke="#1e2a4a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
<text x="535.0" y="483.0" font-size="12" font-weight="700" fill="#1e2a4a" text-anchor="middle" xml:space="preserve"><tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" font-weight="800">POST</tspan> <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" font-weight="800">/auth/refresh</tspan> + season pass</text>
<line x1="734.0" y1="520.0" x2="1044.0" y2="520.0" stroke="#336791" stroke-width="2.2" stroke-linecap="round" />
<path d="M1036.9 523.8 L1044.0 520.0 L1036.9 516.2" fill="none" stroke="#336791" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
<text x="890.0" y="513.0" font-size="12" font-weight="700" fill="#336791" text-anchor="middle" xml:space="preserve">the pass matches <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#336791" font-weight="800">token_hash</tspan></text>
<text x="890.0" y="538.0" font-size="11.5" font-weight="600" fill="#4a5568" text-anchor="middle" xml:space="preserve"><tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11" fill="#1e2a4a" font-weight="700">previous_token_hash</tspan> ← <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11" fill="#1e2a4a" font-weight="700">token_hash</tspan></text>
<text x="890.0" y="555.0" font-size="11.5" font-weight="600" fill="#4a5568" text-anchor="middle" xml:space="preserve"><tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11" fill="#1e2a4a" font-weight="700">token_hash</tspan> ← SHA-256 of the new pass</text>
<line x1="726.0" y1="590.0" x2="346.0" y2="590.0" stroke="#1a7f37" stroke-width="2.2" stroke-linecap="round" />
<path d="M353.1 586.2 L346.0 590.0 L353.1 593.8" fill="none" stroke="#1a7f37" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
<text x="535.0" y="583.0" font-size="12" font-weight="700" fill="#1a7f37" text-anchor="middle" xml:space="preserve">new wristband + new pass: the old pass isn't valid anymore</text>
<circle cx="50.0" cy="634.0" r="12" fill="#1a7f37" stroke="#ffffff" stroke-width="2" />
<text x="50.0" y="638.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >5</text>
<text x="70.0" y="638.0" font-size="13.5" font-weight="800" fill="#1e2a4a" text-anchor="start" xml:space="preserve">An old pass</text>
<text x="70.0" y="657.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">used again, for example</text>
<text x="70.0" y="675.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">by its thief</text>
<line x1="344.0" y1="640.0" x2="724.0" y2="640.0" stroke="#1e2a4a" stroke-width="2.2" stroke-linecap="round" />
<path d="M716.9 643.8 L724.0 640.0 L716.9 636.2" fill="none" stroke="#1e2a4a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
<text x="535.0" y="633.0" font-size="12" font-weight="700" fill="#1e2a4a" text-anchor="middle" xml:space="preserve"><tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" font-weight="800">POST</tspan> <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" font-weight="800">/auth/refresh</tspan> + <tspan font-weight="800">old pass</tspan></text>
<line x1="734.0" y1="666.0" x2="1044.0" y2="666.0" stroke="#336791" stroke-width="2.2" stroke-linecap="round" />
<path d="M1036.9 669.8 L1044.0 666.0 L1036.9 662.2" fill="none" stroke="#336791" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
<text x="890.0" y="659.0" font-size="12" font-weight="700" fill="#336791" text-anchor="middle" xml:space="preserve">matches <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#336791" font-weight="800">previous_token_hash</tspan></text>
<rect x="240.0" y="690.0" width="440.0" height="76.0" rx="10" fill="#fdeedd" stroke="#b45f17" stroke-width="1.4" />
<text x="256.0" y="714.0" font-size="12.5" font-weight="600" fill="#b45f17" text-anchor="start" xml:space="preserve"><tspan font-weight="800">less than 30 seconds</tspan> since it was replaced: grace period</text>
<text x="256.0" y="734.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">e.g. two tabs that <tspan>refresh</tspan> at the same time:</text>
<text x="256.0" y="752.0" font-size="12" font-weight="700" fill="#1e2a4a" text-anchor="start" >a new wristband is enough, the session stays</text>
<rect x="700.0" y="690.0" width="456.0" height="76.0" rx="10" fill="#fde6e8" stroke="#e63946" stroke-width="1.4" />
<text x="716.0" y="714.0" font-size="12.5" font-weight="600" fill="#e63946" text-anchor="start" xml:space="preserve"><tspan font-weight="800">30 seconds or more</tspan>: probably stolen</text>
<text x="716.0" y="734.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" >session revoked (its row deleted): you and</text>
<text x="716.0" y="752.0" font-size="12" font-weight="700" fill="#1e2a4a" text-anchor="start" xml:space="preserve">the thief both need a new <tspan>login</tspan></text>
<circle cx="50.0" cy="806.0" r="12" fill="#1a7f37" stroke="#ffffff" stroke-width="2" />
<text x="50.0" y="810.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >6</text>
<text x="70.0" y="810.0" font-size="13.5" font-weight="800" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan>Logout</tspan></text>
<text x="70.0" y="829.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">the season pass</text>
<text x="70.0" y="847.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">dies instantly</text>
<line x1="344.0" y1="812.0" x2="724.0" y2="812.0" stroke="#1e2a4a" stroke-width="2.2" stroke-linecap="round" />
<path d="M716.9 815.8 L724.0 812.0 L716.9 808.2" fill="none" stroke="#1e2a4a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
<text x="535.0" y="805.0" font-size="12" font-weight="700" fill="#1e2a4a" text-anchor="middle" xml:space="preserve"><tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" font-weight="800">POST /auth/logout</tspan></text>
<line x1="734.0" y1="840.0" x2="1044.0" y2="840.0" stroke="#336791" stroke-width="2.2" stroke-linecap="round" />
<path d="M1036.9 843.8 L1044.0 840.0 L1036.9 836.2" fill="none" stroke="#336791" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
<text x="890.0" y="833.0" font-size="12" font-weight="700" fill="#336791" text-anchor="middle" xml:space="preserve">row deleted</text>
<line x1="726.0" y1="880.0" x2="346.0" y2="880.0" stroke="#1e2a4a" stroke-width="2.2" stroke-linecap="round" />
<path d="M353.1 876.2 L346.0 880.0 L353.1 883.8" fill="none" stroke="#1e2a4a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
<text x="535.0" y="873.0" font-size="12" font-weight="700" fill="#1e2a4a" text-anchor="middle" xml:space="preserve">both <tspan>cookie</tspan>s emptied; that session's Socket.IO cut</text>
<circle cx="50.0" cy="924.0" r="12" fill="#1a7f37" stroke="#ffffff" stroke-width="2" />
<text x="50.0" y="928.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >7</text>
<text x="70.0" y="928.0" font-size="13.5" font-weight="800" fill="#1e2a4a" text-anchor="start" xml:space="preserve">Seven days</text>
<text x="70.0" y="947.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">after the <tspan>login</tspan>, even</text>
<text x="70.0" y="965.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">with diligent <tspan>refresh</tspan></text>
<line x1="344.0" y1="930.0" x2="724.0" y2="930.0" stroke="#1e2a4a" stroke-width="2.2" stroke-linecap="round" />
<path d="M716.9 933.8 L724.0 930.0 L716.9 926.2" fill="none" stroke="#1e2a4a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
<text x="535.0" y="923.0" font-size="12" font-weight="700" fill="#1e2a4a" text-anchor="middle" xml:space="preserve"><tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" font-weight="800">POST</tspan> <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" font-weight="800">/auth/refresh</tspan> + season pass</text>
<line x1="734.0" y1="948.0" x2="1044.0" y2="948.0" stroke="#336791" stroke-width="2.2" stroke-linecap="round" />
<path d="M1036.9 951.8 L1044.0 948.0 L1036.9 944.2" fill="none" stroke="#336791" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
<text x="890.0" y="941.0" font-size="12" font-weight="700" fill="#336791" text-anchor="middle" xml:space="preserve"><tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#336791" font-weight="800">expires_at</tspan> has passed</text>
<line x1="726.0" y1="966.0" x2="346.0" y2="966.0" stroke="#e63946" stroke-width="2.2" stroke-linecap="round" />
<path d="M353.1 962.2 L346.0 966.0 L353.1 969.8" fill="none" stroke="#e63946" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
<text x="535.0" y="959.0" font-size="12" font-weight="700" fill="#e63946" text-anchor="middle" xml:space="preserve">401: session over, new <tspan>login</tspan></text>
