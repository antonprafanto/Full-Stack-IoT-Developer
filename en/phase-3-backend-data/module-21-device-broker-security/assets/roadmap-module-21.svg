<text x="751.0" y="248.0" font-size="14" font-weight="800" fill="#e63946" text-anchor="middle" >YOU ARE HERE</text>
<text x="813.0" y="248.0" font-size="14" font-weight="700" fill="#1a7f37" text-anchor="start" >← the house is locked for devices:</text>
<text x="831.0" y="268.0" font-size="14" font-weight="700" fill="#1a7f37" text-anchor="start" >a key per device, broker accounts, an access list</text>
<rect x="60.0" y="290.0" width="1080.0" height="464.0" rx="14" fill="#ffffff" stroke="#e0dcd2" stroke-width="1.6" />
<text x="80.0" y="322.0" font-size="17" font-weight="700" fill="#1e2a4a" text-anchor="start" >Module 21 this week (9–11 hours, spread out)</text>
<text x="1120.0" y="322.0" font-size="14" font-weight="700" fill="#4a5568" text-anchor="end" >⭐ = required to pass</text>
<text x="80.0" y="346.0" font-size="14" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">Kit A + B or just a laptop · a direct continuation of Module 20: backend v0.5 with accounts and <tspan font-style="italic">login</tspan></text>
<rect x="80.0" y="371.0" width="50.0" height="22.0" rx="11" fill="#1a7f37" />
<path d="M99.17 379.88 A6.2 6.2 0 0 1 110.37 378.90" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
<path d="M107.42 377.20 L110.37 378.90 L110.37 375.50" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
<path d="M110.83 384.12 A6.2 6.2 0 0 1 99.63 385.10" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
<path d="M102.58 386.80 L99.63 385.10 L99.63 388.50" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
<text x="142.0" y="387.0" font-size="15" font-weight="400" fill="#1e2a4a" text-anchor="start" xml:space="preserve">JavaScript warm-up: random keys, a fingerprint and</text>
<text x="142.0" y="408.0" font-size="15" font-weight="400" fill="#1e2a4a" text-anchor="start" xml:space="preserve">a fair comparison, the topic pattern <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13.8" font-weight="700">%u</tspan>, a guest book <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13.8" font-weight="700">Map</tspan>,</text>
<text x="142.0" y="429.0" font-size="15" font-weight="400" fill="#1e2a4a" text-anchor="start" xml:space="preserve">a password in a packet is just <tspan font-style="italic">bytes</tspan></text>
<rect x="80.0" y="447.0" width="50.0" height="22.0" rx="11.0" fill="#1a7f37" />
<text x="105.0" y="462.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle" >QW</text>
<text x="142.0" y="463.0" font-size="15" font-weight="400" fill="#1e2a4a" text-anchor="start" xml:space="preserve">Quick Win: a practice broker that rejects</text>
<text x="142.0" y="484.0" font-size="15" font-weight="400" fill="#1e2a4a" text-anchor="start" xml:space="preserve">guests without a password</text>
<rect x="80.0" y="503.0" width="50.0" height="22.0" rx="11.0" fill="#1a7f37" />
<text x="105.0" y="518.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle" >P1</text>
<text x="142.0" y="519.0" font-size="15" font-weight="400" fill="#1e2a4a" text-anchor="start" xml:space="preserve">the registry and device keys</text>
<rect x="80.0" y="537.0" width="50.0" height="22.0" rx="11.0" fill="#1a7f37" />
<text x="105.0" y="552.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle" >P2</text>
<text x="142.0" y="553.0" font-size="15" font-weight="400" fill="#1e2a4a" text-anchor="start" xml:space="preserve">the second layer and a broker account for the backend</text>
<rect x="80.0" y="571.0" width="50.0" height="22.0" rx="11.0" fill="#1a7f37" />
<text x="105.0" y="586.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle" >P3</text>
<text x="142.0" y="587.0" font-size="15" font-weight="400" fill="#1e2a4a" text-anchor="start" xml:space="preserve">Node 1 and the tools install their keys</text>
<rect x="80.0" y="605.0" width="50.0" height="22.0" rx="11.0" fill="#1a7f37" />
<text x="105.0" y="620.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle" >P4</text>
<text x="142.0" y="621.0" font-size="15" font-weight="400" fill="#1e2a4a" text-anchor="start" xml:space="preserve">locking the broker's door ⭐</text>
<text x="142.0" y="640.0" font-size="13" font-weight="700" fill="#4a5568" text-anchor="start" xml:space="preserve">pass requirement: MQTTX without a password is rejected by the broker</text>
<rect x="580.0" y="371.0" width="50.0" height="22.0" rx="11.0" fill="#1a7f37" />
<text x="605.0" y="386.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle" >P5</text>
<text x="642.0" y="387.0" font-size="15" font-weight="400" fill="#1e2a4a" text-anchor="start" xml:space="preserve">the access list: every device on its own topic</text>
<rect x="580.0" y="405.0" width="50.0" height="22.0" rx="11.0" fill="#1a7f37" />
<text x="605.0" y="420.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle" >P6</text>
<text x="642.0" y="421.0" font-size="15" font-weight="400" fill="#1e2a4a" text-anchor="start" xml:space="preserve">the intruder is rejected and logged ⭐</text>
<text x="642.0" y="440.0" font-size="13" font-weight="700" fill="#4a5568" text-anchor="start" xml:space="preserve">pass requirement: a device that "impersonates" another's topic is rejected</text>
<rect x="580.0" y="459.0" width="50.0" height="22.0" rx="11.0" fill="#1a7f37" />
<text x="605.0" y="474.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle" >P7</text>
<text x="642.0" y="475.0" font-size="15" font-weight="400" fill="#1e2a4a" text-anchor="start" xml:space="preserve">revoking a lost device's key ⭐</text>
<text x="642.0" y="494.0" font-size="13" font-weight="700" fill="#4a5568" text-anchor="start" xml:space="preserve">pass requirement: a device whose key is revoked can no longer send data</text>
<rect x="580.0" y="513.0" width="50.0" height="22.0" rx="11.0" fill="#1a7f37" />
<text x="605.0" y="528.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle" >P8</text>
<text x="642.0" y="529.0" font-size="15" font-weight="400" fill="#1e2a4a" text-anchor="start" xml:space="preserve">honest about encryption, and the pass tests ⭐</text>
<rect x="580.0" y="547.0" width="50.0" height="22.0" rx="11.0" fill="#1e2a4a" />
<text x="605.0" y="563.4" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle" >+</text>
<text x="642.0" y="563.0" font-size="15" font-weight="400" fill="#1e2a4a" text-anchor="start" xml:space="preserve">Add-on: backend v1.0, data contract 1.4, and</text>
<text x="642.0" y="584.0" font-size="15" font-weight="400" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-style="italic">pull request</tspan> "device security" ⭐</text>
<text x="80.0" y="678.0" font-size="14" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve"><tspan font-weight="800" fill="#1e2a4a">The order matters:</tspan> install the keys first (Practices 1–3), then change the lock: the broker is locked in Practice 4.</text>
<text x="80.0" y="706.0" font-size="14" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve"><tspan font-weight="800" fill="#1e2a4a">Three paths:</tspan> the device (the Pi gateway, Node 1, and a Node 2 board borrowed as an intruder),</text>
<text x="80.0" y="728.0" font-size="14" font-weight="600" fill="#4a5568" text-anchor="start" >the laptop (Mosquitto on the laptop, the simulator, and MQTTX as the intruder), or Wokwi (firmware v1.6.0 only).</text>
<text x="1178.0" y="782.0" font-size="12" font-weight="400" fill="#8a8f9c" text-anchor="end" >Fullstack IoT Developer Curriculum · CC BY 4.0</text>
