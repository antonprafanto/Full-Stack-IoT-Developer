<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="968" viewBox="0 0 1200 968" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<rect width="1200" height="968" fill="#fffdf7"/>
<text x="600.0" y="44.0" font-size="28" font-weight="800" fill="#1e2a4a" text-anchor="middle" xml:space="preserve">Revoking a lost device's key: two layers</text>
<text x="600.0" y="76.0" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">Concept 9 · example: the Node 1 board <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="14.5">a4cf12e5b7c0</tspan> is lost · revoked in two places, exactly the way the key was installed</text>
<line x1="62.0" y1="128.0" x2="62.0" y2="880.0" stroke="#d5dbe3" stroke-width="3" stroke-linecap="round" />
<circle cx="62.0" cy="128.0" r="9" fill="#ffffff" stroke="#9aa3b0" stroke-width="2.4" />
<g transform="translate(108 132) scale(0.72) translate(-108 -132)">
<rect x="93.0" y="112.0" width="30.0" height="40.0" rx="3" fill="none" stroke="#9aa3b0" stroke-width="2" />
<rect x="99.0" y="118.0" width="18.0" height="14.0" rx="2" fill="none" stroke="#9aa3b0" stroke-width="1.6" />
<line x1="93.0" y1="122.0" x2="88.0" y2="122.0" stroke="#9aa3b0" stroke-width="1.6" stroke-linecap="round" />
<line x1="123.0" y1="122.0" x2="128.0" y2="122.0" stroke="#9aa3b0" stroke-width="1.6" stroke-linecap="round" />
<line x1="93.0" y1="130.0" x2="88.0" y2="130.0" stroke="#9aa3b0" stroke-width="1.6" stroke-linecap="round" />
<line x1="123.0" y1="130.0" x2="128.0" y2="130.0" stroke="#9aa3b0" stroke-width="1.6" stroke-linecap="round" />
<line x1="93.0" y1="138.0" x2="88.0" y2="138.0" stroke="#9aa3b0" stroke-width="1.6" stroke-linecap="round" />
<line x1="123.0" y1="138.0" x2="128.0" y2="138.0" stroke="#9aa3b0" stroke-width="1.6" stroke-linecap="round" />
<line x1="93.0" y1="146.0" x2="88.0" y2="146.0" stroke="#9aa3b0" stroke-width="1.6" stroke-linecap="round" />
<line x1="123.0" y1="146.0" x2="128.0" y2="146.0" stroke="#9aa3b0" stroke-width="1.6" stroke-linecap="round" />
</g>
<text x="134.0" y="128.0" font-size="14" font-weight="800" fill="#1e2a4a" text-anchor="start" >The Node 1 board is lost, or a test board is lent to a friend</text>
<text x="134.0" y="148.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="start" >the key inside it is still valid: whoever holds it can get into the broker on behalf of Node 1</text>
<circle cx="62.0" cy="192.0" r="13" fill="#1a7f37" stroke="#ffffff" stroke-width="2" />
<text x="62.0" y="197.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" >1</text>
<rect x="92.0" y="172.0" width="690.0" height="226.0" rx="12" fill="#ffffff" stroke="#1a7f37" stroke-width="1.6" />
<path d="M92.8 212.8 L92.8 184.3 Q92.8 172.8 104.3 172.8 L769.6999999999999 172.8 Q781.1999999999999 172.8 781.1999999999999 184.3 L781.1999999999999 212.8 Z" fill="#dafbe1" stroke-linecap="round" stroke-linejoin="round" />
<line x1="92.8" y1="213.0" x2="781.2" y2="213.0" stroke="#1a7f37" stroke-width="1" stroke-linecap="round" />
<text x="108.0" y="198.0" font-size="14" font-weight="800" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-weight="800" fill="#1a7f37">Layer 1</tspan> · the backend</text>
<text x="766.0" y="198.0" font-size="12.5" font-weight="800" fill="#1a7f37" text-anchor="end" >effective at once</text>
<text x="108.0" y="238.0" font-size="12" font-weight="700" fill="#4a5568" text-anchor="start" >the admin sends:</text>
<rect x="108.0" y="248.0" width="300.0" height="34.4" rx="8" fill="#eef1f5" />
<text x="120.0" y="269.8" font-size="11.5" font-weight="800" fill="#1e2a4a" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">POST /devices/a4cf12e5b7c0/revoke</text>
<text x="430.0" y="266.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" >the backend removes the key fingerprint</text>
<text x="430.0" y="284.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" >and records the revocation time</text>
<line x1="108.0" y1="312.0" x2="766.0" y2="312.0" stroke="#e0dcd2" stroke-width="1" stroke-linecap="round" />
<text x="108.0" y="336.0" font-size="12.5" font-weight="700" fill="#1e2a4a" text-anchor="start" >messages from that device</text>
<text x="108.0" y="354.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="start" >from that second on:</text>
<rect x="300.0" y="322.0" width="466.0" height="30.0" rx="8" fill="#fde6e8" />
<text x="314.0" y="342.0" font-size="12" font-weight="800" fill="#e63946" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">IGNORED … its key has been revoked</text>
<text x="108.0" y="384.0" font-size="12.5" font-weight="700" fill="#1e2a4a" text-anchor="start" >a command to that device:</text>
<rect x="300.0" y="366.0" width="64.0" height="26.0" rx="13.0" fill="#fde6e8" stroke="#e63946" stroke-width="1.4" />
<text x="332.0" y="383.7" font-size="13" font-weight="800" fill="#e63946" text-anchor="middle" xml:space="preserve">409</text>
<text x="376.0" y="384.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">the answer to <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#1e2a4a" font-weight="700">POST</tspan> <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#1e2a4a" font-weight="700">/devices/:id/command</tspan> for that device</text>
<circle cx="62.0" cy="438.0" r="13" fill="#0f8b8d" stroke="#ffffff" stroke-width="2" />
<text x="62.0" y="443.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" >2</text>
<rect x="92.0" y="418.0" width="690.0" height="238.0" rx="12" fill="#ffffff" stroke="#0f8b8d" stroke-width="1.6" />
<path d="M92.8 458.8 L92.8 430.3 Q92.8 418.8 104.3 418.8 L769.6999999999999 418.8 Q781.1999999999999 418.8 781.1999999999999 430.3 L781.1999999999999 458.8 Z" fill="#e2f3f1" stroke-linecap="round" stroke-linejoin="round" />
<line x1="92.8" y1="459.0" x2="781.2" y2="459.0" stroke="#0f8b8d" stroke-width="1" stroke-linecap="round" />
<text x="108.0" y="444.0" font-size="14" font-weight="800" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-weight="800" fill="#0f8b8d">Layer 2</tspan> · the broker</text>
<text x="766.0" y="444.0" font-size="12.5" font-weight="800" fill="#0f8b8d" text-anchor="end" >closing its door</text>
<text x="108.0" y="484.0" font-size="12" font-weight="700" fill="#4a5568" text-anchor="start" >on the broker machine (the Pi): remove its account, then reload</text>
<rect x="108.0" y="494.0" width="658.0" height="52.2" rx="8" fill="#eef1f5" />
<text x="120.0" y="515.8" font-size="11.5" font-weight="800" fill="#1e2a4a" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">sudo mosquitto_passwd -D /etc/mosquitto/broker-passwd a4cf12e5b7c0</text>
<text x="120.0" y="533.6" font-size="11.5" font-weight="800" fill="#1e2a4a" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">sudo systemctl reload mosquitto</text>
<line x1="108.0" y1="568.0" x2="766.0" y2="568.0" stroke="#e0dcd2" stroke-width="1" stroke-linecap="round" />
<text x="108.0" y="592.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" >according to the Mosquitto source code: all connected clients are checked again,</text>
<text x="108.0" y="612.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">and Node 1 <tspan font-weight="800" fill="#e63946">is disconnected</tspan>. The next attempt is answered</text>
<rect x="479.0" y="596.0" width="74.0" height="24.0" rx="12.0" fill="#fde6e8" stroke="#e63946" stroke-width="1.4" />
<text x="516.0" y="612.5" font-size="12.5" font-weight="800" fill="#e63946" text-anchor="middle" xml:space="preserve">code 5</text>
<text x="563.0" y="613.0" font-size="12" font-weight="800" fill="#e63946" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">Not authorized</text>
<text x="108.0" y="640.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">Node 1 writes <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#1e2a4a" font-weight="800">MQTT</tspan> <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#1e2a4a" font-weight="800">REJECTED</tspan> <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#1e2a4a" font-weight="800">by</tspan> <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#1e2a4a" font-weight="800">broker</tspan> <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#1e2a4a" font-weight="800">(code</tspan> <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#1e2a4a" font-weight="800">5)</tspan> and retries every 60 seconds</text>
<rect x="92.0" y="672.0" width="690.0" height="62.0" rx="10" fill="#fdeedd" />
<text x="108.0" y="696.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-weight="800" fill="#b45f17">The</tspan> <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12" fill="#1e2a4a" font-weight="800">offline</tspan> <tspan font-weight="800" fill="#b45f17">will isn't sent</tspan> when the account is revoked: the <tspan font-style="italic">retained</tspan> <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12" fill="#1e2a4a" font-weight="800">status</tspan> can stay <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12" fill="#1e2a4a" font-weight="800">online</tspan>.</text>
<text x="108.0" y="718.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">A device's official state is seen in <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12" font-weight="800">GET</tspan> <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12" font-weight="800">/devices</tspan> (the <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12" font-weight="800">key</tspan> column: <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12" font-weight="800">revoked</tspan>), not in <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12" font-weight="800">status</tspan>.</text>
<circle cx="62.0" cy="772.0" r="13" fill="#ffffff" stroke="#2a9d5c" stroke-width="2.4" />
<path d="M55 772 L60 778 L70 766" fill="none" stroke="#2a9d5c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
<rect x="92.0" y="752.0" width="690.0" height="160.0" rx="12" fill="#ffffff" stroke="#e0dcd2" stroke-width="1.6" />
<text x="108.0" y="778.0" font-size="14" font-weight="800" fill="#1e2a4a" text-anchor="start" >Recovery: the board has turned up</text>
<text x="766.0" y="778.0" font-size="12.5" font-weight="800" fill="#2a9d5c" text-anchor="end" >don't use its old key again</text>
<circle cx="118.0" cy="808.0" r="10" fill="#2a9d5c" stroke="#ffffff" stroke-width="2" />
<text x="118.0" y="812.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >1</text>
<text x="138.0" y="812.0" font-size="12.5" font-weight="800" fill="#1e2a4a" text-anchor="start" >backend</text>
<text x="226.0" y="812.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12" font-weight="800">POST /devices/a4cf12e5b7c0/key</tspan></text>
<text x="766.0" y="812.0" font-size="12.5" font-weight="600" fill="#4a5568" text-anchor="end" xml:space="preserve">makes a <tspan font-weight="800" fill="#2a9d5c">new key</tspan></text>
<circle cx="118.0" cy="838.0" r="10" fill="#2a9d5c" stroke="#ffffff" stroke-width="2" />
<text x="118.0" y="842.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >2</text>
<text x="138.0" y="842.0" font-size="12.5" font-weight="800" fill="#1e2a4a" text-anchor="start" >broker</text>
<text x="226.0" y="842.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12" font-weight="800">mosquitto_passwd</tspan> with the new key</text>
<text x="766.0" y="842.0" font-size="12.5" font-weight="600" fill="#4a5568" text-anchor="end" xml:space="preserve">then reload the broker</text>
<circle cx="118.0" cy="868.0" r="10" fill="#2a9d5c" stroke="#ffffff" stroke-width="2" />
<text x="118.0" y="872.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >3</text>
<text x="138.0" y="872.0" font-size="12.5" font-weight="800" fill="#1e2a4a" text-anchor="start" >device</text>
<text x="226.0" y="872.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12" font-weight="800">key &lt;new value&gt;</tspan></text>
<text x="766.0" y="872.0" font-size="12.5" font-weight="600" fill="#4a5568" text-anchor="end" xml:space="preserve">in Node 1's Serial Monitor</text>
<text x="108.0" y="900.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="start" >the old key may already have been copied</text>
<rect x="802.0" y="104.0" width="368.0" height="808.0" rx="14" fill="#ffffff" stroke="#e0dcd2" stroke-width="1.6" />
<text x="822.0" y="136.0" font-size="15" font-weight="800" fill="#1e2a4a" text-anchor="start" >Reload or restart?</text>
<text x="822.0" y="156.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="start" >two different ways</text>
<rect x="818.0" y="176.0" width="336.0" height="152.0" rx="10" fill="#ffffff" stroke="#0f8b8d" stroke-width="1.4" />
<text x="834.0" y="202.0" font-size="14" font-weight="800" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-weight="800">Reload</tspan></text>
<text x="834.0" y="226.0" font-size="11.5" font-weight="700" fill="#4a5568" text-anchor="start" >if what changed:</text>
<text x="834.0" y="244.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">the password file: adding, changing, or</text>
<text x="834.0" y="262.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">removing an account with <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" font-weight="800">mosquitto_passwd</tspan></text>
<text x="834.0" y="288.0" font-size="11.5" font-weight="700" fill="#4a5568" text-anchor="start" >on the Pi:</text>
<text x="903.0" y="288.0" font-size="11.5" font-weight="800" fill="#0f8b8d" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">sudo systemctl reload mosquitto</text>
<text x="834.0" y="310.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="start" >valid connections aren't cut off</text>
<rect x="818.0" y="344.0" width="336.0" height="172.0" rx="10" fill="#ffffff" stroke="#0f8b8d" stroke-width="1.4" />
<text x="834.0" y="370.0" font-size="14" font-weight="800" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-weight="800">Restart</tspan></text>
<text x="834.0" y="394.0" font-size="11.5" font-weight="700" fill="#4a5568" text-anchor="start" >if what changed:</text>
<text x="834.0" y="412.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">the access list, or a setting like</text>
<text x="834.0" y="430.0" font-size="12.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" font-weight="800">use_username_as_clientid</tspan></text>
<text x="834.0" y="456.0" font-size="11.5" font-weight="700" fill="#4a5568" text-anchor="start" >on the Pi:</text>
<text x="903.0" y="456.0" font-size="11.5" font-weight="800" fill="#0f8b8d" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">sudo systemctl restart mosquitto</text>
<text x="834.0" y="478.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="start" >all clients reconnect</text>
<text x="834.0" y="496.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="start" >within a few seconds</text>
<rect x="818.0" y="532.0" width="336.0" height="224.0" rx="10" fill="#fde6e8" />
<text x="834.0" y="558.0" font-size="13" font-weight="800" fill="#e63946" text-anchor="start" xml:space="preserve">Why does the access list need a <tspan font-style="italic">restart</tspan>?</text>
<text x="834.0" y="582.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">According to its source code, Mosquitto 2.0.21</text>
<text x="834.0" y="600.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">(the Pi) that reloads an access list with a</text>
<text x="834.0" y="618.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">typo keeps running <tspan font-weight="800" fill="#e63946">with no access</tspan></text>
<text x="834.0" y="636.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-weight="800" fill="#e63946">list at all</tspan>: every account may</text>
<text x="834.0" y="654.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">write anywhere. The only sign is</text>
<text x="834.0" y="672.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">two <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" font-weight="800">Error</tspan> lines in the log.</text>
<text x="834.0" y="700.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">With a <tspan font-style="italic">restart</tspan>, a bad file makes the</text>
<text x="834.0" y="718.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">broker fail to start: the mistake is</text>
<text x="834.0" y="736.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">seen at once.</text>
<rect x="818.0" y="772.0" width="336.0" height="84.0" rx="10" fill="#eef1f5" />
<text x="834.0" y="796.0" font-size="12.5" font-weight="800" fill="#1e2a4a" text-anchor="start" >On the laptop</text>
<text x="834.0" y="816.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" >for both, just stop the</text>
<text x="834.0" y="834.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" >broker, then start it again</text>
<text x="1178.0" y="954.0" font-size="11" font-weight="400" fill="#8a8f9c" text-anchor="end" >Fullstack IoT Developer Curriculum · CC BY 4.0</text>
</svg>
