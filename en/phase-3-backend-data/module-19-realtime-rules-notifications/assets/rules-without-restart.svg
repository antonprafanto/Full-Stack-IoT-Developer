<text x="48.0" y="592.0" font-size="13" font-weight="800" fill="#1e2a4a" text-anchor="start" xml:space="preserve">Proof in Practice 4.8 (backend log, WIB times): threshold 32 doesn't turn the fan on at 31 °C; the threshold is lowered to 30 again, without a <tspan>restart</tspan>:</text>
