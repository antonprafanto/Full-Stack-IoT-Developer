<text x="48.0" y="685.0" font-size="11.5" font-weight="700" fill="#1e2a4a" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve"><tspan font-weight="800" fill="#1a7f37">[06:51:48]</tspan> INFO: rule 1 (Automatic fan): temperature 31 above 30; fan turned on if it lasts 120 seconds</text>
