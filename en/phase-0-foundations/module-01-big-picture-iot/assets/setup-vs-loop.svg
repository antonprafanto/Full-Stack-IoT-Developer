<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1e2a4a"/>
    </marker>
  </defs>
  <rect width="1100" height="460" fill="#fffdf7"/>
  <text x="550" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#1e2a4a">Two "rooms" in every Arduino program</text>
  <text x="550" y="68" text-anchor="middle" font-size="15" fill="#555">setup() runs ONCE when the chip powers on · loop() repeats OVER AND OVER until the power is pulled</text>

  <!-- power on -->
  <rect x="40" y="170" width="150" height="80" rx="12" fill="#e0e0e0"/>
  <text x="115" y="204" text-anchor="middle" font-size="15" font-weight="700" fill="#1e2a4a">ESP32 powers on</text>
  <text x="115" y="226" text-anchor="middle" font-size="13" fill="#555">(plug in USB / reset)</text>
  <line x1="195" y1="210" x2="255" y2="210" stroke="#1e2a4a" stroke-width="3" marker-end="url(#arr)"/>

  <!-- setup box -->
  <rect x="260" y="130" width="300" height="160" rx="14" fill="#fde4c8" stroke="#f4a261" stroke-width="3"/>
  <text x="410" y="165" text-anchor="middle" font-size="22" font-weight="700" fill="#1e2a4a" font-family="'DejaVu Sans Mono', monospace">setup()</text>
  <text x="410" y="195" text-anchor="middle" font-size="14" fill="#333">runs ONE time</text>
  <text x="410" y="222" text-anchor="middle" font-size="14" font-weight="600" fill="#1e2a4a">"morning ritual"</text>
  <text x="410" y="244" text-anchor="middle" font-size="13" fill="#555">registers the pins being used,</text>
  <text x="410" y="262" text-anchor="middle" font-size="13" fill="#555">connects to Wi-Fi (later, Module 10)</text>
  <line x1="565" y1="210" x2="625" y2="210" stroke="#1e2a4a" stroke-width="3" marker-end="url(#arr)"/>

  <!-- loop box -->
  <rect x="630" y="110" width="420" height="200" rx="14" fill="#cfe9f3" stroke="#0f8b8d" stroke-width="3"/>
  <text x="840" y="146" text-anchor="middle" font-size="22" font-weight="700" fill="#1e2a4a" font-family="'DejaVu Sans Mono', monospace">loop()</text>
  <text x="840" y="176" text-anchor="middle" font-size="13.5" fill="#333">repeats OVER AND OVER (this Blink: 1 cycle per second)</text>
  <text x="840" y="203" text-anchor="middle" font-size="14" font-weight="600" fill="#1e2a4a">"all-day routine"</text>
  <g font-family="'DejaVu Sans Mono', monospace" font-size="13" fill="#1e2a4a">
    <text x="690" y="236">digitalWrite(PIN_LED, HIGH);  → on</text>
    <text x="690" y="256">delay(500);                   → wait</text>
    <text x="690" y="276">digitalWrite(PIN_LED, LOW);   → off</text>
    <text x="690" y="296">delay(500);                   → wait</text>
  </g>
  <!-- loop arrow (circular) -->
  <path d="M1050 250 C1095 250 1095 330 1050 330 L700 330 C650 330 650 330 630 310" fill="none" stroke="#0f8b8d" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arr)"/>
  <text x="840" y="352" text-anchor="middle" font-size="14" font-weight="700" fill="#0f8b8d">finished the last line? → back to the first line. Again. Again. Again.</text>

  <!-- bottom note -->
  <rect x="40" y="380" width="1010" height="56" rx="10" fill="#fff" stroke="#e0dcd2" stroke-width="1.5"/>
  <text x="545" y="403" text-anchor="middle" font-size="14" fill="#333">There is no "done button". An ESP32 program is designed to run forever —</text>
  <text x="545" y="424" text-anchor="middle" font-size="14" fill="#333">just like an electricity meter that never "quits the app".</text>
  <text x="1060" y="452" text-anchor="end" font-size="11" fill="#999">Fullstack IoT Developer curriculum · CC BY 4.0</text>
</svg>
