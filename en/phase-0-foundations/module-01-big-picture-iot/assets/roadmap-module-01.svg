<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1200" height="430" fill="#fffdf7"/>
  <text x="600" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#1e2a4a">Mini roadmap — you are here</text>
  <text x="600" y="66" text-anchor="middle" font-size="15" fill="#555">32 modules = 32 weeks · one running project, "Mini Smart Home", that grows from a blinking LED into an online system</text>

  <!-- phase bar -->
  <g font-size="14" font-weight="600">
    <rect x="60" y="100" width="160" height="56" rx="8" fill="#f4a261"/>
    <text x="140" y="124" text-anchor="middle" fill="#1e2a4a">PHASE 0</text>
    <text x="140" y="144" text-anchor="middle" fill="#1e2a4a" font-weight="400">Foundations · M1–4</text>

    <rect x="226" y="100" width="125" height="56" rx="8" fill="#fde4c8"/>
    <text x="288.5" y="124" text-anchor="middle" fill="#1e2a4a">PHASE 1</text>
    <text x="288.5" y="144" text-anchor="middle" fill="#1e2a4a" font-weight="400">ESP32 · M5–9</text>

    <rect x="357" y="100" width="176" height="56" rx="8" fill="#cfe9f3"/>
    <text x="445" y="124" text-anchor="middle" fill="#1e2a4a">PHASE 2</text>
    <text x="445" y="144" text-anchor="middle" fill="#1e2a4a" font-weight="400">Connectivity · M10–15</text>

    <rect x="539" y="100" width="196" height="56" rx="8" fill="#d6f0e3"/>
    <text x="637" y="124" text-anchor="middle" fill="#1e2a4a">PHASE 3</text>
    <text x="637" y="144" text-anchor="middle" fill="#1e2a4a" font-weight="400">Backend &amp; data · M16–21</text>

    <rect x="741" y="100" width="170" height="56" rx="8" fill="#e6dcf5"/>
    <text x="826" y="124" text-anchor="middle" fill="#1e2a4a">PHASE 4</text>
    <text x="826" y="144" text-anchor="middle" fill="#1e2a4a" font-weight="400">Dashboard · M22–25</text>

    <rect x="917" y="100" width="223" height="56" rx="8" fill="#e0e0e0"/>
    <text x="1028.5" y="124" text-anchor="middle" fill="#1e2a4a">PHASE 5</text>
    <text x="1028.5" y="144" text-anchor="middle" fill="#1e2a4a" font-weight="400">Operations &amp; scale · M26–32</text>
  </g>

  <!-- module boxes inside Fase 0 -->
  <g font-size="13" font-weight="600" text-anchor="middle">
    <rect x="60" y="170" width="30" height="26" rx="5" fill="#e63946"/>
    <text x="75" y="188" fill="#fff">M1</text>
    <rect x="96" y="170" width="30" height="26" rx="5" fill="#fff" stroke="#f4a261" stroke-width="2"/>
    <text x="111" y="188" fill="#1e2a4a">M2</text>
    <rect x="132" y="170" width="30" height="26" rx="5" fill="#fff" stroke="#f4a261" stroke-width="2"/>
    <text x="147" y="188" fill="#1e2a4a">M3</text>
    <rect x="168" y="170" width="30" height="26" rx="5" fill="#fff" stroke="#f4a261" stroke-width="2"/>
    <text x="183" y="188" fill="#1e2a4a">M4</text>
  </g>
  <!-- pointer -->
  <path d="M75 215 L75 236" stroke="#e63946" stroke-width="3"/>
  <path d="M66 228 L75 238 L84 228" fill="none" stroke="#e63946" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="75" y="210" text-anchor="middle" font-size="13" fill="#e63946" font-weight="700">YOU ARE HERE</text>

  <!-- what M1 contributes -->
  <rect x="60" y="250" width="1080" height="150" rx="12" fill="#fff" stroke="#e0dcd2" stroke-width="1.5"/>
  <text x="80" y="280" font-size="17" font-weight="700" fill="#1e2a4a">Module 1 this week (about 6–8 hours, relaxed):</text>

  <g font-size="14" fill="#333">
    <g transform="translate(80,300)">
      <circle cx="10" cy="10" r="10" fill="#0f8b8d"/><text x="10" y="15" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text>
      <text x="28" y="15">10-minute win: a blinking LED in the Wokwi simulator</text>
    </g>
    <g transform="translate(80,330)">
      <circle cx="10" cy="10" r="10" fill="#0f8b8d"/><text x="10" y="15" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text>
      <text x="28" y="15">Concepts: what IoT is, "fullstack", microcontroller vs laptop, code → chip</text>
    </g>
    <g transform="translate(80,360)">
      <circle cx="10" cy="10" r="10" fill="#0f8b8d"/><text x="10" y="15" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text>
      <text x="28" y="15">Practice: change the blink speed → second LED → your name pattern</text>
    </g>
    <g transform="translate(620,300)">
      <circle cx="10" cy="10" r="10" fill="#f4a261"/><text x="10" y="15" text-anchor="middle" font-size="12" font-weight="700" fill="#1e2a4a">4</text>
      <text x="28" y="15">Save your work to GitHub in the browser (no installs at all)</text>
    </g>
    <g transform="translate(620,330)">
      <circle cx="10" cy="10" r="10" fill="#f4a261"/><text x="10" y="15" text-anchor="middle" font-size="12" font-weight="700" fill="#1e2a4a">5</text>
      <text x="28" y="15">Order Kit A Stage 1 ("right vs wrong" guide) + write your vision</text>
    </g>
    <g transform="translate(620,360)">
      <circle cx="10" cy="10" r="10" fill="#f4a261"/><text x="10" y="15" text-anchor="middle" font-size="12" font-weight="700" fill="#1e2a4a">6</text>
      <text x="28" y="15">How to ask good questions &amp; why "versions" matter</text>
    </g>
  </g>
  <text x="1140" y="420" text-anchor="end" font-size="11" fill="#999">Fullstack IoT Developer curriculum · CC BY 4.0</text>
</svg>
