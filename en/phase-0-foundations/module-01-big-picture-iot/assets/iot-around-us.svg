<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Inter, 'DejaVu Sans', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1e2a4a"/>
    </marker>
  </defs>
  <rect width="1200" height="560" fill="#fffdf7"/>
  <text x="600" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#1e2a4a">IoT around us: the pattern is always the same</text>
  <text x="600" y="68" text-anchor="middle" font-size="15" fill="#555">Something is MEASURED → a "small brain" handles it → SENT over a network → STORED on a server → SEEN/CONTROLLED by phone</text>

  <!-- column headers -->
  <g font-size="14" font-weight="700" fill="#0f8b8d" text-anchor="middle">
    <text x="330" y="112">SENSOR / DEVICE</text>
    <text x="530" y="112">SMALL BRAIN</text>
    <text x="730" y="112">NETWORK</text>
    <text x="930" y="112">SERVER</text>
    <text x="1110" y="112">PHONE / SCREEN</text>
  </g>

  <!-- rows -->
  <g id="row" font-size="14" fill="#333">
    <!-- Row 1: meteran listrik pintar -->
    <g transform="translate(0,130)">
      <rect x="40" y="0" width="1130" height="110" rx="12" fill="#fff" stroke="#e0dcd2" stroke-width="1.5"/>
      <text x="60" y="30" font-size="16" font-weight="700" fill="#1e2a4a">1. Smart power meter</text>
      <text x="60" y="52" font-size="13" fill="#666">at home / at the office</text>
      <text x="60" y="72" font-size="13" fill="#666">(PLN "smart prepaid")</text>
      <!-- sensor -->
      <rect x="270" y="20" width="120" height="70" rx="10" fill="#fde4c8"/>
      <text x="330" y="50" text-anchor="middle" font-weight="600">measures</text>
      <text x="330" y="70" text-anchor="middle" font-weight="600">kWh</text>
      <line x1="395" y1="55" x2="465" y2="55" stroke="#1e2a4a" stroke-width="2" marker-end="url(#arr)"/>
      <!-- brain -->
      <rect x="470" y="20" width="120" height="70" rx="10" fill="#cfe9f3"/>
      <text x="530" y="50" text-anchor="middle" font-weight="600">chip inside</text>
      <text x="530" y="70" text-anchor="middle" font-weight="600">the meter</text>
      <line x1="595" y1="55" x2="665" y2="55" stroke="#1e2a4a" stroke-width="2" marker-end="url(#arr)"/>
      <!-- network -->
      <rect x="670" y="20" width="120" height="70" rx="10" fill="#d6f0e3"/>
      <text x="730" y="50" text-anchor="middle" font-weight="600">cellular signal</text>
      <text x="730" y="70" text-anchor="middle" font-weight="600">/ radio</text>
      <line x1="795" y1="55" x2="865" y2="55" stroke="#1e2a4a" stroke-width="2" marker-end="url(#arr)"/>
      <!-- server -->
      <rect x="870" y="20" width="120" height="70" rx="10" fill="#e6dcf5"/>
      <text x="930" y="50" text-anchor="middle" font-weight="600">PLN server</text>
      <text x="930" y="70" text-anchor="middle" font-weight="600">(billing)</text>
      <line x1="995" y1="55" x2="1045" y2="55" stroke="#1e2a4a" stroke-width="2" marker-end="url(#arr)"/>
      <!-- phone -->
      <rect x="1050" y="20" width="110" height="70" rx="10" fill="#f4a261"/>
      <text x="1105" y="50" text-anchor="middle" font-weight="600" fill="#1e2a4a">app</text>
      <text x="1105" y="70" text-anchor="middle" font-weight="600" fill="#1e2a4a">on your phone</text>
    </g>

    <!-- Row 2: ojek online -->
    <g transform="translate(0,255)">
      <rect x="40" y="0" width="1130" height="110" rx="12" fill="#fff" stroke="#e0dcd2" stroke-width="1.5"/>
      <text x="60" y="30" font-size="16" font-weight="700" fill="#1e2a4a">2. Ride-hailing tracker</text>
      <text x="60" y="52" font-size="13" fill="#666">"your driver is nearby"</text>
      <rect x="270" y="20" width="120" height="70" rx="10" fill="#fde4c8"/>
      <text x="330" y="50" text-anchor="middle" font-weight="600">phone GPS</text>
      <text x="330" y="70" text-anchor="middle" font-weight="600">(driver)</text>
      <line x1="395" y1="55" x2="465" y2="55" stroke="#1e2a4a" stroke-width="2" marker-end="url(#arr)"/>
      <rect x="470" y="20" width="120" height="70" rx="10" fill="#cfe9f3"/>
      <text x="530" y="50" text-anchor="middle" font-weight="600">app</text>
      <text x="530" y="70" text-anchor="middle" font-weight="600">(driver)</text>
      <line x1="595" y1="55" x2="665" y2="55" stroke="#1e2a4a" stroke-width="2" marker-end="url(#arr)"/>
      <rect x="670" y="20" width="120" height="70" rx="10" fill="#d6f0e3"/>
      <text x="730" y="50" text-anchor="middle" font-weight="600">internet</text>
      <text x="730" y="70" text-anchor="middle" font-weight="600">4G/5G</text>
      <line x1="795" y1="55" x2="865" y2="55" stroke="#1e2a4a" stroke-width="2" marker-end="url(#arr)"/>
      <rect x="870" y="20" width="120" height="70" rx="10" fill="#e6dcf5"/>
      <text x="930" y="50" text-anchor="middle" font-weight="600">server</text>
      <text x="930" y="70" text-anchor="middle" font-weight="600">app</text>
      <line x1="995" y1="55" x2="1045" y2="55" stroke="#1e2a4a" stroke-width="2" marker-end="url(#arr)"/>
      <rect x="1050" y="20" width="110" height="70" rx="10" fill="#f4a261"/>
      <text x="1105" y="50" text-anchor="middle" font-weight="600" fill="#1e2a4a">map on phone</text>
      <text x="1105" y="70" text-anchor="middle" font-weight="600" fill="#1e2a4a">(passenger)</text>
    </g>

    <!-- Row 3: sensor banjir -->
    <g transform="translate(0,380)">
      <rect x="40" y="0" width="1130" height="110" rx="12" fill="#fff" stroke="#e0dcd2" stroke-width="1.5"/>
      <text x="60" y="30" font-size="16" font-weight="700" fill="#1e2a4a">3. Flood early warning</text>
      <text x="60" y="52" font-size="13" fill="#666">at a river / floodgate</text>
      <rect x="270" y="20" width="120" height="70" rx="10" fill="#fde4c8"/>
      <text x="330" y="50" text-anchor="middle" font-weight="600">water level</text>
      <text x="330" y="70" text-anchor="middle" font-weight="600">sensor</text>
      <line x1="395" y1="55" x2="465" y2="55" stroke="#1e2a4a" stroke-width="2" marker-end="url(#arr)"/>
      <rect x="470" y="20" width="120" height="70" rx="10" fill="#cfe9f3"/>
      <text x="530" y="50" text-anchor="middle" font-weight="600">microcontroller</text>
      <text x="530" y="70" text-anchor="middle" font-weight="600">(e.g., ESP32)</text>
      <line x1="595" y1="55" x2="665" y2="55" stroke="#1e2a4a" stroke-width="2" marker-end="url(#arr)"/>
      <rect x="670" y="20" width="120" height="70" rx="10" fill="#d6f0e3"/>
      <text x="730" y="50" text-anchor="middle" font-weight="600">Wi-Fi / cellular</text>
      <text x="730" y="70" text-anchor="middle" font-weight="600">/ LoRa</text>
      <line x1="795" y1="55" x2="865" y2="55" stroke="#1e2a4a" stroke-width="2" marker-end="url(#arr)"/>
      <rect x="870" y="20" width="120" height="70" rx="10" fill="#e6dcf5"/>
      <text x="930" y="50" text-anchor="middle" font-weight="600">server</text>
      <text x="930" y="70" text-anchor="middle" font-weight="600">BPBD / village</text>
      <line x1="995" y1="55" x2="1045" y2="55" stroke="#1e2a4a" stroke-width="2" marker-end="url(#arr)"/>
      <rect x="1050" y="20" width="110" height="70" rx="10" fill="#f4a261"/>
      <text x="1105" y="50" text-anchor="middle" font-weight="600" fill="#1e2a4a">siren +</text>
      <text x="1105" y="70" text-anchor="middle" font-weight="600" fill="#1e2a4a">WhatsApp</text>
    </g>
  </g>

  <text x="600" y="530" text-anchor="middle" font-size="15" font-weight="600" fill="#e63946">In this curriculum you will build ALL of those columns yourself — that is what "fullstack" IoT means.</text>
  <text x="1160" y="552" text-anchor="end" font-size="11" fill="#999">Fullstack IoT Developer curriculum · CC BY 4.0</text>
</svg>
