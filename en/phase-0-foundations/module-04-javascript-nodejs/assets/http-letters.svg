<text x="886.0" y="151.0" font-size="16.5" font-weight="800" fill="#1e2a4a" text-anchor="start" >webhook-receiver.js</text>
<text x="990.0" y="196.0" font-size="14" font-weight="700" fill="#0f8b8d" text-anchor="middle" >SERVER (the answerer)</text>
<text x="990.0" y="240.0" font-size="13.5" font-weight="400" fill="#4a5568" text-anchor="middle" >stands guard at</text>
