<text x="84.0" y="686.0" font-size="16" font-weight="800" fill="#1e2a4a" text-anchor="start" >Two kinds of errors:</text>
<text x="84.0" y="714.0" font-size="14.2" font-weight="400" fill="#1e2a4a" text-anchor="start" >SyntaxError = wrong grammar (a missing quotation mark/parenthesis): Node.js checks it before running the file, so not a single line runs.</text>
<text x="84.0" y="740.0" font-size="14.2" font-weight="400" fill="#1e2a4a" text-anchor="start" >ReferenceError, TypeError = happen at runtime: the lines before it have already run, like "Hello, Node.js!" above.</text>
