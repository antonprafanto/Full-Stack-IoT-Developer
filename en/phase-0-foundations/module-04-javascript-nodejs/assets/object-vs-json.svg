<circle cx="690.0" cy="510.0" r="10" fill="#e63946" />
<path d="M685.5 505.5 L694.5 514.5 M694.5 505.5 L685.5 514.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
<text x="708.0" y="515.0" font-size="15" font-weight="700" fill="#e63946" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">'fw': '0.1.0'</text>
<text x="84.0" y="555.0" font-size="15" font-weight="700" fill="#1e2a4a" text-anchor="start" >3. No comma at the end</text>
