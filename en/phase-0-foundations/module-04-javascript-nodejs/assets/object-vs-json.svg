<circle cx="690.0" cy="470.0" r="10" fill="#e63946" />
<path d="M685.5 465.5 L694.5 474.5 M694.5 465.5 L685.5 474.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
<text x="708.0" y="475.0" font-size="15" font-weight="700" fill="#e63946" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">temperature: 28.5</text>
<text x="84.0" y="515.0" font-size="15" font-weight="700" fill="#1e2a4a" text-anchor="start" >2. Text only in double quotes</text>
<circle cx="400.0" cy="510.0" r="10" fill="#2a9d5c" />
