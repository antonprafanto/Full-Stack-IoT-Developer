<text x="84.0" y="432.0" font-size="17" font-weight="800" fill="#1e2a4a" text-anchor="start" >Five JSON rules (stricter than a JavaScript object):</text>
<text x="84.0" y="475.0" font-size="15" font-weight="700" fill="#1e2a4a" text-anchor="start" >1. Keys must be in double quotes</text>
