<text x="708.0" y="555.0" font-size="15" font-weight="700" fill="#e63946" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">{"temperature": 28.5,}</text>
<text x="84.0" y="595.0" font-size="15" font-weight="700" fill="#1e2a4a" text-anchor="start" >4. No comments</text>
