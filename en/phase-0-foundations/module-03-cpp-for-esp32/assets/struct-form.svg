<text x="84.0" y="502.0" font-size="16" font-weight="800" fill="#1e2a4a" text-anchor="start" >Why bother with a struct?</text>
<text x="84.0" y="530.0" font-size="14.5" font-weight="400" fill="#1e2a4a" text-anchor="start" >Without a struct: four scattered variables, and functions need four separate ingredients.</text>
<text x="84.0" y="551.0" font-size="14.5" font-weight="400" fill="#1e2a4a" text-anchor="start" >With a struct: one reading = one form. Functions can take it in and return it whole,</text>
<text x="84.0" y="572.0" font-size="14.5" font-weight="400" fill="#1e2a4a" text-anchor="start" >and its field names match the project's data contract (Syllabus Appendix A).</text>
