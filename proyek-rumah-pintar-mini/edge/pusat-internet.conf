# pusat-internet.conf - broker PUSAT Rumah Pintar Mini di VPS (Modul 27, jalur utama), dipilih dengan KONF_PUSAT=
# pusat-internet.conf di .env (layanan mosquitto di compose.cloud.yml). Isinya SAMA dengan pusat.conf (ubah keduanya bersamaan),
# ditambah satu pintu lagi di bawah: 8883, MQTT terenkripsi TLS, untuk jembatan Pi dan perangkat dari internet. Pintu polos
# 1883 tetap ada untuk backend di lorong Compose, tetapi loketnya di VPS hanya 127.0.0.1 (ALAMAT_MQTT), tidak ke internet.
# Jalur di bawah = jalur DI DALAM kontainer.
# Sesudah mengubah berkas ini atau acl-broker: docker compose restart mosquitto (restart, bukan reload).
listener 1883
# tanpa nama pengguna dan sandi yang terdaftar, tidak boleh masuk (Modul 21)
allow_anonymous false
# berkas sandi tinggal di lemari data-broker (dibuat mosquitto_passwd DI DALAM kontainer; image menyerahkannya ke pengguna
# mosquitto setiap kali menyala, jadi tanpa urusan pemilik berkas di laptop)
password_file /mosquitto/data/sandi-broker
acl_file /mosquitto/config/acl-broker
# nama klien selalu = nama pengguna: tidak ada yang bisa menyamar atau menendang klien lain. Opsi ini berlaku PER PINTU
# (hanya untuk listener di atasnya), jadi pintu 8883 di bawah menulisnya lagi.
use_username_as_clientid true
# pesan retained (status perangkat, config dari backend) dan sesi disimpan di lemari: tidak hilang saat kontainer dibuat ulang
persistence true
persistence_location /mosquitto/data/
# log ke layar kontainer: dibaca dengan docker compose logs mosquitto (dibatasi 3 x 10 MB oleh compose.cloud.yml)
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
# hapus # di depan baris berikut untuk melihat juga pesan yang DITOLAK daftar izin (Denied PUBLISH, Modul 21);
# akibatnya log jauh lebih ramai
# log_type debug
# Modul 27: pintu TLS untuk tamu dari internet. Sertifikatnya SALINAN sertifikat Let's Encrypt yang diminta Caddy untuk
# DOMAIN_MQTT (layanan sertifikat-mqtt menyalinnya ke lemari data-sertifikat sebagai milik pengguna mosquitto). certfile
# berisi sertifikat nama broker + sertifikat penerbit antaranya (rantai); keyfile = kuncinya. Tanpa berkas ini, broker
# berhenti saat menyala (Unable to load server certificate). Versi TLS paling rendah = bawaan Mosquitto 2.x, yaitu TLS 1.2.
# Aturan akun, sandi, dan daftar izin di atas berlaku juga untuk pintu ini; use_username_as_clientid TIDAK ikut, jadi
# ditulis lagi tepat di bawah listener 8883. Tanpa baris itu, akun broker MANA PUN (misalnya akun uji pemeriksa di MQTTX
# HP) bisa masuk lewat internet dengan nama klien "backend" atau "jembatan-pi": klien aslinya ditendang (log "session
# taken over") dan antrean pesan yang ditahan broker untuk backend ikut terhapus.
listener 8883
use_username_as_clientid true
certfile /mosquitto/sertifikat/broker.crt
keyfile /mosquitto/sertifikat/broker.key
