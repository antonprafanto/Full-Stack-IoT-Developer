# compose.edge.yml - layanan GERBANG Rumah Pintar Mini di Raspberry Pi (Modul 26-28), pasangan compose.cloud.yml di pusat
# (laptop di Modul 26; VPS atau Pi yang sama di Modul 27).
# Jalankan di Pi, dari folder edge:  docker compose up -d
#   Baris COMPOSE_FILE=compose.edge.yml di edge/.env membuat -f tidak perlu (contohnya edge/.env.example).
# Broker Mosquitto gerbang (menggantikan paket apt Modul 12) + jembatan ke broker pusat (jembatan/pusat.conf). Sejak Modul 27
# jembatan itu menahan pesan perangkat selama pusat tak terjangkau (gerbang.conf) dan bisa menyambung lewat TLS ke VPS.
# Modul 28: akun perangkat di broker ini dibuat dan dihapus backend di pusat (plugin dynamic security, lewat jembatan).
# Node-RED (opsional) hanya menyala kalau profilnya disebut: docker compose --profile nodered up -d
# Modul 27: cloudflared (terowongan Cloudflare, jalur gratis) PINDAH ke compose.cloud.yml (profil "terowongan"), karena harus
# satu lorong dengan layanan web. JANGAN "docker compose down -v": -v menghapus lemari berisi berkas sandi broker DAN antrean
# pesan yang belum terkirim ke pusat.
name: rumahpintar-gerbang

# Log setiap kontainer dibatasi 3 berkas x 10 MB. Bawaan Docker TANPA batas: kartu microSD Pi bisa penuh pelan-pelan.
x-log: &log
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  # Broker gerbang: Node 1 (dan Node 2 lewat Node 1) tetap masuk ke IP Pi port 1883 dengan akun lamanya. Mosquitto 2.1.2
  # membaca berkas sandi lama Pi (format 2.0) apa adanya.
  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    environment:
      # Modul 28: sandi akun "admin" plugin dynamic security broker gerbang (gerbang.conf), dipakai SEKALI saat berkas akunnya
      # dibuat di lemari data-broker Pi. Tidak pernah dipakai untuk masuk, tetapi rahasia: acak, minimal 12 huruf. Tanpa
      # sandi ini plugin membuat sandi acak sendiri DAN akun contoh "democlient", jadi wajib diisi di edge/.env.
      MOSQUITTO_DYNSEC_PASSWORD: ${MOSQUITTO_DYNSEC_PASSWORD:?isi MOSQUITTO_DYNSEC_PASSWORD di edge/.env (acak, minimal 12 huruf)}
    volumes:
      # Konfigurasi dan daftar izin dari repo (hanya-baca). Sesudah mengubah salah satunya: docker compose restart mosquitto
      - ./gerbang.conf:/mosquitto/config/mosquitto.conf:ro
      - ./acl-broker:/mosquitto/config/acl-broker:ro
      # folder jembatan: berisi pusat.conf (sandi jembatan, tidak ikut Git)
      - ./jembatan:/mosquitto/config/jembatan:ro
      # berkas sandi (dipindah dari /etc/mosquitto/sandi-broker), pesan retained, sesi, (Modul 27) antrean jembatan, dan
      # (Modul 28) akun perangkat dynamic security
      - data-broker:/mosquitto/data
    # Image Mosquitto menyiapkan folder log sebagai lemari, padahal log kita tampil di layar (docker compose logs).
    # tmpfs = folder sementara di RAM: tanpa ini Docker membuat lemari tanpa nama setiap kontainer ini dibuat baru.
    tmpfs:
      - /mosquitto/log
    ports:
      # semua antarmuka: perangkat masuk dari WiFi rumah. Firmware memakai 1883, jadi di Pi angka ini jangan diganti.
      - "${PORT_GERBANG:-1883}:1883"
    extra_hosts:
      # nama "pusat" di jembatan/pusat.conf (jembatan RUMAH, polos) diarahkan ke ALAMAT_PUSAT di edge/.env: IP laptop yang
      # menjalankan compose.cloud.yml (Modul 26), atau host-gateway (= mesin ini sendiri) bila pusat dan gerbang di mesin
      # yang sama (jalur laptop Modul 26, Pi jalur gratis Modul 27). Jembatan ke VPS (jalur utama Modul 27) memakai nama
      # domain langsung, jadi baris ini tidak terpakai di sana: ALAMAT_PUSAT boleh kosong (= host-gateway).
      - "pusat:${ALAMAT_PUSAT:-host-gateway}"
      # Modul 27, OPSIONAL (jalur utama): selama internet rumah putus, setiap percobaan jembatan menanyakan nama broker VPS ke
      # DNS, dan broker gerbang tertahan sampai ±5 detik menunggu jawabannya (pesan lokal ikut terlambat; perangkat tidak
      # putus). Nama yang ditulis tetap di sini tidak ditanyakan ke DNS: hapus # di depan baris berikut dan isi nama broker +
      # IP VPS-mu. Harganya: kalau IP VPS berganti, baris ini wajib diubah juga (jembatan tidak tersambung sampai diubah).
      # - "mqtt.namaanda.my.id:203.0.113.10"
    restart: unless-stopped
    logging: *log

  # Modul 27: layanan cloudflared (profil "terowongan") yang tertulis di sini pada Modul 26 kini ada di compose.cloud.yml.

  # Node-RED dalam kontainer (opsional). Modul 26 tetap memakai Node-RED systemd dari Modul 13. Sebelum profil ini dipakai,
  # matikan layanan nodered systemd (loket 1880 bentrok), pindahkan flow dan kredensialnya, lalu ganti alamat broker di flow
  # dari localhost menjadi mosquitto (di dalam kontainer, localhost = kontainer Node-RED sendiri).
  nodered:
    image: nodered/node-red:5.0.9-24
    profiles: ["nodered"]
    environment:
      TZ: Asia/Jakarta
    volumes:
      - data-nodered:/data
    ports:
      - "${PORT_NODERED:-1880}:1880"
    restart: unless-stopped
    logging: *log

volumes:
  # Lemari milik Compose: berkas sandi broker gerbang + pesan retained + (Modul 28) akun perangkat dynamic security, dan data
  # Node-RED (bila profilnya dipakai). Cadangkan akun perangkatnya: skrip/cadangkan-akun-broker.sh.
  data-broker:
  data-nodered:
