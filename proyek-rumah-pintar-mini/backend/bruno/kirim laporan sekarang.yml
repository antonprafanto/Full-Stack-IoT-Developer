info:
  name: kirim laporan sekarang
  type: http
  seq: 28

http:
  method: POST
  url: "{{baseUrl}}/laporan/kirim?hari=ini"
  params:
    - name: hari
      value: ini
      type: query
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
