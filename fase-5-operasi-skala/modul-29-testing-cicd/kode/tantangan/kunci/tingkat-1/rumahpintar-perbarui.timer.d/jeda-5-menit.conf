# jeda-5-menit.conf - Kunci Tantangan 1 Modul 29: Pi bertanya "ada rilis baru?" setiap 5 menit, bukan 15.
# Berkas "drop-in" systemd: menimpa sebagian rumahpintar-perbarui.timer TANPA mengubah berkas aslinya (berkas di repo tetap
# 15 menit). Tempatnya di Pi: /etc/systemd/system/rumahpintar-perbarui.timer.d/jeda-5-menit.conf
[Timer]
# Jadwal (OnBootSec=, OnUnitActiveSec=, ...) boleh ditulis berkali-kali, dan SEMUA nilainya berlaku bersamaan. Baris kosong di
# bawah ini mengosongkan SEMUA jadwal timer ini dulu, termasuk OnBootSec=5min dari berkas aslinya: tanpa baris kosong, jadwal
# 15 menit yang lama tetap ada di samping jadwal 5 menit yang baru.
OnUnitActiveSec=
# ...jadi jadwal "5 menit sesudah Pi menyala" ditulis lagi. Tanpa baris ini, sesudah Pi dinyalakan ulang tidak ada yang
# membangunkan timer: OnUnitActiveSec= dihitung dari putaran sebelumnya, dan sesudah menyala belum ada putaran apa pun.
OnBootSec=5min
OnUnitActiveSec=5min
