info:
  name: klaim perangkat tiruan
  type: http
  seq: 38

http:
  method: POST
  url: "{{baseUrl}}/provision/klaim"
  body:
    type: json
    data: |-
      {
        "kode": "{{process.env.KODE_KLAIM}}",
        "device_id": "f00d00000003"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
