<!doctype html>
<html lang="id" class="scheme-light dark:scheme-dark scroll-pb-64 xl:scroll-pb-0">
  <head>
    <meta charset="UTF-8" />
    <!-- Modul 24: scroll-pb-64 = saat browser menggulir SENDIRI ke tombol atau kolom (tombol Tab, kolom yang salah isi), ia
         menyisakan 16rem di bawah, tempat toast di HP dan tablet. Mulai 1280 px toast ada di samping isi: xl:scroll-pb-0. -->
    <!-- Modul 27: ikon tab = gambar rumah (public/favicon.svg), bukan lagi logo Vite. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Modul 24: ikon (180 x 180 px) dan nama pendek untuk iPhone ("Tambah ke Layar Utama"). Modul 27: lewat https://,
         Android dan laptop membaca nama dan ikon aplikasi dari manifest.webmanifest; tautannya ditambahkan sendiri oleh
         vite-plugin-pwa saat npm run build (lihat vite.config.ts). -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Rumah Pintar" />
    <!-- Modul 27: warna bilah atas aplikasi terpasang; harus sama dengan theme_color di vite.config.ts -->
    <meta name="theme-color" content="#1d293d" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rumah Pintar Mini</title>
  </head>
  <body class="bg-slate-100 dark:bg-slate-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
