info:
  name: login viewer
  type: http
  seq: 14

http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "viewer@rumah.test",
        "sandi": "{{process.env.SANDI_VIEWER}}"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.peran
      operator: eq
      value: viewer

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
