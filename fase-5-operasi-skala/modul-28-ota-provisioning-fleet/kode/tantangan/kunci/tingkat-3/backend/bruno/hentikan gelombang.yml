info:
  name: hentikan gelombang
  type: http
  seq: 42

http:
  method: POST
  url: "{{baseUrl}}/armada/gelombang/berhenti"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
