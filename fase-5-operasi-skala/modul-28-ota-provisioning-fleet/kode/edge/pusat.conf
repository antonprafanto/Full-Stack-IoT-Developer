# pusat.conf - broker PUSAT Rumah Pintar Mini di dalam kontainer (Modul 26-28, layanan mosquitto di compose.cloud.yml).
# Dipakai di laptop (Modul 26) dan di Pi jalur gratis (Modul 27): satu pintu polos 1883 untuk jaringan rumah. Di VPS
# (Modul 27) dipakai pusat-internet.conf: isinya sama + pintu TLS 8883 (KONF_PUSAT di .env memilih salah satunya).
# Backend masuk lewat nama layanan mosquitto:1883; gerbang Pi masuk lewat jembatan dengan akun jembatan-pi; simulator alat/
# lewat loket 1883. Jalur di bawah = jalur DI DALAM kontainer.
# Sesudah mengubah berkas ini atau acl-broker: docker compose restart mosquitto (restart, bukan reload).
listener 1883
# tanpa nama pengguna dan sandi yang terdaftar, tidak boleh masuk (Modul 21)
allow_anonymous false
# berkas sandi tinggal di lemari data-broker (dibuat mosquitto_passwd DI DALAM kontainer; image menyerahkannya ke pengguna
# mosquitto setiap kali menyala, jadi tanpa urusan pemilik berkas di laptop)
password_file /mosquitto/data/sandi-broker
acl_file /mosquitto/config/acl-broker
# Modul 28: akun PERANGKAT dibuat dan dihapus backend sendiri lewat plugin "dynamic security" (sudah ada di image ini).
# Plugin membaca perintah JSON di topik $CONTROL/dynamic-security/v1 (izinnya hanya untuk akun backend, acl-broker blok 3)
# dan menyimpan akunnya di lemari data-broker. Plugin ini dibaca LEBIH DULU daripada password_file dan acl_file di atas:
# akun yang tidak dikenalnya (backend, jembatan-pi, pemantau, akun perangkat lama Modul 21) diteruskan ke berkas sandi, dan
# izin topik akun perangkat barunya, untuk menulis DAN membaca, tetap pola %u di acl-broker: akun itu tidak diberi peran
# apa pun, dan backend mengubah izin BACA bawaan plugin (aslinya "izinkan") menjadi "tolak" sebelum membuat akun pertama
# (setDefaultACLAccess, tersimpan di berkas akun plugin; temuan verifikasi kode M28). Saat pertama menyala,
# plugin membuat berkas akunnya sendiri dengan sandi admin dari MOSQUITTO_DYNSEC_PASSWORD (.env). Akun baru langsung
# berlaku dan akun yang dihapus langsung diputus, tanpa restart; acl-broker dan berkas .conf tetap butuh restart.
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json
# nama klien selalu = nama pengguna: tidak ada yang bisa menyamar atau menendang klien lain. Opsi ini berlaku PER PINTU
# (hanya untuk listener di atasnya): pintu baru, misalnya 8883 di pusat-internet.conf, harus menulisnya lagi.
use_username_as_clientid true
# pesan retained (status perangkat, config dari backend) dan sesi disimpan di lemari: tidak hilang saat kontainer dibuat ulang
persistence true
persistence_location /mosquitto/data/
# log ke layar kontainer: dibaca dengan docker compose logs mosquitto (dibatasi 3 x 10 MB oleh compose.cloud.yml)
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
# hapus # di depan baris berikut untuk melihat juga pesan yang DITOLAK daftar izin (Denied PUBLISH, Modul 21);
# akibatnya log jauh lebih ramai
# log_type debug
