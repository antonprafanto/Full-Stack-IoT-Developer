<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="982" viewBox="0 0 1200 982" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<rect width="1200" height="982" fill="#fffdf7"/>
<text x="600.0" y="44.0" font-size="28" font-weight="800" fill="#1e2a4a" text-anchor="middle" xml:space="preserve">Armada: satu dulu, baru semua</text>
<text x="600.0" y="76.0" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">Konsep 7 · <tspan font-style="italic">canary</tspan> = perangkat yang diperbarui lebih dulu · <tspan font-weight="800">Perbarui semua</tspan> terkunci sampai satu canary berhasil</text>
<rect x="30.0" y="100.0" width="336.0" height="188.0" rx="14" fill="#ffffff" stroke="#e0dcd2" stroke-width="1.6" />
<text x="50.0" y="132.0" font-size="15" font-weight="800" fill="#1e2a4a" text-anchor="start" >1. Unggah rilis</text>
<text x="50.0" y="160.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-weight="800" fill="#1e2a4a">Unggah firmware Node 1</tspan> di <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11" fill="#1e2a4a" font-weight="800">/armada</tspan></text>
<text x="50.0" y="181.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">(admin), misalnya 1.7.1</text>
<text x="50.0" y="223.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">rilis biasa: boleh untuk banyak perangkat</text>
<text x="50.0" y="244.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">rilis <tspan font-weight="800" fill="#1e2a4a">uji</tspan> (misalnya 1.7.2): hanya lewat</text>
<text x="50.0" y="265.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-weight="800" fill="#1e2a4a">Perbarui</tspan> di satu kartu perangkat</text>
<rect x="432.0" y="100.0" width="336.0" height="188.0" rx="14" fill="#fcf2f6" stroke="#a13a6b" stroke-width="2" />
<text x="452.0" y="132.0" font-size="15" font-weight="800" fill="#a13a6b" text-anchor="start" >2. Perbarui canary</text>
<text x="452.0" y="160.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">hanya Node 1 bercentang <tspan font-weight="800" fill="#1e2a4a">Canary</tspan> yang</text>
<text x="452.0" y="181.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-style="italic">online</tspan>; tunggu sampai hasilnya <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11" fill="#1e2a4a" font-weight="800">berhasil</tspan></text>
<text x="452.0" y="223.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">di daftar rilis:</text>
<text x="452.0" y="244.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-weight="800" fill="#1e2a4a">Canary: 1 berhasil, 0 gagal atau rollback</tspan></text>
<line x1="372.0" y1="194.0" x2="426.0" y2="194.0" stroke="#a13a6b" stroke-width="2.6" stroke-linecap="round" />
<path d="M418.1 198.2 L426.0 194.0 L418.1 189.8" fill="none" stroke="#a13a6b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
<rect x="834.0" y="100.0" width="336.0" height="188.0" rx="14" fill="#ffffff" stroke="#2a9d5c" stroke-width="2" />
<text x="854.0" y="132.0" font-size="15" font-weight="800" fill="#2a9d5c" text-anchor="start" >3. Perbarui semua</text>
<text x="854.0" y="160.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">terbuka bila canary berhasil ≥ 1 dan</text>
<text x="854.0" y="181.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">gagal atau rollback = 0</text>
<text x="854.0" y="223.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">semua Node 1 yang <tspan font-style="italic">online</tspan> dan memenuhi</text>
<text x="854.0" y="244.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">syarat dikirimi <tspan font-weight="800" fill="#1e2a4a">sekaligus</tspan>; yang lain</text>
<text x="854.0" y="265.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">dilewati, <tspan font-weight="800" fill="#1e2a4a">tidak diantre</tspan></text>
<line x1="774.0" y1="194.0" x2="828.0" y2="194.0" stroke="#2a9d5c" stroke-width="2.6" stroke-linecap="round" />
<path d="M820.1 198.2 L828.0 194.0 L820.1 189.8" fill="none" stroke="#2a9d5c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
<rect x="784.0" y="148.0" width="34.0" height="34.0" rx="6" fill="#fffdf7" />
<rect x="790.0" y="163.0" width="22.0" height="17.0" rx="3" fill="none" stroke="#b45f17" stroke-width="2" />
<path d="M794.5 163.0 L794.5 158.0 A6.5 6.5 0 0 1 807.5 158.0 L807.5 163.0" fill="none" stroke="#b45f17" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<circle cx="801.0" cy="171.0" r="1.8" fill="#b45f17" />
<rect x="30.0" y="308.0" width="1140.0" height="86.0" rx="12" fill="#fdeedd" />
<text x="52.0" y="336.0" font-size="12.5" font-weight="700" fill="#1e2a4a" text-anchor="start" xml:space="preserve">Selama syaratnya belum terpenuhi, tombol <tspan font-weight="800" fill="#1e2a4a">Perbarui semua</tspan> mati dan menulis alasannya:</text>
<text x="52.0" y="362.0" font-size="11.5" font-weight="800" fill="#b45f17" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">Terkunci: belum ada canary yang berhasil.</text>
<text x="612.0" y="362.0" font-size="11.5" font-weight="800" fill="#b45f17" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">Terkunci: ada canary yang gagal atau rollback.</text>
<text x="52.0" y="382.0" font-size="11.5" font-weight="800" fill="#b45f17" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">Terkunci: rilis uji: hanya per perangkat.</text>
<text x="612.0" y="382.0" font-size="11.5" font-weight="800" fill="#b45f17" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">Terkunci: rilis ditarik.</text>
<rect x="30.0" y="414.0" width="1140.0" height="320.0" rx="14" fill="#ffffff" stroke="#e0dcd2" stroke-width="1.6" />
<text x="54.0" y="444.0" font-size="14.5" font-weight="800" fill="#1e2a4a" text-anchor="start" >Contoh: Perbarui semua ke 1.7.1</text>
<text x="1146.0" y="444.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="end" >nama perangkat = contoh; alasan = bunyi persis dari server</text>
<text x="54.0" y="476.0" font-size="11.5" font-weight="800" fill="#4a5568" text-anchor="start" >perangkat</text>
<text x="252.0" y="476.0" font-size="11.5" font-weight="800" fill="#4a5568" text-anchor="start" >keadaan</text>
<text x="430.0" y="476.0" font-size="11.5" font-weight="800" fill="#4a5568" text-anchor="start" >hasil</text>
<text x="532.0" y="476.0" font-size="11.5" font-weight="800" fill="#4a5568" text-anchor="start" >alasan yang ditulis server</text>
<line x1="54.0" y1="484.0" x2="1146.0" y2="484.0" stroke="#e0dcd2" stroke-width="1" stroke-linecap="round" />
<text x="54.0" y="505.0" font-size="12" font-weight="700" fill="#1e2a4a" text-anchor="start" >Node 1 ruang tamu</text>
<text x="252.0" y="505.0" font-size="11.5" font-weight="600" fill="#4a5568" text-anchor="start" >canary, sudah 1.7.1</text>
<rect x="430.0" y="489.0" width="74.6" height="22.0" rx="11.0" fill="#eef1f5" stroke="#9aa3b0" stroke-width="1.4" />
<text x="467.3" y="504.0" font-size="11" font-weight="800" fill="#4a5568" text-anchor="middle" xml:space="preserve">dilewati</text>
<text x="532.0" y="504.0" font-size="10.5" font-weight="700" fill="#1e2a4a" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">perangkat sudah memakai 1.7.1</text>
<line x1="54.0" y1="516.0" x2="1146.0" y2="516.0" stroke="#e0dcd2" stroke-width="1" stroke-linecap="round" />
<text x="54.0" y="537.0" font-size="12" font-weight="700" fill="#1e2a4a" text-anchor="start" >Node 1 garasi</text>
<text x="252.0" y="537.0" font-size="11.5" font-weight="600" fill="#4a5568" text-anchor="start" >online, 1.7.0</text>
<rect x="430.0" y="521.0" width="67.7" height="22.0" rx="11.0" fill="#e3f4ea" stroke="#2a9d5c" stroke-width="1.4" />
<text x="463.9" y="536.0" font-size="11" font-weight="800" fill="#2a9d5c" text-anchor="middle" xml:space="preserve">dikirim</text>
<text x="532.0" y="537.0" font-size="11.5" font-weight="600" fill="#4a5568" text-anchor="start" >lalu berhasil (atau rollback, kalau firmware-nya salah)</text>
<line x1="54.0" y1="548.0" x2="1146.0" y2="548.0" stroke="#e0dcd2" stroke-width="1" stroke-linecap="round" />
<text x="54.0" y="569.0" font-size="12" font-weight="700" fill="#1e2a4a" text-anchor="start" >papan ketiga</text>
<text x="252.0" y="569.0" font-size="11.5" font-weight="600" fill="#4a5568" text-anchor="start" >online, 1.7.0</text>
<rect x="430.0" y="553.0" width="67.7" height="22.0" rx="11.0" fill="#e3f4ea" stroke="#2a9d5c" stroke-width="1.4" />
<text x="463.9" y="568.0" font-size="11" font-weight="800" fill="#2a9d5c" text-anchor="middle" xml:space="preserve">dikirim</text>
<line x1="54.0" y1="580.0" x2="1146.0" y2="580.0" stroke="#e0dcd2" stroke-width="1" stroke-linecap="round" />
<text x="54.0" y="601.0" font-size="12" font-weight="700" fill="#1e2a4a" text-anchor="start" >Node 1 dapur</text>
<text x="252.0" y="601.0" font-size="11.5" font-weight="600" fill="#4a5568" text-anchor="start" >offline</text>
<rect x="430.0" y="585.0" width="74.6" height="22.0" rx="11.0" fill="#eef1f5" stroke="#9aa3b0" stroke-width="1.4" />
<text x="467.3" y="600.0" font-size="11" font-weight="800" fill="#4a5568" text-anchor="middle" xml:space="preserve">dilewati</text>
<text x="532.0" y="600.0" font-size="10.5" font-weight="700" fill="#1e2a4a" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">perangkat sedang offline: perintah update hanya dikirim ke perangkat online (tidak diantre)</text>
<line x1="54.0" y1="612.0" x2="1146.0" y2="612.0" stroke="#e0dcd2" stroke-width="1" stroke-linecap="round" />
<text x="54.0" y="633.0" font-size="12" font-weight="700" fill="#1e2a4a" text-anchor="start" >Node 1 teras</text>
<text x="252.0" y="633.0" font-size="11.5" font-weight="600" fill="#4a5568" text-anchor="start" >online, belum selesai</text>
<rect x="430.0" y="617.0" width="74.6" height="22.0" rx="11.0" fill="#eef1f5" stroke="#9aa3b0" stroke-width="1.4" />
<text x="467.3" y="632.0" font-size="11" font-weight="800" fill="#4a5568" text-anchor="middle" xml:space="preserve">dilewati</text>
<text x="532.0" y="632.0" font-size="10.5" font-weight="700" fill="#1e2a4a" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">perangkat masih menjalankan pembaruan lain</text>
<line x1="54.0" y1="644.0" x2="1146.0" y2="644.0" stroke="#e0dcd2" stroke-width="1" stroke-linecap="round" />
<text x="54.0" y="665.0" font-size="12" font-weight="700" fill="#1e2a4a" text-anchor="start" >papan yang hilang</text>
<text x="252.0" y="665.0" font-size="11.5" font-weight="600" fill="#4a5568" text-anchor="start" >dinonaktifkan</text>
<rect x="430.0" y="649.0" width="74.6" height="22.0" rx="11.0" fill="#eef1f5" stroke="#9aa3b0" stroke-width="1.4" />
<text x="467.3" y="664.0" font-size="11" font-weight="800" fill="#4a5568" text-anchor="middle" xml:space="preserve">dilewati</text>
<text x="532.0" y="664.0" font-size="10.5" font-weight="700" fill="#1e2a4a" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">perangkat sudah dinonaktifkan (kuncinya dicabut)</text>
<line x1="54.0" y1="676.0" x2="1146.0" y2="676.0" stroke="#e0dcd2" stroke-width="1" stroke-linecap="round" />
<text x="54.0" y="697.0" font-size="12" font-weight="700" fill="#1e2a4a" text-anchor="start" >papan baru diklaim</text>
<text x="252.0" y="697.0" font-size="11.5" font-weight="600" fill="#4a5568" text-anchor="start" >belum kirim telemetry</text>
<rect x="430.0" y="681.0" width="74.6" height="22.0" rx="11.0" fill="#eef1f5" stroke="#9aa3b0" stroke-width="1.4" />
<text x="467.3" y="696.0" font-size="11" font-weight="800" fill="#4a5568" text-anchor="middle" xml:space="preserve">dilewati</text>
<text x="532.0" y="696.0" font-size="10.5" font-weight="700" fill="#1e2a4a" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">jenis perangkat belum diketahui: tunggu telemetry pertamanya</text>
<rect x="30.0" y="754.0" width="640.0" height="186.0" rx="14" fill="#eef1f5" />
<text x="54.0" y="784.0" font-size="14" font-weight="800" fill="#1e2a4a" text-anchor="start" >Aturan armada</text>
<text x="54.0" y="810.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-weight="800" fill="#1e2a4a">Satu pembaruan berjalan per perangkat</tspan>: perintah kedua ditolak <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11" fill="#1e2a4a" font-weight="800">409</tspan></text>
<text x="54.0" y="831.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-weight="800" fill="#1e2a4a">Tanpa kabar 10 menit</tspan> → <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11" fill="#1e2a4a" font-weight="800">kedaluwarsa</tspan> <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11" fill="#1e2a4a" font-weight="800">(tanpa</tspan> <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11" fill="#1e2a4a" font-weight="800">kabar)</tspan></text>
<text x="54.0" y="852.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-weight="800" fill="#1e2a4a">Turun versi</tspan> hanya dengan centang <tspan font-weight="800" fill="#1e2a4a">Izinkan turun versi</tspan>;</text>
<text x="54.0" y="873.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">versi di bawah 1.7.0 ditolak Node 1 sendiri (versi itu belum punya <tspan font-style="italic">rollback</tspan>)</text>
<text x="54.0" y="894.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-weight="800" fill="#1e2a4a">Rilis uji</tspan> (1.7.2) tidak dihitung rilis terbaru, tidak pernah untuk semua</text>
<text x="54.0" y="915.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-weight="800" fill="#1e2a4a">Node 2</tspan> tidak di-OTA: tampil di Armada, diperbarui lewat kabel</text>
<rect x="686.0" y="754.0" width="484.0" height="110.0" rx="14" fill="#ffffff" stroke="#e0dcd2" stroke-width="1.6" />
<text x="706.0" y="784.0" font-size="14" font-weight="800" fill="#1e2a4a" text-anchor="start" >Lab tiruan penulis</text>
<text x="706.0" y="808.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">22 perangkat simulator: semua <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11" fill="#1e2a4a" font-weight="800">berhasil</tspan> dalam</text>
<text x="706.0" y="827.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">6,3–8,1 detik; Telegram tiruan 44 pesan</text>
<text x="706.0" y="846.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">(2 per perangkat); 100 perangkat tidak diukur</text>
<rect x="686.0" y="878.0" width="484.0" height="62.0" rx="14" fill="#ffffff" stroke="#a13a6b" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="706.0" y="905.0" font-size="13" font-weight="800" fill="#a13a6b" text-anchor="start" >Menyusul: gelombang otomatis</text>
<text x="706.0" y="925.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" >bertahap dengan rem darurat = Tantangan T3</text>
<text x="1178.0" y="968.0" font-size="11" font-weight="400" fill="#8a8f9c" text-anchor="end" >Kurikulum Fullstack IoT Developer · CC BY 4.0</text>
