<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="896" viewBox="0 0 1200 896" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<rect width="1200" height="896" fill="#fffdf7"/>
<text x="600.0" y="44.0" font-size="28" font-weight="800" fill="#1e2a4a" text-anchor="middle" xml:space="preserve">Rollback yang benar-benar bekerja</text>
<text x="600.0" y="76.0" font-size="16" font-weight="400" fill="#4a5568" text-anchor="middle" xml:space="preserve">Konsep 4 · keadaan rak program di <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="14.5">otadata</tspan> (ESP-IDF v5.5.5) · firmware baru harus membuktikan diri dalam 60 detik</text>
<rect x="30.0" y="100.0" width="1140.0" height="588.0" rx="14" fill="#ffffff" stroke="#e0dcd2" stroke-width="1.6" />
<text x="54.0" y="132.0" font-size="15" font-weight="800" fill="#1e2a4a" text-anchor="start" >Perjalanan firmware yang dipasang lewat udara</text>
<text x="1146.0" y="132.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="end" xml:space="preserve">keadaan dicatat di <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#4a5568" font-weight="800">otadata</tspan>, tidak di dalam berkas <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#4a5568" font-weight="800">.bin</tspan></text>
<rect x="52.0" y="250.0" width="172.0" height="92.0" rx="10" fill="#ffffff" stroke="#1e2a4a" stroke-width="2" />
<text x="68.0" y="276.0" font-size="14" font-weight="800" fill="#1e2a4a" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">NEW</text>
<text x="68.0" y="298.0" font-size="11.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">baru ditulis lewat udara,</text>
<text x="68.0" y="316.0" font-size="11.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">belum pernah menyala</text>
<line x1="226.0" y1="296.0" x2="286.0" y2="296.0" stroke="#1e2a4a" stroke-width="2.2" stroke-linecap="round" />
<path d="M278.9 299.8 L286.0 296.0 L278.9 292.2" fill="none" stroke="#1e2a4a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
<text x="256.0" y="284.0" font-size="11" font-weight="700" fill="#4a5568" text-anchor="middle" >menyala</text>
<rect x="290.0" y="250.0" width="200.0" height="92.0" rx="10" fill="#fdeedd" stroke="#b45f17" stroke-width="2" />
<text x="306.0" y="276.0" font-size="14" font-weight="800" fill="#b45f17" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">PENDING_VERIFY</text>
<text x="306.0" y="298.0" font-size="11.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">pembuka rak menandainya</text>
<text x="306.0" y="316.0" font-size="11.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">saat menyala pertama</text>
<line x1="492.0" y1="296.0" x2="552.0" y2="296.0" stroke="#1e2a4a" stroke-width="2.2" stroke-linecap="round" />
<path d="M544.9 299.8 L552.0 296.0 L544.9 292.2" fill="none" stroke="#1e2a4a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
<rect x="556.0" y="242.0" width="252.0" height="108.0" rx="10" fill="#ffffff" stroke="#1e2a4a" stroke-width="2" />
<text x="572.0" y="266.0" font-size="12.5" font-weight="800" fill="#1e2a4a" text-anchor="start" xml:space="preserve">inti Arduino, sebelum <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12" fill="#1e2a4a" font-weight="800">setup()</tspan>:</text>
<text x="572.0" y="288.0" font-size="12.5" font-weight="800" fill="#a13a6b" text-anchor="start" xml:space="preserve"><tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12.5" fill="#a13a6b" font-weight="800">verifyRollbackLater()</tspan>?</text>
<text x="572.0" y="312.0" font-size="11.5" font-weight="700" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11" fill="#a13a6b" font-weight="800">true</tspan> (Modul 28): masa uji</text>
<text x="572.0" y="330.0" font-size="11.5" font-weight="600" fill="#4a5568" text-anchor="start" >60 detik milik firmware sendiri</text>
<rect x="556.0" y="148.0" width="252.0" height="80.0" rx="10" fill="#fde6e8" stroke="#e63946" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="570.0" y="170.0" font-size="12" font-weight="800" fill="#e63946" text-anchor="start" xml:space="preserve">bawaan <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#e63946" font-weight="800">false</tspan>: langsung VALID</text>
<text x="570.0" y="190.0" font-size="11.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">sebelum <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="10.5" fill="#1e2a4a" font-weight="800">setup()</tspan>: kunci salah pun sah,</text>
<text x="570.0" y="208.0" font-size="11.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">tanpa pesan, tanpa rollback</text>
<path d="M596 242 L596 230" fill="none" stroke="#e63946" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/>
<rect x="290.0" y="368.0" width="518.0" height="82.0" rx="10" fill="#fcf2f6" stroke="#a13a6b" stroke-width="1.8" />
<text x="304.0" y="393.0" font-size="12" font-weight="800" fill="#a13a6b" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">extern "C" bool verifyRollbackLater() { return true; }</text>
<text x="304.0" y="415.0" font-size="11" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="10.5" fill="#1e2a4a" font-weight="800">masa-uji.cpp</tspan>: tanpa <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="10.5" fill="#1e2a4a" font-weight="800">extern</tspan> <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="10.5" fill="#1e2a4a" font-weight="800">"C"</tspan>, kompilasi tetap berhasil tanpa peringatan, tetapi</text>
<text x="304.0" y="433.0" font-size="11" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">fungsi kita tidak masuk firmware: bawaan <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="10.5" fill="#1e2a4a" font-weight="800">false</tspan> yang dipakai (hasil kompilasi penulis)</text>
<rect x="52.0" y="368.0" width="214.0" height="64.0" rx="10" fill="#ffffff" stroke="#4a5568" stroke-width="2" />
<text x="68.0" y="394.0" font-size="14" font-weight="800" fill="#4a5568" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">UNDEFINED</text>
<text x="68.0" y="416.0" font-size="11.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">lewat kabel: tanpa masa uji</text>
<rect x="868.0" y="148.0" width="282.0" height="116.0" rx="10" fill="#ffffff" stroke="#2a9d5c" stroke-width="2" />
<text x="884.0" y="173.0" font-size="14" font-weight="800" fill="#2a9d5c" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">VALID</text>
<text x="884.0" y="194.0" font-size="11.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-weight="800" fill="#1e2a4a">dalam 60 detik sejak menyala:</tspan></text>
<text x="884.0" y="212.0" font-size="11.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">tersambung ke broker (kunci diterima)</text>
<text x="884.0" y="230.0" font-size="11.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">+ <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="10.5" fill="#1e2a4a" font-weight="800">online</tspan> terbit + langganan <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="10.5" fill="#1e2a4a" font-weight="800">cmd</tspan></text>
<text x="884.0" y="248.0" font-size="11.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">→ firmware menandai dirinya sah</text>
<rect x="868.0" y="282.0" width="282.0" height="116.0" rx="10" fill="#ffffff" stroke="#e63946" stroke-width="2" />
<text x="884.0" y="307.0" font-size="14" font-weight="800" fill="#e63946" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">INVALID</text>
<text x="884.0" y="328.0" font-size="11.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-weight="800" fill="#1e2a4a">60 detik habis tanpa itu</tspan></text>
<text x="884.0" y="346.0" font-size="11.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">(kunci salah, broker tak terjangkau)</text>
<text x="884.0" y="364.0" font-size="11.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">→ laporan <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="10.5" fill="#1e2a4a" font-weight="800">rollback</tspan> disimpan dulu,</text>
<text x="884.0" y="382.0" font-size="11.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">lalu ditandai tidak sah + restart</text>
<rect x="868.0" y="416.0" width="282.0" height="116.0" rx="10" fill="#ffffff" stroke="#e63946" stroke-width="2" />
<text x="884.0" y="441.0" font-size="14" font-weight="800" fill="#e63946" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">ABORTED</text>
<text x="884.0" y="462.0" font-size="11.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-weight="800" fill="#1e2a4a">menyala ulang di tengah masa uji</tspan></text>
<text x="884.0" y="480.0" font-size="11.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">(mogok, <tspan font-style="italic">watchdog</tspan>, listrik padam,</text>
<text x="884.0" y="498.0" font-size="11.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="10.5" fill="#1e2a4a" font-weight="800">restart</tspan>) → pembuka rak membatalkan</text>
<text x="884.0" y="516.0" font-size="11.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">saat menyala berikutnya</text>
<line x1="809.0" y1="296.0" x2="838.0" y2="296.0" stroke="#1e2a4a" stroke-width="2" stroke-linecap="round" />
<line x1="838.0" y1="206.0" x2="838.0" y2="474.0" stroke="#1e2a4a" stroke-width="2" stroke-linecap="round" />
<line x1="838.0" y1="206.0" x2="865.0" y2="206.0" stroke="#1e2a4a" stroke-width="2" stroke-linecap="round" />
<path d="M858.8 209.3 L865.0 206.0 L858.8 202.7" fill="none" stroke="#1e2a4a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<line x1="838.0" y1="340.0" x2="865.0" y2="340.0" stroke="#1e2a4a" stroke-width="2" stroke-linecap="round" />
<path d="M858.8 343.3 L865.0 340.0 L858.8 336.7" fill="none" stroke="#1e2a4a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<line x1="838.0" y1="474.0" x2="865.0" y2="474.0" stroke="#1e2a4a" stroke-width="2" stroke-linecap="round" />
<path d="M858.8 477.3 L865.0 474.0 L858.8 470.7" fill="none" stroke="#1e2a4a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<path d="M808 178 L864 178" fill="none" stroke="#e63946" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/>
<path d="M858.8 181.3 L865.0 178.0 L858.8 174.7" fill="none" stroke="#e63946" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
<rect x="868.0" y="552.0" width="282.0" height="116.0" rx="10" fill="#fcf2f6" stroke="#a13a6b" stroke-width="2" />
<text x="884.0" y="577.0" font-size="14" font-weight="800" fill="#a13a6b" text-anchor="start" >Rollback: rak lama menyala</text>
<text x="884.0" y="599.0" font-size="11.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">firmware lama membaca catatan di NVS</text>
<text x="884.0" y="617.0" font-size="11.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">(laporan atau rencana) → <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="10.5" fill="#1e2a4a" font-weight="800">vitals.ota</tspan></text>
<text x="884.0" y="635.0" font-size="11.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="10.5" fill="#1e2a4a" font-weight="800">"hasil":"rollback"</tspan> → dashboard:</text>
<text x="884.0" y="653.0" font-size="11.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-weight="800" fill="#a13a6b">kembali ke versi lama</tspan></text>
<line x1="1009.0" y1="533.0" x2="1009.0" y2="549.0" stroke="#e63946" stroke-width="2" stroke-linecap="round" />
<path d="M1005.7 542.8 L1009.0 549.0 L1012.3 542.8" fill="none" stroke="#e63946" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<path d="M1150 340.0 L1162 340.0 L1162 582 L1153 582" fill="none" stroke="#e63946" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<path d="M1158.2 578.7 L1152.0 582.0 L1158.2 585.3" fill="none" stroke="#e63946" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
<text x="54.0" y="474.0" font-size="14" font-weight="800" fill="#1e2a4a" text-anchor="start" >Dua jenis firmware yang salah, dua penangkap</text>
<rect x="52.0" y="490.0" width="370.0" height="178.0" rx="10" fill="#eef1f5" />
<text x="68.0" y="516.0" font-size="13" font-weight="800" fill="#1e2a4a" text-anchor="start" >Mogok atau macet</text>
<text x="68.0" y="538.0" font-size="11.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">contoh: program <tspan font-style="italic">panic</tspan>, macet di <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="10.5" fill="#1e2a4a" font-weight="800">setup()</tspan></text>
<text x="68.0" y="557.0" font-size="11.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">(<tspan font-style="italic">watchdog</tspan> masa uji: 75 detik)</text>
<text x="68.0" y="576.0" font-size="11.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">penangkap: <tspan font-weight="800" fill="#a13a6b">pembuka rak</tspan> (ABORTED)</text>
<text x="68.0" y="601.0" font-size="11.5" font-weight="700" fill="#4a5568" text-anchor="start" >laporan di dashboard:</text>
<text x="68.0" y="621.0" font-size="10.5" font-weight="700" fill="#e63946" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">menyala ulang di tengah masa uji (PANIC)</text>
<text x="68.0" y="639.0" font-size="10.5" font-weight="700" fill="#e63946" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">padam di tengah masa uji</text>
<rect x="438.0" y="490.0" width="370.0" height="178.0" rx="10" fill="#eef1f5" />
<text x="454.0" y="516.0" font-size="13" font-weight="800" fill="#1e2a4a" text-anchor="start" >Jalan tapi buta</text>
<text x="454.0" y="538.0" font-size="11.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">contoh: rilis uji 1.7.2, <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="10.5" fill="#1e2a4a" font-weight="800">UJI_KUNCI_SALAH</tspan> <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="10.5" fill="#1e2a4a" font-weight="800">=</tspan> <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="10.5" fill="#1e2a4a" font-weight="800">1</tspan>:</text>
<text x="454.0" y="557.0" font-size="11.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">kunci dirusak di RAM, broker menolak</text>
<text x="454.0" y="576.0" font-size="11.5" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">penangkap: <tspan font-weight="800" fill="#a13a6b">pengatur waktu 60 detik</tspan> (INVALID)</text>
<text x="454.0" y="601.0" font-size="11.5" font-weight="700" fill="#4a5568" text-anchor="start" >laporan di dashboard:</text>
<text x="454.0" y="621.0" font-size="10.5" font-weight="700" fill="#e63946" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">tidak tersambung ke broker dalam 60 detik</text>
<rect x="30.0" y="708.0" width="1140.0" height="146.0" rx="14" fill="#eef1f5" />
<text x="54.0" y="738.0" font-size="14.5" font-weight="800" fill="#1e2a4a" text-anchor="start" >Yang perlu diingat</text>
<text x="54.0" y="764.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-weight="800" fill="#1e2a4a">Restart apa pun di masa uji = batal.</tspan> Broker tak terjangkau 60 detik (router atau Pi mati) juga membatalkan firmware yang baik: ulangi <tspan font-weight="800" fill="#1e2a4a">Perbarui</tspan></text>
<text x="54.0" y="788.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-weight="800" fill="#1e2a4a">Selama masa uji</tspan> WiFi dicoba setiap 10 detik, portal WiFi tidak dibuka, dan <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11" fill="#1e2a4a" font-weight="800">update</tspan> lain ditolak (<tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11" fill="#1e2a4a" font-weight="800">masih</tspan> <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11" fill="#1e2a4a" font-weight="800">dalam</tspan> <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11" fill="#1e2a4a" font-weight="800">masa</tspan> <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11" fill="#1e2a4a" font-weight="800">uji</tspan> <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11" fill="#1e2a4a" font-weight="800">60</tspan> <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11" fill="#1e2a4a" font-weight="800">detik</tspan>)</text>
<text x="54.0" y="812.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-weight="800" fill="#1e2a4a">"Terbukti"</tspan> = kunci diterima broker, <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11" fill="#1e2a4a" font-weight="800">online</tspan> terbit, langganan <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11" fill="#1e2a4a" font-weight="800">cmd</tspan> dikirim; kesalahan sesudah itu (misalnya sensor) tidak dilindungi rollback</text>
<text x="54.0" y="836.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-weight="800" fill="#1e2a4a">Lab tiruan</tspan> (simulator): rollback tercatat 70 detik sesudah perintah (5 + 60 + 5); <tspan font-weight="800" fill="#1e2a4a">rollback di papan sungguhan belum diuji penulis</tspan></text>
<text x="1178.0" y="882.0" font-size="11" font-weight="400" fill="#8a8f9c" text-anchor="end" >Kurikulum Fullstack IoT Developer · CC BY 4.0</text>
</svg>
