<text x="54.0" y="586.0" font-size="13" font-weight="800" fill="#1e2a4a" text-anchor="start" >Akar yang dipercaya, dan di mana rantainya berhenti</text>
<text x="54.0" y="610.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-weight="800" fill="#1e2a4a">HP, laptop, browser</tspan> (punya X1 dan X2): ECDSA berhenti di X2, RSA di X1</text>
<text x="54.0" y="630.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-weight="800" fill="#1e2a4a">jembatan Pi:</tspan> <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11" fill="#1e2a4a" font-weight="800">bridge_cafile</tspan> <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11" fill="#1e2a4a" font-weight="800">…/ca-cert-ISRG_Root_X1.pem</tspan> (sudah ada</text>
<text x="54.0" y="650.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">di image Mosquitto) → lewat X2 bertanda tangan X1 sampai X1 (dokumen; belum diuji)</text>
<text x="54.0" y="670.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-weight="800" fill="#1e2a4a">ESP32</tspan> (opsional): tanam X1 + X2, atau bundel CA bawaan</text>
<rect x="690.0" y="98.0" width="480.0" height="600.0" rx="14" fill="#ffffff" stroke="#e0dcd2" stroke-width="1.6" />
<text x="714.0" y="128.0" font-size="16" font-weight="800" fill="#1e2a4a" text-anchor="start" >Tiga pemeriksaan klien</text>
<text x="714.0" y="148.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="start" >browser, MQTTX, jembatan, ESP32: setiap tersambung</text>
<rect x="706.0" y="168.0" width="448.0" height="132.0" rx="10" fill="#eef1f5" />
<circle cx="728.0" cy="192.0" r="12" fill="#a13a6b" stroke="#ffffff" stroke-width="2" />
<text x="728.0" y="196.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >1</text>
<text x="750.0" y="197.0" font-size="14" font-weight="800" fill="#1e2a4a" text-anchor="start" >Rantai</text>
<text x="722.0" y="222.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">tanda tangan bersambung sampai akar</text>
<text x="722.0" y="241.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">yang SUDAH ada di klien</text>
<text x="722.0" y="268.0" font-size="11.5" font-weight="700" fill="#4a5568" text-anchor="start" >gagal (lab tiruan):</text>
<text x="722.0" y="287.0" font-size="10.5" font-weight="800" fill="#e63946" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">unable to get local issuer certificate</text>
<rect x="706.0" y="316.0" width="448.0" height="132.0" rx="10" fill="#eef1f5" />
<circle cx="728.0" cy="340.0" r="12" fill="#a13a6b" stroke="#ffffff" stroke-width="2" />
<text x="728.0" y="344.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >2</text>
<text x="750.0" y="345.0" font-size="14" font-weight="800" fill="#1e2a4a" text-anchor="start" >Nama</text>
<text x="722.0" y="370.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">nama yang diketik tertulis di sertifikat:</text>
<text x="722.0" y="389.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#1e2a4a" font-weight="800">mqtt.namaanda.my.id</tspan>, bukan alamat IP</text>
<text x="722.0" y="416.0" font-size="11.5" font-weight="700" fill="#4a5568" text-anchor="start" >gagal (lab tiruan):</text>
<text x="722.0" y="435.0" font-size="10.5" font-weight="800" fill="#e63946" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">Hostname/IP does not match certificate's altnames</text>
<rect x="706.0" y="464.0" width="448.0" height="132.0" rx="10" fill="#eef1f5" />
<circle cx="728.0" cy="488.0" r="12" fill="#a13a6b" stroke="#ffffff" stroke-width="2" />
<text x="728.0" y="492.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" >3</text>
<text x="750.0" y="493.0" font-size="14" font-weight="800" fill="#1e2a4a" text-anchor="start" >Tanggal</text>
<text x="722.0" y="518.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">hari ini di antara "berlaku mulai" dan</text>
<text x="722.0" y="537.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">"berlaku sampai"; jam klien harus benar</text>
<text x="722.0" y="564.0" font-size="11.5" font-weight="700" fill="#4a5568" text-anchor="start" >gagal (lab tiruan):</text>
<text x="722.0" y="583.0" font-size="10.5" font-weight="800" fill="#e63946" text-anchor="start" font-family="'DejaVu Sans Mono', Consolas, monospace" xml:space="preserve">certificate has expired</text>
<rect x="706.0" y="628.0" width="448.0" height="54.0" rx="10" fill="#fcf2f6" />
<text x="722.0" y="650.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">Browser: tiga-tiganya lolos = gembok. Gagal =</text>
<text x="722.0" y="670.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve"><tspan font-weight="800" fill="#1e2a4a">Koneksi Anda tidak pribadi</tspan> (Kemenangan Cepat)</text>
<rect x="30.0" y="718.0" width="1140.0" height="214.0" rx="14" fill="#ffffff" stroke="#e0dcd2" stroke-width="1.6" />
<text x="54.0" y="748.0" font-size="16" font-weight="800" fill="#1e2a4a" text-anchor="start" >Umur sertifikat Let's Encrypt makin pendek</text>
<text x="1146.0" y="748.0" font-size="12" font-weight="700" fill="#a13a6b" text-anchor="end" >Caddy memperbarui sendiri, kira-kira saat sepertiga umur tersisa</text>
<text x="54.0" y="794.0" font-size="13" font-weight="800" fill="#1e2a4a" text-anchor="start" >hari ini (Okt 2026)</text>
<rect x="250.0" y="776.0" width="648.0" height="26.0" rx="6" fill="#f5e0ea" stroke="#a13a6b" stroke-width="1.4" />
<text x="262.0" y="794.0" font-size="13" font-weight="800" fill="#a13a6b" text-anchor="start" >90 hari</text>
<line x1="682.0" y1="772.0" x2="682.0" y2="806.0" stroke="#1e2a4a" stroke-width="2.4" stroke-linecap="round" />
<text x="912.0" y="794.0" font-size="12" font-weight="700" fill="#1e2a4a" text-anchor="start" >garis tegak ±hari 60: Caddy memperbarui</text>
<text x="54.0" y="838.0" font-size="13" font-weight="800" fill="#1e2a4a" text-anchor="start" >mulai 10 Feb 2027</text>
<rect x="250.0" y="820.0" width="460.8" height="26.0" rx="6" fill="#f5e0ea" stroke="#a13a6b" stroke-width="1.4" />
<text x="262.0" y="838.0" font-size="13" font-weight="800" fill="#a13a6b" text-anchor="start" >64 hari</text>
<line x1="559.6" y1="816.0" x2="559.6" y2="850.0" stroke="#1e2a4a" stroke-width="2.4" stroke-linecap="round" />
<text x="724.8" y="838.0" font-size="12" font-weight="700" fill="#1e2a4a" text-anchor="start" >garis tegak ±hari 43: Caddy memperbarui</text>
<text x="54.0" y="882.0" font-size="13" font-weight="800" fill="#1e2a4a" text-anchor="start" >mulai 16 Feb 2028</text>
<rect x="250.0" y="864.0" width="324.0" height="26.0" rx="6" fill="#f5e0ea" stroke="#a13a6b" stroke-width="1.4" />
<text x="262.0" y="882.0" font-size="13" font-weight="800" fill="#a13a6b" text-anchor="start" >45 hari</text>
<line x1="466.0" y1="860.0" x2="466.0" y2="894.0" stroke="#1e2a4a" stroke-width="2.4" stroke-linecap="round" />
<text x="588.0" y="882.0" font-size="12" font-weight="700" fill="#1e2a4a" text-anchor="start" >garis tegak ±hari 30: Caddy memperbarui</text>
<text x="54.0" y="914.0" font-size="12" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">Let's Encrypt tidak lagi mengirim surel peringatan kedaluwarsa (pemantau menyusul di Modul 30). Umur yang lebih pendek TIDAK mengganti akar.</text>
<rect x="30.0" y="950.0" width="640.0" height="168.0" rx="12" fill="#fcf2f6" stroke="#a13a6b" stroke-width="1.6" />
<text x="50.0" y="978.0" font-size="14" font-weight="800" fill="#a13a6b" text-anchor="start" >ACME: cara Caddy mendapat sertifikat</text>
<text x="50.0" y="1004.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">Caddy membuktikan nama itu miliknya lewat port <tspan font-weight="800" fill="#1e2a4a">80</tspan> (HTTP-01)</text>
<text x="50.0" y="1025.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">atau <tspan font-weight="800" fill="#1e2a4a">443</tspan> (TLS-ALPN-01): DNS harus sudah menunjuk VPS</text>
<text x="50.0" y="1046.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">akun ACME tanpa email; batas <tspan font-weight="800" fill="#1e2a4a">5 sertifikat yang sama per 7 hari</tspan>:</text>
<text x="50.0" y="1067.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">jangan hapus lemari Caddy (<tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#1e2a4a" font-weight="800">docker</tspan> <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#1e2a4a" font-weight="800">compose</tspan> <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#1e2a4a" font-weight="800">down</tspan> <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11.5" fill="#1e2a4a" font-weight="800">-v</tspan>)</text>
<text x="50.0" y="1088.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">lab tiruan: Pebble menerbitkan dalam ±6 s (bukan angka Let's Encrypt)</text>
<rect x="690.0" y="950.0" width="480.0" height="168.0" rx="12" fill="#eef1f5" />
<text x="710.0" y="978.0" font-size="14" font-weight="800" fill="#1e2a4a" text-anchor="start" >Kapan akar berganti?</text>
<text x="710.0" y="1004.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">X1 dipercaya program akar sampai ±2030</text>
<text x="710.0" y="1025.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">(berkasnya berlaku sampai 4 Jun 2035);</text>
<text x="710.0" y="1046.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">tanggal pensiunnya belum diumumkan</text>
<text x="710.0" y="1067.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">akar berganti: Pi cukup menarik image baru,</text>
<text x="710.0" y="1088.0" font-size="12" font-weight="600" fill="#1e2a4a" text-anchor="start" xml:space="preserve">ESP32 butuh firmware baru (OTA, Modul 28)</text>
<text x="1178.0" y="1146.0" font-size="11" font-weight="400" fill="#8a8f9c" text-anchor="end" >Kurikulum Fullstack IoT Developer · CC BY 4.0</text>
