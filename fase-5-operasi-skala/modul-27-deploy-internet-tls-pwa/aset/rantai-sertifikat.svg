<text x="386.0" y="388.0" font-size="11.5" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">akar baru, belum dipercaya HP:</text>
<text x="386.0" y="405.0" font-size="11.5" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">versi bertanda tangan X1</text>
<rect x="372.0" y="428.0" width="278.0" height="54.0" rx="10" fill="#ffffff" stroke="#1e2a4a" stroke-width="1.6" />
<text x="386.0" y="450.0" font-size="13" font-weight="800" fill="#1e2a4a" text-anchor="start" xml:space="preserve">YR1 atau YR2</text>
<text x="386.0" y="468.0" font-size="11.5" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">sertifikat antara (penerbit)</text>
<rect x="372.0" y="496.0" width="278.0" height="66.0" rx="10" fill="#ffffff" stroke="#9aa3b0" stroke-width="1.6" />
<text x="386.0" y="518.0" font-size="13" font-weight="800" fill="#1e2a4a" text-anchor="start" xml:space="preserve">daun berkunci RSA</text>
<text x="386.0" y="536.0" font-size="11.5" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">bila Caddy diminta RSA</text>
<text x="386.0" y="553.0" font-size="11.5" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">(Bedah Teknis; bukan bawaan)</text>
