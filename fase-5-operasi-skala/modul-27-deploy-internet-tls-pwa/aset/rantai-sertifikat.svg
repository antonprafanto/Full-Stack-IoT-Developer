<text x="68.0" y="290.0" font-size="13" font-weight="800" fill="#1e2a4a" text-anchor="start" xml:space="preserve">ISRG Root X2</text>
<text x="68.0" y="308.0" font-size="11.5" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">akar ECDSA; versi bertanda tangan</text>
<text x="68.0" y="325.0" font-size="11.5" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">X1 ikut dikirim untuk klien lama</text>
