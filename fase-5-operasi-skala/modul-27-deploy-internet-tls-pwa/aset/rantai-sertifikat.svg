<text x="68.0" y="370.0" font-size="13" font-weight="800" fill="#1e2a4a" text-anchor="start" xml:space="preserve">Root YE</text>
<text x="68.0" y="388.0" font-size="11.5" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">akar baru, belum dipercaya HP:</text>
<text x="68.0" y="405.0" font-size="11.5" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">versi bertanda tangan X2</text>
<rect x="54.0" y="428.0" width="278.0" height="54.0" rx="10" fill="#ffffff" stroke="#1e2a4a" stroke-width="1.6" />
<text x="68.0" y="450.0" font-size="13" font-weight="800" fill="#1e2a4a" text-anchor="start" xml:space="preserve">YE1 atau YE2</text>
<text x="68.0" y="468.0" font-size="11.5" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">sertifikat antara (penerbit)</text>
<rect x="54.0" y="496.0" width="278.0" height="66.0" rx="10" fill="#fcf2f6" stroke="#a13a6b" stroke-width="2" />
<text x="68.0" y="518.0" font-size="13" font-weight="800" fill="#a13a6b" text-anchor="start" xml:space="preserve"><tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12" fill="#a13a6b" font-weight="800">iot.namaanda.my.id</tspan></text>
<text x="68.0" y="536.0" font-size="11.5" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">sertifikat daun = milikmu</text>
<text x="68.0" y="553.0" font-size="11.5" font-weight="600" fill="#4a5568" text-anchor="start" xml:space="preserve">(juga <tspan font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="11" fill="#4a5568" font-weight="800">mqtt.namaanda.my.id</tspan>)</text>
