# compose.cloud.yml - semua layanan PUSAT Rumah Pintar Mini dalam satu berkas (Modul 26-27).
# SATU berkas untuk tiga tempat; yang berbeda hanya isi .env (tabel "nilai per tempat" di .env.example):
#   laptop (Modul 26)            : DOMAIN_WEB dan DOMAIN_MQTT kosong = dashboard HTTP di http://localhost, broker polos 1883
#   VPS (Modul 27, jalur utama)  : DOMAIN_WEB dan DOMAIN_MQTT terisi = Caddy memasang HTTPS sendiri, broker juga TLS di 8883
#   Pi (Modul 27, jalur gratis)  : domain kosong (HTTPS dipasang Cloudflare), profil "terowongan" (cloudflared) dinyalakan
# Jalankan dari folder ini (akar proyek):  docker compose up -d
#   Belum ada .env? Salin .env.example menjadi .env dan isi rahasianya dulu. Tanpa .env, Compose tidak menemukan berkas ini
#   (no configuration file provided); rahasia yang masih kosong membuatnya berhenti (required variable).
#   Baris COMPOSE_FILE=compose.cloud.yml di .env membuat -f tidak perlu (tanpa baris itu: docker compose -f compose.cloud.yml ...).
# Rahasia dan setelan dibaca dari .env di folder ini (contohnya .env.example). .env TIDAK PERNAH ikut Git, dan keluaran
# "docker compose config" mencetak semua rahasia: jangan ditempel ke forum, isu, atau AI.
# JANGAN "docker compose down -v": -v menghapus lemari (volume) milik Compose. Lemari riwayat (db, grafana) sengaja "external"
# supaya tidak ikut terhapus, tetapi sandi broker, data Uptime Kuma, dan (Modul 27) sertifikat HTTPS Caddy tetap hilang.
name: rumahpintar

# Setelan backend dipakai dua layanan (backend dan migrasi): ditulis sekali di sini, lalu dirujuk dengan *setelan-backend.
# Nama "x-..." diabaikan Compose sebagai layanan; isinya hanya bahan rujukan.
x-setelan-backend: &setelan-backend
  # di dalam lorong Compose, layanan lain dipanggil dengan NAMA LAYANAN: mosquitto, db (bukan 127.0.0.1). Broker di sini
  # tetap polos (mqtt://, 1883): sambungannya tidak pernah keluar dari mesin ini, juga di VPS.
  MQTT_URL: mqtt://mosquitto:1883
  MQTT_USERNAME: backend
  MQTT_PASSWORD: ${MQTT_PASSWORD:?isi MQTT_PASSWORD di .env}
  DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env}@db:5432/rumahpintar
  # 0.0.0.0 = mendengar di semua antarmuka DI DALAM kontainer, supaya Caddy dan healthcheck bisa masuk. Yang menentukan
  # siapa di luar mesin ini bisa mengetuk tetap loket (ports) layanan backend di bawah: 127.0.0.1 saja.
  HOST: 0.0.0.0
  PORT: "8080"
  JWT_SECRET: ${JWT_SECRET:?isi JWT_SECRET di .env}
  # halaman (origin) yang boleh login dari browser: dashboard lewat Caddy di http://localhost (loket web 80).
  # VPS dan Pi jalur gratis: alamat dashboard di internet, misalnya https://iot.namaanda.my.id (Modul 27)
  CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost,http://127.0.0.1}
  # Modul 27 (backend 1.4.0): backend selalu di belakang Caddy. uniquelocal = keterangan Caddy tentang tamu (alamat IP dan
  # https, kepala X-Forwarded-*) dipercaya bila datang dari alamat privat lorong Docker: cookie login ber-Secure di HTTPS
  # dan batas 10 percobaan login per tamu, bukan dibagi semua tamu. Jangan angka (ditolak backend).
  TRUST_PROXY: ${TRUST_PROXY:-uniquelocal}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
  # hanya untuk server Bot API tiruan di lab; kosong = server Telegram sungguhan
  TELEGRAM_API_ROOT: ${TELEGRAM_API_ROOT:-}
  LAPORAN_JADWAL: "${LAPORAN_JADWAL:-0 7 * * *}"
  # jam di log backend memakai WIB (tanpa ini, jam kontainer = UTC; VPS juga biasanya UTC)
  TZ: Asia/Jakarta

# Log setiap kontainer dibatasi 3 berkas x 10 MB. Bawaan Docker TANPA batas: lama-lama disk penuh.
x-log: &log
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  # Database TimescaleDB (Modul 17-18). Lemarinya = lemari rumahpintar-data yang sama sejak Modul 17 (lihat volumes di bawah).
  db:
    image: timescale/timescaledb:2.30.2-pg17
    environment:
      # Formulir ini hanya dibaca saat lemari masih KOSONG. Lemari lama sudah berisi sandi: tulis sandi LAMA di .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env}
      POSTGRES_DB: rumahpintar
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      - data-db:/var/lib/postgresql/data
    ports:
      # 127.0.0.1 = hanya mesin ini (DBeaver, psql, mode kembang npm run dev). Tanpa 127.0.0.1, Docker membuka loket ke
      # seluruh WiFi (di VPS: ke seluruh internet) dan melewati firewall (juga ufw).
      - "127.0.0.1:${PORT_DB:-5432}:5432"
    networks:
      default:
        # nama lama kontainer Modul 17-25: data source Grafana buatan layar (host rumahpintar-db:5432) tetap tersambung
        aliases:
          - rumahpintar-db
    healthcheck:
      # "running" belum tentu "siap menerima tamu". -h 127.0.0.1: saat lemari baru diisi pertama kali, server sementara
      # hanya mendengar soket lokal, jadi tanpa -h pemeriksaan bisa lolos terlalu dini.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d rumahpintar"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s
    restart: unless-stopped
    logging: *log

  # Sekali jalan: membuat akun broker "backend" di lemari broker, HANYA bila berkas sandi belum ada (mesin baru, lemari
  # kosong). Akun lain (perangkat simulator, jembatan-pi, pemeriksa, pemantau) ditambah dengan (-u mosquitto = pemilik
  # berkas sandi):
  #   docker compose exec -u mosquitto mosquitto mosquitto_passwd /mosquitto/data/sandi-broker <nama>
  # lalu: docker compose restart mosquitto
  akun-broker:
    image: eclipse-mosquitto:2.1.2-alpine
    environment:
      MQTT_PASSWORD: ${MQTT_PASSWORD:?isi MQTT_PASSWORD di .env}
    # $$ = tanda $ yang diteruskan ke sh, bukan diisi Compose dari .env. -b = sandi ditulis di perintah: tidak masuk riwayat
    # terminalmu, tetapi sesaat terlihat di daftar proses mesin (di Linux, Pi, dan VPS, ps juga menampilkan proses
    # kontainer). Risikonya kecil: hanya sekali, saat berkas sandi dibuat.
    command:
      - sh
      - -c
      - |
        set -e
        if [ -f /mosquitto/data/sandi-broker ]; then
          echo "berkas sandi broker sudah ada: dilewati"
        else
          mosquitto_passwd -b -c /mosquitto/data/sandi-broker backend "$$MQTT_PASSWORD"
          chmod 600 /mosquitto/data/sandi-broker
          echo "akun broker backend dibuat"
        fi
    volumes:
      - data-broker:/mosquitto/data
    # Image Mosquitto menyiapkan folder log sebagai lemari, padahal log kita tampil di layar (docker compose logs).
    # tmpfs = folder sementara di RAM: tanpa ini Docker membuat lemari tanpa nama setiap kontainer ini dibuat baru.
    tmpfs:
      - /mosquitto/log
    restart: "no"
    logging: *log

  # Modul 27, sekali jalan: menyalin sertifikat nama broker (DOMAIN_MQTT, dimintakan Caddy ke Let's Encrypt) dari lemari
  # Caddy ke lemari data-sertifikat, sebagai milik pengguna mosquitto (uid 1883). Mosquitto 2.x membaca sertifikat SESUDAH
  # turun hak dari root menjadi pengguna mosquitto, padahal berkas Caddy hanya boleh dibaca root: dibaca langsung = "Permission
  # denied" dan broker berhenti. Isi langkahnya: skrip/salin-sertifikat.sh. Menunggu Caddy paling lama 5 menit.
  # DOMAIN_MQTT kosong (laptop, Pi jalur gratis) = langsung selesai: "dilewati", broker tetap polos seperti Modul 26.
  # Caddy memperbarui sertifikatnya sendiri, Mosquitto TIDAK membaca ulang sendiri. Di VPS, cron seminggu sekali menjalankan
  # skrip/perbarui-sertifikat-mqtt.sh: layanan ini lagi (docker compose run --rm sertifikat-mqtt), lalu muat ulang broker
  # (docker compose exec mosquitto kill -HUP 1: PID sama, jembatan tidak putus). Jangan "docker compose restart mosquitto"
  # dengan kunci yang salah pemilik (jatuh-bangun), dan jangan "docker compose kill -s SIGHUP" (Docker menganggapnya berhenti).
  sertifikat-mqtt:
    image: eclipse-mosquitto:2.1.2-alpine
    environment:
      DOMAIN_MQTT: ${DOMAIN_MQTT:-}
    # skrip ini dijalankan sh di dalam kontainer (sebagai root), bukan program mosquitto
    entrypoint: ["sh", "/skrip/salin-sertifikat.sh"]
    volumes:
      # lemari Caddy hanya-baca: penyalin tidak bisa mengubah sertifikat atau kunci akun Let's Encrypt
      - data-caddy:/caddy:ro
      - data-sertifikat:/keluar
      # folder skrip/ dari repo, dipasang sebagai FOLDER (seperti Caddyfile), hanya-baca
      - ./skrip:/skrip:ro
    # dua folder bawaan image Mosquitto yang tidak dipakai di sini: tmpfs, supaya tidak ada lemari tanpa nama
    tmpfs:
      - /mosquitto/data
      - /mosquitto/log
    restart: "no"
    logging: *log

  # Broker MQTT PUSAT (Mosquitto 2.1.2). Backend memanggilnya mosquitto:1883 di dalam lorong; gerbang Pi (jembatan) dan
  # simulator masuk lewat loket 1883 dari jaringan rumah, atau (Modul 27, VPS) lewat pintu TLS 8883 dari internet.
  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    volumes:
      # Konfigurasi dan daftar izin dari repo (hanya-baca). Sesudah mengubah salah satunya: docker compose restart mosquitto
      # Modul 27: KONF_PUSAT di .env memilih berkasnya: pusat.conf (bawaan: laptop dan Pi jalur gratis, 1883 saja) atau
      # pusat-internet.conf (VPS: + pintu TLS 8883 dengan sertifikat salinan). Bentuk panjang + create_host_path false:
      # nama berkas yang salah ketik langsung ditolak Compose, bukan diam-diam dibuatkan folder kosong.
      - type: bind
        source: ./edge/${KONF_PUSAT:-pusat.conf}
        target: /mosquitto/config/mosquitto.conf
        read_only: true
        bind:
          create_host_path: false
      - ./edge/acl-broker:/mosquitto/config/acl-broker:ro
      # berkas sandi, pesan retained, dan sesi disimpan di lemari ini (milik Compose)
      - data-broker:/mosquitto/data
      # Modul 27: salinan sertifikat nama broker dari layanan sertifikat-mqtt (kosong di laptop dan Pi jalur gratis)
      - data-sertifikat:/mosquitto/sertifikat:ro
    # folder log bawaan image tidak dipakai (log ke layar): tmpfs, supaya tidak ada lemari tanpa nama
    tmpfs:
      - /mosquitto/log
    ports:
      # 1883 = MQTT POLOS: nama pengguna dan kunci perangkat terbaca siapa pun di jalan yang dilewatinya (Modul 21).
      # Bawaan 127.0.0.1 = hanya mesin ini (backend tetap masuk lewat lorong). ALAMAT_MQTT=0.0.0.0 di .env bila gerbang Pi
      # atau ESP32 masuk dari WiFi rumah (laptop Kit B Modul 26); Pi jalur gratis: 172.17.0.1, hanya untuk jembatan gerbang
      # di Pi yang sama (host-gateway). Di VPS JANGAN 0.0.0.0: Docker membuka loket melewati ufw, jadi 1883 polos terbuka ke
      # seluruh internet. Laptop di WiFi umum (kafe, kampus) dengan 0.0.0.0: docker compose stop mosquitto, lalu di rumah
      # lagi: docker compose start mosquitto
      - "${ALAMAT_MQTT:-127.0.0.1}:${PORT_MQTT:-1883}:1883"
      # Modul 27: 8883 = MQTT TERENKRIPSI (TLS) untuk jembatan Pi dan perangkat dari internet; hanya hidup dengan
      # pusat-internet.conf. Ikut ALAMAT_WEB (pintu tamu dari luar): VPS 0.0.0.0, laptop dan Pi 127.0.0.1.
      - "${ALAMAT_WEB:-127.0.0.1}:${PORT_MQTTS:-8883}:8883"
    depends_on:
      akun-broker:
        condition: service_completed_successfully
      # Modul 27: pintu 8883 butuh salinan sertifikat SEBELUM broker menyala (tanpa berkasnya, broker berhenti)
      sertifikat-mqtt:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *log

  # Sekali jalan: menerapkan berkas migrasi/*.sql yang baru (aman diulang: "0 migrasi baru diterapkan").
  migrasi:
    # cetakan yang sama dengan layanan backend (image + build ditulis sama persis di kedua layanan)
    image: ${TOKO_IMAGE:?isi TOKO_IMAGE di .env}/rumah-pintar-mini-backend:1.4.0
    build: ./backend
    command: ["node", "src/db/migrasi.ts"]
    environment: *setelan-backend
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    logging: *log

  # Backend 1.4.0 (Modul 16-27). Tag image = version di backend/package.json.
  backend:
    # image: nama di toko image (GHCR, Modul 26 Praktik 10). build: kalau image itu belum ada di mesin ini dan tidak bisa
    # ditarik dari toko, Compose membangunnya sendiri dari backend/Dockerfile (di VPS: docker compose build, Modul 27).
    image: ${TOKO_IMAGE:?isi TOKO_IMAGE di .env}/rumah-pintar-mini-backend:1.4.0
    build: ./backend
    environment: *setelan-backend
    ports:
      # Bruno, Swagger (http://localhost:8080/docs), dan alat/terminal-live.js tetap memakai loket lama. Di VPS juga
      # 127.0.0.1: dari laptop lewat terowongan SSH (ssh -L 8080:127.0.0.1:8080), tamu internet lewat Caddy /api.
      - "127.0.0.1:${PORT_BACKEND:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_started
      migrasi:
        condition: service_completed_successfully
    healthcheck:
      # HEAD /health dari dalam kontainer (image node tidak membawa curl). Sehat = proses hidup dan menjawab; /health tetap
      # 200 walau broker atau database putus (pemantau sungguhan = Modul 30). "unhealthy" TIDAK me-restart kontainer.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health',{method:'HEAD'}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 2s
    restart: unless-stopped
    logging: *log

  # Dashboard (Modul 22-27) disajikan Caddy: halaman di /, API backend di /api (satu alamat, tanpa CORS lintas port).
  # Modul 27: Caddy juga memasang HTTPS sendiri bila DOMAIN_WEB diisi (frontend/caddy/Caddyfile).
  web:
    image: ${TOKO_IMAGE:?isi TOKO_IMAGE di .env}/rumah-pintar-mini-web:1.3.0
    build:
      context: ./frontend
      args:
        # alamat API dibakar ke JavaScript saat build; harus sama dengan awalan handle_path di frontend/caddy/Caddyfile
        VITE_API_BASE: /api
    environment:
      # Modul 27: dibaca Caddyfile. Kosong di .env = ":80": HTTP saja di port 80 untuk alamat apa pun (Modul 26, dan Pi
      # jalur gratis di belakang Cloudflare Tunnel). Terisi = Caddy meminta sertifikat Let's Encrypt untuk nama itu, membuka
      # HTTPS 443, mengalihkan http:// ke https://, dan memperbaruinya sendiri. DOMAIN_MQTT: sertifikat untuk broker (8883).
      # (":80" ditulis di sini, bukan di Caddyfile: Caddy hanya memakai nilai penggantinya bila variabel TIDAK ADA, sedangkan
      # baris "DOMAIN_WEB=" yang kosong di .env tetap sampai ke Caddy sebagai teks kosong.)
      DOMAIN_WEB: ${DOMAIN_WEB:-:80}
      DOMAIN_MQTT: ${DOMAIN_MQTT:-}
      # Modul 27, jalur gratis saja: penerus yang dipercaya Caddy (cloudflared di lorong ini), lihat .env.example
      PROKSI_TEPERCAYA: ${PROKSI_TEPERCAYA:-}
    volumes:
      # Caddyfile dipasang sebagai FOLDER (bukan berkas tunggal), supaya isi baru terbaca sesudah berkasnya disimpan editor.
      - ./frontend/caddy:/etc/caddy:ro
      # Modul 27: lemari Caddy (milik Compose) = kunci akun Let's Encrypt + sertifikat + kuncinya. WAJIB awet: hilang =
      # minta ulang ke Let's Encrypt (batas 5 sertifikat yang sama per minggu). Jangan "down -v".
      - data-caddy:/data
      - data-caddy-config:/config
    ports:
      # bawaan 127.0.0.1 = hanya mesin ini. Mode HP (laptop): ALAMAT_WEB=0.0.0.0 dan IP laptop di CORS_ORIGIN.
      # VPS: ALAMAT_WEB=0.0.0.0, karena Let's Encrypt dan tamu harus bisa mengetuk 80 dan 443 dari internet. 0.0.0.0 =
      # IPv4 saja: buat record DNS A, jangan AAAA (IPv6).
      - "${ALAMAT_WEB:-127.0.0.1}:${PORT_WEB:-80}:80"
      # Modul 27: HTTPS (TCP) dan HTTP/3 (UDP, diiklankan Caddy sendiri). Di laptop tanpa domain tidak dipakai.
      - "${ALAMAT_WEB:-127.0.0.1}:${PORT_HTTPS:-443}:443"
      - "${ALAMAT_WEB:-127.0.0.1}:${PORT_HTTPS:-443}:443/udp"
    # Modul 27: web TIDAK menunggu backend lagi. Mosquitto menunggu salinan sertifikat (sertifikat-mqtt), salinan menunggu
    # sertifikat dari Caddy; kalau Caddy menunggu backend (yang menunggu Mosquitto), semuanya saling menunggu selamanya.
    # Akibatnya kecil: beberapa detik pertama sesudah "up", /api dijawab 502 sampai backend siap.
    restart: unless-stopped
    logging: *log

  # Sekali jalan: akun database hanya-baca grafana_baca (grafana/pengguna-grafana.sql) bila belum ada, lalu sandinya
  # disamakan dengan GRAFANA_BACA_SANDI di .env. Kontainer ini hanya memakai psql dari image database, bukan databasenya.
  akun-grafana:
    image: timescale/timescaledb:2.30.2-pg17
    environment:
      PGHOST: db
      PGUSER: postgres
      PGDATABASE: rumahpintar
      PGPASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env}
      GRAFANA_BACA_SANDI: ${GRAFANA_BACA_SANDI:?isi GRAFANA_BACA_SANDI di .env}
    # $$ = tanda $ untuk sh; sandi dikirim lewat variabel psql (:'sandi'), tidak pernah tertulis di berkas atau di layar
    command:
      - sh
      - -c
      - |
        set -e
        if [ "$$(psql -tAc "SELECT 1 FROM pg_roles WHERE rolname = 'grafana_baca'")" = "1" ]; then
          echo "akun grafana_baca sudah ada: dilewati"
        else
          psql -v ON_ERROR_STOP=1 -f /grafana/pengguna-grafana.sql
        fi
        echo "ALTER ROLE grafana_baca PASSWORD :'sandi';" | psql -v ON_ERROR_STOP=1 -v sandi="$$GRAFANA_BACA_SANDI"
        echo "sandi grafana_baca disamakan dengan GRAFANA_BACA_SANDI di .env"
    volumes:
      - ./grafana:/grafana:ro
    # Image database menyiapkan folder datanya sebagai lemari, padahal kontainer ini hanya memakai psql: tmpfs, supaya
    # tidak ada lemari tanpa nama setiap kontainer ini dibuat baru (riwayat tetap di lemari layanan db).
    tmpfs:
      - /var/lib/postgresql/data
    depends_on:
      migrasi:
        condition: service_completed_successfully
    restart: "no"
    logging: *log

  # Grafana 13.2.4 (Modul 25), lemari rumahpintar-grafana-data yang sama. Data source, dashboard, aturan "Node diam", dan
  # contact point Telegram dipasang dari berkas grafana/provisioning (Modul 26): tampil "Provisioned", diubah lewat berkas.
  grafana:
    image: grafana/grafana:13.2.4
    environment:
      # setelan Modul 25 persis: tanpa unduhan plugin saat menyala pertama, tanpa kiriman statistik/snapshot/dashboard publik
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_PUBLIC_DASHBOARDS_ENABLED: "false"
      # hanya dipakai saat lemari Grafana masih kosong; lemari Modul 25 tetap memakai sandi admin lamamu
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_SANDI:?isi GRAFANA_ADMIN_SANDI di .env}
      # Modul 27: alamat Grafana yang dilihat tamu, dipakai untuk tautan (misalnya di kabar alert Telegram). Kosong =
      # bawaan Grafana (http://localhost:3000/, seperti Modul 25-26). VPS: https://iot.namaanda.my.id/grafana/ = Grafana
      # dibuka lewat Caddy HTTPS di bawah /grafana/ (frontend/caddy/Caddyfile). SERVE_FROM_SUB_PATH = Grafana sendiri
      # melayani jalur /grafana/ itu; tanpa jalur di alamatnya (laptop), Grafana tetap di / seperti biasa.
      GF_SERVER_ROOT_URL: ${GRAFANA_ALAMAT:-%(protocol)s://%(domain)s:%(http_port)s/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # dibaca berkas provisioning ($GRAFANA_BACA_SANDI, $TELEGRAM_BOT_TOKEN, $TELEGRAM_CHAT_ID)
      GRAFANA_BACA_SANDI: ${GRAFANA_BACA_SANDI:?isi GRAFANA_BACA_SANDI di .env}
      # Telegram tidak wajib, tetapi contact point tanpa token membuat Grafana gagal menyala (jatuh bangun). "belum-diisi"
      # dan 0 = Grafana tetap menyala; alert tetap tercatat, hanya kirimannya ke Telegram yang gagal.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-belum-diisi}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-0}
    volumes:
      - data-grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      # 127.0.0.1 juga di VPS: dari laptop lewat terowongan SSH (ssh -L 3000:127.0.0.1:3000), tamu lewat Caddy /grafana/
      - "127.0.0.1:${PORT_GRAFANA:-3000}:3000"
    depends_on:
      akun-grafana:
        condition: service_completed_successfully
    healthcheck:
      # image Grafana membawa curl; /api/health menjawab "database": "ok" bila Grafana siap. -L: dengan alamat ber-/grafana/,
      # Grafana mengalihkan /api/health ke /grafana/api/health
      test: ["CMD", "curl", "-fsSL", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    restart: unless-stopped
    logging: *log

  # Modul 27, jalur gratis (semua di Pi): terowongan Cloudflare membawa tamu dari https://iot.namaanda.my.id ke Caddy
  # (http://web:80 di lorong ini) lewat sambungan KELUAR dari Pi, tanpa loket terbuka di router. Butuh TUNNEL_TOKEN (dari
  # dasbor Cloudflare, rahasia) di .env. Profil "terowongan" = tidak menyala sampai disebut:
  #   COMPOSE_PROFILES=terowongan di .env, atau: docker compose --profile terowongan up -d
  # Di Modul 26 layanan ini tertulis di edge/compose.edge.yml; dipindah ke sini karena harus satu lorong dengan web.
  # Jalur utama (VPS) tidak memakainya. Broker MQTT TIDAK lewat terowongan ini (hanya HTTP dan WebSocket).
  cloudflared:
    image: cloudflare/cloudflared:2026.10.5
    profiles: ["terowongan"]
    # program awal image sudah "cloudflared --no-autoupdate"; ini lanjutannya
    command: ["tunnel", "run"]
    environment:
      # Tanpa token, cloudflared berhenti dan dinyalakan lagi terus (Restarting). "belum-diisi" membuat pesannya jelas:
      # docker compose logs cloudflared -> "Provided Tunnel token is not valid." (isi TUNNEL_TOKEN di .env). Tanda ":?"
      # (wajib diisi) tidak bisa dipakai di sini: Compose memeriksanya juga saat profil terowongan tidak dinyalakan.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-belum-diisi}
    restart: unless-stopped
    logging: *log

  # Uptime Kuma (dikonfigurasi di Modul 30). Profil "pantau": TIDAK menyala dengan "docker compose up -d" biasa;
  # nyalakan dengan: docker compose --profile pantau up -d
  # matikan dengan:  docker compose --profile pantau down   (tanpa --profile, Uptime Kuma tetap menyala)
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.8-slim
    profiles: ["pantau"]
    volumes:
      - data-kuma:/app/data
    ports:
      - "127.0.0.1:${PORT_KUMA:-3001}:3001"
    restart: unless-stopped
    logging: *log

volumes:
  # Lemari riwayat milik KAMU, bukan milik Compose ("external"): Compose tidak pernah membuat atau menghapusnya, juga tidak
  # dengan "down -v". Mesin baru (laptop baru, VPS, Pi) membuatnya sekali: docker volume create rumahpintar-data (dan
  # rumahpintar-grafana-data).
  data-db:
    external: true
    name: ${LEMARI_DB:-rumahpintar-data}
  data-grafana:
    external: true
    name: ${LEMARI_GRAFANA:-rumahpintar-grafana-data}
  # Lemari milik Compose (dibuat sendiri, ikut terhapus oleh "down -v"): berkas sandi broker + retained, data Uptime Kuma,
  # dan (Modul 27) lemari Caddy (akun Let's Encrypt + sertifikat) serta salinan sertifikat broker.
  data-broker:
  data-kuma:
  data-caddy:
  data-caddy-config:
  data-sertifikat:
